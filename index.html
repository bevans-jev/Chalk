          <div style={{fontSize:11,color:C.muted,marginTop:3}}>Base → item modifiers → buzz band → exact effective sheet → engine output</div></div>
        <label style={{display:"grid",gap:5}}><span style={{...label,fontSize:8.5}}>Character</span>
          <select value={charId} onChange={e=>setCharId(e.target.value)} style={{...btn,background:C.panel2,minWidth:150}}>
            {CHAR_IDS.map(id=><option key={id} value={id}>{CHARS[id].name}</option>)}</select></label>
        <div style={{flex:"1 1 260px",minWidth:220}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10}}><span style={{...label,fontSize:8.5}}>Buzz · tolerance {ch.tol}</span>
            <b style={{fontFamily:F.mono,fontSize:10,color:band==="Over"||band==="Cut off"?C.warn:band==="Sober"?C.muted:C.good}}>{band.toUpperCase()} · {buzz}</b></div>
          <input type="range" min="0" max="120" step="1" value={buzz} onChange={e=>setBuzz(+e.target.value)} style={{width:"100%",accentColor:C.accent,marginTop:7}}/>
        </div>
      </div>

      {chooser(byRole("boost"),"Boosts")}
      {chooser(byRole("back"),"Back off")}
      {chooser(byRole("effect"),"Rule effects")}
      {chooser(SPIKE_IDS,"Hostile effects")}

      <div style={{overflowX:"auto",marginTop:16}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:620,fontSize:11.5}}>
        <thead><tr>{["Stat","Base","Items","Buzz band","Effective","Total change"].map(h=><th key={h} style={{...label,fontSize:8.5,textAlign:h==="Stat"?"left":"right",padding:"7px 8px",borderBottom:`1px solid ${C.line}`}}>{h}</th>)}</tr></thead>
        <tbody>{STATS.map(([k,n])=>{const base=ch[k],items=k==="tol"?0:itemDelta[k]||0,bd=k==="tol"?0:(bf.stats||{})[k]||0,fin=k==="tol"?base:effective[k],delta=fin-base;
          return <tr key={k}><td style={{padding:"8px",borderBottom:`1px solid ${C.line}`,fontWeight:600,color:C.ink}}>{n}</td>
            {[base,items,bd,fin,delta].map((v,i)=><td key={i} style={{padding:"8px",borderBottom:`1px solid ${C.line}`,textAlign:"right",fontFamily:F.mono,
              color:i===3?C.ink:i===4?(v>0?C.good:v<0?C.warn:C.muted):i>0&&v!==0?(v>0?C.good:C.warn):C.ink2}}>{i===0||i===3?Math.round(v):plus(Math.round(v))}</td>)}</tr>;})}</tbody>
      </table></div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",gap:8,marginTop:14}}>
        {phys.map(([n,b,l])=><div key={n} style={{padding:"9px 10px",borderRadius:9,background:C.panel2,border:`1px solid ${C.line}`}}>
          <div style={{...label,fontSize:8}}>{n}</div><div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:5}}>
            <span style={{fontFamily:F.mono,fontSize:9,color:C.muted,textDecoration:"line-through"}}>{b}</span>
            <b style={{fontFamily:F.mono,fontSize:12,color:b===l?C.ink2:C.accent}}>{l}</b></div></div>)}
      </div>

      <div style={{marginTop:14,padding:"10px 11px",borderRadius:9,background:C.panel2}}>
        <div style={{...label,fontSize:8.5,marginBottom:6}}>Active rule flags</div>
        <div style={{fontFamily:F.mono,fontSize:10,color:Object.keys(ruleFlags).length?C.accent:C.muted,lineHeight:1.5}}>
          {Object.keys(ruleFlags).length?Object.keys(ruleFlags).filter(k=>ruleFlags[k]).map(k=>k.toUpperCase()).join(" · "):
            "NONE — numeric stats only"}</div>
      </div>
    </div>
  </Shell>);
}

const KING_FIRST=["Maya","Reggie","Tasha","Vic","Nico","June","Dez","Lena","Omar","Frankie","Sol","Bree"];
const KING_NICK=["Side Door","Cold Rack","Two-Rail","No Chalk","Railbird","Quiet Eye","Corner Tax","Night Shift","Dead Center","Last Call"];
const KING_LAST=["Vega","Banks","Mercer","Flores","Price","Okafor","Tran","Santos","Reed","Bell"];
const KING_TABLES=["regulation","octagon","gates","crossroads","keyhole","bowtie","pillars","offset"];
function makeKingChallenge(streak){
  // The random flavour never overwhelms progression: every conquered opponent
  // raises the minimum by 52, while the roll is capped at 30. The next person
  // is therefore always harder than the previous one.
  const rating=Math.min(850,300+streak*52+Math.floor(streak/3)*10+Math.floor(Math.random()*31));
  const team=streak>1&&(streak+1)%4===0;
  return{name:`${KING_FIRST[Math.floor(Math.random()*KING_FIRST.length)]} “${KING_NICK[Math.floor(Math.random()*KING_NICK.length)]}” ${KING_LAST[Math.floor(Math.random()*KING_LAST.length)]}`,
    rating,team,tid:KING_TABLES[(streak+Math.floor(Math.random()*KING_TABLES.length))%KING_TABLES.length],
    char:CHAR_IDS[Math.floor(Math.random()*CHAR_IDS.length)],powerSet:POWER_SET_IDS[(streak+Math.floor(Math.random()*4))%4]};
}
const KING_START_BANK=60;
const freshKing=()=>({streak:0,bank:KING_START_BANK,buzz:0,challenge:makeKingChallenge(0),series:null,decision:null,last:"The house fronts you $60. Build it from here."});

// Screen router plus every setting the match needs. App owns the setup; Game
// owns everything that happens once the balls are on the table.
function App(){
  const [screen,setScreen]=useState("home");
  const [tid,setTid]=useState("regulation");
  const [cloth,setCloth]=useState("oxblood");
  const [count,setCount]=useState(2);
  const [mode,setMode]=useState("eight");
  const [opts,setOpts]=useState({balls:true,specials:true,bar:true});
  const [powerSet,setPowerSet]=useState("haunted");
  const [drop,setDrop]=useState(null);
  const [king,setKing]=useState(freshKing);
  const [kingKey,setKingKey]=useState(0);
  const [seats,setSeats]=useState(()=>CHAR_IDS.slice(0,4).map((c,i)=>
    ({kind:i===0?"human":"cpu",char:c,rating:450,team:i%2?2:1})));
  useEffect(()=>{const f=()=>setDrop(null);window.addEventListener("click",f);return()=>window.removeEventListener("click",f);},[]);
  useEffect(()=>{const ok=modesFor(count); if(!ok.includes(mode))setMode(ok[0]);},[count]);

  const upd=(i,p)=>setSeats(s=>s.map((x,j)=>j===i?{...x,...p}:x));
  const launchKing=rematch=>{
    setKing(k=>({...k,decision:null,series:k.series?{...k.series,rematch:!!rematch}:{target:2,us:0,them:0,rematch:false}}));
    setKingKey(k=>k+1);setScreen("kingGame");};
  const advanceKing=won=>setKing(k=>{const streak=won?k.streak+1:0,bonus=won?12+Math.round(k.challenge.rating/30):0;
    return{...k,bank:k.bank+bonus,streak,buzz:k.buzz,series:null,decision:null,challenge:makeKingChallenge(streak),
      last:won?`Win banked · +$${bonus} table bonus. A harder challenger stepped up.`:"Loss accepted. The bank stays, but the streak resets."};});
  const onKingResult=r=>setKing(k=>{
    const s=k.series||{target:2,us:0,them:0,rematch:false},us=s.us+(r.humanWin?1:0),them=s.them+(r.humanWin?0:1);
    const rackPay=r.humanWin?18+Math.round(k.challenge.rating/48)+k.streak*2:4;
    const bank=k.bank+rackPay,buzz=Math.max(0,r.buzz*.65),done=us>=2||them>=2;
    if(!done){setTimeout(()=>setScreen("king"),0);return{...k,bank,buzz,series:{target:2,us,them,rematch:s.rematch},
      decision:{lastWon:r.humanWin,racks:us+them},last:`Rack ${us+them}: ${r.humanWin?"won":"lost"} · +$${rackPay} · matchup ${us}–${them}`};}
    const won=us>them;
    const bonus=won?28+Math.round(k.challenge.rating/22):0,streak=won?k.streak+1:0;
    setTimeout(()=>setScreen("king"),0);return{...k,bank:bank+bonus,buzz,streak,series:null,decision:null,
      last:won?`Matchup won ${us}–${them} · +$${rackPay+bonus}. A harder challenger stepped up.`:`Matchup lost ${us}–${them}. The bank is safe; the streak resets.`,
      challenge:makeKingChallenge(streak)};
  });

  function Select({id,value,options,onPick,width}){
    const open=drop===id, cur=options.find(o=>o.v===value)||options[0];
    return(<span style={{position:"relative",display:"inline-block"}}>
      <button onClick={e=>{e.stopPropagation();setDrop(open?null:id);}}
        style={{...btn,padding:"8px 10px",width:width||130,display:"flex",alignItems:"center",gap:7,textAlign:"left",background:C.panel2}}>
        {cur&&cur.dot&&<span style={{width:8,height:8,borderRadius:8,background:cur.dot,flexShrink:0}}/>}
        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12.5}}>{cur&&cur.label}</span>
        <span style={{color:C.muted,fontSize:9}}>▾</span></button>
      {open&&<div className="thin" onClick={e=>e.stopPropagation()} style={{position:"absolute",top:"calc(100% + 5px)",left:0,zIndex:50,
        width:Math.max(width||130,190),maxHeight:250,overflowY:"auto",...panel,padding:5,boxShadow:"0 16px 40px rgba(0,0,0,.6)"}}>
        {options.map(o=><button key={String(o.v)} onClick={()=>{onPick(o.v);setDrop(null);}}
          style={{display:"flex",gap:8,alignItems:"center",width:"100%",padding:"7px 8px",borderRadius:7,border:"none",
            background:o.v===value?C.line:"transparent",color:C.ink,cursor:"pointer",textAlign:"left"}}>
          {o.dot&&<span style={{width:8,height:8,borderRadius:8,background:o.dot,flexShrink:0}}/>}
          <span style={{minWidth:0,flex:1}}>
            <span style={{display:"block",fontSize:12.5,fontWeight:500,whiteSpace:"nowrap"}}>{o.label}</span>
            {o.sub&&<span style={{display:"block",fontFamily:F.mono,fontSize:9.5,color:C.muted,whiteSpace:"nowrap",
              overflow:"hidden",textOverflow:"ellipsis"}}>{o.sub}</span>}</span></button>)}
      </div>}</span>);}

  const ClothPicker=()=>(<div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
    {CLOTH_IDS.map(k=>{const on=cloth===k,cl=CLOTHS[k];
      const sw=cl.kind==="solid"?cl.base
        :cl.kind==="dye"?`conic-gradient(${cl.cols.join(",")},${cl.cols[0]})`
        :cl.kind==="heat"?"radial-gradient(circle at 38% 40%,#fff3b0,#ff9a1f 30%,#e0332a 55%,#5a1470 78%,#050a18)"
        :cl.base;
      return(<button key={k} onClick={()=>setCloth(k)} title={cl.name}
        style={{width:26,height:26,borderRadius:7,padding:0,cursor:"pointer",background:sw,
          border:on?`2px solid ${C.accent}`:`1px solid ${C.line}`,boxShadow:on?"0 0 0 3px rgba(127,166,196,.14)":"none"}}/>);})}
    <span style={{...label,marginLeft:4}}>{CLOTHS[cloth].name}</span></div>);

  // ---- HOME ---------------------------------------------------------------
  if(screen==="home")return(<Shell>
    <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:30,padding:"6vh 0"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:F.display,fontWeight:700,fontSize:"clamp(52px,13vw,88px)",letterSpacing:-2.5,lineHeight:1}}>Chalk</div>
        <div style={{...label,marginTop:12,letterSpacing:4}}>Run the table</div></div>
      <div style={{width:"min(320px,100%)",display:"grid",gap:9}}>
        <button onClick={()=>setScreen("table")} style={{...btnPrimary,padding:"16px",fontSize:15}}>Play</button>
        <button onClick={()=>setScreen("lab")} style={{...btn,padding:"13px",borderColor:C.accentDim}}>Effect Lab</button>
        <button onClick={()=>setScreen("rules")} style={{...btn,padding:"13px"}}>How to play</button>
        <button disabled style={{...btn,padding:"13px",opacity:.35,cursor:"default"}}>Online</button>
      </div></div></Shell>);

  if(screen==="lab")return <EffectLab onBack={()=>setScreen("home")} cloth={cloth}/>;

  if(screen==="king"){
    const q=king.challenge,tier=BOTS.reduce((a,b)=>Math.abs(b.rating-q.rating)<Math.abs(a.rating-q.rating)?b:a,BOTS[0]);
    const rackPay=18+Math.round(q.rating/48)+king.streak*2,s=king.series||{us:0,them:0},deciding=s.us===1&&s.them===1;
    return(<Shell wide><Head onBack={()=>setScreen("setup")} title="King of the Table"/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:14}}>
        {[["WIN STREAK",king.streak,"#efc486"],["BANK",`$${king.bank}`,C.good],["BUZZ",Math.round(king.buzz),king.buzz>=85?C.warn:C.accent]].map(([k,v,c])=><div key={k} style={{...panel,padding:"14px 16px"}}>
          <div style={{...label,fontSize:9}}>{k}</div><div style={{fontFamily:F.display,fontSize:28,fontWeight:700,color:c,marginTop:3}}>{v}</div></div>)}
      </div>
      {king.last&&<div style={{padding:"9px 12px",borderRadius:9,background:"rgba(106,168,138,.09)",border:`1px solid ${C.line}`,fontSize:12,color:C.ink2,marginBottom:12}}>{king.last}</div>}
      <div style={{...panel,padding:18,borderColor:"rgba(201,138,75,.38)"}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
          <span style={{width:48,height:48,borderRadius:14,background:charOf(q.char).color,display:"grid",placeItems:"center",fontFamily:F.display,fontWeight:800,fontSize:20,color:"#111"}}>{charOf(q.char).name[0]}</span>
          <div style={{flex:"1 1 300px"}}><div style={{...label,color:C.warn}}>{king.decision?"Rack complete · choose":"Next challenger"}</div>
            <h2 style={{fontFamily:F.display,margin:"4px 0 3px",fontSize:"clamp(22px,4vw,32px)"}}>{q.name}</h2>
            <div style={{fontFamily:F.mono,fontSize:10,color:C.muted}}>{q.rating} RATING · {tier.label.toUpperCase()} · {TABLES[q.tid].name.toUpperCase()} · OPPONENT {king.streak+1}</div></div>
          {q.team&&<span style={{fontFamily:F.mono,fontSize:10,padding:"6px 9px",borderRadius:7,border:`1px solid ${C.warn}`,color:C.warn}}>2 × 2 NIGHT</span>}
          {king.series&&<span style={{fontFamily:F.display,fontWeight:700,fontSize:22,padding:"7px 11px",borderRadius:9,background:C.panel2,border:`1px solid ${C.line}`}}>{s.us}–{s.them}</span>}
        </div>
        <div style={{margin:"15px 0",height:1,background:C.line}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:18,alignItems:"center"}}>
          <TableArt tid={q.tid} cloth={cloth}/>
          <div><div style={{fontSize:13,color:C.ink2,lineHeight:1.55}}>{q.team?"You get a house partner and their side gets one too. Win the rack, then decide whether this table is settled or deserves a runback.":"Play one rack first. Only after it ends do you bank the result and take the next challenger, or play this person again."}</div>
            <div style={{fontSize:11.5,color:C.muted,lineHeight:1.5,marginTop:7}}>A rematch becomes a race to two: 2–0 ends immediately; 1–1 forces one deciding rack. Buzz falls 35% after every rack. Every conquered opponent raises the next rating by at least 52 until pro speed.</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:14}}>
              {!king.decision&&<button onClick={()=>launchKing(false)} style={btnPrimary}>Play rack · win ${rackPay}</button>}
              {king.decision&&king.decision.racks===1&&<>
                <button onClick={()=>advanceKing(king.decision.lastWon)} style={btnPrimary}>{king.decision.lastWon?"Bank the win · next challenger":"Accept loss · next challenger"}</button>
                <button onClick={()=>launchKing(true)} style={{...btn,borderColor:C.warn,color:"#efc486"}}>Play them again · race to 2</button>
              </>}
              {king.decision&&deciding&&<button onClick={()=>launchKing(true)} style={{...btnPrimary,background:C.warn}}>Play deciding rack · tied 1–1</button>}
            </div></div>
        </div>
      </div>
      <div style={{...panel,padding:"12px 14px",marginTop:12,display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{...label,fontSize:9}}>Your player</span>
        <Select id="kingchar" value={seats[0].char} width={150} onPick={v=>upd(0,{char:v})}
          options={CHAR_IDS.map(c=>({v:c,label:CHARS[c].name,sub:CHARS[c].move.name,dot:CHARS[c].color}))}/>
        <span style={{...label,fontSize:9,marginLeft:8}}>Cloth</span><ClothPicker/>
      </div>
    </Shell>);}

  if(screen==="kingGame"){
    const q=king.challenge,ally=CHAR_IDS.find(c=>c!==seats[0].char&&c!==q.char)||CHAR_IDS[0];
    const ks=q.team?
      [{kind:"human",char:seats[0].char,team:1},{kind:"cpu",char:q.char,rating:q.rating,team:2},{kind:"cpu",char:ally,rating:Math.max(350,q.rating-55),team:1},{kind:"cpu",char:CHAR_IDS.find(c=>c!==q.char&&c!==ally)||CHAR_IDS[1],rating:Math.max(350,q.rating-25),team:2}]:
      [{kind:"human",char:seats[0].char,team:1},{kind:"cpu",char:q.char,rating:q.rating,team:2}];
    return <Game key={kingKey} tid={q.tid} cloth={cloth} count={q.team?4:2} mode="eight" seats={ks}
      opts={{balls:true,specials:true,bar:true}} powerSet={q.powerSet} initialBuzz={king.buzz} initialCash={START_CASH}
      campaign={{challenger:q.name,rating:q.rating,us:king.series.us,them:king.series.them,target:king.series.target,rematch:king.series.rematch,bank:king.bank}}
      onResult={onKingResult} onSetup={()=>setScreen("king")} onQuit={()=>setScreen("king")}/>;
  }

  // ---- RULES --------------------------------------------------------------
  if(screen==="rules"){
    const H=({children})=><div style={{fontFamily:F.display,fontSize:15,fontWeight:600,margin:"22px 0 9px"}}>{children}</div>;
    const R=({k,v,c})=><div style={{display:"grid",gridTemplateColumns:"128px 1fr",gap:12,marginBottom:7,fontSize:13,alignItems:"baseline"}}>
      <b style={{color:c||C.ink,fontWeight:600}}>{k}</b><span style={{color:C.ink2,lineHeight:1.55}}>{v}</span></div>;
    return(<Shell wide><Head onBack={()=>setScreen("home")} title="How to play"/>
      <p style={{color:C.ink2,fontSize:13.5,lineHeight:1.65,margin:0,maxWidth:640}}>
        Drag anywhere on the cloth to aim — the further from the cue ball you drag, the finer the control.
        Then drag the power bar under the table and let go to shoot. The white line shows first contact; the blue
        line shows where the struck ball sets off.</p>
      <H>Game types</H>
      {MODE_IDS.map(m=><R key={m} k={MODES[m].name} v={m==="king"?`Solo campaign — ${MODES[m].blurb}`:`${MODES[m].seats.join(" or ")} players — ${MODES[m].blurb}`}/>)}
      <H>8-Ball</H>
      <R k="Groups" v="The table is open until someone legally pockets a solid or a stripe. That group is theirs, and their side's."/>
      <R k="Fouls" v="Scratch, hitting nothing, hitting the wrong group first, or failing to reach a cushion after contact. Every one of them is ball in hand anywhere."/>
      <R k="The eight" v="Once your group is cleared you're on the eight, and you have to call the pocket first. Make it there and the rack is yours. Sink it early, sink it anywhere else, or foul while making it, and you lose on the spot."/>
      <R k="The break" v="Eight on the break is not a loss — it goes straight back up on the foot spot."/>
      <H>Cutthroat</H>
      <R k="Groups" v="Two players take solids and stripes with the eight left neutral; three take five each; four take three each with 13, 14 and 15 neutral. Each ball wears a ring in its owner's colour."/>
      <R k="Shooting" v="You pot other people's balls, never your own. Sink one of yours and it stays down — that's punishment enough. Turn continues only if you pocketed an opponent's."/>
      <R k="Neutral balls" v="Pocketing one is a foul. It goes back on the foot spot and your turn ends."/>
      <R k="Scratch" v="Every opponent gets one of their pocketed balls spotted back, and the next player shoots with ball in hand. Someone with no balls left is skipped, not eliminated — a scratch can put them right back in it."/>
      <H>Tables</H>
      {TABLE_IDS.map(t=><R key={t} k={TABLES[t].name} v={`${TABLES[t].tag} — ${TABLES[t].blurb}`}/>)}
      <H>Stats</H>
      <p style={{color:C.ink2,fontSize:13,lineHeight:1.6,margin:"0 0 10px",maxWidth:640}}>
        Six stats, and each one gates something different, so being good at one never covers being bad at another.
        Nobody has all six.</p>
      <R k="Power" v="Your top cue speed. Low power can still pot anything on the table, it just can't break properly or send the cue ball three rails for position."/>
      <R k="Stroke" v="How closely the ball leaves on the line you aimed. This is the one that decides whether you make the shot you lined up."/>
      <R k="Touch" v="How closely the delivered speed matches the speed you set. You can be dead straight and still lose the table by arriving too hard."/>
      <R k="English" v="How far off centre you're allowed to strike. The dashed ring on the tip control is your ceiling — draw, follow and side all live inside it."/>
      <R k="Curve" v="How high you may raise the butt of the cue. Elevation plus side spin is what bends a ball, so this is the stat that gets you round a post."/>
      <R k="Eye" v="How much of the shot you're shown before you play it: one, two or three cushions ahead, whether you see where the object ball goes, and whether you see where the cue ball finishes."/>
      <H>Characters</H>
      <p style={{color:C.ink2,fontSize:13,lineHeight:1.6,margin:"0 0 10px",maxWidth:640}}>
        Fargo is the strongest all round and still can't bend a ball, which is the whole reason Pillars and Gates are
        on the table list. Specials are chosen now and go live in the next build.</p>
      {CHAR_IDS.map(c=><R key={c} c={CHARS[c].color} k={CHARS[c].name}
        v={`${CHARS[c].move.name} (${CHARS[c].move.tag}) — ${CHARS[c].move.text}`}/>)}
      <H>Power Ball sets</H>
      {POWER_SET_IDS.map(k=><R key={k} k={POWER_SETS[k].name} v={`${POWER_SETS[k].blurb} ${POWER_SETS[k].trigger}.`}/>) }
    </Shell>);}

  // ---- TABLE PICKER -------------------------------------------------------
  if(screen==="table")return(<Shell>
    <Head onBack={()=>setScreen("home")} title="Pick a table"/>
    <div className="table-grid">
      {TABLE_IDS.map(t=>{const on=tid===t;
        return(<button key={t} onClick={()=>setTid(t)} style={{...panel,padding:11,cursor:"pointer",textAlign:"center",
          border:on?`1px solid ${C.accentDim}`:`1px solid ${C.line}`,background:on?C.panel2:C.panel,
          boxShadow:on?"0 0 0 1px rgba(127,166,196,.18)":"none"}}>
          <TableArt tid={t} cloth={PREVIEW_CLOTH}/>
          <div style={{fontFamily:F.display,fontWeight:600,fontSize:14,marginTop:8,color:C.ink}}>{TABLES[t].name}</div>
          <div style={{fontFamily:F.mono,fontSize:10.5,color:C.muted,marginTop:2}}>{TABLES[t].tag}</div>
        </button>);})}
    </div>
    <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <button onClick={()=>setScreen("rules")} style={{...btnGhost,fontSize:12}}>Table rules</button>
      <button onClick={()=>setScreen("setup")} style={{...btnPrimary,padding:"11px 20px"}}>Players →</button></div>
  </Shell>);

  // ---- SETUP --------------------------------------------------------------
  if(screen==="setup"){const legal=modesFor(count);
    return(<Shell><Head onBack={()=>setScreen("table")} title={`Setup · ${TABLES[tid].name}`}/>
      {mode!=="king"&&<div style={{display:"flex",gap:8,marginBottom:14}}>{[2,3,4].map(n=>
        <button key={n} onClick={()=>setCount(n)} style={count===n?segOn:seg}>{n} players</button>)}</div>
      }
      <div style={{display:"grid",gap:12}}>
        <div style={{...panel,padding:"14px 16px"}}>
          <div style={{...label,marginBottom:9}}>Table cloth</div>
          <div style={{display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{width:230,maxWidth:"100%",flexShrink:0}}><TableArt tid={tid} cloth={cloth}/></div>
            <div style={{flex:"1 1 260px",minWidth:0}}>
              <ClothPicker/>
              <div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:9}}>Select a swatch to preview the full cloth on {TABLES[tid].name}.</div>
            </div>
          </div>
          <div style={{height:1,background:C.line,margin:"14px 0"}}/>

          <div style={label}>Game mode</div>
          <div style={{display:"flex",gap:7,marginTop:8,flexWrap:"wrap"}}>{legal.map(m=>
            <button key={m} onClick={()=>setMode(m)} style={mode===m?segOn:seg}>{MODES[m].name}</button>)}
            <button disabled style={{...seg,opacity:.35,cursor:"default"}}>Tournament · soon</button></div>
          <div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:8}}>{MODES[mode].blurb}</div>
          {mode==="cutthroat"&&(()=>{const N=(TABLES[tid].build().racks||1)*15;
            const per=count===2?Math.floor(N/2)-(N/15):Math.floor(N/count), spare=N-per*count;
            return <div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:5}}>
              {per} balls each{spare?`, ${spare} neutral — pocket one of those and it goes straight back up`:", nothing spare"}.</div>;})()}
          {mode==="eight"&&count>2&&(()=>{const a=seats.slice(0,count).filter(x=>(x.team||1)===1).length;
            return <div style={{fontSize:11.5,color:a===0||a===count?C.warn:C.muted,lineHeight:1.45,marginTop:5}}>
              {a===0||a===count?"Put at least one player on each side.":`${a} v ${count-a}. Sides alternate every shot, so a lone player still shoots every other turn.`}</div>;})()}

          <div style={{height:1,background:C.line,margin:"14px 0"}}/>
          {mode==="king"?<div style={{padding:"11px 12px",borderRadius:10,background:"rgba(201,138,75,.08)",border:`1px solid rgba(201,138,75,.35)`}}>
            <div style={{fontFamily:F.mono,fontSize:9.5,color:C.warn}}>SOLO CAMPAIGN · EVERYTHING ENABLED</div>
            <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:5}}>Your selected cloth carries into the run and {TABLES[tid].name} hosts the opening challenge. Later challengers bring their own tables, Power Ball sets, stakes, and occasional 2v2 partners.</div>
          </div>:<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div style={label}>Game options</div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setOpts({balls:false,specials:false,bar:false})} style={{...btnGhost,padding:"6px 11px",fontSize:11}}>Pure</button>
              <button onClick={()=>setOpts({balls:true,specials:true,bar:true})} style={{...btnGhost,padding:"6px 11px",fontSize:11}}>Everything</button>
            </div></div>
          <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
            {[["balls","Power balls"],["specials","Specials"],["bar","The bar"]].map(([k,l])=>
              <button key={k} onClick={()=>setOpts(o=>({...o,[k]:!o[k]}))} style={opts[k]?segOn:seg}>{opts[k]?"✓ ":""}{l}</button>)}</div>
          {opts.balls&&<div style={{marginTop:11,padding:"11px 12px",borderRadius:10,background:"rgba(127,166,196,.07)",border:`1px solid ${C.line}`}}>
            <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{...label,fontSize:9}}>Match-wide set</span>
              <Select id="powerset" value={powerSet} width={168} onPick={setPowerSet}
                options={POWER_SET_IDS.map(k=>({v:k,label:POWER_SETS[k].name,sub:POWER_SETS[k].tag,dot:POWER_SETS[k].color}))}/>
              <span style={{fontFamily:F.mono,fontSize:9.5,color:POWER_SETS[powerSet].color}}>{POWER_SETS[powerSet].trigger.toUpperCase()}</span>
            </div>
            <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:7}}>{POWER_SETS[powerSet].blurb}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>{Object.entries(POWER_SETS[powerSet].map).map(([n,p])=><span key={n}
              style={{fontFamily:F.mono,fontSize:8.5,color:BALLS[p].color,padding:"4px 6px",borderRadius:6,border:`1px solid ${BALLS[p].color}55`,background:`${BALLS[p].color}0d`}}>
              {n} · {BALLS[p].sigil} {BALLS[p].name.toUpperCase()}</span>)}</div>
          </div>}
          {opts.bar&&<div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:8}}>
            Everyone starts on a ${START_CASH} tab. Drinks buy you stats or bend the rules; you can also spend it on
            the player opposite. When the tab is gone it is gone.</div>}
          </>}
        </div>

        {Array.from({length:mode==="king"?1:count}).map((_,i)=>{const s=seats[i],ch=charOf(s.char);
          return(<div key={i} style={{...panel,padding:"12px 14px"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{width:22,height:22,borderRadius:6,background:ch.color,flexShrink:0}}/>
              <b style={{fontFamily:F.mono,fontSize:11,minWidth:48}}>SEAT {i+1}</b>
              {mode!=="king"&&<Select id={i+"k"} value={s.kind} width={104} onPick={v=>upd(i,{kind:v})}
                options={[{v:"human",label:"You"},{v:"cpu",label:"Computer"}]}/>
              }
              <Select id={i+"c"} value={s.char} width={132} onPick={v=>upd(i,{char:v})}
                options={CHAR_IDS.map(c=>({v:c,label:CHARS[c].name,sub:CHARS[c].move.name,dot:CHARS[c].color}))}/>
              {mode!=="king"&&s.kind==="cpu"&&<Select id={i+"r"} value={s.rating} width={150} onPick={v=>upd(i,{rating:v})}
                options={BOTS.map(b=>({v:b.rating,label:b.label,sub:b.rating+" rating"}))}/>}
              {mode==="eight"&&count>2&&<Select id={i+"t"} value={s.team||1} width={100} onPick={v=>upd(i,{team:v})}
                options={[{v:1,label:"Side 1"},{v:2,label:"Side 2"}]}/>}
            </div>
            <div style={{display:"flex",gap:"7px 16px",flexWrap:"wrap",marginTop:10}}>
              {STATS.map(([k,l])=><span key={k} style={{display:"inline-flex",gap:6,alignItems:"center"}}>
                <span style={{...label,fontSize:8,letterSpacing:.9}}>{l}</span><Bars v={ch[k]} color={ch.color}/></span>)}</div>
            {(mode==="king"||opts.specials)&&<div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:8}}>
              <b style={{color:ch.color,fontWeight:600}}>{ch.move.name}</b>
              <span style={{fontFamily:F.mono,fontSize:10,color:ch.move.kind==="passive"?C.good:C.warn}}> · {ch.move.tag}</span> — {ch.move.text}</div>}
          </div>);})}
      </div>
      <button onClick={()=>{if(mode==="king"){setKing(k=>({...k,challenge:{...k.challenge,tid}}));setScreen("king");}else setScreen("game");}}
        style={{...btnPrimary,marginTop:18}}>{mode==="king"?"Enter King of the Table →":"Break →"}</button>
    </Shell>);}

  return <Game tid={tid} cloth={cloth} count={count} mode={mode} seats={seats} opts={opts} powerSet={powerSet}
    onSetup={()=>setScreen("setup")} onQuit={()=>setScreen("home")}/>;
}

// ===== 9. GAME ===============================================================
// Two rulesets share one shot loop. What differs is only: who owns which balls,
// what counts as a foul, what a foul costs, and how the turn passes.
function Game({tid,cloth,count,mode,seats,opts,powerSet,onSetup,onQuit,onResult,initialBuzz=0,initialCash=START_CASH,campaign}){
  const g=useMemo(()=>TABLES[tid].build(),[tid]);
  const racks=g.racks||1, TOTAL=racks*15;
  const pk=useMemo(()=>makePockets(g),[g]);
  const ballsRef=useRef(buildRack(g,racks,opts.balls?powerSet:null));
  const [,force]=useState(0);
  const redraw=useCallback(()=>force(v=>v+1),[]);
  const bs=ballsRef.current;
  const cue=bs.find(b=>b.n===0);

  // 8-ball sides. Seat teams come from setup; two seats is always 1 v 1.
  const teams=useMemo(()=>{
    if(mode!=="eight")return null;
    const a=[],b=[];
    for(let i=0;i<count;i++)((seats[i].team===2)?b:a).push(i);
    if(!a.length||!b.length){a.length=0;b.length=0;
      for(let i=0;i<count;i++)(i%2?b:a).push(i);}
    return [a,b];
  },[mode,count,seats]);
  // Cutthroat ownership, fixed for the whole game.
  const own=useMemo(()=>mode==="cutthroat"?assignOwners(TOTAL,count):null,[mode,TOTAL,count]);

  // ---- turn state ----------------------------------------------------------
  const [ply,setPly]=useState(0);        // 8-ball: alternates sides, so 1 v 2 is fair
  const [seatTurn,setSeatTurn]=useState(0);
  const [angle,setAngle]=useState(Math.PI);
  const [power,setPower]=useState(0.42);   // committed shot power, 0..1 — persists
  const grab=useRef(0);                    // power at the moment you took hold
  const [tip,setTip]=useState({a:0,b:0});  // where the tip strikes the cue ball
  const [elev,setElev]=useState(0);        // how far the butt is raised, radians
  const [moving,setMoving]=useState(false);
  const [side,setSide]=useState(null);   // 8-ball: {0:"solid"|"stripe",1:...}
  const [called,setCalled]=useState(null);
  const [msg,setMsg]=useState("Break.");
  const [over,setOver]=useState(null);   // winning seat
  const [inHand,setInHand]=useState(false);
  const [shotNo,setShotNo]=useState(0);
  const [spent,setSpent]=useState({});     // special uses burned, per seat
  const [armed,setArmed]=useState(false);  // active special primed for this shot
  // ---- the bar -------------------------------------------------------------
  const [buzz,setBuzz]=useState(()=>initialBuzz?{0:initialBuzz}:{});       // per seat, 0-120
  const [fx,setFx]=useState({});           // per seat, [{id, shots}]
  const [cash,setCash]=useState(()=>({0:initialCash}));       // your tab. when it's gone, it's gone
  const [sending,setSending]=useState(false);
  const [barOpen,setBarOpen]=useState(false);   // the bar is a popup, not a scroll
  const [bought,setBought]=useState(-1);   // which ply the current purchase was made on
  const [pending,setPending]=useState({});  // per seat: skipTurn / echo / overdrive
  const [tilt,setTilt]=useState(0);
  const [missStreak,setMissStreak]=useState(0);
  const [magnetSurge,setMagnetSurge]=useState(false);
  const [powerPulse,setPowerPulse]=useState("");
  const reported=useRef(false);
  const raf=useRef(0), drag=useRef(null), snap=useRef(null);

  function sideOf(seat){return teams&&teams[0].includes(seat)?0:1;}

  // Base sheet + every live drink + whatever band the buzz meter is in.
  const effOf=useCallback(seat=>{
    const ch=charOf(seats[seat].char), b=buzz[seat]||0, list=fx[seat]||[];
    const st={}; STAT_KEYS.forEach(k=>st[k]=ch[k]);
    const flags={};
    for(const e of list){const d=DRINKS[e.key]||SPIKES[e.key]; if(!d)continue;
      for(const k in (d.stats||{}))st[k]+=d.stats[k];
      Object.assign(flags,d.flags||{});}
    const band=bandOf(b), bf=BAND_FX[band];
    if(bf){ for(const k in (bf.stats||{}))st[k]+=bf.stats[k]; Object.assign(flags,bf.flags||{}); }
    return{ch,st,flags,band,buzz:b};
  },[seats,buzz,fx]);
  // How many balls this seat still has to pot. In cutthroat that is their own
  // group; in 8-ball it is their side's group, or seven while the table is open.
  const upCount=seat=>mode==="cutthroat"
    ? bs.filter(b=>!b.in&&b.n!==0&&own[b.n]===seat).length
    : (()=>{const gp=side&&side[sideOf(seat)]; if(!gp)return 7*racks;
        return bs.filter(b=>!b.in&&b.n!==0&&groupOf(b.n)===gp).length;})();

  // Whose shot is it? 8-ball alternates sides then rotates within the side, so
  // the lone player in a 1 v 2 game still shoots every other turn.
  const shooterAt=useCallback(p=>{
    if(mode!=="eight")return seatTurn;
    const sd=p%2, list=teams[sd];
    return list[Math.floor(p/2)%list.length];
  },[mode,teams,seatTurn]);
  const turn=mode==="eight"?shooterAt(ply):seatTurn;
  const alive=i=>mode!=="cutthroat"||upCount(i)>0;

  const onEight=(()=>{ if(mode!=="eight"||!side)return false;
    const gp=side[sideOf(turn)];
    return bs.filter(b=>!b.in&&b.n!==0&&groupOf(b.n)===gp).length===0;})();

  const legalFor=useCallback(t=>{
    if(mode==="cutthroat")return n=>own[n]!==t&&own[n]!==-1; // not yours, not neutral
    const gp=side&&side[sideOf(t)];
    if(!gp)return n=>groupOf(n)!=="eight";                 // table still open
    const left=bs.filter(b=>!b.in&&b.n!==0&&groupOf(b.n)===gp).length;
    return left?(n=>groupOf(n)===gp):(n=>groupOf(n)==="eight");
  },[mode,side,own,bs,teams]);

  const nextSeat=t=>{let n=t;
    for(let i=0;i<count*2;i++){n=(n+1)%count;
      if(!alive(n))continue;
      if((pending[n]||{}).skip){setPending(x=>({...x,[n]:{...(x[n]||{}),skip:0}}));continue;}
      return n;}
    return t;};
  const passTurn=()=>{ if(mode==="eight")setPly(p=>p+1); else setSeatTurn(t=>nextSeat(t)); };



  // ---- the shot -------------------------------------------------------------
  const resolveRef=useRef(null);
  const shoot=useCallback((a,speed,tp,el)=>{
    if(moving||over!=null||!cue||cue.in)return;
    const e0=effOf(turn), ch=e0.ch, k=kit(e0.st,e0.flags), mv=ch.move, FL=e0.flags;
    const P=passiveOf(ch);
    const breaking=bs.filter(b=>!b.in&&b.n!==0).length===TOTAL;
    // passives that are simply always true of this player
    RULE.noSquirt=P.noSquirt; RULE.spinHold=P.spinHold;
    RULE.fastCloth=!!FL.fastCloth;            // vodka: the cloth runs
    RULE.phase=!!FL.phase||(opts.balls&&powerSet==="haunted"&&missStreak>=3); RULE.phaseBall=null;   // acid / Haunted séance
    RULE.pocketBoost=FL.khole?1.9:1;          // ketamine: the pockets open up
    RULE.magnetBoost=magnetSurge?2.6:1.7;
    RULE.softJaws=!!FL.khole;                 // and stop them spitting balls back
    RULE.tilt=tilt;                           // jager: the slate leans
    RULE.deadRail=armed&&mv.name==="Dead Rail";
    RULE.stunCue =armed&&mv.name==="Perch";
    // La Recta: a near-straight shot leaves with nothing on it
    const pv=predictPath(cue,a,speed,tp,el,bs,g,1);
    const straight=P.perfectStraight&&pv.ball&&pv.cut>0.985;
    const clean=straight||(armed&&mv.name==="Every Route")||!!FL.steady;
    let aErr=clean?0:(Math.random()*2-1)*k.aimErr;
    if(FL.shaky)aErr+=(Math.random()*2-1)*0.004;      // over the line: hands go
    let tpUse=FL.noTip?{a:0,b:0}:(tp||{a:0,b:0});
    if(FL.randomTip){                                  // tequila: it is not up to you
      const m=k.maxTip; tpUse={a:(Math.random()*2-1)*m,b:(Math.random()*2-1)*m};}
    if(FL.miscue&&Math.hypot(tpUse.a,tpUse.b)>k.maxTip*0.78){
      aErr+=(Math.random()*2-1)*0.05; speed*=0.55;}    // struck it too far out
    const sErr=1+(Math.random()*2-1)*k.speedErr;
    // Wrecking Ball: the break ignores the ceiling entirely. Cut Off must set
    // the committed speed before `sp` is calculated; the old order randomized
    // the direction but accidentally kept the player's carefully chosen pace.
    if(FL.cutOff){a=Math.random()*Math.PI*2; speed=MAXV*(0.06+Math.random()*0.10); tpUse={a:0,b:0};}
    const sp=(P.freeBreak&&breaking)?MAXV*1.2:speed*sErr;
    strike(cue,a+aErr,Math.max(12,sp),tpUse,el||0);
    if(opts.balls&&powerSet==="haunted"&&missStreak>=3){setMissStreak(0);setPowerPulse("SÉANCE SHOT · the cue ball ignored first contact");}
    if(magnetSurge)setMagnetSurge(false);
    setFx(f=>({...f,[turn]:(f[turn]||[]).map(e=>({...e,shots:e.shots-1})).filter(e=>e.shots>0)}));
    setBuzz(b=>({...b,[turn]:Math.max(0,(b[turn]||0)+buzzShift(-7,ch.tol))}));
    if(armed){setSpent(x=>({...x,[turn]:(x[turn]||0)+1}));setArmed(false);}
    const before=bs.filter(b=>b.in).map(b=>b.n);
    snap.current=bs.map(b=>({n:b.n,x:b.x,y:b.y,in:b.in}));
    const ev={first:null,rail:false};
    setMoving(true); setMsg("");
    let last=performance.now();
    const loop=now=>{
      const dt=Math.min(.04,(now-last)/1000); last=now;
      advance(bs,g,dt,ev);
      redraw();
      if(asleep(bs)){setMoving(false); resolveRef.current(before,ev); return;}
      raf.current=requestAnimationFrame(loop);};
    raf.current=requestAnimationFrame(loop);
  },[moving,over,cue,bs,g,redraw,seats,turn,armed,TOTAL,effOf,tilt,pending,opts.balls,powerSet,missStreak,magnetSurge]);

  // ---- turn resolution ------------------------------------------------------
  resolveRef.current=(before,ev)=>{
    const sunk=bs.filter(b=>b.in&&b.n!==0&&!before.includes(b.n));
    const scratch=cue.in;
    const isBreak=shotNo===0;
    setShotNo(n=>n+1);
    let keep=false, note="", win=null, lose=false;
    if(opts.balls){
      if(ev.power){note=ev.power;setPowerPulse(ev.power);}
      if(sunk.length)setMissStreak(0);else setMissStreak(n=>n+1);
      if(powerSet==="gravity"&&sunk.length>=2){setMagnetSurge(true);setPowerPulse("MAGNET SURGE · every Magnet widens next turn");}
      if(powerSet==="roulette"&&(shotNo+1)%4===0){
        const deck=BALL_IDS.filter(x=>x!=="none"),live=bs.filter(b=>!b.in&&b.power);
        live.forEach((b,i)=>{b.power=deck[(Math.floor(Math.random()*deck.length)+i)%deck.length];b.ghostSpent=false;});
        setPowerPulse("HOUSE REDRAW · every live Power Ball changed");redraw();}
    }

    if(mode==="cutthroat"){
      const neutral=sunk.filter(b=>own[b.n]===-1&&b.power!=="wild"&&b.power!=="steal");
      const theirs=sunk.filter(b=>b.power==="wild"||b.power==="steal"||(own[b.n]!==turn&&own[b.n]!==-1)).length;
      neutral.forEach(b=>spotBall(b,bs,g));            // neutral balls never stay down
      if(scratch){
        // every opponent lifts one of their own balls back onto the foot spot
        let back=0;
        for(let i=0;i<count;i++){ if(i===turn)continue;
          const down=bs.filter(b=>b.in&&b.n!==0&&own[b.n]===i);
          if(down.length){spotBall(down[down.length-1],bs,g);back++;}}
        note=back?`Scratch. ${back===1?"An opponent gets":"Opponents each get"} a ball back, and ball in hand.`
                 :"Scratch. Nobody had a ball to get back — ball in hand.";
      } else if(neutral.length) note="Neutral ball down. It goes straight back up.";
      else if(!sunk.length)     note="Nothing down.";
      else if(!theirs)          note="That was your own. Turn over.";
      else                      note="Good. Shoot again.";
      keep=theirs>0&&!scratch&&!neutral.length;
      const standing=[];for(let i=0;i<count;i++)if(upCount(i)>0)standing.push(i);
      if(standing.length===1)win=standing[0];
      else if(standing.length===0)win=turn;
    } else {
      const mySide=sideOf(turn);
      const eights=sunk.filter(b=>groupOf(b.n)==="eight");
      // group assignment on the first legal pot
      let sd=side;
      if(!sd&&!scratch){
        const first=sunk.find(b=>groupOf(b.n)!=="eight"&&b.power!=="wild"&&b.power!=="steal");
        if(first){const mineG=groupOf(first.n);
          sd={[mySide]:mineG,[1-mySide]:mineG==="solid"?"stripe":"solid"};
          setSide(sd); note=`${mineG==="solid"?"Solids":"Stripes"} are yours.`;}}
      const gp=sd&&sd[mySide];
      const wasOnEight=onEight;
      const mine=gp?sunk.filter(b=>groupOf(b.n)===gp||b.power==="wild"||b.power==="steal").length
                   :sunk.filter(b=>b.power==="wild"||b.power==="steal").length;
      const noHit=ev.first==null;
      const wrongFirst=!noHit&&!legalFor(turn)(ev.first);
      const noRail=!noHit&&!ev.rail&&sunk.length===0;
      const foul=scratch||noHit||wrongFirst||noRail;

      if(eights.length){
        if(isBreak){ eights.forEach(b=>spotBall(b,bs,g)); note="Eight on the break. It goes back up."; }
        else if(!wasOnEight)                       lose=true;
        else if(foul)                              lose=true;
        else if(eights.some(b=>b.pocket!==called)) lose=true;
        else if(bs.filter(b=>!b.in&&groupOf(b.n)==="eight").length===0) win=turn;
        else {keep=true; note="One eight down. Call the next.";}
      }
      if(!lose&&win==null&&!eights.length){
        if(scratch)          note="Scratch. Ball in hand.";
        else if(noHit)       note="You hit nothing. Ball in hand.";
        else if(wrongFirst)  note="Wrong ball first. Ball in hand.";
        else if(noRail)      note="No rail after contact. Ball in hand.";
        else if(!sunk.length)note="Nothing down.";
        else if(!note)       note=mine>0?"Good. Shoot again.":"That wasn't yours.";
        keep=!foul&&mine>0;
      }
      if(foul&&!lose&&win==null)setInHand(true);
      setCalled(null);
    }

    if(mode==="cutthroat"&&scratch)setInHand(true);
    if(scratch){const cs=g.cueSpot||[g.w*0.24,g.h/2];cue.in=false;cue.pocket=undefined;cue.vx=cue.vy=0;cue.x=cs[0];cue.y=cs[1];
      if(E.flags.noHand)setInHand(false);}   // nailed feet: no ball in hand

    if(lose){const w=mode==="eight"?teams[1-sideOf(turn)][0]:nextSeat(turn);
      setOver(w); setMsg("The eight went down early. Rack over."); redraw(); return;}
    if(win!=null){setOver(win); setMsg(""); redraw(); return;}
    const pd=pending[turn]||{};
    // Sour the pot — anything they sank spits one of their old ones back up
    if(E.flags.feedback&&sunk.length){
      const back=bs.filter(b=>b.in&&b.n!==0&&!sunk.includes(b));
      if(back.length){spotBall(back[back.length-1],bs,g); note+=" One of yours came back up.";}}
    // Peyote — the table snaps back, but the pots stand
    if(pd.echo&&snap.current){
      for(const q of snap.current){const b=bs.find(x=>x.n===q.n); if(!b||b.in)continue; b.x=q.x;b.y=q.y;b.vx=b.vy=b.wx=b.wy=b.wz=0;}
      setPending(x=>({...x,[turn]:{...pd,echo:0}}));
      setMsg("You have been here before. Shoot it again."); redraw(); return;}
    // Adderall — a second shot now, and your next turn is gone
    if(pd.over){ setPending(x=>({...x,[turn]:{over:0,skip:1}}));
      setMsg("Again. Then you're done."); redraw(); return;}
    setMsg(note);
    if(!keep)passTurn();
    redraw();
  };

  // Whose hands are on the cue, and what their sheet looks like right now once
  // drinks and buzz have been applied.
  const human=seats[turn]&&seats[turn].kind==="human";
  const E=effOf(turn), me=E.ch, K=kit(E.st,E.flags);
  useEffect(()=>{
    if(over==null||!onResult||reported.current)return;
    reported.current=true;
    const hi=seats.findIndex(s=>s.kind==="human");
    const humanWin=mode==="eight"&&count>2?sideOf(over)===sideOf(hi):over===hi;
    const t=setTimeout(()=>onResult({winner:over,humanWin,buzz:buzz[hi]||0,cash:cash[hi]==null?initialCash:cash[hi],shots:shotNo}),1050);
    return()=>clearTimeout(t);
  },[over]);

  // Take something. Free, but it happens on your turn and everyone can see it.
  const money=i=>cash[i]==null?(i===0?initialCash:START_CASH):cash[i];
  const applyItem=(seat,d)=>{
    const ch=charOf(seats[seat].char);
    setBuzz(b=>({...b,[seat]:Math.max(0,Math.min(120,(b[seat]||0)+buzzShift(d.buzz,ch.tol)))}));
    setFx(f=>{let list=(f[seat]||[]).filter(e=>e.key!==d.key);
      // Back-off items change the actual active stack, not only the meter.
      // Their own modifier is added after the cleanup so it keeps its duration.
      if(d.cleanse){list=d.cleanse>900?[]:list.map(e=>({...e,shots:e.shots-d.cleanse})).filter(e=>e.shots>0);}
      return{...f,[seat]:[...list,{key:d.key,shots:d.rack?999:d.shots,hostile:d.hostile?1:0}]};});
    if(d.flags&&d.flags.tilt)setTilt((Math.random()<0.5?-1:1)*11);
    redraw();};
  // buy something for yourself
  const spentThisTurn=bought===shotNo;
  const buy=(id)=>{const d=DRINKS[id];
    if(money(turn)<d.cost||spentThisTurn)return;                 // one purchase a turn
    if((fx[turn]||[]).some(e=>e.key===id))return;                // and no double-dosing
    setBought(shotNo); setCash(c=>({...c,[turn]:money(turn)-d.cost}));
    applyItem(turn,{...d,key:id});
    if(d.cleanse){const before=fx[turn]||[], removed=k=>{const e=before.find(x=>x.key===k);
        return e&&(d.cleanse>900||e.shots<=d.cleanse);};
      if(removed("echo"))setPending(x=>({...x,[turn]:{...(x[turn]||{}),echo:0}}));
      if(d.cleanse>900){setPending(x=>({...x,[turn]:{echo:0,over:0,skip:(x[turn]||{}).skip||0}}));
        if(before.some(e=>e.key==="jager"))setTilt(0);}}
    setMsg(`${d.name} active · ${d.fx.toLowerCase()}.`);
    if(d.flags&&d.flags.echo)setPending(x=>({...x,[turn]:{...(x[turn]||{}),echo:1}}));
    if(d.flags&&d.flags.overdrive)setPending(x=>({...x,[turn]:{...(x[turn]||{}),over:1}}));};

  // Send one over. Costs a round, and a round is only earned by missing — so it
  // is the player sitting down who has the ammunition. Note it only HELPS you if
  // it tips them past 85; buy a sober rival a beer and you have walked them into
  // the Loose band for free.
  const sendOne=(to,id)=>{
    const sp=SPIKES[id]; if(money(turn)<sp.cost||spentThisTurn)return;
    setBought(shotNo); setCash(c=>({...c,[turn]:money(turn)-sp.cost}));
    if(sp.flags&&sp.flags.skim){setCash(c=>({...c,[to]:Math.max(0,money(to)-12),[turn]:money(turn)-sp.cost+12}));
      setSending(false); setMsg(`Twelve dollars off ${charOf(seats[to].char).name}.`); return;}
    setSending(false);
    if(!sp.drink){ applyItem(to,{...sp,key:id,hostile:1}); setMsg(`${charOf(seats[to].char).name}: ${sp.name.toLowerCase()}.`); return; }
    applyItem(to,{...sp,key:id,hostile:1});
    setMsg(`${charOf(seats[to].char).name}: ${sp.name.toLowerCase()}.`);
  };


  // ---- computer turn --------------------------------------------------------
  // One action per pass: place the cue ball, or call a pocket, or shoot. Doing
  // two in a single effect run schedules two shots for the same turn.
  useEffect(()=>{
    if(over!=null||moving||(human&&!E.flags.mindSwap))return;
    const t=setTimeout(()=>{
      if(inHand){const cs=g.cueSpot||[g.w*0.24,g.h/2];cue.x=cs[0];cue.y=cs[1];setInHand(false);redraw();return;}
      if(onEight&&called==null){setCalled(pickPocket(bs,g,pk));return;}
      // The house drinks too — and it is watching your meter. The evil play is
      // not drinking for itself, it is spotting a rival parked just under the
      // line and buying the one glass that tips them over.
      if(opts.bar&&shotNo>0&&!spentThisTurn){
        const my=buzz[turn]||0, myCash=money(turn);
        const tolMe=charOf(seats[turn].char).tol;
        // 1. sober myself up before I stop being able to aim
        if(my>=80&&myCash>=DRINKS.espresso.cost){buy("espresso");return;}
        // 2. is anyone sitting in the 55-84 window? one double shot ends them
        const mark=Array.from({length:count},(_,i)=>i).filter(i=>i!==turn&&alive(i))
          .find(i=>{const b=buzz[i]||0;
            return b>=48&&b+buzzShift(SPIKES.doubles.buzz,charOf(seats[i].char).tol)>=95;});
        if(mark!=null&&myCash>=SPIKES.doubles.cost){sendOne(mark,"doubles");return;}
        // 3. otherwise soften up whoever has the most balls left
        if(myCash>=SPIKES.lights.cost+18&&Math.random()<0.4){
          const t2=Array.from({length:count},(_,i)=>i).filter(i=>i!==turn&&alive(i))
            .sort((a,b)=>upCount(a)-upCount(b))[0];
          if(t2!=null){sendOne(t2,Math.random()<0.5?"lights":"dose");return;}}
        // 4. and drink for myself while there is room on the meter
        if(my<40&&myCash>=DRINKS.whiskey.cost+20&&Math.random()<0.5){
          const ch2=charOf(seats[turn].char);
          buy(ch2.pow<60?"whiskey":ch2.stroke<70?"beer":"vodka");return;}
      }
      const cm=charOf(seats[turn].char).move;
      if(cm.kind==="active"&&(cm.uses-(spent[turn]||0))>0&&Math.random()<0.35&&!armed){setArmed(true);return;}
      const s=pickShot(bs,g,legalFor(turn),seats[turn].rating||650);
      if(s){setAngle(s.angle);setTimeout(()=>shoot(s.angle,s.speed,{a:0,b:0},0),400);}
    },700);
    return()=>clearTimeout(t);
  },[turn,moving,over,inHand,human,onEight,called,legalFor,shoot,bs,g,pk,seats,cue,redraw,spent,armed,
     opts.bar,shotNo,spentThisTurn,buzz,cash,count]);
  useEffect(()=>()=>cancelAnimationFrame(raf.current),[]);

  // ---- input ---------------------------------------------------------------
  // Two gestures and two buttons, and that is the whole control scheme: the
  // cloth aims, the speed bar sets pace, and only Shoot or Enter plays the ball.
  const needCall=onEight&&called==null&&over==null;
  const canShoot=human&&!moving&&over==null&&!inHand&&!needCall&&!E.flags.mindSwap;
  const mv=me.move, left=mv.kind==="active"?mv.uses-(spent[turn]||0):0;
  const canArm=canShoot&&mv.kind==="active"&&left>0;
  useEffect(()=>{ if(power<K.minPower)setPower(K.minPower); },[K.minPower,power]);


  // The cloth is an aiming surface and nothing else. Dragging it only ever
  // turns the cue — no gesture here plays the shot, so you can work on your
  // line as long as you like without ever setting it off by accident.
  const onPoint=(kind,p)=>{
    if(!p||!human||moving||over!=null)return;
    if(kind==="down"&&needCall){
      let bi=0,bd=Infinity;
      pk.forEach((q,i)=>{const d=Math.hypot(q.cx-p.x,q.cy-p.y);if(d<bd){bd=d;bi=i;}});
      setCalled(bi); return;}
    if(inHand){                                  // slide it around as long as you like
      if(kind==="down")drag.current="hand";
      if(drag.current==="hand"){
        const x=Math.max(BR,Math.min(g.w-BR,p.x)),y=Math.max(BR,Math.min(g.h-BR,p.y));
        if(insideBed(g,x,y)){cue.x=x;cue.y=y;redraw();}}
      if(kind==="up")drag.current=null;
      return;}
    if(!cue)return;
    if(kind==="down")drag.current="aim";
    if(kind!=="up"&&drag.current==="aim")
      setAngle(E.flags.mirror?-Math.atan2(p.y-cue.y,p.x-cue.x):Math.atan2(p.y-cue.y,p.x-cue.x));
    if(kind==="up")drag.current=null;};

  // The stroke bar does the same job without needing to find the cue on the
  // cloth: press it, pull down, let go.
  const strokeRef=useRef(null), strokeY=useRef(0);
  const onStroke=(kind,e)=>{
    if(!canShoot)return;
    const el=strokeRef.current; if(!el)return;
    if(kind==="down"){el.setPointerCapture(e.pointerId);strokeY.current=e.clientY;grab.current=power;return;}
    if(kind==="move"){ if(!e.buttons)return;
      // up for more, which is the way every other slider on earth works
      setPower(Math.max(K.minPower,Math.min(1,grab.current-(e.clientY-strokeY.current)/118))); return;}
    // deliberately no shot on release — this control only sets the speed
  };

  // Enter plays the shot at whatever speed is dialled in. That and the Shoot
  // button are the only two things in the whole screen that fire a ball.
  useEffect(()=>{
    const k=e=>{ if(!canShoot||e.key!=="Enter")return;
      e.preventDefault(); shoot(angle,MAXV*K.speedMul*power*power,tip,elev);};
    window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);
  },[canShoot,angle,power,tip,elev,shoot,K.speedMul]);

  // Arrow keys nudge the line; hold shift for a hair's width.
  useEffect(()=>{
    const k=e=>{ if(!canShoot)return;
      const fine=e.shiftKey?0.0006:0.004;

  },[canShoot]);

  const spinRef=useRef(null);
  const onSpin=(kind,e)=>{
    if(!canShoot)return;
    const el=spinRef.current; if(!el)return;

    if(kind==="up"){drag.current=null;return;}
    if(kind==="move"&&!e.buttons)return;
    const r=el.getBoundingClientRect();
    let a=((e.clientX-r.left)/r.width-0.5)*2, b=-(((e.clientY-r.top)/r.height-0.5)*2);

    if(m>1){a/=m;b/=m;}
    if(E.flags.noTip){setTip({a:0,b:0});return;}
    setTip({a:+(a*K.maxTip).toFixed(3),b:+(b*K.maxTip).toFixed(3)});};

  const colorForSide=sd=>{const lead=teams&&teams[sd]&&teams[sd][0];return lead==null?C.accent:charOf(seats[lead].char).color;};
  const ringFor=b=>{if(E.flags.blindGroups)return null;
    if(mode==="cutthroat"){const o=own[b.n];return o<0?null:charOf(seats[o].char).color;}
    if(mode==="eight"&&side&&groupOf(b.n)!=="eight"){
      const gp=groupOf(b.n),owner=side[0]===gp?0:1;return colorForSide(owner);}
    return null;};
  const previewV=MAXV*K.speedMul*power*power;
  // DMT used to simulate an entire seven-second table outcome on every render,
  // including unrelated hover/state updates. Memoizing the forecast keeps the
  // effect responsive while still recalculating for every meaningful aim edit.
  const endPreview=useMemo(()=>cue&&!cue.in&&E.flags.seeEnd
    ?restingPlaces(bs,g,angle,previewV,tip,elev):null,
    [cue&&cue.x,cue&&cue.y,angle,previewV,tip.a,tip.b,elev,shotNo,turn,E.flags.seeEnd,g]);
  const aim=cue&&!cue.in?{
    show:human&&!moving&&over==null&&!inHand&&!needCall&&!E.flags.noPreview,
    stick:!moving&&over==null&&!inHand,
    x:cue.x,y:cue.y,angle,pull:power,tip,
    ends:endPreview,
    p:predictPath(cue,angle+(E.flags.falseLine?0.055:0),previewV,tip,elev,bs,g,
        armed&&me.move.name==="Every Route"?5:((E.flags.falseLine||E.flags.seeAll)?5:K.rails)),
    ghostLine:E.flags.doubleVision?predictPath(cue,angle+0.07,previewV,tip,elev,bs,g,K.rails):null,
    live:false,objLine:K.objLine||armed||E.flags.seeAll,
    cueLine:K.cueLine||armed||E.flags.seeAll,stop:K.stopMark||armed||E.flags.seeAll}:null;

  // Full reset: new rack, sober everybody up, refill every tab.
  const restart=()=>{ballsRef.current=buildRack(g,racks,opts.balls?powerSet:null);setPly(0);setSeatTurn(0);setSide(null);
    setOver(null);setInHand(false);setPower(0.42);setTip({a:0,b:0});setElev(0);setCalled(null);setSpent({});setArmed(false);
    setBuzz(initialBuzz?{0:initialBuzz}:{});setFx({});setCash({0:initialCash});setTilt(0);setSending(false);setBarOpen(false);

  const groupLabel=i=>{
    if(mode==="cutthroat")return `${upCount(i)} up`;

    return (gp?(gp==="solid"?"Solids":"Stripes"):"Open")+(teams&&count>2?` · Side ${sideOf(i)+1}`:"");};

  return(<Shell wide>
    <Head title="Chalk" right={<>
      {!campaign&&<button onClick={restart} style={btnGhost}>Rerack</button>}
      {!campaign&&<button onClick={onSetup} style={btnGhost}>Setup</button>}
      <button onClick={onQuit} style={btnGhost}>Quit</button></>}/>

    {campaign&&<div style={{...panel,padding:"9px 12px",marginBottom:10,display:"flex",gap:14,alignItems:"center",flexWrap:"wrap",borderColor:"rgba(201,138,75,.45)"}}>
      <b style={{fontFamily:F.display,color:"#efc486"}}>King of the Table</b>
      <span style={{fontFamily:F.mono,fontSize:10,color:C.ink2}}>{campaign.challenger} · {campaign.rating} RATING</span>
      <span style={{fontFamily:F.mono,fontSize:10,color:C.muted}}>{campaign.rematch?`REMATCH ${campaign.us}–${campaign.them} · FIRST TO 2`:"ONE RACK · REMATCH OFFER COMES AFTER"}</span>
      <span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:10,color:C.good}}>BANK ${campaign.bank} · BUZZ {Math.round(E.buzz)}</span>
    </div>}

    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      {seats.slice(0,count).map((s,i)=>{const ch=charOf(s.char),act=i===turn&&over==null,out=!alive(i),
        gp=mode==="eight"&&side?side[sideOf(i)]:null,markCol=gp?colorForSide(sideOf(i)):ch.color;
        return(<div key={i} style={{...panel,padding:"9px 12px",display:"flex",alignItems:"center",gap:10,flex:"1 1 168px",
          opacity:out?.4:1,border:act?`1px solid ${C.accentDim}`:`1px solid ${C.line}`,background:act?C.panel2:C.panel,
          boxShadow:gp?`inset 3px 0 ${markCol}`:"none"}}>
          <span style={{width:26,height:26,borderRadius:26,background:ch.color,display:"flex",alignItems:"center",
            justifyContent:"center",fontFamily:F.display,fontWeight:700,fontSize:12,color:"#12140f",flexShrink:0}}>{ch.name[0]}</span>
          <span style={{minWidth:0,flex:1}}>
            <span style={{display:"block",fontSize:13,fontWeight:600,color:C.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ch.name}</span>
            <span style={{display:"block",fontFamily:F.mono,fontSize:9.5,color:act?C.accent:C.muted}}>
              {out?"OUT":(effOf(i).flags.blindGroups?"???":groupLabel(i))}{s.kind==="cpu"?" · CPU":""}</span>
            {opts.bar&&<span style={{display:"block",marginTop:4}}>
              <span style={{display:"block",height:3,borderRadius:3,background:C.line,overflow:"hidden"}}>
                <span style={{display:"block",height:"100%",width:`${Math.min(100,(buzz[i]||0)/1.2)}%`,
                  background:(buzz[i]||0)>=85?C.warn:(buzz[i]||0)>=25?C.good:C.muted}}/></span>
              <span style={{fontFamily:F.mono,fontSize:8.5,color:(buzz[i]||0)>=85?C.warn:C.muted}}>
                {bandOf(buzz[i]||0).toUpperCase()}{opts.bar?` · $${money(i)}`:""}</span></span>}
            </span>
          {gp&&!effOf(i).flags.blindGroups&&<GroupToken group={gp} color={markCol} size={22}/>} 
          {mode!=="cutthroat"&&!effOf(i).flags.blindGroups&&<span style={{fontFamily:F.mono,fontSize:11,color:C.muted}}>{upCount(i)}</span>}
          {sending&&i!==turn&&alive(i)&&<button onClick={()=>sendOne(i,sending)}
            style={{...btn,padding:"6px 9px",fontSize:11,borderColor:C.warn,color:C.warn}}>On me</button>}
        </div>);})}
    </div>

    {(()=>{const hi=seats.slice(0,count).findIndex(s=>s.kind==="human");if(hi<0)return null;
      if(mode==="cutthroat"){const col=charOf(seats[hi].char).color;return <div style={{display:"flex",alignItems:"center",gap:9,margin:"-3px 0 10px",padding:"8px 11px",borderRadius:9,border:`1px solid ${col}66`,background:`${col}12`}}>
        <span style={{width:12,height:12,borderRadius:"50%",background:col,boxShadow:`0 0 0 3px ${col}33`}}/><b style={{fontSize:12.5}}>Your table color</b><span style={{fontSize:11,color:C.muted}}>Balls outlined in this color belong to you.</span></div>;}
      if(mode!=="eight")return null;if(!side)return <div style={{margin:"-3px 0 10px",fontFamily:F.mono,fontSize:9.5,color:C.muted}}>TABLE OPEN · YOUR GROUP AND TABLE COLOR LOCK IN ON THE FIRST LEGAL POT</div>;
      const sd=sideOf(hi),gp=side[sd],col=colorForSide(sd);return <div style={{display:"flex",alignItems:"center",gap:9,margin:"-3px 0 10px",padding:"8px 11px",borderRadius:9,border:`1px solid ${col}66`,background:`${col}12`}}>
        <GroupToken group={gp} color={col} size={24}/><b style={{fontSize:13}}>You are {gp==="solid"?"Solids":"Stripes"}</b>
        <span style={{width:9,height:9,borderRadius:"50%",background:col}}/><span style={{fontSize:11,color:C.muted}}>This color outlines every ball your side owns.</span></div>;})()}

    {opts.balls&&POWER_SETS[powerSet]&&<div style={{display:"flex",gap:9,alignItems:"center",flexWrap:"wrap",margin:"-2px 0 10px",padding:"7px 10px",borderRadius:9,
      background:`${POWER_SETS[powerSet].color}12`,border:`1px solid ${POWER_SETS[powerSet].color}55`}}>
      <span style={{fontFamily:F.mono,fontSize:9,color:POWER_SETS[powerSet].color}}>POWER SET</span>
      <b style={{fontSize:12.5}}>{POWER_SETS[powerSet].name}</b>
      <span style={{fontSize:11,color:C.muted}}>{POWER_SETS[powerSet].trigger}</span>
      <span style={{display:"inline-flex",gap:5,flexWrap:"wrap"}}>{Object.entries(POWER_SETS[powerSet].map).map(([n,p])=><span key={n}
        style={{fontFamily:F.mono,fontSize:8,color:BALLS[p].color,padding:"3px 5px",borderRadius:5,border:`1px solid ${BALLS[p].color}55`}}>{n} {BALLS[p].sigil} {BALLS[p].name}</span>)}</span>
      {powerPulse&&<span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:9.5,color:"#f2cf8b"}}>{powerPulse}</span>}
    </div>}

    <div style={{...panel,padding:10,background:"#0d0f11"}}>
      <TableArt tid={tid} cloth={cloth} balls={bs} aim={aim} onPoint={onPoint}
        ringFor={ringFor} calls={needCall?pk:null} called={called} blank={E.flags.blankBalls}
        tfx={{khole:E.flags.khole,fastCloth:E.flags.fastCloth,phase:E.flags.phase,
              melt:E.flags.phase,steady:E.flags.steady,echo:E.flags.echo,
              ends:aim&&aim.ends,noPreview:E.flags.noPreview,
              tilt:tilt}}/></div>


    {/* WHAT IS RUNNING RIGHT NOW — the thing you cannot play without */}
    {(()=>{const live=(fx[turn]||[]).map(e=>({e,d:DRINKS[e.key]||SPIKES[e.key]})).filter(x=>x.d);
      if(!live.length&&!armed&&!needCall)return null;
      return(<div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:10,alignItems:"center"}}>
        <span style={{...label,fontSize:9.5}}>In effect</span>
        {armed&&<span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 10px",borderRadius:8,
          border:`1px solid ${me.color}`,background:`${me.color}22`}}>
          <span style={{width:7,height:7,borderRadius:7,background:me.color}}/>
          <b style={{fontSize:12,color:C.ink}}>{mv.name}</b>
          <span style={{fontFamily:F.mono,fontSize:9,color:C.muted}}>ARMED · {me.name.toUpperCase()}</span></span>}
        {live.map(({e,d})=>{const look=fxLook(e.key),col=e.hostile?C.warn:look.ink;
          return(<span key={e.key} title={d.note} style={{display:"inline-flex",alignItems:"center",gap:8,
            padding:"6px 10px 6px 7px",borderRadius:9,border:`1px solid rgba(${look.rgb},.38)`,
            borderLeft:`3px solid ${col}`,background:`rgba(${look.rgb},.09)`,
            boxShadow:`inset 0 1px rgba(255,255,255,.025)`,animation:"fx-enter .22s ease-out both"}}>
            <span style={{fontFamily:F.mono,fontSize:7.5,fontWeight:500,letterSpacing:.7,color:col,
              padding:"3px 5px",borderRadius:4,background:`rgba(${look.rgb},.12)`}}>{look.mark}</span>
            <b style={{fontSize:12,color:C.ink,fontWeight:600}}>{d.name}</b>
            <span style={{fontFamily:F.mono,fontSize:8.5,color:C.muted}}>
              {e.shots>900?"RACK":`${e.shots} SHOT${e.shots>1?"S":""}`}{e.hostile?" · HOSTILE":""}</span></span>);})}
      </div>);})()}

    <div style={{display:"flex",gap:12,alignItems:"flex-end",marginTop:12,flexWrap:"wrap"}}>
      <div style={{flex:"0 0 auto"}}>
        <div style={{...label,marginBottom:5,fontSize:9.5}}>Tip</div>
        <div ref={spinRef} onPointerDown={e=>onSpin("down",e)} onPointerMove={e=>onSpin("move",e)}
          onPointerUp={e=>onSpin("up",e)}
          style={{width:56,height:56,borderRadius:56,background:"#f4f2ec",position:"relative",
            border:`1px solid ${C.line}`,cursor:canShoot?"crosshair":"default",opacity:canShoot?1:.45,
            touchAction:"none",boxShadow:"inset -4px -5px 10px rgba(0,0,0,.28)"}}>
          <div style={{position:"absolute",left:"50%",top:"50%",width:"100%",height:1,
            background:"rgba(0,0,0,.12)",transform:"translate(-50%,-50%)"}}/>
          <div style={{position:"absolute",left:"50%",top:"50%",width:1,height:"100%",
            background:"rgba(0,0,0,.12)",transform:"translate(-50%,-50%)"}}/>
          <div style={{position:"absolute",left:"50%",top:"50%",width:`${K.maxTip*2*56}px`,
            height:`${K.maxTip*2*56}px`,borderRadius:"50%",border:"1px dashed rgba(0,0,0,.28)",
            transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
          <div style={{position:"absolute",width:12,height:12,borderRadius:12,background:"#3f6d8c",
            border:"2px solid #fff",boxShadow:"0 1px 3px rgba(0,0,0,.4)",
            left:`calc(50% + ${tip.a*56}px)`,top:`calc(50% - ${tip.b*56}px)`,
            transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
        </div>
        <div style={{fontFamily:F.mono,fontSize:8.5,color:C.muted,marginTop:4,textAlign:"center",width:56}}>
          {tip.b>0.14?"FOLLOW":tip.b<-0.14?"DRAW":"CENTRE"}{Math.abs(tip.a)>0.14?(tip.a>0?"·R":"·L"):""}</div>
      </div>

      <div style={{flex:"0 0 auto",width:86}}>
        <div style={{...label,marginBottom:5,fontSize:9.5}}>Elevation</div>
        <input type="range" min="0" max={Math.round(K.maxElev)} step="1" value={Math.round(elev*180/Math.PI)}
          disabled={!canShoot} onChange={e=>setElev(+e.target.value*Math.PI/180)}
          style={{width:86,accentColor:C.accent,opacity:canShoot?1:.45}}/>
        <div style={{fontFamily:F.mono,fontSize:8.5,color:elev>0.02?C.accent:C.muted,marginTop:4}}>
          {Math.round(elev*180/Math.PI)}°/{Math.round(K.maxElev)}°{elev>0.02&&Math.abs(tip.a)>0.12?" CURVE":""}</div>
      </div>

      <div style={{flex:"0 0 auto"}}>
        <div style={{...label,marginBottom:5,fontSize:9.5}}>Speed</div>
        <div ref={strokeRef} onPointerDown={e=>onStroke("down",e)} onPointerMove={e=>onStroke("move",e)}
          onPointerUp={e=>onStroke("up",e)}
          style={{width:38,height:56,borderRadius:9,border:`1px solid ${C.line}`,background:C.panel,
            position:"relative",overflow:"hidden",touchAction:"none",
            cursor:canShoot?"grab":"default",opacity:canShoot?1:.45}}>
          <div style={{position:"absolute",left:0,right:0,bottom:0,height:`${power*100}%`,
            background:`linear-gradient(180deg,${C.accent},${C.accentDim})`}}/>
          <div style={{position:"absolute",left:0,right:0,bottom:`calc(${power*100}% - 1px)`,height:2,
            background:"#fff",opacity:.5,pointerEvents:"none"}}/>
        </div>
        <div style={{fontFamily:F.mono,fontSize:8.5,color:C.muted,marginTop:4,textAlign:"center",width:38}}>UP</div>
      </div>

      {mv.kind==="active"&&<button onClick={()=>setArmed(a=>!a)} disabled={!canArm}
        style={{...btn,padding:"11px 13px",borderColor:armed?me.color:C.line,
          background:armed?me.color:C.panel2,color:armed?"#12140f":C.ink,
          opacity:canArm||armed?1:.35,cursor:canArm?"pointer":"default",textAlign:"left"}}>
        <span style={{display:"block",fontSize:12.5,fontWeight:600}}>{mv.name}</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:8.5,
          color:armed?"#12140f":C.muted}}>{me.name.toUpperCase()} · {armed?"ARMED":`${left} LEFT`}</span></button>}

      {opts.bar&&<button onClick={()=>setBarOpen(true)}
        style={{...btn,padding:"11px 13px",textAlign:"left",
          borderColor:(fx[turn]||[]).length?C.accent:C.line}}>
        <span style={{display:"block",fontSize:12.5,fontWeight:600}}>The bar</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:8.5,color:C.muted}}>
          ${money(turn)} · {Math.round(E.buzz)} BUZZ</span></button>}

      {inHand&&<button onClick={()=>{setInHand(false);redraw();}}
        style={{...btnPrimary,padding:"14px 18px",background:C.warn}}>Place ball</button>}

      <button onClick={()=>shoot(angle,MAXV*K.speedMul*power*power,tip,elev)} disabled={!canShoot}
        style={{...btnPrimary,padding:"11px 20px",opacity:canShoot?1:.35,
          cursor:canShoot?"pointer":"default",textAlign:"center"}}>
        <span style={{display:"block",fontSize:14}}>Shoot</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:9.5,opacity:.75}}>
          {(MAXV*K.speedMul*power*power/17.6).toFixed(1)} MPH</span></button>

      <div style={{display:"flex",gap:5}}>
        <button onClick={()=>setAngle(a=>a-0.0025)} disabled={!canShoot}
          style={{...btnGhost,padding:"11px 11px",opacity:canShoot?1:.4}}>‹</button>
        <button onClick={()=>setAngle(a=>a+0.0025)} disabled={!canShoot}
          style={{...btnGhost,padding:"11px 11px",opacity:canShoot?1:.4}}>›</button>
      </div>

      <div style={{flex:"1 1 200px",minWidth:170,fontSize:12,color:C.ink2,lineHeight:1.45}}>
        {over!=null ? <b style={{color:C.good,fontSize:14}}>
            {mode==="eight"&&count>2?`Side ${sideOf(over)+1} takes it.`:`${charOf(seats[over].char).name} takes the rack.`}
            {msg?<span style={{display:"block",color:C.ink2,fontWeight:400,fontSize:12}}>{msg}</span>:null}</b>
        : needCall ? <b style={{color:C.warn}}>You're on the eight — tap a pocket to call it.</b>
        : inHand ? <b style={{color:C.warn}}>Ball in hand — drag it anywhere, then Place ball.</b>
        : moving ? <span style={{color:C.muted}}>Balls rolling…</span>
        : <><b style={{color:C.ink}}>{me.name}</b> to shoot. {msg}</>}
        {canShoot&&<div style={{fontFamily:F.mono,fontSize:9,color:C.muted,marginTop:5,lineHeight:1.5}}>
          DRAG THE CLOTH TO AIM · ← → FINE-TUNE · ENTER TO SHOOT</div>}
      </div>
      {over!=null&&(campaign?<span style={{fontFamily:F.mono,fontSize:10,color:C.muted}}>Settling the rack…</span>:<button onClick={restart} style={btnPrimary}>Rerack</button>)}
      {called!=null&&over==null&&!moving&&<button onClick={()=>setCalled(null)} style={btnGhost}>Recall pocket</button>}

    {inHand&&human&&over==null&&<div style={{...panel,padding:"10px 14px",marginTop:10,
      borderColor:C.warn,background:"rgba(201,138,75,.12)",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{width:9,height:9,borderRadius:9,background:C.warn,flexShrink:0}}/>
      <b style={{fontSize:13,color:C.warn}}>Ball in hand</b>
      <span style={{fontSize:12.5,color:C.ink2}}>{msg||"A foul was called."} Drag the cue ball anywhere you like,
        move it as often as you want, then press Place ball.</span></div>}

    {opts.bar&&barOpen&&human&&over==null&&!moving&&(()=>{
      const preBreak=shotNo===0, band=E.band;
      const bandCol=band==="Over"||band==="Cut off"?C.warn:band==="Sober"?C.muted:C.good;
      // One card shape for everything on sale, so the four shelves read as one
      // menu instead of four different widgets.
      const Card=({id,d,spike})=>{
        const on=!spike&&(fx[turn]||[]).some(e=>e.key===id);
        const afford=money(turn)>=d.cost&&!spentThisTurn&&!on&&!preBreak;
        const loud=d.fx===d.fx.toUpperCase();
        const look=fxLook(id);
        return(<button key={id} disabled={!afford}
          onClick={()=>{if(spike){setSending(id);}else{buy(id);}setBarOpen(false);}}
          style={{display:"flex",flexDirection:"column",gap:5,padding:"10px 11px",borderRadius:11,
            textAlign:"left",cursor:afford?"pointer":"default",
            border:`1px solid ${on?C.good:sending===id?C.warn:look?`rgba(${look.rgb},.28)`:C.line}`,
            borderTop:look?`2px solid rgba(${look.rgb},.72)`:undefined,
            background:on?"rgba(106,168,138,.10)":C.panel2,
            opacity:afford||on?1:.4}}>
          <span style={{display:"flex",alignItems:"baseline",gap:8}}>
            <b style={{fontSize:13,fontWeight:600,color:C.ink,flex:1}}>{d.name}</b>
            {look&&<span style={{fontFamily:F.mono,fontSize:7.5,letterSpacing:.65,color:look.ink,
              padding:"2px 4px",borderRadius:4,background:`rgba(${look.rgb},.10)`}}>{look.mark}</span>}
            <span style={{fontFamily:F.mono,fontSize:11,color:afford?C.good:C.muted}}>${d.cost}</span></span>
          <span style={{fontFamily:F.mono,fontSize:8.5,letterSpacing:.5,
            color:look?look.ink:loud?(spike?C.warn:C.accent):C.muted}}>{d.fx.toUpperCase()}</span>
          <span style={{fontSize:10.5,lineHeight:1.4,color:C.muted,display:"-webkit-box",
            WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{d.note}</span>
          <span style={{display:"flex",gap:8,marginTop:"auto",paddingTop:3,
            fontFamily:F.mono,fontSize:8.5,color:C.muted}}>
            {d.buzz!==0&&<span style={{color:d.buzz>0?C.warn:C.good}}>
              {d.buzz>0?"+":""}{d.buzz} BUZZ</span>}
            <span>{d.rack?"ALL RACK":`${d.shots} SHOT${d.shots>1?"S":""}`}</span>
            {on&&<span style={{color:C.good,marginLeft:"auto"}}>ACTIVE</span>}</span>
        </button>);};
      const Shelf=({title,sub,ids,spike})=>(<div style={{marginTop:16}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:8}}>
          <span style={{fontFamily:F.display,fontSize:13,fontWeight:600,letterSpacing:.3,color:C.ink}}>{title}</span>
          <span style={{fontSize:11,color:C.muted}}>{sub}</span></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(184px,1fr))",gap:9}}>
          {ids.map(id=><Card key={id} id={id} d={spike?SPIKES[id]:DRINKS[id]} spike={spike}/>)}</div></div>);
      return(<div onClick={()=>setBarOpen(false)}
        style={{position:"fixed",inset:0,zIndex:90,background:"rgba(4,5,7,.80)",
          display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div onClick={e=>e.stopPropagation()} className="thin"
          style={{...panel,padding:0,width:"min(860px,100%)",maxHeight:"88vh",overflowY:"auto",
            boxShadow:"0 30px 90px rgba(0,0,0,.75)"}}>

          <div style={{position:"sticky",top:0,zIndex:2,background:C.panel,
            borderBottom:`1px solid ${C.line}`,padding:"14px 18px",
            display:"flex",alignItems:"center",gap:18,flexWrap:"wrap"}}>
            <div>
              <div style={{fontFamily:F.display,fontSize:19,fontWeight:600,letterSpacing:-.2}}>The bar</div>
              <div style={{fontSize:11,color:preBreak?C.warn:C.muted,marginTop:2}}>
                {preBreak?"Closed until the break is over":
                 spentThisTurn?"You have already bought this turn":"One purchase a turn"}</div></div>

            <div style={{marginLeft:"auto",display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}}>
              <div>
                <div style={{...label,fontSize:9}}>Tab</div>
                <div style={{fontFamily:F.mono,fontSize:20,color:C.good,lineHeight:1.1}}>${money(turn)}</div></div>
              <div style={{minWidth:150}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{...label,fontSize:9}}>{me.name} · tol {me.tol}</span>
                  <span style={{fontFamily:F.mono,fontSize:9.5,color:bandCol}}>
                    {band.toUpperCase()} {Math.round(E.buzz)}</span></div>
                <div style={{height:6,borderRadius:4,background:C.line,marginTop:5,position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",inset:0,width:`${Math.min(100,E.buzz/1.2)}%`,
                    background:`linear-gradient(90deg,${C.good},${bandCol})`}}/>
                  {[20,45,75,95].map(t=><div key={t} style={{position:"absolute",top:0,bottom:0,
                    left:`${t/1.2}%`,width:1,background:"rgba(255,255,255,.22)"}}/>)}</div></div>
              <button onClick={()=>setBarOpen(false)} style={{...btnGhost,padding:"9px 13px"}}>Close</button>
            </div>
          </div>

          <div style={{padding:"4px 18px 18px"}}>
            <Shelf title="Boost" sub="pure stat trades — no surprises" ids={byRole("boost")}/>
            <Shelf title="Back off" sub="lower buzz and shorten every effect currently on you" ids={byRole("back")}/>
            <Shelf title="Effects" sub="these change a rule, not a number" ids={byRole("effect")}/>
            <Shelf title="On them" sub="bought for somebody else — pick the player after" ids={SPIKE_IDS} spike/>
            {sending&&<div style={{marginTop:14,padding:"11px 13px",borderRadius:10,
              border:`1px solid ${C.warn}`,background:"rgba(201,138,75,.10)",fontSize:12,color:C.ink2,lineHeight:1.5}}>
              <b style={{color:C.warn}}>{SPIKES[sending].name}</b> is on your tab. Close this and press
              <b> On me</b> on whoever is getting it.
              <button onClick={()=>setSending(false)} style={{...btnGhost,padding:"4px 10px",fontSize:11,marginLeft:10}}>cancel</button></div>}
          </div>
        </div></div>);})()}


    </div>
  </Shell>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
