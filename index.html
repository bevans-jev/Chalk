<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect,useMemo,useCallback}=React;

/* ============================================================================
   CHALK — pool, with a roster, a physics engine, and a bar.

   ONE FILE, NO BUILD STEP. React + Babel from a CDN, everything else is here.

   HOW THE PIECES FIT
     A character has six stats (0-100) plus Tolerance. Drinks and the buzz band
     rewrite those stats into EFFECTIVE stats. kit() turns effective stats into
     the numbers the engine runs on — cue speed, aim scatter, tip ceiling, cue
     elevation, how far ahead you can see. Anything that changes a RULE rather
     than a number sets a flag in RULE, which both the shot loop and the aim
     preview read, so what you are shown is always what you get.

   MAINTENANCE MAP
     Content constants describe the game; they do not mutate during a rack.
     App owns navigation and pre-match choices. Game owns the live rack.
     ballsRef is the authoritative mutable ball array; React state redraws the
     interface around it. RULE is rebuilt for the active shooter before a shot.
     TableArt and the physics engine both consume TABLES geometry. A visible
     rail or pocket must therefore come from the same geometry used to collide.
     The preview calls the real fixed-step simulator on a cloned rack, so avoid
     adding preview-only physics or the aim line will disagree with the shot.

   SECTIONS
     1   CONTENT ....... roster, stats, specials, tables, game types, bots
     1b  THE BAR ....... buzz bands, drinks you buy yourself, spikes you buy
                         for somebody else, tolerance maths
     2   CLOTHS ........ table skins, flat colour only
     3   TOKENS ........ one palette, one type scale, shared style objects
     4   TABLE ART ..... cushion geometry, jaws, pockets, balls, cue stick
     5   PHYSICS ....... sliding/rolling, spin, cushions, throw, prediction
     6   RULES ......... racking, cutthroat ownership, spotting
     7   AI ............ ghost-ball shot picker, pocket calling
     8   SCREENS ....... shared UI, Effect Lab, King campaign, navigation
     9   GAME .......... the match itself: turns, fouls, the bar, the controls

   UNITS
     Table space is inches. A regulation playfield is 100 x 50 and a ball is
     2.25 across, so every constant in here is a real measurement you can check
     against a real table. Speeds are inches/second; 440 is a 25 mph break.
   ========================================================================== */

// ===== 1. CONTENT ============================================================
// Six stats, and each one gates a DIFFERENT capability, so a high number in one
// can never paper over a low number in another. Power gets you there, Stroke
// hits the line, Touch delivers the speed you asked for, English caps how far
// off centre you may strike, Curve caps how high you may raise the butt, and Eye
// decides how much of the shot you get shown before you play it.
//   POWER   top cue speed
//   STROKE  how much of the spin you dialled in actually reaches the ball
//   TOUCH   how closely the speed matches the speed you set
//   ENGLISH how far off centre the tip may go before it miscues
//   CURVE   how far the cue may be raised — this is the masse stat
//   EYE     cushions previewed, and whether you see the object and cue-out lines
// Nobody is good at everything. Fargo is the strongest overall and still can't
// bend a ball, which is why the custom bank geometry matters.
// Stats are 0-100 now. Ten buckets was too coarse once drinks started shoving
// numbers around; a drink worth 18 points has to land somewhere real. Effective
// stats can also run past 100 or below 0 — a whiskey-fed Backwood at 118 power is a
// legitimate state, and anything under about 20 is where the game starts
// refusing to do things for you.
// TOLERANCE is resistance to CHANGE, in both directions. High tolerance climbs
// slowly and sobers up slowly: stable, committed, hard to sabotage. Low
// tolerance spikes off one drink and a single cigarette drags it most of the way
// back: volatile, tunable shot to shot, and very easy for a rival to ruin.
//
// THE SPECIALS GOT TEETH. Every one of these used to be a single small nudge —
// one shot with no stroke error, one dead rail — which is a fine idea and a
// boring button. Each one now stacks two or three effects so that using it
// actually changes what is possible on the table, not just how likely you are
// to make the ball you were already going to make.
const CHARS={
  fargo:{name:"Fargo",from:"The house legend",color:"#c9a227",
    pow:70,stroke:94,touch:86,english:78,curve:78,eye:86,tol:68,
    move:{name:"House Money",kind:"passive",uses:0,tag:"builds all rack",

  mordecai:{name:"Mordecai",from:"The dirtbag",color:"#6f8fbf",

  backwood:{name:"Backwood",from:"Rolls her own",color:"#d07b43",

  pearl:{name:"Pearl",from:"Cuts the inlays",color:"#4ca7b8",

  daphne:{name:"Daphne",from:"Nobody caught the name",color:"#c87898",

      text:"She has been watching the table all night and she does not miss. She calls it, and the first ball she touches IS GUIDED HOME — it steers itself into the nearest pocket it is facing, bending across the cloth to get there. It is not a shot, it is an announcement. Three a rack."}},

const CHAR_IDS=Object.keys(CHARS);
const charOf=id=>CHARS[id]||CHARS[CHAR_IDS[0]];   // never blow up on a stale id
const STATS=[["pow","POWER"],["stroke","STROKE"],["touch","TOUCH"],
             ["english","ENGLISH"],["curve","CURVE"],["eye","EYE"],["tol","TOLERANCE"]];
const STAT_KEYS=["pow","stroke","touch","english","curve","eye"];
// Every stat turned into the number the engine actually uses.
// A character's PASSIVE is keyed off their move name. This lives apart from
// kit() because kit works on effective stats (which drinks and buzz rewrite)
// while a passive belongs to the person and never changes.
// Always-on traits are keyed off WHO SOMEBODY IS, not off whether their move
// happens to be an active button. That is what lets Pearl carry her cue's
// no-deflection shaft around while still having a special to press.
function passiveOf(ch){
  const m=ch.move.name;
  const k=ch.kingAbility||{};
  return{
    perfectStraight: m==="La Recta"||k.perfectStraight,
    freeBreak:       m==="Backdraft"||k.freeBreak,
    heavyCue:        m==="Backdraft"||k.heavyCue,
    noSquirt:        m==="Claim"||k.noSquirt,
    tipBonus:        (m==="Claim"?1.35:1)*(k.tipBonus||1),
    spinHold:        m==="Boomerang"||k.spinHold,
    cushBite:        m==="Boomerang"||k.cushBite,
    masseBoost:      (m==="Boomerang"?2.6:1)*(k.masseBoost||1),
    elevFree:        m==="Boomerang"||k.elevFree,
    cueSafe:         !!k.cueSafe,
    deadRail:        !!k.deadRail,
    // Fargo: per-ball stat growth, applied in effOf() from his potted count
    // HOUSE MONEY RAMPS. A flat two a ball made the first pot as valuable as the
    // seventh, which is the opposite of warming up. The first two balls are
    // worth half a point each, the next three a full point each, and the last
    // two are worth two apiece — so the run is worth eight in total and almost
    // all of it is at the sharp end.
    momentum:        m==="House Money"?{steps:[0.5,0.5,1,1,1,2,2],cap:8}:null,
  };
}

// Effective stats -> the numbers the engine actually runs on.
//
// THE AIM RULE, AND WHY IT CHANGED.
// Stroke used to buy you random aim scatter: every character sprayed the ball
// off the line by a random amount forever, which meant a low-Stroke character
// was not a different style of player, just a worse one, and no amount of
// skill on your part could fix it. That is miserable to play.
//
// A SOBER CHARACTER NOW AIMS PERFECTLY. Every one of them. Aim error is
// generated ONLY by the deficit between your printed sheet and your current
// effective sheet — that is, only by what the bar has done to you. Get drunk,
// get spiked, get pushed over the line and the ball starts wandering; stay
// sober and it goes exactly where the white line says it goes, whoever you are.
//
// Stroke still matters, and it now matters DETERMINISTICALLY: it is SPIN
// TRANSFER. A high-Stroke player delivers the draw, follow and side you dialled
// in; a low-Stroke player delivers a fraction of it. Cricket's tip offset lands
// at 76% and Fargo's at 105%, so they play genuinely different pool — and
// neither of them randomly misses a ball they lined up correctly.
function kit(st,flags,base){
  const f=flags||{};
  const cl=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
  const eng=cl(st.english,0,130)*(f.miscue?0.6:1);
  // how far the bar has dragged you below your own printed sheet
  const drop=base?Math.max(0,base.stroke-st.stroke):0;
  const pace=base?Math.max(0,base.touch-st.touch):0;
  // Two stats are read off the PRINTED sheet rather than the effective one,
  // because they are identity rather than condition: a drink should not turn a
  // feel player into a sighted one, or take a puncher's punch away.
  const bCurve=base?base.curve:st.curve, bEye=base?base.eye:st.eye;
  return{
    // POWER, plus the puncher's bonus: a player who never raises the butt keeps
    // the cue dead level and gets more of their arm into the ball.
    speedMul: cl((0.50+0.0062*st.pow)*(bCurve<45?1.08:1),0.40,1.45),
    // sober: exactly zero. every point of this is something you drank.
    aimErr:   (0.00024*drop)*(f.strokeWreck?2.4:1)+(f.shaky?0.0016:0),
    // Sober input is exact. Touch still governs delicate speed through
    // minPower; pace variation now appears only when an effect lowers Touch.
    speedErr: 0.00075*pace,
    spinMul:  cl(0.30+0.0080*st.stroke,0.22,1.25),   // STROKE = spin transfer
    maxTip:   cl(0.10+0.0040*eng,0.08,0.52),
    // CURVE is not a number on a sheet any more. This is how hard the ball
    // ACTUALLY bends when you raise the butt and strike off centre — the gap
    // between Oscar (0.57, he may as well not bother) and Cricket (1.89, and
    // his Boomerang multiplies it again on top).
    masseMul: cl(0.35+0.016*st.curve,0.30,2.0),
    // CURVE floor is a choice now, not a locked door — everybody can bend the
    // ball a little; the high end decides whether you can bend it around a post.
    maxElev:  cl(14+0.46*st.curve,12,60),
    // EYE: nobody is blindfolded any more. Two cushions and the object line are
    // the floor for everyone, and the stat buys depth on top of that.
    // Thresholds sit just above the printed sheets of the feel players, so an
    // Eye drink (Red Bull, Espresso, Acid) genuinely buys them a cushion of
    // depth and the cue-ball finish line. Without that, those drinks did
    // nothing for the three characters who most wanted them.
    rails:    st.eye>=80?4:st.eye>=52?3:2,
    // HOW FAR DOWN THE LINE YOU CAN ACTUALLY SEE, in inches of ball travel.
    // This is the real EYE stat now. A feel player gets a stub of a line and
    // has to know the rest; a sighted player gets a genuinely useful stretch of
    // it — and even at a hundred it is a fraction of what the preview used to
    // hand out, because being shown the whole route is the same as not having
    // to plan one. Acid, Espresso and Red Bull buy real inches here.
    // The blue object-ball line is deliberately shorter than it used to be.
    // Eye still buys meaningful distance, but even a perfect Eye no longer
    // previews most of a regulation table on a firm shot.
    seeObj:   cl(8+0.23*st.eye,7,32),
    seeCue:   cl(5+0.19*st.eye,4,26),
    objLine:  true, cueLine: st.eye>=52, stopMark: st.eye>=40,
    // ...and the flip side. A player who never had the full picture never
    // learned to lean on it, so killing the lights or lying to their aim line
    // barely touches them. Low Eye is now a way of playing, not a punishment.
    blindProof: bEye<55,
    // TOUCH is also the softest shot you can control. Cricket can roll it an
    // inch; Backwood physically cannot play a delicate safety.
    minPower: cl(0.22-0.0020*st.touch,0.02,0.22),
  };
}

// FOUR SETS, TWELVE POWERS, NO OVERLAP.

// "this ball is heavy but orange", which is why they all felt the same. Each

// happen on the cloth, not a modifier you have to be told about.
const BALLS={

  bomb:{name:"Bomb",color:"#ff7a45",sigil:"✹",cadence:"ON POT",when:"when pocketed",short:"scatters the pocket",

const BALL_IDS=Object.keys(BALLS);
const POWER_SETS={
  haunted:{name:"Haunted Rack",tag:"nothing stays put",color:"#a991e8",
    blurb:"A table that will not hold still. The Ghost phases through first contact every shot, the Revenant climbs back out of the pocket the first time you sink it, the Poltergeist throws every other ball across the cloth when it drops, and the Steal changes sides on whoever pots it. Three dry turns in a row and the cue ball itself starts phasing.",

    blurb:"Three ways for something to go off, and one thing that will not move. The Bomb clears the pocket when it drops, the Nitro detonates MID-SHOT the moment you drive it into a rail hard, and the Fuse lights when you touch it and blows at the END of the shot wherever it stopped. The Keystone just shuts a pocket and dares you. Every fifth turn overcharges the lot.",

    blurb:"The table stops being flat. The Void drags every ball that rolls near it off its line, the Repulsor shoves them away and guards a lane, the Comet never slows down once it is rolling, and the Magnet swallows near misses. Pot two together and every Magnet widens for a turn.",
    trigger:"2+ balls down → next-turn surge",clock:"MULTI",map:{2:"magnet",5:"void",11:"repulsor",13:"comet"}},

    blurb:"The one set that borrows from the other three. Its two printed balls always count for whoever pots them, and every fourth turn every marked ball still on the table is dealt a brand new power out of the whole deck. Pot the Joker and the redeal happens on the spot.",

};
const POWER_SET_IDS=Object.keys(POWER_SETS);

// --- Tables -----------------------------------------------------------------
// w/h are playable inches measured between cushion noses. A custom table adds
// one clockwise boundary polygon. Pocket x/y coordinates sit on that boundary;
// cx/cy place the visible throat just outside it. Do not create a second visual
// outline: TableArt and tableSegs() must continue sharing this source geometry.
const CORNERS=(w,h)=>[{x:0,y:0},{x:w,y:0},{x:0,y:h},{x:w,y:h}];
const SIXP=(w,h)=>[...CORNERS(w,h),{x:w/2,y:0},{x:w/2,y:h}];

// Turn selected polygon vertices into outside-facing corner pockets. The
// centroid provides a stable outward direction for these deliberate layouts.
function pocketsAtBoundaryVertices(boundary,indices){
  let centerX=0,centerY=0;
  for(const [x,y] of boundary){centerX+=x;centerY+=y;}
  centerX/=boundary.length; centerY/=boundary.length;
  return indices.map(index=>{
    const [x,y]=boundary[index],dx=x-centerX,dy=y-centerY;
    const distance=Math.hypot(dx,dy)||1;
    return{x,y,cx:x+dx/distance*0.85,cy:y+dy/distance*0.85,r:2.9,capt:2.9*1.12};
  });
}

const SWISS_BOUNDARY=[[37,0],[79,0],[79,20],[116,20],[116,62],[79,62],[79,82],[37,82],[37,62],[0,62],[0,20],[37,20]];
// The rails run dead straight into all four pockets and pinch twice in
// between, mirrored top to bottom. Damping the curve to zero at x=0 and x=W is
// what lets the corner cushions meet their pockets square, the way they do on
// the straight tables — the old version arrived at the corner mid-wobble.
const WAVE_STEPS=36, WAVE_W=120, WAVE_H=58, WAVE_AMP=5.2, WAVE_RAIL=4;
function makeWaveBoundary(){
  const top=[],bottom=[];
  const off=x=>WAVE_AMP*(1-Math.cos(4*Math.PI*x/WAVE_W))/2;
  for(let i=0;i<=WAVE_STEPS;i++){
    const x=WAVE_W*i/WAVE_STEPS, y=WAVE_RAIL+off(x);
    top.push([x,y]);
    bottom.unshift([x,WAVE_H-y]);
  }
  return[...top,...bottom];
}
const WAVE_BOUNDARY=makeWaveBoundary();
const WAVE_PK=[0,WAVE_STEPS,WAVE_STEPS+1,WAVE_STEPS*2+1];

const TABLES={
  regulation:{name:"Regulation",tag:"9 ft · 100 × 50",blurb:"The standard nine-footer. Six pockets, clean cloth, nothing in your way.",

// ===== 4. TABLE ART ==========================================================
// Real table geometry, drawn flat.
//   RW  rail width from cushion nose to the outside edge of the frame
//   CD  cushion depth — how far the rubber stands proud of the rail
//   M_C / M_S  how far back a cushion is cut from a corner / side pocket
//   JAW how much wider the throat gets between the nose and the back
// Cushions are separate segments per rail. Each end that meets a pocket is
// mitred outward into the throat; each end that meets another cushion (a sealed
// corner) is mitred at 45° so the two meet flush.
const RW=6.6, CD=2.2, M_C=2.24, M_S=2.5, JAW=1.5, BR=1.125;
const FRAME="#1b1e22", FRAME_EDGE="#000000";

function makePockets(g){
  // Regulation pockets provide only a point; custom tables may provide an
  // explicit throat center. Normalize both forms for rendering and capture.
  const on=(v,e)=>Math.abs(v-e)<1e-6;
  return g.pockets.map(p=>{
    if(p.cx!=null)return{...p,corner:true,r:p.r||2.85,capt:p.capt||(p.r||2.85)*1.1};
    const ax=on(p.x,0)||on(p.x,g.w), ay=on(p.y,0)||on(p.y,g.h), corner=ax&&ay;
    let nx=0,ny=0;
    if(corner){nx=(p.x<g.w/2?-1:1)*0.7071; ny=(p.y<g.h/2?-1:1)*0.7071;}
    else if(ay) ny=p.y<g.h/2?-1:1; else nx=p.x<g.w/2?-1:1;
    const off=corner?0.85:0.7, r=corner?2.9:2.6;
    return{x:p.x,y:p.y,corner,cx:p.x+nx*off,cy:p.y+ny*off,r,capt:r*(corner?1.12:1.06)};});
}

// One polygon per cushion segment, in table coordinates.
function cushions(g){
  if(g.boundary)return bedCushions(g).polys;
  const near=(a,b)=>Math.abs(a-b)<1e-6;
  const rails=[
    {L:g.w,on:p=>near(p.y,0),   at:p=>p.x, map:(t,d)=>[t,-d]},
    {L:g.w,on:p=>near(p.y,g.h), at:p=>p.x, map:(t,d)=>[t,g.h+d]},
    {L:g.h,on:p=>near(p.x,0),   at:p=>p.y, map:(t,d)=>[-d,t]},
    {L:g.h,on:p=>near(p.x,g.w), at:p=>p.y, map:(t,d)=>[g.w+d,t]},
  ];
  const out=[];
  for(const r of rails){
    const ts=g.pockets.filter(r.on).map(r.at).sort((a,b)=>a-b);
    const head=ts.some(t=>near(t,0)), tail=ts.some(t=>near(t,r.L));
    const mid=ts.filter(t=>!near(t,0)&&!near(t,r.L));
    const segs=[]; let cur=head?M_C:0, ja=head;
    for(const t of mid){segs.push({a:cur,b:t-M_S,ja,jb:true}); cur=t+M_S; ja=true;}
    segs.push({a:cur,b:tail?r.L-M_C:r.L,ja,jb:tail});
    for(const s of segs){
      if(s.b-s.a<0.4)continue;
      const ab=s.ja?s.a-JAW:s.a-CD, bb=s.jb?s.b+JAW:s.b+CD;
      out.push([r.map(s.a,0),r.map(s.b,0),r.map(bb,CD),r.map(ab,CD)]);}
  }
  return out;
}

const ballInfo=n=>{const num=((n-1)%15)+1;

// Real tournament cloth colours, plus lightweight printed skins and Thermal.
//
// THESE ARE FLAT ON PURPOSE. There used to be a fine worsted weave pattern laid
// over every cloth at low contrast. It looked nice standing still and it was,
// measurably, the single most expensive thing in the game: a 1.1-inch tile over
// a 100x50 bed is about four thousand tiles of three strokes each, and the
// browser re-rasterised the lot every time a ball moved across it. Deleting it
// took a break from 46fps to 59, and took the worst frame from 141ms to 54.
// Cumulative gain from a run of n balls under a stepped momentum passive.
function momentumGain(mo,n){
  if(!mo)return 0;
  if(mo.steps){let g=0;for(let i=0;i<Math.min(n,mo.steps.length);i++)g+=mo.steps[i];
    return Math.min(mo.cap==null?g:mo.cap,g);}
  return Math.min(mo.cap,(mo.per||0)*n);
}

const CLOTH_IDS=Object.keys(CLOTHS);
// Table previews always use one readable cloth — you cannot pick a table you
// cannot see, and Onyx on a preview card is a black rectangle.
const PREVIEW_CLOTH="oxblood";

// ---- pattern builders -------------------------------------------------------
function ClothDefs({id,cl,g}){const c=CLOTHS[cl]||CLOTHS.onyx,photo=SKIN_IMAGES[c.kind];
  return(<>
    {photo&&<pattern id={"pat"+id} x="0" y="0" width={g.w} height={g.h} patternUnits="userSpaceOnUse">
      <rect width={g.w} height={g.h} fill={c.base}/>
      <image href={photo} x="0" y="0" width={g.w} height={g.h}
        preserveAspectRatio="xMidYMid slice" opacity={c.kind==="zebra"?.94:.96}/>
      <rect width={g.w} height={g.h} fill={c.kind==="zebra"?"#d8d2c7":"#2a1208"}
        opacity={c.kind==="zebra"?.035:.055}/>
    </pattern>}
  </>);}

// A stable false-colour thermal field. It uses layered geometry only—no moving
// filter, trail history or second render loop—so nearby sources visibly pool
// without the flashing and frame spikes of the old implementation.
function HeatCloth({id,g,balls}){
  const live=(balls||[]).filter(b=>!b.in);
  const raw=live.length?live:[{n:"a",x:g.w*.28,y:g.h*.38,vx:0,vy:0},{n:"b",x:g.w*.50,y:g.h*.55,vx:0,vy:0},
    {n:"c",x:g.w*.57,y:g.h*.51,vx:0,vy:0},{n:"d",x:g.w*.75,y:g.h*.31,vx:0,vy:0}];
  const spots=raw.map(b=>{const speed=Math.hypot(b.vx||0,b.vy||0);
    const near=raw.reduce((n,q)=>q===b?n:n+Math.max(0,1-Math.hypot(q.x-b.x,q.y-b.y)/13),0);
    return{...b,speed,heat:Math.min(1,.34+Math.min(.34,speed/340)+Math.min(.32,near*.16))};});
  const links=[];
  for(let i=0;i<spots.length;i++)for(let j=i+1;j<spots.length;j++){
    const d=Math.hypot(spots[i].x-spots[j].x,spots[i].y-spots[j].y);
    if(d<15.5)links.push({a:spots[i],b:spots[j],d,heat:(spots[i].heat+spots[j].heat)/2});}
  return(<g clipPath={`url(#bed${id})`} pointerEvents="none" shapeRendering="geometricPrecision">
    {/* Wide cool-violet bodies touch first, creating one readable heat mass. */}
    {links.map((q,i)=><line key={"outer"+i} x1={q.a.x} y1={q.a.y} x2={q.b.x} y2={q.b.y}
      stroke="#542c8c" strokeWidth={Math.max(4.5,13-q.d*.42)} strokeLinecap="round"
      opacity={.22+q.heat*.18}/>)}
    {spots.map(b=>{const stretch=1+Math.min(.55,b.speed/310),ang=Math.atan2(b.vy||0,b.vx||0)*180/Math.PI;
      const r=7.2+b.heat*3.3;return <ellipse key={"cold"+b.n} cx={b.x} cy={b.y}
        rx={r*stretch} ry={r*.86} transform={`rotate(${ang} ${b.x} ${b.y})`}
        fill={`url(#heatCold${id})`} opacity={.58+b.heat*.16}/>;})}
    {/* Red-orange cores join only when sources are genuinely close; the pooled
        shape therefore grows naturally instead of being connected by strings. */}
    <g style={{mixBlendMode:"screen"}}>
      {links.map((q,i)=><line key={"body"+i} x1={q.a.x} y1={q.a.y} x2={q.b.x} y2={q.b.y}
        stroke="#c8324d" strokeWidth={Math.max(1.8,8.4-q.d*.36)} strokeLinecap="round"
        opacity={Math.max(.12,.42-q.d*.012)*q.heat}/>)}
      {spots.map(b=>{const stretch=1+Math.min(.38,b.speed/380),ang=Math.atan2(b.vy||0,b.vx||0)*180/Math.PI;
        const r=4.2+b.heat*2.9;return <ellipse key={"body"+b.n} cx={b.x} cy={b.y}
          rx={r*stretch} ry={r*.94} transform={`rotate(${ang} ${b.x} ${b.y})`}
          fill={`url(#heatSpot${id})`} opacity={.74+b.heat*.20}/>;})}
    </g>
    {/* White is reserved for the hottest compact core, as on a real thermal
        palette; motion and close packing raise it rather than spawning trails. */}
    {spots.map(b=><ellipse key={"hot"+b.n} cx={b.x} cy={b.y}
      rx={1.15+b.heat*1.05} ry={1.05+b.heat*.9} fill="#fff8cf"
      opacity={.16+b.heat*.62}/>)}
  </g>);}

function PowerSkin({type,r,id}){const d=BALLS[type]||BALLS.none,clip=`url(#bclip${id})`;
  return(<g clipPath={clip} pointerEvents="none">
    <title>{`${d.name} Power Ball · ${d.short}`}</title>
    {type==="ghost"&&<g>
      <circle r={r} fill="#dff7ff" opacity=".34"/>
      {[.22,.5,.78].map((x,i)=><path key={i} d={`M${-r} ${-r+x*r*2}Q0 ${-r+(x+.25)*r*2} ${r} ${-r+x*r*2}`}
        fill="none" stroke="#c9f2ff" strokeWidth=".12" strokeOpacity={.42+i*.12}/>) }
      <circle cx={-.34*r} cy={-.12*r} r={.13*r} fill="#fff" opacity=".85"/><circle cx={.34*r} cy={-.12*r} r={.13*r} fill="#fff" opacity=".85"/>
    </g>}
    {type==="bomb"&&<g>
      <circle r={r} fill="#301715" opacity=".76"/><circle r={r*.48} fill="#ff6b36" opacity=".38"/>
      {Array.from({length:8},(_,i)=>{const a=i*Math.PI/4,ri=r*.38,ro=r*.96;return <line key={i} x1={Math.cos(a)*ri} y1={Math.sin(a)*ri}
        x2={Math.cos(a)*ro} y2={Math.sin(a)*ro} stroke={i%2?"#ffba68":"#ff5638"} strokeWidth={i%2?.1:.16} strokeLinecap="round"/>;})}
      <path d={`M${r*.2} ${-r*.46}Q${r*.55} ${-r*.94} ${r*.82} ${-r*.72}`} fill="none" stroke="#f3d094" strokeWidth=".15" strokeLinecap="round"/>
      <circle cx={r*.83} cy={-r*.73} r={r*.13} fill="#fff2a6"/>
    </g>}
    {type==="anchor"&&<g>
      <circle r={r} fill="#26323d" opacity=".72"/>
      <path d={`M0 ${-r*.83}V${r*.48}M${-r*.42} ${-r*.45}H${r*.42}M${-r*.68} ${r*.18}Q${-r*.55} ${r*.77} 0 ${r*.66}Q${r*.55} ${r*.77} ${r*.68} ${r*.18}`}
        fill="none" stroke="#d7e1e9" strokeWidth=".2" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cy={-r*.71} r={r*.16} fill="none" stroke="#d7e1e9" strokeWidth=".13"/>
    </g>}
    {type==="magnet"&&<g>
      <circle r={r} fill="#211d2b" opacity=".68"/>
      <path d={`M${-r*.7} ${r*.54}V0A${r*.7} ${r*.7} 0 0 1 ${r*.7} 0V${r*.54}`} fill="none" stroke="#e7edf1" strokeWidth={r*.34}/>
      <path d={`M${-r*.7} ${r*.54}V${r*.13}`} stroke="#4a9fea" strokeWidth={r*.34}/><path d={`M${r*.7} ${r*.54}V${r*.13}`} stroke="#ef5e6c" strokeWidth={r*.34}/>

      {kind==="poltergeist"&&rays.map((a,i)=><rect key={i} className="ck-power-confetti"

function Ball({b,id,owner}){const {num,col,group}=ballInfo(b.n);
  const cue=b.n===0, r=BR;
  // The pole, projected. Its tilt decides where the numbered cap sits and how
  // wide the stripe reads — pole facing up gives you a white cap ringed with
  // colour, pole lying flat gives you the classic band across the middle.
  const px=b.px||0, py=b.py||0, pz=b.pz==null?1:b.pz;
  const pl=Math.hypot(px,py);
  const ang=Math.atan2(py,px)*180/Math.PI;
  const capOn=Math.abs(pz)>0.42;
  const capX=px*r*0.58, capY=py*r*0.58, capR=r*0.40;
  const numOn=Math.abs(pz)>0.62;
  const nAng=Math.atan2(b.qy||0,b.qx||1)*180/Math.PI;
  // A STRIPE MUST ALWAYS LOOK LIKE A STRIPE. The band used to widen without
  // limit as the pole turned toward you, and at pl≈0.3 it covered the whole
  // ball — a stripe that rolled to exactly the wrong angle became a solid, and
  // you could not tell whose it was. It is now capped so white always shows
  // above and below it, whatever the ball is doing.
  const band=Math.min(r*0.66,r*0.60/Math.max(0.30,pl));
  return(<g transform={`translate(${b.x} ${b.y})`}>
    <ellipse cx=".18" cy=".26" rx={r*.95} ry={r*.9} fill="#000" opacity=".3" filter={`url(#soft${id})`}/>
    <circle r={r} fill={cue||group==="stripe"?"#f4f2ec":col}/>
    {group==="stripe"&&!cue&&<rect x={-band} y={-r} width={band*2} height={r*2} fill={col}
      transform={`rotate(${ang})`} clipPath={`url(#bclip${id})`}/>}
    {capOn&&!cue&&<g transform={`rotate(${ang} ${capX} ${capY})`}>
      <ellipse cx={capX} cy={capY} rx={capR*Math.max(0.5,Math.abs(pz))} ry={capR} fill="#faf8f3"
        clipPath={`url(#bclip${id})`}/></g>}
    {capOn&&cue&&<ellipse cx={capX} cy={capY} rx={capR*0.34*Math.abs(pz)} ry={capR*0.34}
      fill="#c0402f" opacity=".8" transform={`rotate(${ang} ${capX} ${capY})`}/>}
    {numOn&&!cue&&<text x={capX} y={capY+r*.145} textAnchor="middle" fontFamily={F.body}
      fontWeight="700" fontSize={r*.5} fill="#17191c" opacity={Math.min(1,(Math.abs(pz)-0.62)*4)}
      transform={`rotate(${nAng} ${capX} ${capY})`}>{num}</text>}
    {/* THE NUMBER, ALWAYS. The rolled-on number only faces you part of the
        time, which makes cutthroat unplayable — you cannot tell whose ball is
        whose. When the real number has turned away, a small permanent badge
        takes over so every ball on the table is identifiable at a glance. */}
    {!cue&&!numOn&&!b.power&&<g pointerEvents="none">
      <circle cx={-r*.62} cy={r*.62} r=".40" fill="#f5f2e9" stroke="#15181b" strokeWidth=".11" opacity=".95"/>
      <text x={-r*.62} y={r*.62+.16} textAnchor="middle" fontFamily={F.mono} fontSize=".44"
        fontWeight="700" fill="#17191c">{num}</text></g>}
    {/* cutthroat: whose ball this is, in their colour, on the ball itself */}
    {owner&&!cue&&<circle r={r*0.94} fill="none" stroke={owner} strokeWidth=".28" opacity=".95"/>}
    {b.power&&<PowerSkin type={b.power} r={r} id={id}/>} 
    <circle r={r} fill={`url(#sph${id})`}/>
    <circle cx={-r*.33} cy={-r*.35} r={r*.2} fill="#fff" opacity=".42"/>
    {b.power&&<g pointerEvents="none">
      <circle cx={r*.7} cy={-r*.7} r=".43" fill="#0b0d10" stroke={BALLS[b.power].color} strokeWidth=".13"/>
      <text x={r*.7} y={-r*.7+.18} textAnchor="middle" fontFamily={F.body} fontSize=".45" fontWeight="700" fill={BALLS[b.power].color}>{BALLS[b.power].sigil}</text>
      <circle cx={-r*.68} cy={r*.68} r=".35" fill="#f5f2e9" stroke="#15181b" strokeWidth=".1"/>
      <text x={-r*.68} y={r*.68+.14} textAnchor="middle" fontFamily={F.mono} fontSize=".38" fontWeight="700" fill="#17191c">{num}</text>
    </g>}
  </g>);}

function GroupToken({group,color,size=22}){const stripe=group==="stripe";
  return <span title={stripe?"Stripes":"Solids"} style={{width:size,height:size,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",
    position:"relative",overflow:"hidden",flexShrink:0,background:stripe?"#f2f0e9":color,border:`2px solid ${color}`,boxShadow:"0 1px 4px rgba(0,0,0,.45)"}}>
    {stripe&&<span style={{position:"absolute",left:0,right:0,top:"34%",height:"32%",background:color}}/>}
    <span style={{position:"relative",width:size*.32,height:size*.32,borderRadius:"50%",background:"#f7f5ef",border:"1px solid rgba(0,0,0,.22)"}}/>
  </span>;}

// Butt cap, linen wrap, forearm, silver joint collar, maple shaft, ivory
// ferrule, blue tip — built as a chain of tapered quads down one axis.
function CueStick({x,y,angle,pull,id,tip,live,bounds}){
  const dx=Math.cos(angle),dy=Math.sin(angle),nx=-dy,ny=dx;
  // Cap only the DRAWN pullback and length at the SVG edge so a hard shot never
  // makes the entire cue disappear. Shot power still uses the full pull.
  const wantBack=BR+1.4+pull*26, wantL=58;
  let room=wantBack+wantL;
  if(bounds){const [xmin,ymin,xmax,ymax]=bounds;
    const tx=dx>1e-6?(x-xmin)/dx:dx<-.000001?(xmax-x)/(-dx):1e6;
    const ty=dy>1e-6?(y-ymin)/dy:dy<-.000001?(ymax-y)/(-dy):1e6;
    room=Math.max(4.8,Math.min(tx,ty)-.65);}
  const back=Math.min(wantBack,Math.max(BR+1.0,room-3.2));
  const L=Math.max(2.8,Math.min(wantL,room-back));
  const cropped=back<wantBack-.1||L<wantL-.1;
  const off=(tip?tip.a:0)*BR*0.62;
  const px=x-dx*back+nx*off, py=y-dy*back+ny*off;
  const pt=(d,o)=>[px-dx*d+nx*o,py-dy*d+ny*o];
  // half-width grows from the tip back to the butt
  const hw=d=>0.30+0.26*(d/L);
  const quad=(d0,d1)=>[pt(d0,hw(d0)),pt(d1,hw(d1)),pt(d1,-hw(d1)),pt(d0,-hw(d0))]
    .map(q=>q.join(",")).join(" ");
  const part=(d0,d1,fill,extra)=>d0>=L?null:<polygon points={quad(d0,Math.min(d1,L))} fill={fill} {...(extra||{})}/>;
  return(<g opacity={live?1:.94}>
    {live&&<polygon points={quad(-1.2,L)} fill={C.accent} opacity=".14"
      transform={`translate(${nx*0} ${ny*0})`}/>}
    {part(0,0.9,"#4f86a8")}          {/* tip */}
    {part(0.9,2.4,"#efe9dc")}        {/* ferrule */}
    {part(2.4,24,`url(#shaft${id})`)}{/* maple shaft */}
    {part(24,25.4,"#cfd3d8")}        {/* joint collar */}
    {part(25.4,38,`url(#fore${id})`)}{/* forearm */}
    {part(38,50,"#15161a")}          {/* linen wrap */}
    {part(50,L,`url(#fore${id})`)}   {/* butt sleeve */}
    {part(L-1.1,L,"#cfd3d8")}        {/* butt cap */}
    <polygon points={[pt(2.4,hw(2.4)*0.55),pt(L,hw(L)*0.55),pt(L,hw(L)*0.05),pt(2.4,hw(2.4)*0.05)]
      .map(q=>q.join(",")).join(" ")} fill="#fff" opacity=".16"/>
    <polygon points={[pt(2.4,-hw(2.4)*0.35),pt(L,-hw(L)*0.35),pt(L,-hw(L)),pt(2.4,-hw(2.4))]
      .map(q=>q.join(",")).join(" ")} fill="#000" opacity=".26"/>
    {cropped&&<circle cx={pt(L,0)[0]} cy={pt(L,0)[1]} r=".95" fill={C.accent} opacity=".42"/>}
  </g>);}

let UID=0;
// One SVG renderer serves picker thumbnails, Effect Lab previews, and the live
// game. Optional props only add overlays or interaction; geometry stays shared.
function TableArt({tid,cloth,balls,aim,onPoint,calls,called,tfx,style,owners,fitParent=false}){
  const g=useMemo(()=>TABLES[tid].build(),[tid]);
  const id=useMemo(()=>++UID,[]);
  const cl=CLOTHS[cloth]||CLOTHS.onyx;
  const fill=cl.kind==="solid"?cl.base:cl.kind==="heat"?`url(#heatBase${id})`:`url(#pat${id})`;
  const pk=useMemo(()=>makePockets(g),[g]);
  const cush=useMemo(()=>cushions(g),[g]);
  const boundary=g.boundary&&g.boundary.map(q=>q.join(",")).join(" ");
  const vb=[-RW,-RW,g.w+RW*2,g.h+RW*2];
  const T=tfx||{};   // which rule-bending effects are live on this shot
  const live=cl.kind==="heat";
  const svgRef=useRef(null);
  const toTable=e=>{const s=svgRef.current;if(!s)return null;const r=s.getBoundingClientRect();
    const t=e.touches&&e.touches[0]?e.touches[0]:e;
    return{x:vb[0]+(t.clientX-r.left)/r.width*vb[2], y:vb[1]+(t.clientY-r.top)/r.height*vb[3]};};
  // Sight diamonds sit on the rail top, skipped wherever a pocket is close.
  const sights=[];
  const addS=(L,map)=>{for(let i=1;i<=7;i++){const t=L*i/8;
    if(g.pockets.some(p=>Math.abs((map===0||map===1?p.x:p.y)-t)<5&&
      (map===0?p.y===0:map===1?p.y===g.h:map===2?p.x===0:p.x===g.w)))continue;
    const q=map===0?[t,-(CD+RW)/2]:map===1?[t,g.h+(CD+RW)/2]:map===2?[-(CD+RW)/2,t]:[g.w+(CD+RW)/2,t];
    sights.push({x:q[0],y:q[1],a:45});}};
  if(!g.boundary){addS(g.w,0);addS(g.w,1);addS(g.h,2);addS(g.h,3);}
  else{
    // A diamond PER FACET put forty-eight of them around a curved rail in a
    // scattered dotted line. Space them by distance travelled along the rail
    // instead, so a curve gets the same even spacing a straight rail gets.
    const P=g.boundary, n=P.length;
    let area2=0; for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];area2+=a[0]*b[1]-b[0]*a[1];}
    const ccw=area2>0;
    const STEP=14; let acc=0, next=STEP;
    for(let i=0;i<n;i++){
      const a=P[i],b=P[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
      if(L<1e-6)continue;
      const ux=dx/L,uy=dy/L, nx=ccw?uy:-uy, ny=ccw?-ux:ux;
      while(next<acc+L){
        const d=next-acc, x=a[0]+ux*d, y=a[1]+uy*d;
        next+=STEP;
        if(g.pockets.some(p=>Math.hypot(p.x-x,p.y-y)<9))continue;
        sights.push({x:x+nx*(CD+RW)/2,y:y+ny*(CD+RW)/2,a:Math.atan2(dy,dx)*180/Math.PI+45});}
      acc+=L;}
  }

  // ---- THE PARTS OF THE TABLE THAT NEVER MOVE ------------------------------
  // A shot calls redraw() on every animation frame, and React was re-walking
  // the ENTIRE svg each time — every gradient, every filter, every cushion
  // polygon, every pocket, every sight diamond — to discover that none of them
  // had changed. Holding them in useMemo hands React the identical element
  // objects each frame, so it skips those subtrees outright and only
  // reconciles the handful of things that actually move.
  const defsEl=useMemo(()=>(
      <defs><ClothDefs id={id} cl={cloth} g={g}/>
        <radialGradient id={"sph"+id} cx="35%" cy="31%" r="76%">
          <stop offset="0%" stopColor="#fff" stopOpacity=".24"/><stop offset="52%" stopColor="#fff" stopOpacity="0"/>
          <stop offset="100%" stopColor="#000" stopOpacity=".34"/></radialGradient>
        <linearGradient id={"shaft"+id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#e3c491"/><stop offset="45%" stopColor="#c9a068"/><stop offset="100%" stopColor="#8e6a3c"/></linearGradient>
        <linearGradient id={"fore"+id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#7a3f2a"/><stop offset="45%" stopColor="#5a2b1c"/><stop offset="100%" stopColor="#2e150d"/></linearGradient>
        <filter id={"soft"+id} x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation=".5"/></filter>
        <clipPath id={"bclip"+id}><circle cx="0" cy="0" r={BR}/></clipPath>
        <linearGradient id={"rail"+id} x1="0" y1="0" x2="0.15" y2="1">
          <stop offset="0%" stopColor="#262b31"/><stop offset="42%" stopColor="#1b1f24"/>
          <stop offset="100%" stopColor="#111418"/></linearGradient>
        {/* A pocket is a hole with depth: black at the mouth, and a hint of the
            slate edge catching light on the far lip. */}
        <radialGradient id={"pkt"+id} cx="50%" cy="42%" r="62%">
          <stop offset="0%" stopColor="#000000"/><stop offset="58%" stopColor="#020304"/>
          <stop offset="88%" stopColor="#080b0f"/><stop offset="100%" stopColor="#12171d"/></radialGradient>
        <clipPath id={"bed"+id}>{boundary?<polygon points={boundary}/>:<rect x="0" y="0" width={g.w} height={g.h}/>}</clipPath>
        {/* The thermal palette. heatSpot is a ball: white core through yellow,
            orange and red into violet. heatCold is the cool wash around it, so
            empty cloth reads as cold rather than black. */}
        <radialGradient id={"heatSpot"+id} colorInterpolation="sRGB">
          <stop offset="0%"   stopColor="#ffffff" stopOpacity="1"/>
          <stop offset="10%"  stopColor="#fffbd6" stopOpacity=".98"/>
          <stop offset="22%"  stopColor="#ffe176" stopOpacity=".94"/>
          <stop offset="36%"  stopColor="#ffb52d" stopOpacity=".88"/>
          <stop offset="50%"  stopColor="#f77a24" stopOpacity=".79"/>
          <stop offset="64%"  stopColor="#e63d3d" stopOpacity=".67"/>
          <stop offset="77%"  stopColor="#b72e69" stopOpacity=".49"/>
          <stop offset="89%"  stopColor="#6f278a" stopOpacity=".25"/>
          <stop offset="100%" stopColor="#2a1f6b" stopOpacity="0"/>
        </radialGradient>
        <radialGradient id={"heatBase"+id}>
          <stop offset="0%" stopColor="#0d1330"/><stop offset="100%" stopColor="#070a20"/></radialGradient>
        <radialGradient id={"heatCold"+id}>
          <stop offset="0%"   stopColor="#3b3fa0" stopOpacity=".62"/>
          <stop offset="55%"  stopColor="#26307e" stopOpacity=".34"/>
          <stop offset="100%" stopColor="#111a52" stopOpacity="0"/>
        </radialGradient>
        <filter id={"melt"+id} x="-8%" y="-8%" width="116%" height="116%">
          {/* STATIC noise. An <animate> on baseFrequency makes the browser
              regenerate this whole texture every single frame — after the cloth
              weave it was the most expensive thing on the table. All the motion
              you actually see comes from the CSS-animated layers above it. */}
          <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.45" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id={"oil"+id} x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="11" result="t"/>
          <feColorMatrix in="t" type="matrix"
            values="1.9 -0.9 0.2 0 0   0.1 1.8 -0.9 0 0   -0.9 0.2 1.9 0 0   0 0 0 0 1"/>
          <feGaussianBlur stdDeviation="0.55"/>
        </filter>
        <filter id={"soften"+id} x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.1"/></filter>
        <filter id={"glow"+id} x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1.15"/></filter>
        <radialGradient id={"well"+id}>
          <stop offset="0%" stopColor="#8ff0c8" stopOpacity=".85"/>
          <stop offset="45%" stopColor="#6ad0b0" stopOpacity=".30"/>
          <stop offset="100%" stopColor="#6ad0b0" stopOpacity="0"/>
        </radialGradient>
        <linearGradient id={"ketFade"+id} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#66d9b7" stopOpacity="0"/>
          <stop offset="34%" stopColor="#8ee9c9" stopOpacity=".52"/>
          <stop offset="62%" stopColor="#d2fff0" stopOpacity=".82"/>
          <stop offset="100%" stopColor="#66d9b7" stopOpacity="0"/>
        </linearGradient>
        {/* VODKA — frozen cloth and a glide track that runs off the table */}
        <linearGradient id={"frostWash"+id} x1="0" y1="0" x2=".3" y2="1">
          <stop offset="0%" stopColor="#cdeeff" stopOpacity=".16"/>
          <stop offset="45%" stopColor="#8fd4f0" stopOpacity=".07"/>
          <stop offset="100%" stopColor="#e8fbff" stopOpacity=".14"/>
        </linearGradient>
        <linearGradient id={"glide"+id} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#eafaff" stopOpacity=".45"/>
          <stop offset="35%" stopColor="#9fd9f2" stopOpacity=".2"/>
          <stop offset="100%" stopColor="#9fd9f2" stopOpacity=".06"/>
        </linearGradient>
        {/* ACID — the wash is centred on the cue ball, not the table */}
        <radialGradient id={"acidCore"+id} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#ffe9ff" stopOpacity=".30"/>
          <stop offset="26%" stopColor="#ff6ec7" stopOpacity=".20"/>
          <stop offset="52%" stopColor="#8f7bff" stopOpacity=".15"/>
          <stop offset="76%" stopColor="#4fd6e0" stopOpacity=".10"/>
          <stop offset="100%" stopColor="#ffd36e" stopOpacity="0"/>
        </radialGradient>
        {/* CUT OFF — the last of the light, sitting on the cue ball */}
        <radialGradient id={"lastLight"+id} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#ffffff" stopOpacity=".55"/>
          <stop offset="34%" stopColor="#e8eef5" stopOpacity=".22"/>
          <stop offset="100%" stopColor="#9fb0c4" stopOpacity="0"/>
        </radialGradient>
        <radialGradient id={"mollyWash"+id} cx="50%" cy="50%" r="70%">
          <stop offset="0%" stopColor="#ff7bd5" stopOpacity=".24"/>
          <stop offset="38%" stopColor="#a56cff" stopOpacity=".12"/>
          <stop offset="72%" stopColor="#62e0e8" stopOpacity=".08"/>
          <stop offset="100%" stopColor="#ffcf70" stopOpacity="0"/>
        </radialGradient>
        <radialGradient id={"dmtCore"+id} cx="50%" cy="50%" r="58%">
          <stop offset="0%" stopColor="#d7fbff" stopOpacity=".28"/>
          <stop offset="38%" stopColor="#70d8ee" stopOpacity=".14"/>
          <stop offset="70%" stopColor="#a975ed" stopOpacity=".08"/>
          <stop offset="100%" stopColor="#342460" stopOpacity="0"/>
        </radialGradient>
        <linearGradient id={"peyoteWash"+id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#e6c477" stopOpacity=".14"/>
          <stop offset="45%" stopColor="#9ed7c2" stopOpacity=".06"/>
          <stop offset="72%" stopColor="#c59bd5" stopOpacity=".10"/>
          <stop offset="100%" stopColor="#e6c477" stopOpacity=".04"/>
        </linearGradient>
        <linearGradient id={"peyoteSpiral"+id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#f2d58b" stopOpacity=".18"/>
          <stop offset="34%" stopColor="#d09b56" stopOpacity=".78"/>
          <stop offset="66%" stopColor="#7bc6aa" stopOpacity=".72"/>
          <stop offset="100%" stopColor="#b787c8" stopOpacity=".12"/>
        </linearGradient>
        <linearGradient id={"aur"+id} x1="0" y1="0" x2="1" y2="0.3">
          <stop offset="0%" stopColor="#ff6ec7" stopOpacity="0"/>
          <stop offset="30%" stopColor="#8f7bff" stopOpacity=".75"/>
          <stop offset="62%" stopColor="#4fd6e0" stopOpacity=".75"/>
          <stop offset="100%" stopColor="#ffd36e" stopOpacity="0"/>
        </linearGradient>
        <radialGradient id={"focusRing"+id}>
          <stop offset="0%" stopColor="#f2dcff" stopOpacity="0"/>
          <stop offset="70%" stopColor="#d6a7f5" stopOpacity=".08"/>
          <stop offset="92%" stopColor="#e9c7ff" stopOpacity=".34"/>
          <stop offset="100%" stopColor="#e9c7ff" stopOpacity="0"/>
        </radialGradient>
        {/* the nerve shot: the room closes in and the table gets a pulse */}
        <radialGradient id={"nerveWash"+id} cx="50%" cy="50%" r="72%">
          <stop offset="0%" stopColor="#ff5f8a" stopOpacity="0"/>
          <stop offset="42%" stopColor="#e0325f" stopOpacity=".14"/>
          <stop offset="72%" stopColor="#8d0f33" stopOpacity=".46"/>
          <stop offset="100%" stopColor="#2c0311" stopOpacity=".86"/>
        </radialGradient>
        {/* MADE IT: a warm spotlight, everything else falls away */}
        <radialGradient id={"spotWash"+id} cx="50%" cy="50%" r="66%">
          <stop offset="0%" stopColor="#ffe4f2" stopOpacity=".24"/>
          <stop offset="40%" stopColor="#f07bb0" stopOpacity=".12"/>
          <stop offset="78%" stopColor="#3d0a22" stopOpacity=".32"/>
          <stop offset="100%" stopColor="#150309" stopOpacity=".58"/>
        </radialGradient>
        {/* MISSED IT: the NERVE vignette exactly, with the blood drained out.
            Same shape, same stops, same rhythm — only the colour differs. */}
        <radialGradient id={"shakeWash"+id} cx="50%" cy="50%" r="72%">
          <stop offset="0%" stopColor="#aab6c4" stopOpacity="0"/>
          <stop offset="42%" stopColor="#6c7a8a" stopOpacity=".14"/>
          <stop offset="72%" stopColor="#2f3843" stopOpacity=".46"/>
          <stop offset="100%" stopColor="#0d1116" stopOpacity=".86"/>
        </radialGradient>
        {/* OVER THE LINE: warm sickly light and the walls breathing */}
        <radialGradient id={"boozeWash"+id} cx="50%" cy="50%" r="74%">
          <stop offset="0%" stopColor="#ffcf7a" stopOpacity=".07"/>
          <stop offset="46%" stopColor="#b8722a" stopOpacity=".16"/>
          <stop offset="80%" stopColor="#4a2408" stopOpacity=".40"/>
          <stop offset="100%" stopColor="#0d0703" stopOpacity=".76"/>
        </radialGradient>
        {/* CUT OFF: the tunnel */}
        <radialGradient id={"blackWash"+id} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#000" stopOpacity="0"/>
          <stop offset="16%" stopColor="#05070a" stopOpacity=".34"/>
          <stop offset="34%" stopColor="#030406" stopOpacity=".82"/>
          <stop offset="55%" stopColor="#000" stopOpacity=".97"/>
          <stop offset="100%" stopColor="#000" stopOpacity="1"/>
        </radialGradient>
        <filter id={"sway"+id} x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="2" seed="19" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <linearGradient id={"tiltD"+id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#000" stopOpacity=".26"/><stop offset="100%" stopColor={C.warn} stopOpacity=".18"/></linearGradient>
        <linearGradient id={"tiltU"+id} x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stopColor="#000" stopOpacity=".26"/><stop offset="100%" stopColor={C.warn} stopOpacity=".18"/></linearGradient>
      </defs>
  ),[id,cloth,g,boundary]);
  const frameEl=useMemo(()=>(<g>
      {/* frame */}
      {boundary?<>
        <polygon points={boundary} fill={`url(#rail${id})`} stroke="#020304" strokeWidth={RW*2+1.4} strokeLinejoin="round"/>
        <polygon points={boundary} fill={`url(#rail${id})`} stroke={`url(#rail${id})`} strokeWidth={RW*2} strokeLinejoin="round"/>
        <polygon points={boundary} fill="none" stroke="#fff" strokeOpacity=".055" strokeWidth={RW*2-.8} strokeLinejoin="round"/>
        <polygon points={boundary} fill="none" stroke={FRAME_EDGE} strokeOpacity=".72" strokeWidth=".58" strokeLinejoin="round"/>
      </>:<>
        <rect x={vb[0]} y={vb[1]} width={vb[2]} height={vb[3]} rx="2.5" fill={`url(#rail${id})`}/>
        <rect x={vb[0]+.45} y={vb[1]+.45} width={vb[2]-.9} height={vb[3]-.9} rx="2.1" fill="none" stroke="#fff" strokeOpacity=".055" strokeWidth=".5"/>
        <rect x={vb[0]+.2} y={vb[1]+.2} width={vb[2]-.4} height={vb[3]-.4} rx="2.3" fill="none" stroke={FRAME_EDGE} strokeOpacity=".85" strokeWidth=".55"/>
        <rect x={-CD-.55} y={-CD-.55} width={g.w+(CD+.55)*2} height={g.h+(CD+.55)*2} rx="1.4" fill="none" stroke="#000" strokeOpacity=".5" strokeWidth=".5"/>
      </>}
      {sights.map((s,i)=><rect key={i} x={s.x-.6} y={s.y-.6} width="1.2" height="1.2"
        transform={`rotate(${s.a} ${s.x} ${s.y})`} fill="#cfc6b2" opacity=".3"/>)}
  </g>),[id,g,boundary,vb.join()]);
  const clothEl=useMemo(()=>(<g>
      {/* cushions: same cloth, one shade down, with a crisp nose line */}
      {/* Custom rooms use these same polygons — cushions() builds them from the
          boundary with the identical mitre, so a cross or a wave gets exactly
          the rails, jaws and pocket mouths the regulation table has. */}
      {cush.map((poly,i)=>{const pts=poly.map(q=>q.join(",")).join(" ");
        return(<g key={i}>
          <polygon points={pts} fill={fill}/>
            <polygon points={pts} fill="#000" opacity=".28"/>
          <polygon points={pts} fill="none" stroke="#000" strokeOpacity=".55" strokeWidth=".22"/></g>);})}

      {/* obstacle walls, built like cushions so they read as part of the table */}
      {g.walls.map((w,i)=><g key={"w"+i}>
        {/* a post is a rail standing in the middle of the bed: cushion face,
            rail cap on top, so it does not read as a second pocket */}
        <rect x={w.x-.5} y={w.y-.5} width={w.w+1} height={w.h+1} rx=".7" fill={fill}/>
        <rect x={w.x-.5} y={w.y-.5} width={w.w+1} height={w.h+1} rx=".7" fill="#000" opacity=".28"/>
        <rect x={w.x} y={w.y} width={w.w} height={w.h} rx=".5" fill={`url(#rail${id})`}/>
        <rect x={w.x+.35} y={w.y+.35} width={w.w-.7} height={w.h-.7} rx=".35" fill="none"
          stroke="#fff" strokeOpacity=".06" strokeWidth=".45"/>
        <rect x={w.x} y={w.y} width={w.w} height={w.h} rx=".5" fill="none" stroke="#000" strokeOpacity=".62" strokeWidth=".26"/></g>)}

      {/* Pockets, cut last. On the custom rooms the cushion is one unbroken
          stroke around the boundary, so a pocket drawn straight on top of it
          looks like a sticker. Punch the cushion open with a disc of cloth
          first, shade it, then drop the hole in — now the rail genuinely
          opens into the pocket the way the mitred jaws do on a box table. */}
      {pk.map((p,i)=><g key={i}>
        <circle cx={p.cx} cy={p.cy} r={p.r} fill={`url(#pkt${id})`}/>
        <circle cx={p.cx} cy={p.cy} r={p.r} fill="none" stroke="#000" strokeOpacity=".62" strokeWidth=".42"/>
      </g>)}
  </g>),[id,cloth,g,boundary,fill]);

  return(<svg ref={svgRef} viewBox={vb.join(" ")} preserveAspectRatio="xMidYMid meet"
    style={fitParent?{height:"100%",width:"auto",maxWidth:"100%",display:"block",touchAction:"none",...style}
                    :{width:"100%",height:"auto",display:"block",touchAction:"none",...style}}
    onPointerDown={onPoint?e=>{e.currentTarget.setPointerCapture(e.pointerId);onPoint("down",toTable(e));}:undefined}
    onPointerMove={onPoint?e=>onPoint("move",toTable(e)):undefined}
    onPointerUp={onPoint?e=>onPoint("up",toTable(e)):undefined}>
    {defsEl}

    {frameEl}

    {/* bed */}
    <g filter={T.melt?`url(#melt${id})`:(T.tipsy||T.blackout)?`url(#sway${id})`:undefined}
      clipPath={`url(#bed${id})`}>
      {boundary?<polygon points={boundary} fill={fill}/>:<rect x="0" y="0" width={g.w} height={g.h} fill={fill}/>}
      {cl.kind==="heat"&&<HeatCloth id={id} g={g} balls={balls}/>}
    </g>
    <g clipPath={`url(#bed${id})`}>
    {/* ACID — the colour comes OUT OF THE CUE BALL. It used to be horizontal
        ribbons sweeping left to right across the table, which read as weather
        happening beside you rather than something you were causing. */}
    {T.melt&&(()=>{const c=balls&&balls.find(b=>b.n===0&&!b.in);
      const cx=c?c.x:g.w/2, cy=c?c.y:g.h/2;
      return(<g style={{pointerEvents:"none"}}>
        <rect x="0" y="0" width={g.w} height={g.h} filter={`url(#oil${id})`}
          opacity=".16" style={{mixBlendMode:"soft-light",animation:"ck-hue 23s linear infinite"}}/>
        {/* the wash itself is now centred on the ball */}
        <g style={{mixBlendMode:"screen"}}>
          <ellipse className="ck" cx={cx} cy={cy} rx={g.w*.62} ry={g.w*.62}
            fill={`url(#acidCore${id})`} filter={`url(#soften${id})`}
            style={{animation:"ck-acid-tide 9s ease-in-out infinite"}}/>
          {/* rainbow shockwaves, expanding out of the ball on a loop */}
          {[0,1,2,3].map(i=><circle key={i} className="ck" cx={cx} cy={cy} r="6" fill="none"
            stroke={`url(#aur${id})`} strokeWidth={.9-i*.13} filter={`url(#soften${id})`}
            style={{animation:"ck-acid-wave 7s cubic-bezier(.25,.6,.4,1) infinite",
                    animationDelay:`${i*-1.75}s`,mixBlendMode:"screen"}}/>)}
          {/* and spokes of colour thrown out from the same point */}
          {Array.from({length:10},(_,i)=>{const a=i*Math.PI/5;
            return <line key={"sp"+i} className="ck" x1={cx+Math.cos(a)*4} y1={cy+Math.sin(a)*4}
              x2={cx+Math.cos(a)*g.w*.55} y2={cy+Math.sin(a)*g.w*.55}
              stroke={["#ff6ec7","#8f7bff","#4fd6e0","#ffd36e"][i%4]} strokeWidth=".5"
              strokeOpacity=".2" filter={`url(#soften${id})`}
              style={{animation:`ck-acid-spoke ${9+i%4}s ease-in-out infinite`,animationDelay:`${i*-.7}s`}}/>;})}
        </g>
      </g>);})()}
    {/* VODKA — THE TABLE ICES OVER. The old version was three wobbling lines
        with beads sliding along them, which said "current" but never said
        "nothing on this cloth will stop". Now the bed freezes: a cold sheen,
        fracture lines cracking outward from the cue ball, and a glide track
        that runs off the far end of the table. */}
    {T.fastCloth&&<rect x="0" y="0" width={g.w} height={g.h} fill={`url(#frostWash${id})`}
      className="ck" style={{pointerEvents:"none",mixBlendMode:"screen",
        animation:"ck-frost 6s ease-in-out infinite"}}/>}
    {T.steady&&<rect className="ck" x="0" y="0" width={g.w} height={g.h} fill={`url(#mollyWash${id})`}
      style={{pointerEvents:"none",mixBlendMode:"screen",animation:"ck-molly-wash 2.15s ease-in-out infinite"}}/>}
    {T.echo&&<rect className="ck" x="0" y="0" width={g.w} height={g.h} fill={`url(#peyoteWash${id})`}
      style={{pointerEvents:"none",mixBlendMode:"screen",animation:"ck-peyote-wash 7s ease-in-out infinite"}}/>}
    {T.ends&&<g style={{pointerEvents:"none",mixBlendMode:"screen"}} opacity=".7">
      <circle cx={g.w/2} cy={g.h/2} r={Math.min(g.w,g.h)*.38} fill={`url(#dmtCore${id})`}/>
      <g className="ck" style={{animation:"ck-dmt-turn 24s linear infinite"}}>
        {[.18,.28,.37].map((r,i)=>{const R=Math.min(g.w,g.h)*r,pts=Array.from({length:8},(_,k)=>{

    {T.tilt&&<g style={{pointerEvents:"none"}}>

      <g transform={`translate(${g.w-16} 2.2)`} opacity=".9">

    {T.fastCloth&&balls&&(()=>{
      const c=balls.find(b=>b.n===0&&!b.in); if(!c)return null;
      // frost fractures: branching cracks radiating from under the cue ball
      const cracks=[];
      for(let i=0;i<11;i++){
        const a=i*Math.PI*2/11+0.3, len=13+((i*37)%17);
        let x=c.x+Math.cos(a)*BR*1.3, y=c.y+Math.sin(a)*BR*1.3, ang=a, d=`M${x.toFixed(2)} ${y.toFixed(2)}`;
        for(let k=0;k<4;k++){
          ang+=((i*7+k*13)%9-4)*0.075;
          const step=len/4;
          x+=Math.cos(ang)*step; y+=Math.sin(ang)*step;
          d+=`L${x.toFixed(2)} ${y.toFixed(2)}`;
          if(k===1){const ba=ang+((i%2)?0.7:-0.7), bx=x+Math.cos(ba)*step*.75, by=y+Math.sin(ba)*step*.75;
            d+=`M${x.toFixed(2)} ${y.toFixed(2)}L${bx.toFixed(2)} ${by.toFixed(2)}M${x.toFixed(2)} ${y.toFixed(2)}`;}

      const dx=aim?Math.cos(aim.angle):1, dy=aim?Math.sin(aim.angle):0, nx=-dy, ny=dx;
      return(<g style={{pointerEvents:"none"}} clipPath={`url(#bed${id})`}>

          {[-1,1].map(sd=><line key={sd} x1={c.x+nx*BR*sd} y1={c.y+ny*BR*sd}

        </g>}
        {/* the ice itself */}
        <g style={{mixBlendMode:"screen"}}>
          {cracks.map(({d,i})=><path key={i} className="ck" d={d} fill="none"

    {T.steady&&balls&&(()=>{const c=balls.find(b=>b.n===0&&!b.in);if(!c)return null;

      return(<g style={{pointerEvents:"none"}}>
        {near.map((b,i)=><g key={"link"+b.n} className="ck" style={{animation:`ck-neural ${2.8+i*.37}s ease-in-out infinite`,animationDelay:`${i*-.42}s`}}>

        </g>)}
        <circle className="ck" cx={c.x} cy={c.y} r={BR*3.9} fill={`url(#focusRing${id})`}

        {[-1,1].flatMap(sx=>[-1,1].map(sy=><path key={sx+","+sy}
          d={`M${c.x+sx*BR*2.55} ${c.y+sy*BR*1.45}L${c.x+sx*BR*2.55} ${c.y+sy*BR*2.55}L${c.x+sx*BR*1.45} ${c.y+sy*BR*2.55}`}

      </g>);})()}
    {T.echo&&balls&&<g style={{pointerEvents:"none"}}>
      {balls.filter(b=>!b.in).map(b=>[
        [1,"#eadcae",.42,-.32],[2,"#9ed7c2",.76,-.57],[3,"#d0a8dc",1.05,-.78]

        strokeOpacity={(b.n===0?.5:.24)/k} strokeWidth=".13"/>))}
      {(()=>{const c=balls.find(b=>b.n===0&&!b.in);if(!c)return null;
        const pts=Array.from({length:110},(_,i)=>{const t=i/109*Math.PI*5.5,r=.28+(i/109)*BR*7.2;

        return <g opacity=".88">

        </g>);})()}
    </g>}

    {T.spotlight&&(()=>{const c=balls&&balls.find(b=>b.n===0&&!b.in);

            style={{animation:"ck-nerve 1.9s ease-in-out infinite"}}/>
        </g>}
      </g>);})()}
    {/* MISSED IT — this is the NERVE block, character for character, with grey

    {T.shakes&&<g style={{pointerEvents:"none"}}>

        return(<g style={{mixBlendMode:"screen"}}>

            fill="none" stroke="#b9c4d0" strokeWidth={.24-i*.05} strokeOpacity=".5"
            style={{animation:`ck-pulse 1.5s ease-out infinite`,animationDelay:`${i*.16}s`}}/>)}
          <circle className="ck" cx={c.x} cy={c.y} r={BR*1.5} fill="none" stroke="#dde4ea"

    </g>}

      {balls&&<>
        <g className="ck" opacity=".42" style={{animation:"ck-drunkA 5.2s ease-in-out infinite"}}>
          {balls.filter(b=>!b.in).map(b=>{const bi=b.n===0?null:ballInfo(b.n);
            return <circle key={"gA"+b.n} cx={b.x} cy={b.y} r={BR}

        </g>
        <g className="ck" opacity=".30" style={{animation:"ck-drunkB 6.9s ease-in-out infinite"}}>
          {balls.filter(b=>!b.in).map(b=>{const bi=b.n===0?null:ballInfo(b.n);
            return <circle key={"gB"+b.n} cx={b.x} cy={b.y} r={BR}
              fill={b.n===0?"#f4f2ec":bi.col}/>;})}
        </g>
      </>}
    </g>}
    {/* CUT OFF — a dark table and the white ball breathing in the middle of it.

        vision layered on top, and all of that was noise on top of the one image
        that actually says everything. */}
    {T.blackout&&(()=>{const c=balls&&balls.find(b=>b.n===0&&!b.in);
      const cx=c?c.x:g.w/2, cy=c?c.y:g.h/2;
      return(<g style={{pointerEvents:"none"}}>
        <rect className="ck" x={cx-g.w*.85} y={cy-g.w*.85} width={g.w*1.7} height={g.w*1.7}

        {c&&<g style={{mixBlendMode:"screen"}}>
          <circle className="ck" cx={cx} cy={cy} r={BR*3.4} fill={`url(#lastLight${id})`}

      </g>);})()}
    {T.noPreview&&<rect x="0" y="0" width={g.w} height={g.h} fill="#000" opacity=".34"/>}
    </g>

    {clothEl}
    {balls&&(()=>{const shut=[];
      for(const q of balls){ if(q.in||q.power!=="anchor")continue;
        pk.forEach((p,i)=>{ if(Math.hypot(q.x-p.cx,q.y-p.cy)<9.5&&!shut.includes(i))shut.push(i); }); }
      return shut.map(i=>{const p=pk[i];
        return(<g key={"shut"+i} style={{pointerEvents:"none"}}>

          <path d={`M${p.cx-p.r*.5} ${p.cy-p.r*.5}L${p.cx+p.r*.5} ${p.cy+p.r*.5}

            stroke="#c9d4de" strokeWidth=".34" strokeLinecap="round" strokeOpacity=".8"/>

        </g>);});})()}
    {T.khole&&pk.map((p,i)=><g key={"kh"+i} style={{pointerEvents:"none"}}>
      <circle className="ck" cx={p.cx} cy={p.cy} r={p.r*1.82} fill={`url(#well${id})`}

      <path d={`M${p.cx-p.r*1.42} ${p.cy}A${p.r*1.42} ${p.r*1.42} 0 0 1 ${p.cx} ${p.cy-p.r*1.42}`}
        fill="none" stroke={`url(#ketFade${id})`} strokeWidth=".34" strokeLinecap="round" filter={`url(#glow${id})`}/>
      <path d={`M${p.cx+p.r*1.42} ${p.cy}A${p.r*1.42} ${p.r*1.42} 0 0 1 ${p.cx} ${p.cy+p.r*1.42}`}
        fill="none" stroke={`url(#ketFade${id})`} strokeWidth=".27" strokeLinecap="round" filter={`url(#glow${id})`} opacity=".76"/>
    </g>)}
    {calls&&calls.map((p,i)=><circle key={"c"+i} cx={p.cx} cy={p.cy} r={p.r+1.1} fill="none"
      stroke={C.warn} strokeOpacity=".85" strokeWidth=".5"/>)}
    {called!=null&&pk[called]&&<circle cx={pk[called].cx} cy={pk[called].cy} r={pk[called].r+1.3}
      fill="none" stroke={C.warn} strokeWidth=".7"/>}

    {aim&&aim.show&&aim.ghostLine&&<polyline points={aim.ghostLine.path.map(q=>q.join(",")).join(" ")}
      fill="none" stroke="#fff" strokeOpacity=".3" strokeWidth=".22" strokeDasharray="1.6 1.4"/>}
    {aim&&aim.show&&aim.p&&<g>

        {/* dark halo under the object line so it reads on every cloth */}

    {balls&&balls.filter(b=>!b.in&&b.n!==0).map(b=><Ball key={b.n} b={b} id={id} owner={owners&&owners[b.n]}/>)}

    {T.phase&&balls&&(()=>{const c=balls.find(b=>b.n===0&&!b.in); if(!c)return null;

      return(<g style={{pointerEvents:"none",mixBlendMode:"screen"}}>
        <g clipPath={`url(#bed${id})`}>
          {balls.filter(b=>!b.in).map(b=><g key={"split"+b.n}>
            <circle cx={b.x-.34} cy={b.y+.16} r={BR*1.04} fill="none" stroke="#ff62c6" strokeWidth=".23" strokeOpacity=".34"/>
            <circle cx={b.x+.34} cy={b.y-.16} r={BR*1.04} fill="none" stroke="#54dfe7" strokeWidth=".23" strokeOpacity=".34"/>

          {[6.5,10.5,15.5,21.5].map((r,i)=><polygon key={i} className="ck" points={blob(r,i*1.7)}
            fill="none" stroke={`url(#aur${id})`} strokeWidth={.2+i*.035} strokeOpacity={.34+i*.08}
            filter={`url(#glow${id})`} style={{animation:`ck-acid-contour ${8+i*2.4}s linear infinite`,animationDelay:`${i*-.9}s`}}/>)}

        {aim&&aim.p&&<>
          <polyline points={aim.p.path.map(q=>q.join(",")).join(" ")} fill="none" stroke="#ef7fc7"
            strokeWidth=".46" strokeOpacity=".16" transform="translate(-.24 .12)"/>
          <polyline points={aim.p.path.map(q=>q.join(",")).join(" ")} fill="none" stroke="#62dce3"
            strokeWidth=".46" strokeOpacity=".16" transform="translate(.24 -.12)"/>

        <path className="ck" d={`M${c.x-BR*2.1} ${c.y}A${BR*2.1} ${BR*2.1} 0 0 1 ${c.x} ${c.y-BR*2.1}
          M${c.x+BR*2.1} ${c.y}A${BR*2.1} ${BR*2.1} 0 0 1 ${c.x} ${c.y+BR*2.1}`}

    {T.ends&&T.ends.map((q,i)=>{if(q.in)return null;const bi=q.n===0?null:ballInfo(q.n),col=q.n===0?"#f4fbff":bi.col;

    {aim&&aim.stick&&<CueStick x={aim.x} y={aim.y} angle={aim.angle} pull={aim.pull} tip={aim.tip} live={aim.live} id={id}
