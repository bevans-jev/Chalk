    // A busy room makes people stay; a crowded one makes them give up on the
    // table and go home. Without the second half the bar just fills up forever.
    const crowded=Math.max(0,here.length-8)*0.05;
    const stay=(p.regular?0.990:0.855)+Math.min(0.10,room.crowd/900)
      +(p.watched>3?0.04:0)+(p.isWatcher?0.06:0)-crowded;
    if(!chance(stay)){
      p.status="away"; p.awaySince=gameNo;
      if(chance(0.18))roomSay(room,`${p.name} settled up and went home.`);
    }
  }
  // --- people come back ------------------------------------------------------
  for(const p of room.people){
    if(p.status!=="away")continue;
    const gone=gameNo-(p.awaySince||0);
    if(gone<2)continue;
    if(present(room).length>11&&!p.rival&&!p.regular)continue;
    if(!chance(p.rival?0.16+gone*0.05:(p.regular?0.38:0.11)))continue;
    p.status="present"; p.arrived=gameNo;
    if(p.rival){
      // A RIVAL DOES NOT COME BACK THE SAME PLAYER.
      // Three different ways of having thought about it, and which one you get
      // depends on what actually happened between you.
      const roll=Math.random();
      const bumpRating=Math.min(880,p.rating+40+Math.round(gone*4)+p.grudge*8);
      p.rating=bumpRating;
      p.skill=Math.min(0.99,skillOf(bumpRating)+deep*0.02+0.05);
      if(roll<0.42&&ctx&&ctx.profile&&ctx.profile.n>2){
        p.adapted="counter"; p.style=counterStyle(ctx.profile);
        roomSay(room,`${p.name} is back, and they have clearly been thinking about you.`);
      }else if(roll<0.72&&ctx&&ctx.playerStyle){
        p.adapted="imitate"; p.style=ctx.playerStyle;
        roomSay(room,`${p.name} is back. Somebody says they have been practising your shots.`);
      }else{
        p.adapted="sharper";
        roomSay(room,`${p.name} came back in. Same cue, different look on their face.`);
      }
      const c=CHARS[p.char];
      if(c){["pow","stroke","touch","english","curve","eye"].forEach(k=>
        c[k]=Math.max(18,Math.min(100,c[k]+4+Math.round(p.grudge*1.5))));}
    }else if(chance(0.22)){
      roomSay(room,pick([`${p.name} came back. Same stool.`,
        `${p.name} is back, and went straight to where they were sitting before.`,
        `${p.name} never actually left, it turns out. Just went outside.`]));
    }
  }
  // --- new arrivals ----------------------------------------------------------
  // A long streak is a reason to come in off the street.
  const names=takenNames(room);
  let arrivals=chance(0.55)?1:0;
  if(streak>=5&&chance(0.35))arrivals++;
  if(streak>=15&&chance(0.4))arrivals++;
  const roomSize=present(room).length;
  if(roomSize<4)arrivals++;
  if(roomSize>9)arrivals=Math.max(0,arrivals-1);
  for(let i=0;i<arrivals;i++){
    if(roomSize+i>11)break;
    const heardAbout=streak>=6&&chance(0.45);
    const p=makePerson(streak,{arrived:gameNo,avoid:names,
      skillBonus:heardAbout?0.05:0,
      from:heardAbout?"Came in because of you":undefined});
    if(heardAbout){
      p.heardStreak=streak;
      const r=room.rumors.length?pick(room.rumors):null;
      roomSay(room,r
        ?`Somebody new walked in asking if you're the one who ${rumorText(r)}.`
        :`Somebody new walked in and asked who's been holding the table.`);
      if(r)p.heard.push(r.id);
    }
    room.people.push(p);
  }
  // --- the regulars get better too -----------------------------------------
  // Somebody who has been on that stool for thirty racks has been playing on
  // the other tables the whole time. Without this, a long streak ends up facing
  // the same four hundred-rated regulars it started against.
  const bar=kingRating(streak,0.5);
  for(const p of present(room)){
    if(p.rating>=bar-40)continue;
    if(!chance(0.34))continue;
    p.rating=Math.min(bar+20,p.rating+9+Math.round(Math.random()*13));
    p.skill=Math.min(0.99,skillOf(p.rating)+deep*0.02);
    const c=CHARS[p.char];
    if(c&&chance(0.6))["pow","stroke","touch","english","curve","eye"].forEach(k=>
      c[k]=Math.max(18,Math.min(100,c[k]+1+Math.round(Math.random()*2))));
    if(chance(0.06))roomSay(room,`${p.name} has been winning on the other table all night.`);
  }
  // --- everyone present watched the match just played ------------------------
  if(ctx&&ctx.observed){
    for(const p of present(room)){
      p.watched++;
      const o=ctx.observed;
      p.notes.n++;
      p.notes.spin+=o.spin; p.notes.aggro+=o.aggro;
      p.notes.safe+=o.safe; p.notes.flash+=o.flash; p.notes.buzz+=o.buzz;
      if(p.watched>=3&&!p.studied&&chance(0.35))p.studied=true;
    }
  }
  // --- rumours spread, warp and die -----------------------------------------
  for(const r of room.rumors){
    r.heat-=0.16+Math.random()*0.2;
    // a rumour still alive gets retold, and retelling makes it bigger
    if(r.heat>0&&chance(0.28)&&r.tier<3){
      r.tier++;
      const w=present(room).filter(p=>!r.witnesses.includes(p.id));
      if(w.length){const t=pick(w); r.witnesses.push(t.id); t.heard.push(r.id);}
      roomSay(room,`The story going round now is that you ${rumorText(r)}.`);
    }
    if(r.heat>0&&chance(0.2)){
      const w=present(room);
      if(w.length){const t=pick(w); if(!t.heard.includes(r.id))t.heard.push(r.id);}
    }
  }
  room.rumors=room.rumors.filter(r=>r.heat>0).slice(0,7);
  // --- new rumours from what just happened -----------------------------------
  if(ctx&&ctx.notable&&ctx.notable.length){
    const witness=present(room).map(p=>p.id);
    for(const kind of ctx.notable.slice(0,2)){
      if(!RUMOR_KINDS[kind])continue;
      const existing=room.rumors.find(r=>r.kind===kind);
      if(existing){existing.heat=Math.min(3,existing.heat+1.1);}
      else{
        const r=makeRumor(kind,witness,gameNo);
        r.heat=1.6+Math.random();
        room.rumors.push(r);
        for(const id of witness){const p=room.people.find(x=>x.id===id); if(p)p.heard.push(r.id);}
        roomSay(room,`People saw that. They're telling the ones who didn't.`);
      }
    }
  }
  // --- crowd -----------------------------------------------------------------
  // The CROWD is the room's general attention: flashy play pulls it, grinding
  // and safety play lets it wander off to another table.
  if(ctx&&ctx.observed){
    const o=ctx.observed;
    const pull=o.flash*52+o.aggro*14+(ctx.won?12:2)+Math.min(16,streak*1.2)+room.rumors.length*3.5;
    const push=o.safe*46+10;
    room.crowd=Math.max(0,Math.min(100,room.crowd*0.68+(pull-push)*0.62));
  }
  // --- the watcher -----------------------------------------------------------
  // One specific person. Not the crowd. The crowd is noise; this is somebody
  // who has decided to stay until they find out how it ends.
  const cur=room.people.find(p=>p.id===room.watcher);
  if(cur&&cur.status!=="present"){room.watcher=null;room.watcherLevel=0;}
  if(!room.watcher&&streak>=2){
    const cands=present(room).filter(p=>p.watched>=1);
    if(cands.length&&chance(0.55)){
      const w=pick(cands); room.watcher=w.id; w.isWatcher=true; room.watcherLevel=1;
      roomSay(room,`${w.name} has stopped pretending to watch the other table.`);
    }
  }
  if(room.watcher){
    if(ctx&&ctx.won)room.watcherLevel=Math.min(5,room.watcherLevel+(streak%3===0?1:0));
    else{
      // A long streak buys forgiveness. A short one does not.
      const drop=streak>=10?1:streak>=5?2:99;
      room.watcherLevel=Math.max(0,room.watcherLevel-drop);
      if(room.watcherLevel<=0){
        const w=room.people.find(p=>p.id===room.watcher);
        if(w){w.isWatcher=false;roomSay(room,`${w.name} watched you lose and went back to their drink.`);}
        room.watcher=null;
      }
    }
  }
  room.gameNo=gameNo;
  // the rest of the room plays its own night
  otherTables(room);
  roomChatter(room,streak,{won:ctx&&ctx.won,buzz:(ctx&&ctx.buzz)||0});
  return room;
}

// Who actually steps forward. Preference goes to people with a reason: rivals,
// people who have been studying you, people who just walked in for the streak.
function roomPool(room,streak,noDoubles=false){
  const here=present(room);
  if(!here.length){const p=makePerson(streak,{arrived:room.gameNo,avoid:takenNames(room)});room.people.push(p);here.push(p);}
  const want=Math.min(here.length,1+Math.floor(Math.random()*5));
  const weight=p=>{
    let w=1;
    if(p.rival)w+=3.2+p.grudge*0.6;
    if(p.studied)w+=2.2;
    if(p.heardStreak)w+=1.6;
    if(p.watched>=4)w+=1.1;
    if(p.record.w+p.record.l>0)w+=0.5;
    if(p.calledOut)w+=18; // you told this exact heckler to put quarters up
    // somebody four hundred points below you is not stepping up to the king
    const gap=kingRating(streak,0.5)-p.rating;
    if(gap>120)w*=0.35; else if(gap>60)w*=0.7;
    return w;};
  const bag=here.slice(), out=[];
  while(out.length<want&&bag.length){
    let total=0; for(const p of bag)total+=weight(p);
    let r=Math.random()*total, idx=0;
    for(let i=0;i<bag.length;i++){r-=weight(bag[i]); if(r<=0){idx=i;break;}}
    out.push(bag.splice(idx,1)[0]);
  }
  // Doubles stays a side dish: it begins after one win, rises with the run, and
  // an accepted 2v2 blocks another 2v2 from being offered immediately after it.
  const doublesChance=streak<1?0:streak<=2?0.16:streak<=5?0.24:0.30;
  for(const p of out){
    if(p.calledOut){p.calledOut=false;p.wasCalledOut=true;}
    p.team=!noDoubles&&chance(doublesChance);
    if(p.team){
      const n=1+Math.floor(Math.random()*4);
      const av=takenNames(room);
      p.partners=Array.from({length:n},()=>makePerson(Math.max(0,streak-2),
        {avoid:av,rating:Math.max(280,Math.min(870,p.rating-90+Math.floor(Math.random()*181)))}));
      p.oppAlly=makePerson(streak,{avoid:av,rating:Math.max(280,Math.min(870,p.rating-35+Math.floor(Math.random()*71)))});
    }else{p.partners=null;p.oppAlly=null;}
  }
  return out;
}

// What a challenger brings to the table BECAUSE of what they have seen. This is
// the payoff for the whole watching system and it is stated out loud on the
// challenger card, so a player can feel it rather than wonder about it.
function preparation(p,profile){
  const n=Math.max(1,p.notes.n);
  if(!p.studied||p.notes.n<2)return null;
  const spin=p.notes.spin/n, safe=p.notes.safe/n, flash=p.notes.flash/n, buzz=p.notes.buzz/n;
  if(safe>0.26)return{tag:"HAS WATCHED YOU HIDE",
    line:"They have seen you play safe all night and they are not giving the table back.",style:"aggressive",bump:{eye:6}};
  if(flash>0.26)return{tag:"WAITING FOR THE MISS",
    line:"They have watched you take the shot nobody asks for. They intend to be sitting down when it goes wrong.",style:"lockdown",bump:{touch:6}};
  if(spin>0.42)return{tag:"KNOWS YOU SPIN IT",
    line:"They have noticed there is side on everything you hit, and they are leaving you straight ones on purpose.",style:"minimalist",bump:{stroke:5}};
  if(buzz>0.5)return{tag:"COUNTING YOUR DRINKS",
    line:"They have been counting. They plan to still be here when the drink lands.",style:"defensive",bump:{tol:8}};
  return{tag:"HAS YOUR NUMBER",
    line:"They have watched enough racks to know roughly what you are going to do.",style:null,bump:{eye:4}};
}

// ---- the other tables -------------------------------------------------------
// This room does not stop existing while you are shooting. Every rack, two of
// the people standing around play each other on the far table, and it matters:
// the winner gets a little sharper, the loser sulks, and by the time somebody's
// quarters reach YOUR table you have already heard how their night is going.
function otherTables(room){
  const here=present(room).filter(p=>!p.isWatcher);
  if(here.length<2)return;
  const games=here.length>7?2:1;
  for(let i=0;i<games;i++){
    const a=pick(here), b=pick(here.filter(x=>x.id!==a.id));
    if(!b)return;
    const edge=1/(1+Math.pow(10,(b.rating-a.rating)/220));
    const w=chance(edge)?a:b, l=w===a?b:a;
    w.form=Math.min(3,(w.form||0)+1); l.form=Math.max(-3,(l.form||0)-1);
    w.rating=Math.min(880,w.rating+2+Math.round(Math.random()*3));
    w.skill=Math.min(0.99,skillOf(w.rating));
    if(!w.knows.includes(l.id))w.knows.push(l.id);
    if(!l.knows.includes(w.id))l.knows.push(w.id);
    if(chance(0.32))roomSay(room,pick([
      `${(w.short||w.name)} just beat ${(l.short||l.name)} on the far table.`,
      `${(l.short||l.name)} lost the far table to ${(w.short||w.name)} and did not take it well.`,
      `${(w.short||w.name)} is on a little run of their own over there.`,
      `Somebody put money on ${(l.short||l.name)} at the far table. They should not have.`,
    ]));
  }
}

// ---- what the room is talking about between racks ---------------------------
// Chatter keyed to state, so it reads as a room paying attention rather than a
// random line generator. Never more than a couple a rack.
function roomChatter(room,streak,ctx){
  const here=present(room);
  const someone=()=>{const q=here.length?pick(here):null;return q?(q.short||q.name):"Somebody";};
  const lines=[];
  if(ctx.won&&streak===3)lines.push("Three on the trot. The far table has stopped pretending not to look.");
  if(ctx.won&&streak===5)lines.push("Five. Somebody at the bar started keeping the count on a napkin.");
  if(ctx.won&&streak===10)lines.push(`${someone()} says out loud that nobody in here is going to take that table tonight.`);
  if(ctx.won&&streak===20)lines.push("Twenty. The bartender has stopped charging you for the table.");
  if(!ctx.won&&streak===0)lines.push(`${someone()} was quietly delighted by that and is not hiding it well.`);
  if(room.crowd>78)lines.push("There are people three deep on that rail now. Somebody moved a stool.");
  if(room.crowd<18&&streak>3)lines.push("The room has drifted back to its own games. You are winning very quietly.");
  if(ctx.buzz>=70)lines.push(`${someone()} offered to hold your cue while you sat down. It was not a joke.`);
  if(ctx.buzz<=5&&streak>=4)lines.push("Somebody keeps buying you drinks you are not touching. They have noticed.");
  const rivals=room.people.filter(p=>p.rival&&p.status==="present");
  if(rivals.length>=2)lines.push(`${(rivals[0].short||rivals[0].name)} and ${(rivals[1].short||rivals[1].name)} are talking about you in the corner. Neither is smiling.`);
  const old=here.filter(p=>room.gameNo-(p.firstSeen||0)>=18);
  if(old.length&&chance(0.16))lines.push(pick([
    `${(old[0].short||old[0].name)} has been on that stool since you got here and has not once put a coin down.`,
    `${(old[0].short||old[0].name)} has watched every rack you have played tonight. Every single one.`,
    `Somebody asked ${(old[0].short||old[0].name)} if they were going to play. They said not yet.`]));
  if(room.watcher){const w=room.people.find(p=>p.id===room.watcher);
    if(w&&room.watcherLevel>=3)lines.push(`${(w.short||w.name)} has stopped drinking. They are just watching now.`);}
  const idle=["The jukebox skipped and nobody got up to fix it.",
    "Somebody is arguing about a foul on the far table. It is not going to end well.",
    "The door went. Cold air, then nothing.",
    "Somebody racked for you without being asked. That is either respect or a hustle.",
    "The light over the far table has started flickering again.",
    "Two people at the bar are pretending they have not been watching you for an hour."];
  if(chance(0.34))lines.push(pick(idle));
  for(const l of lines.slice(0,2))roomSay(room,l);
}

// ---- what the room has started calling you ----------------------------------
// A name is the clearest possible proof that the room formed an opinion. It
// only appears once enough people have watched enough racks, and it moves when
// what you do moves.
const ROOM_NAMES={
  flashy:["The Sunday Shot","Highlight","The Circus"],
  grinder:["The Metronome","Nine to Five","Clockwork"],
  trap:["The Undertaker","No Fun","The Wall"],
  reckless:["The Crash","Free Money","All Or Nothing"],
  drunk:["Last Call","Two Fisted","The Tab"],
  machine:["The Machine","Closing Time","The Landlord"],
  unknown:[],
};
function roomName(room,profile,streak,buzz){
  if(profile.n<5)return null;
  const op=opinionOf(profile,streak,buzz);
  const bag=ROOM_NAMES[op.id]||[];
  if(!bag.length)return null;
  // pinned per opinion so it does not flicker every rack
  const idx=(room.gameNo>>2)%bag.length;
  return bag[idx];
}

// ---- one-off beats between matchups -----------------------------------------
// Short, rare, and always optional. They are the reason two racks at the same
// difficulty do not feel identical.
function nightBeat(room,king){
  const here=present(room);
  // A favour belongs to the teammate who owes it. They come back later and
  // offer concrete help; declining keeps the debt alive for another rack.
  const due=(king.owedFavours||[]).filter(f=>room.gameNo-f.earnedAt>=2);
  if(due.length&&chance(0.58)){
    const f=pick(due);
    const spend=(fn)=>k=>fn({...k,owedFavours:(k.owedFavours||[]).filter(x=>x.id!==f.id)});
    const help=[
      {label:"Quiet the rail",sub:"No heckling next matchup",apply:spend(k=>({...k,perks:{...k.perks,quiet:1}}))},
      {label:"Put in a word",sub:"Your next offer is accepted clean",apply:spend(k=>({...k,perks:{...k.perks,word:1}}))},
      {label:"Tell me what you saw",sub:"Next challenger is scouted free",apply:spend(k=>({...k,freeScout:true}))},
      {label:"Get me another option",sub:"One more challenger steps up",apply:spend(k=>{
        const p=makePerson(k.streak,{arrived:k.room.gameNo,avoid:takenNames(k.room)});
        k.room.people.push(p); return{...k,pool:[...(k.pool||[]),p]};})},
      {label:"Take this drink off me",sub:"−18 buzz",apply:spend(k=>({...k,buzz:Math.max(0,k.buzz-18)}))},
      {label:"Be ready for doubles",sub:`${f.name} joins your next accepted 2v2`,apply:spend(k=>({...k,
        perks:{...k.perks,partnerCall:f}}))},
    ];
    // Two contextually different offers, not a six-button vending machine.
    const first=Math.floor(Math.random()*help.length),second=(first+1+Math.floor(Math.random()*(help.length-1)))%help.length;
    return{id:`favour-${f.id}`,who:f.name,
      text:`${f.name} catches you between racks. “You carried me in that doubles game. I still owe you.”`,
      opt:[help[first],help[second],{label:"Not yet",sub:"They still owe you",apply:k=>k}]};
  }
  if(!here.length||chance(0.55))return null;
  const who=pick(here), first=who.short||who.name;
  const pool=[];
  if(king.buzz<70)pool.push({id:"drink",who:first,
    text:`${who.name} put a drink down on the rail next to you without saying anything.`,
    opt:[{label:"Drink it",sub:"+16 buzz · +$8 goodwill",apply:k=>({...k,buzz:Math.min(100,k.buzz+16),bank:k.bank+8})},
         {label:"Leave it there",sub:"They notice",apply:k=>k}]});
  if(room.rumors.length)pool.push({id:"story",who:first,
    text:`${first} wants to know whether you really ${rumorText(pick(room.rumors))}.`,
    opt:[{label:"Let them believe it",sub:"Crowd +10",apply:k=>{k.room.crowd=Math.min(100,k.room.crowd+10);return{...k};}},
         {label:"Tell them the truth",sub:"Crowd −6 · they trust you",apply:k=>{k.room.crowd=Math.max(0,k.room.crowd-6);return{...k};}}]});
  const rivals=here.filter(p=>p.rival);
  if(rivals.length)pool.push({id:"warn",who:first,
    text:`${first} leaned over and told you what ${(rivals[0].short||rivals[0].name)} has been practising all night.`,
    opt:[{label:"Take the tip",sub:"Next matchup is scouted free",apply:k=>({...k,freeScout:true})},
         {label:"Not interested",sub:"",apply:k=>k}]});
  if(king.bank>=20)pool.push({id:"loan",who:first,
    text:`${first} is short for the next table and asks you to cover five.`,
    opt:[{label:"Cover them",sub:"−$5 · a named favour owed",apply:k=>({...k,bank:Math.max(0,k.bank-5),
           owedFavours:[...(k.owedFavours||[]),{id:`owed_${++favourSeq}`,whoId:who.id,name:who.name,
             partner:{...who},earnedAt:k.room.gameNo,reason:"you covered their table money"}]})},
         {label:"Not tonight",sub:"",apply:k=>k}]});
  pool.push({id:"jukebox",who:null,
    text:"Somebody is holding the jukebox hostage and wants you to pick.",
    opt:[{label:"Something fast",sub:"Crowd +12 · +6 buzz",apply:k=>{k.room.crowd=Math.min(100,k.room.crowd+12);return{...k,buzz:Math.min(100,k.buzz+6)};}},
         {label:"Something slow",sub:"−10 buzz · crowd −8",apply:k=>{k.room.crowd=Math.max(0,k.room.crowd-8);return{...k,buzz:Math.max(0,k.buzz-10)};}}]});
  return pick(pool);
}

// ---- why this person put their quarters down --------------------------------
function whyStepped(p,room){
  if(p.rival)return "CAME BACK FOR YOU";
  if(p.studied&&p.watched>=5)return `WATCHED ${p.watched} AND WAITED`;
  if(p.heardStreak)return "HEARD ABOUT THE RUN";
  if(p.record.w+p.record.l)return `${p.record.w}–${p.record.l} AND COUNTING`;
  if((p.form||0)>=2)return "WINNING ON THE FAR TABLE";
  if((p.form||0)<=-2)return "LOST THEIRS · WANTS ANOTHER";
  if(room.gameNo-(p.firstSeen||0)>=12)return "FINALLY GOT UP";
  return "QUARTERS DOWN";
}
// The challenger says which game they are naming, and it fits how they play.
function modeCall(p,mode){
  const first=(p.short||p.name);
  if(mode==="cutthroat")return `${first} does not want a straight rack. Cutthroat, their call, until you take one back.`;
  return `${first} named it. Eight ball, their rules, until you win one off them.`;
}

// ---- the three cards --------------------------------------------------------
// This screen sits AFTER you have chosen who you are playing, so every card is
// aimed at a specific person rather than at nothing in particular.
function prepCards(king,q,room){
  const cards=[];
  const buzz=Math.round(king.buzz);
  cards.push({id:"sober",name:"Sit this one out a minute",
    sub:buzz>0?`Clear ${Math.min(buzz,22+Math.round(buzz*0.35))} buzz`:"Nothing left to clear",
    text:"Water, a wall, five minutes of not talking to anybody.",
    ok:buzz>4,apply:k=>({...k,buzz:Math.max(0,k.buzz-(22+k.buzz*0.35))})});
  cards.push({id:"lean",name:"Get one in before it starts",
    sub:"+$18 side action · +14 buzz",
    text:"Somebody wants to bet on the match. Taking their money means drinking with them.",
    ok:true,apply:k=>({...k,bank:k.bank+18,buzz:Math.min(100,k.buzz+14)})});
  if(room.watcher){
    const w=room.people.find(p=>p.id===room.watcher);
    if(w)cards.push({id:"talk",name:`Say something to ${(w.short||w.name)}`,
      sub:"The watcher settles in · +1 level",
      text:"They have been watching all night. Acknowledging it changes something.",
      ok:true,apply:k=>({...k,watcherBump:true})});
  }
  if(king.streak>=4)cards.push({id:"stretch",name:"Take the table for ten minutes",
    sub:"+3 to your two lowest stats this match",
    text:"Roll a few around on your own while the room waits. It helps.",
    ok:true,apply:k=>({...k,warmed:true})});
  return cards.slice(0,4);
}

// ---- side stakes ------------------------------------------------------------
// NOT EVERY BET IS MONEY. Half of what gets wagered in a bar is not currency:
// a drink you can call in later, somebody's cue for the night, a tip about who
// is coming, a rack of head start. And the other side gets to COUNTER — you
// name a price, they come back with something else, and you take it or you do
// not. That back-and-forth is most of what makes a stake feel like a deal.
const kingStakeBase=(q,streak)=>7+Math.round(q.rating/130)+Math.floor(streak*0.6);
const kingCrowdMul=room=>1+Math.min(0.35,(room.crowd/100)*0.35);
function stakeOptions(king,q,room){
  const base=kingStakeBase(q,king.streak);
  const crowd=kingCrowdMul(room);
  const M=x=>Math.round(base*crowd*x);
  const out=[
    {id:"straight",name:"Play it straight",sub:`Win $${M(1)}`,
     text:"The normal rate. Nobody has to shake on anything.",mult:1,risk:0},
    {id:"double",name:"Double or nothing",sub:`Win $${M(2)} · lose $${Math.round(base*0.9)}`,
     text:"They will take that bet and they will not forget it either way.",mult:2,risk:0.9},
  ];
  if(king.bank>=40)out.push({id:"deep",name:"Put real money on it",
    sub:`Win $${M(3.2)} · lose $${Math.round(base*2.1)}`,
    text:"This is the kind of bet people tell other people about.",mult:3.2,risk:2.1,loud:true});
  if(q.rival||q.grudge>0)out.push({id:"grudge",name:"Make it about the last time",
    sub:`Win $${M(2.4)} · lose $${Math.round(base*1.5)} · grudge deepens either way`,
    text:"They brought it up before you did.",mult:2.4,risk:1.5,grudge:true});
  // the ones that are not money at all
  out.push({id:"drink",name:"Play for a drink",sub:`Win $${M(0.8)} + one on the house, any time`,
    text:"Lower purse, but the bar owes you one and it keeps until you want it.",
    mult:0.8,risk:0,perk:"drink"});
  if(king.streak>=3)out.push({id:"cue",name:"Play for their cue",
    sub:`Win $${M(1.1)} + their cue for three matchups`,
    text:"It is a better cue than yours and everybody in here knows it.",
    mult:1.1,risk:0.6,perk:"cue"});
  out.push({id:"word",name:"Play for what they know",sub:`Win $${M(0.9)} + three free reads`,
    text:"They have been in this room longer than you. That is worth something.",
    mult:0.9,risk:0,perk:"intel"});
  return out;
}
// THEY DO NOT ALWAYS JUST SAY YES. A counter is generated from the stake you
// offered and who they are: a showman raises, a lockdown player shaves it, a
// rival makes it personal, somebody skint asks to play for something else.
function counterOffer(king,q,st,room){
  // Most people simply accept. A counter should feel like a person making a
  // point, not a toll screen that appears after every choice.
  if(!st||Math.random()>0.38)return null;
  const first=q.short||q.name;
  const base=kingStakeBase(q,king.streak);
  const crowd=kingCrowdMul(room);
  const M=x=>Math.round(base*crowd*x);
  const opts=[];
  if(st.mult<3)opts.push({
    line:`${first} looked at the money and pushed it back across. They want more on it.`,
    name:"They raised you",sub:`Win $${M(st.mult*1.6)} · lose $${Math.round(base*(st.risk+0.9))}`,
    stake:{...st,id:st.id+"-raised",name:st.name+" (raised)",mult:st.mult*1.6,risk:st.risk+0.9,loud:true}});
  if(st.risk>0)opts.push({
    line:`${first} does not like the number. They will play, for less.`,
    name:"They shaved it",sub:`Win $${M(st.mult*0.7)} · lose $${Math.round(base*st.risk*0.4)}`,
    stake:{...st,id:st.id+"-shaved",name:st.name+" (shaved)",mult:st.mult*0.7,risk:st.risk*0.4}});
  const otherMode=(king.mode||"eight")==="eight"?"cutthroat":"eight";
  opts.push({
    line:`${first} is fine with the money. They are not fine with the game. They want ${MODES[otherMode].name}.`,
    name:"They changed the game",sub:`Same stake · play ${MODES[otherMode].name}`,
    stake:{...st,id:st.id+"-game",name:st.name+` · ${MODES[otherMode].name}`,agreedMode:otherMode}});
  if(q.rival||q.grudge>0)opts.push({
    line:`${first} is not interested in your money. They want it to be about the last time.`,
    name:"They made it personal",sub:`Win $${M(2.6)} · lose $${Math.round(base*1.6)} · grudge either way`,
    stake:{id:"grudge",name:"About the last time",mult:2.6,risk:1.6,grudge:true}});
  if(king.streak>=2)opts.push({
    line:`${first} will only play if you spot them the first rack of the series.`,
    name:"They want a rack start",sub:`Win $${M(st.mult*1.9)} · you start the series 0–1`,
    stake:{...st,id:st.id+"-spot",name:st.name+" (spotted a rack)",mult:st.mult*1.9,risk:st.risk,spot:1}});
  opts.push({
    line:`${first} has no cash on them. They will put something else up instead.`,
    name:"They offered a favour",sub:`Win $${M(st.mult*0.6)} + a drink on the house, any time`,
    stake:{...st,id:st.id+"-favour",name:st.name+" (for a favour)",mult:st.mult*0.6,risk:0,perk:"drink"}});
  const chosen=pick(opts),off=chosen.stake;
  let compromise;
  if(off.agreedMode){
    const mid={...st,id:st.id+"-sweetened",name:st.name+" · your game, sweeter pot",
      mult:st.mult*1.2,risk:st.risk+0.2};
    compromise={stake:mid,label:"Keep your game · sweeten the pot",
      sub:`Win $${M(mid.mult)} · lose $${Math.round(base*mid.risk)}`};
  }else if(off.spot){
    const mid={...st,id:st.id+"-nospot",name:st.name+" · no spot",
      mult:(st.mult+off.mult)/2,risk:(st.risk+off.risk)/2};
    compromise={stake:mid,label:"No rack spot · meet on money",
      sub:`Win $${M(mid.mult)} · lose $${Math.round(base*mid.risk)}`};
  }else{
    const mid={...st,id:st.id+"-middle",name:st.name+" · halfway",
      mult:(st.mult+off.mult)/2,risk:(st.risk+off.risk)/2,
      perk:off.perk||st.perk,grudge:off.grudge||st.grudge};
    compromise={stake:mid,label:"Meet halfway",
      sub:`Win $${M(mid.mult)} · lose $${Math.round(base*mid.risk)}${mid.perk==="drink"?" · drink owed":""}`};
  }
  return{...chosen,original:st,compromise};
}

// ---- the watcher's effect ---------------------------------------------------
function watcherFor(room,streak,cold,defending){
  if(cold)return{label:"THE ROOM FEELS EMPTY",level:0,stats:{touch:-2,eye:-2},
    text:"The streak broke. Your timing is off for this matchup.",name:null};
  const w=room&&room.watcher?room.people.find(p=>p.id===room.watcher):null;
  if(!w||!room.watcherLevel)return{label:"NOBODY IN PARTICULAR",level:0,stats:{},
    text:"The room is busy with itself. Give somebody a reason to look up.",name:null};
  const level=room.watcherLevel, scale=defending?0.5:1;
  const n=Math.round(level*1.4*scale);
  const first=(w.short||w.name);
  return{level,name:w.name,
    label:defending?`${first.toUpperCase()} STAYED FOR THE SERIES`:level>=4?`${first.toUpperCase()} HAS NOT MOVED`:`${first.toUpperCase()} IS WATCHING`,
    stats:{stroke:n,touch:n,eye:Math.ceil(n/2)},
    text:defending?"Less locked in after that, but they have not left."
      :level>=4?"They stopped drinking about an hour ago. They are just watching now."
      :"Somebody specific is following this, and you can feel it in your stroke."};
}

// ---- flavour ---------------------------------------------------------------
function challengerIntro(p,room,streak){
  const first=(p.short||p.name);
  const known=p.record.w+p.record.l;
  if(p.rival&&p.adapted==="counter")return`${p.name} has been away, and they did not spend it drinking. Whatever worked on them last time is not going to work twice.`;
  if(p.rival&&p.adapted==="imitate")return`${p.name} is back and playing your game at you. Badly, at first. Not any more.`;
  if(p.rival)return`${p.name} is back. You are ${p.record.w}–${p.record.l} against them and they have counted it more carefully than you have.`;
  if(p.wasCalledOut){p.wasCalledOut=false;return`You told ${first} to stop talking and put quarters up. They did.`;}
  if((p.chalkRespect||0)>0)return`${first} held your chalk through the end of a rack and returned it without another word. Now they want the table.`;
  if(p.studied&&p.watched>=5)return`${first} has watched ${p.watched} of your racks from that stool without once putting a coin down. Tonight they did.`;
  if(p.heardStreak)return`${first} came in off the street because somebody outside said there was a run going on in here.`;
  if(known)return`You have played ${first} before — ${p.record.w}–${p.record.l}. They remember which.`;
  if(p.watched>=2)return`${first} has been here a while, watching more than playing.`;
  if(p.arrived>=room.gameNo-1)return`${first} just walked in and went straight to the rail.`;
  const tenure=room.gameNo-(p.firstSeen||0);
  if(tenure>=14)return`${first} was already in here when you took the table ${tenure} racks ago, and has not gone home yet.`;
  return`${first} has been waiting for the table since about the time you took it.`;
}

const kingSheet=id=>{const c=charOf(id);return `POW ${c.pow} · STR ${c.stroke} · TCH ${c.touch} · ENG ${c.english} · CRV ${c.curve} · EYE ${c.eye}`;};
const KING_START_BANK=60;
let favourSeq=0;
function freshKing(){
  const room=roomInit();
  const pool=roomPool(room,0);
  return{
    streak:0,
    bank:KING_START_BANK,
    buzz:0,
    room,
    pool,
    challenge:pool[0],
    table:"regulation",
    mode:"eight",          // the king picks the game; a lost rack hands it over
    modeTheirs:false,
    partner:null,
    doubles:false,
    cold:0,
    phase:"pick",          // pick -> prep -> stakes -> play
    scouted:false,
    warmed:false,
    watcherBump:false,
    prepTaken:null,
    stake:null,
    series:null,
    decision:null,
    playerStyle:null,
    best:{streak:0,bank:KING_START_BANK},
    night:1,
    beat:null,
    freeScout:false,
    perks:{drink:0,cue:0,intel:0,quiet:0,word:0,partnerCall:null},
    owedFavours:[],
    counter:null,
    spotRack:0,
    over:null,          // the night ended — see the Last Call card
    nights:[],          // every night you have played in this bar
    last:"The house fronts you $60. There are already people in here who will still be here in an hour.",
  };
}
// A NIGHT ENDS. Before protection, one loss is enough; protected runs end after
// a full matchup loss. Either way the room gets a last page instead of looping.
function nightSummary(king,beatenBy){
  const room=king.room;
  const nick=roomName(room,room.profile,king.best.streak,king.buzz);
  const top=room.rumors.slice().sort((a,b)=>b.tier-a.tier)[0];
  const rivals=room.people.filter(p=>p.rival);
  const oldest=present(room).slice().sort((a,b)=>(a.firstSeen||0)-(b.firstSeen||0))[0];
  return{
    night:king.night,
    streak:king.best.streak,
    bank:king.bank,
    beatenBy:beatenBy?beatenBy.name:null,
    nickname:nick,
    legend:top?`They still say you ${rumorText(top)}.`:null,
    rivals:rivals.map(p=>p.name),
    regular:oldest?oldest.name:null,
    racks:room.gameNo,
    opinion:opinionOf(room.profile,king.best.streak,king.buzz).label,
  };
}
// A new night in the SAME bar. The people who were here are still here — some
// of them have been waiting for you since last time.
function nextNight(king){
  const old=king.room;
  const room=roomInit();
  // carry a few faces forward, rivals first, with everything they learned
  const debts=(king.owedFavours||[]).map(f=>f.partner).filter(Boolean);
  const carry=[...old.people.filter(p=>p.rival||p.regular||p.watched>=6),...debts]
    .filter((p,i,a)=>a.findIndex(x=>x.id===p.id)===i)
    .sort((a,b)=>(b.rival?1:0)-(a.rival?1:0)).slice(0,7);
  for(const p of carry){
    p.status="present"; p.arrived=0; p.firstSeen=0; p.isWatcher=false;
    p.lastNight=king.night;
    room.people.push(p);
  }
  room.profile={...old.profile};
  if(carry.length)roomSay(room,`${carry[0].name} is already here. They were here last night too.`);
  const summary=nightSummary(king,null);
  return{...freshKing(),
    room,
    pool:roomPool(room,0),
    night:king.night+1,
    nights:[...king.nights,summary],
    owedFavours:[...(king.owedFavours||[])],
    bank:KING_START_BANK,
    last:carry.length
      ? `A new night. ${carry.length} face${carry.length>1?"s":""} from last time ${carry.length>1?"are":"is"} already in here.`
      : "A new night, and a room that has mostly turned over.",
  };
}
// One rack's worth of what the room saw, folded into the run-long read.
function foldProfile(profile,o){
  if(!o)return profile;
  return{spin:profile.spin+o.spin,aggro:profile.aggro+o.aggro,safe:profile.safe+o.safe,
    flash:profile.flash+o.flash,buzz:profile.buzz+o.buzz,n:profile.n+1};
}

// Screen router plus every setting the match needs. App owns navigation,
// setup choices, and campaign persistence. Game owns one live rack and reports
// a compact result back to App when that rack ends.
function App(){
  const [screen,setScreen]=useState("home");
  const [tid,setTid]=useState("regulation");
  const [cloth,setCloth]=useState("oxblood");
  const [count,setCount]=useState(2);
  const [mode,setMode]=useState("eight");
  const [opts,setOpts]=useState({balls:true,specials:true,bar:true});
  const [powerSet,setPowerSet]=useState("haunted");
  const [drop,setDrop]=useState(null);
  const [king,setKing]=useState(freshKing);
  // Bumping kingKey guarantees a brand-new Game instance for every campaign
  // rack, including a rematch played on the same table against the same person.
  const [kingKey,setKingKey]=useState(0);
  const [seats,setSeats]=useState(()=>CHAR_IDS.slice(0,4).map((c,i)=>
    ({kind:i===0?"human":"cpu",char:c,rating:450,team:i%2?2:1})));
  useEffect(()=>{const f=()=>setDrop(null);window.addEventListener("click",f);return()=>window.removeEventListener("click",f);},[]);
  useEffect(()=>{const ok=modesFor(count); if(!ok.includes(mode))setMode(ok[0]);},[count]);

  const upd=(i,p)=>setSeats(s=>s.map((x,j)=>j===i?{...x,...p}:x));

  // ---- King of the Table: the night's state machine ------------------------
  // pick a challenger -> prepare for THAT person -> agree a stake -> play.
  const KING_MODES=["eight","cutthroat"];
  const chooseKing=q=>setKing(k=>{
    let picked=q;
    const perks={...(k.perks||{})};
    // A former partner who promised to be ready comes back as an actual partner,
    // by name, the next time you accept a doubles offer.
    if(q.team&&perks.partnerCall&&perks.partnerCall.partner){
      const old=perks.partnerCall.partner;
      const returning={...old,rating:Math.max(old.rating,q.rating-25),
        skill:Math.max(old.skill,skillOf(Math.max(old.rating,q.rating-25)))};
      picked={...q,partners:[returning,...(q.partners||[])]};
      perks.partnerCall=null;
    }
    const prep=CHARS[picked.char];
    return{...k,perks,challenge:picked,
      partner:(picked.partners&&picked.partners[0])||null,
      doubles:false,decision:null,series:null,
      phase:"prep",scouted:!!k.freeScout||((k.perks&&k.perks.intel)>0),freeScout:false,warmed:false,watcherBump:false,prepTaken:null,stake:null,
      modeTheirs:false,
      intro:challengerIntro(q,k.room,k.streak)};
  });
  const takePrep=card=>setKing(k=>({...card.apply(k),prepTaken:card.id,phase:"stakes"}));
  const takeStake=st=>setKing(k=>{
    const vouched=(k.perks&&k.perks.word)>0;
    const c=vouched?null:counterOffer(k,k.challenge,st,k.room);
    const perks=vouched?{...k.perks,word:Math.max(0,k.perks.word-1)}:k.perks;
    return c?{...k,perks,stake:st,counter:c,phase:"counter"}:{...k,perks,stake:st,counter:null,phase:"play",
      last:vouched?`Somebody put in a word. ${k.challenge.short||k.challenge.name} accepted immediately.`
        :`${k.challenge.short||k.challenge.name} accepted ${st.name.toLowerCase()} without an argument.`};
  });
  // Accepting a counter can hand you perks and a series handicap.
  const acceptCounter=()=>setKing(k=>{
    const st=k.counter.stake;
    const perks={...(k.perks||{})};
    if(st.perk==="drink")perks.drink=(perks.drink||0)+1;
    if(st.perk==="cue")perks.cue=3;
    if(st.perk==="intel")perks.intel=3;
    return{...k,stake:st,counter:null,perks,spotRack:st.spot||0,
      mode:st.agreedMode||k.mode,modeTheirs:!!st.agreedMode,phase:"play",
      last:`You and ${k.challenge.short||k.challenge.name} shook on ${st.name.toLowerCase()}.`};
  });
  const compromiseCounter=()=>setKing(k=>{
    const st=k.counter.compromise.stake;
    const perks={...(k.perks||{})};
    if(st.perk==="drink")perks.drink=(perks.drink||0)+1;
    if(st.perk==="cue")perks.cue=3;
    if(st.perk==="intel")perks.intel=3;
    return{...k,stake:st,counter:null,perks,spotRack:st.spot||0,
      mode:st.agreedMode||k.mode,modeTheirs:!!st.agreedMode,phase:"play",
      last:`You and ${k.challenge.short||k.challenge.name} met halfway.`};
  });
  const refuseCounter=()=>setKing(k=>({...k,counter:null,phase:"play",
    last:`You refused the counter. ${k.challenge.short||k.challenge.name} accepted your original terms.`}));

  // Choosing a rematch starts a fresh negotiation. The score carries; the old
  // stake does not silently carry with it.
  const beginRematchNegotiation=()=>setKing(k=>({...k,
    rematchPending:k.decision,decision:null,counter:null,stake:null,phase:"stakes",
    last:k.decision&&k.decision.forced
      ?`Your streak earned another rack against ${k.challenge.short||k.challenge.name}. The old deal is over — put fresh terms on the defence.`
      :`${k.challenge.short||k.challenge.name} wants another rack. Put new terms on it.`}));

  const launchKing=rematch=>{
    setKing(k=>({
      ...k,
      decision:null,
      rematchPending:null,
      series:k.series
        ? {...k.series,rematch:!!rematch}
        : {target:2,us:0,them:k.spotRack||0,rematch:!!rematch||!!k.spotRack},
      spotRack:0,
    }));
    setKingKey(k=>k+1);
    setScreen("kingGame");
  };

  // Everything that happens to the room between matchups lives here so the
  // population, the rumours and the watcher all move on the same clock.
  const rollRoom=(k,won,r)=>{
    const room=k.room;
    const q=k.challenge;
    const person=room.people.find(p=>p.id===q.id);
    const observed=r&&r.observed;
    const profile=foldProfile(room.profile,observed);
    if(person){
      if(won)person.record.l++; else person.record.w++;
      // A RIVAL IS MADE, NOT SPAWNED. Beating somebody badly, taking real money
      // off them, or reverse-sweeping them is what turns a name into a person
      // who is going to come back for you.
      let g=0;
      if(won)g+=1;
      if(won&&r&&r.runBest>=4)g+=2;
      if(won&&k.stake&&k.stake.mult>=2.4)g+=2;
      if(won&&k.series&&k.series.them===1&&k.series.us===2)g+=2;
      if(k.stake&&k.stake.grudge)g+=1;
      person.grudge+=g;
      if(person.grudge>=3&&!person.rival){
        person.rival=true;
        roomSay(room,`${person.name} did not shake your hand. That is somebody you will see again.`);
      }
    }
    const notable=(r&&r.notable)||[];
    if(k.stake&&k.stake.loud)notable.push("bigbet");
    const playerStyle=playerStyleOf(profile);
    roomTick(room,won?k.streak+1:0,{observed,notable,won,profile,playerStyle,buzz:k.buzz});
    room.profile=profile;
    return room;
  };

  const advanceKing=won=>setKing(k=>{
    const streak=won?k.streak+1:0;
    const bonus=won?3+Math.round(k.challenge.rating/180):0;
    const cold=won?Math.max(0,k.cold-1):(k.streak>=2?1:0);
    const room=rollRoom(k,won,k.lastObs||null);
    const pool=roomPool(room,streak,!!k.doubles);
    const perks={...k.perks,quiet:Math.max(0,(k.perks.quiet||0)-1)};
    return{
      ...k,room,perks,
      bank:k.bank+bonus,
      streak,cold,pool,
      challenge:pool[0],
      partner:null,doubles:false,series:null,decision:null,lastObs:null,
      phase:"pick",scouted:false,warmed:false,stake:null,prepTaken:null,modeTheirs:false,
      best:{streak:Math.max(k.best.streak,streak),bank:Math.max(k.best.bank,k.bank+bonus)},
      intro:null,beat:nightBeat(room,k),
      last:won?`Win banked · +$${bonus}. ${pool.length} player${pool.length>1?"s have":" has"} quarters down.`:
        "The streak broke. The bank stays; the room will feel a little empty for one matchup.",
    };
  });

  const onKingResult=r=>setKing(k=>{
    const s=k.series||{target:2,us:0,them:0,rematch:false};
    const us=s.us+(r.humanWin?1:0);
    const them=s.them+(r.humanWin?0:1);
    const stake=k.stake||{mult:1,risk:0};
    const crowdMul=kingCrowdMul(k.room);
    const rackPay=r.humanWin
      ? Math.round(kingStakeBase(k.challenge,k.streak)*crowdMul*stake.mult)
      : -Math.round((10+k.streak)*stake.risk);
    const bank=Math.max(0,k.bank+rackPay);
    // 45% carries, and never less than fifteen points of relief.
    const buzz=Math.max(0,Math.min(r.buzz*0.45,r.buzz-15));
    const chalkHolder=k.room.people.find(p=>p.chalkHeld);
    if(chalkHolder){
      chalkHolder.chalkHeld=false;
      if(r.humanWin){
        chalkHolder.chalkRespect=(chalkHolder.chalkRespect||0)+1;
        roomSay(k.room,`${chalkHolder.name} brings your chalk back. They stopped heckling a while ago.`);
      }else roomSay(k.room,`${chalkHolder.name} sets your chalk beside the new king's cue.`);
    }
    let owedFavours=[...(k.owedFavours||[])];
    let favourEarned=!!s.favourEarned, favourNote="";
    const ally=k.doubles&&k.partner;
    const notable=r.notable||[];
    const clutch=r.humanWin&&ally&&(r.runBest>=2||(s.us+s.them>0&&s.us<=s.them)
      ||notable.some(x=>["bank","longpot","runout","comeback"].includes(x)));
    if(clutch&&!favourEarned&&!owedFavours.some(f=>f.whoId===ally.id)
      &&chance(r.runBest>=4?0.70:0.35)){
      const reason=r.runBest>=4?`you ran ${r.runBest} while they watched`
        :(s.us+s.them>0&&s.us<=s.them)?"you pulled the side out from behind"
        :notable.includes("bank")?"you made the bank that saved the rack"
        :"you closed the rack when it tightened up";
      owedFavours.push({id:`owed_${++favourSeq}`,whoId:ally.id,name:ally.name,
        partner:{...ally},earnedAt:k.room.gameNo,reason});
      favourEarned=true;
      favourNote=` ${ally.name} says they owe you one.`;
    }
    const done=us>=2||them>=2;
    // Before five wins there is no safety net. A first-rack loss hands over the
    // table and ends the night immediately; rematch protection is something a
    // run earns at five, not an option available from the opening matchup.
    const earlyLoss=!r.humanWin&&us===0&&them===1&&k.streak<5;
    if(earlyLoss){
      const room2=rollRoom(k,false,r);
      const beaten=room2.people.find(p=>p.id===k.challenge.id);
      roomSay(room2,`${k.challenge.name} took the table 1–0 before your streak had protection. That is the night.`);
      setTimeout(()=>setScreen("king"),1800);
      return{...k,room:room2,bank,buzz,series:null,decision:null,lastObs:null,phase:"done",
        over:nightSummary({...k,room:room2,bank},beaten),
        last:`${k.challenge.name} beat you 1–0. You needed five straight to earn a rematch on a loss.`};
    }
    if(!done){
      const forced=!r.humanWin&&us===0&&them===1&&k.streak>=5;
      // THE KING SETS THE RULES. Drop a rack and the challenger names the game
      // until you take one back off them.
      const theirs=them>us;
      const newMode=theirs&&!k.modeTheirs
        ? KING_MODES[Math.floor(Math.random()*KING_MODES.length)]
        : (!theirs?"eight":k.mode);
      setTimeout(()=>setScreen("king"),1800);
      return{
        ...k,bank,buzz,
        mode:theirs?newMode:"eight",
        modeTheirs:theirs,
        owedFavours,
        series:{target:2,us,them,rematch:s.rematch,protected:s.protected||forced,favourEarned},
        decision:{lastWon:r.humanWin,racks:us+them,forced},
        // the room saw this rack even if the matchup ends here by choice
        lastObs:{observed:r.observed,notable:r.notable,runBest:r.runBest},
        last:forced?
          `First loss after ${k.streak} straight. House rule: your streak gets a best-of-three defence.`
          :theirs?`Rack ${us+them}: lost · ${rackPay<0?`-$${-rackPay}`:`+$${rackPay}`} · ${modeCall(k.challenge,theirs?newMode:"eight")}`
          :`Rack ${us+them}: ${r.humanWin?"won":"lost"} · ${rackPay<0?`-$${-rackPay}`:`+$${rackPay}`} · matchup ${us}–${them}${favourNote}`,
      };
    }
    const won=us>them;
    const perks={...(k.perks||{})};
    if(won&&stake.perk==="drink")perks.drink=(perks.drink||0)+1;
    if(won&&stake.perk==="cue")perks.cue=3;
    if(won&&stake.perk==="intel")perks.intel=3;
    // TWO RACKS DOWN AND YOU ARE OFF THE TABLE. The night is the run; this is
    // where it gets its last page.
    if(!won){
      const room2=rollRoom(k,false,r);
      const beaten=room2.people.find(p=>p.id===k.challenge.id);
      roomSay(room2,`${k.challenge.name} took the table off you ${them}–${us}. That is the night.`);
      setTimeout(()=>setScreen("king"),1800);
      return{...k,room:room2,bank,buzz,series:null,decision:null,lastObs:null,phase:"done",
        over:nightSummary({...k,room:room2,bank},beaten),
        last:`${k.challenge.name} beat you ${them}–${us}. The table is theirs and the night is over.`};
    }
    const bonus=won?Math.round((8+Math.round(k.challenge.rating/100))*crowdMul*stake.mult):0;
    const streak=won?k.streak+1:0;
    const cold=won?Math.max(0,k.cold-1):(k.streak>=2?1:0);
    const room=rollRoom(k,won,r);
    if(k.watcherBump&&won)room.watcherLevel=Math.min(5,room.watcherLevel+1);
    const pool=roomPool(room,streak,!!k.doubles);
    const nextPerks={...perks,quiet:Math.max(0,(perks.quiet||0)-1)};
    setTimeout(()=>setScreen("king"),1800);
    return{
      ...k,room,owedFavours,perks:{...nextPerks,cue:Math.max(0,(nextPerks.cue||0)-1),intel:Math.max(0,(nextPerks.intel||0)-1)},
      bank:Math.max(0,bank+bonus),
      buzz,streak,cold,pool,
      partner:null,doubles:false,series:null,decision:null,lastObs:null,
      phase:"pick",scouted:false,warmed:false,stake:null,prepTaken:null,
      mode:"eight",modeTheirs:false,intro:null,beat:nightBeat(room,{...k,owedFavours,perks:nextPerks}),
      best:{streak:Math.max(k.best.streak,streak),bank:Math.max(k.best.bank,bank+bonus)},
      last:won?`Matchup won ${us}–${them} · +$${Math.max(0,rackPay)+bonus}. Somebody else stepped up.${favourNote}`
              :`Matchup lost ${us}–${them}. The bank is safe; the streak resets.`,
      challenge:pool[0],
    };
  });

  function Select({id,value,options,onPick,width}){
    const open=drop===id, cur=options.find(o=>o.v===value)||options[0];
    return(<span style={{position:"relative",display:"inline-block",width:width||130,maxWidth:"100%"}}>
      <button onClick={e=>{e.stopPropagation();setDrop(open?null:id);}}
        aria-haspopup="listbox" aria-expanded={open}
        style={{...btn,padding:"8px 10px",width:"100%",display:"flex",alignItems:"center",gap:7,textAlign:"left",background:C.panel2}}>
        {cur&&cur.dot&&<span style={{width:8,height:8,borderRadius:8,background:cur.dot,flexShrink:0}}/>}
        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12.5}}>{cur&&cur.label}</span>
        <span style={{color:C.muted,fontSize:9}}>▾</span></button>
      {open&&<div className="thin" role="listbox" onClick={e=>e.stopPropagation()} style={{position:"absolute",top:"calc(100% + 5px)",left:0,zIndex:50,
        width:Math.max(width||130,190),maxWidth:"calc(100vw - 24px)",maxHeight:250,overflowY:"auto",...panel,padding:5,boxShadow:"0 16px 40px rgba(0,0,0,.6)"}}>
        {options.map(o=><button key={String(o.v)} role="option" aria-selected={o.v===value} onClick={()=>{onPick(o.v);setDrop(null);}}
          style={{display:"flex",gap:8,alignItems:"center",width:"100%",padding:"7px 8px",borderRadius:7,border:"none",
            background:o.v===value?C.line:"transparent",color:C.ink,cursor:"pointer",textAlign:"left"}}>
          {o.dot&&<span style={{width:8,height:8,borderRadius:8,background:o.dot,flexShrink:0}}/>}
          <span style={{minWidth:0,flex:1}}>
            <span style={{display:"block",fontSize:12.5,fontWeight:500,whiteSpace:"nowrap"}}>{o.label}</span>
            {o.sub&&<span style={{display:"block",fontFamily:F.mono,fontSize:9.5,color:C.muted,whiteSpace:"nowrap",
              overflow:"hidden",textOverflow:"ellipsis"}}>{o.sub}</span>}</span></button>)}
      </div>}</span>);}

  const ClothPicker=()=>(<div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
    {CLOTH_IDS.map(k=>{const on=cloth===k,cl=CLOTHS[k];
      const sw=SKIN_IMAGES[cl.kind]?`url("${SKIN_IMAGES[cl.kind]}") center / cover`
        :cl.kind==="solid"?cl.base
        :cl.kind==="heat"?"radial-gradient(circle at 38% 40%,#fff3b0,#ff9a1f 25%,#e03346 48%,#652688 72%,#080c26)"
        :cl.kind==="leopard"?"radial-gradient(ellipse at 28% 35%,#1c100c 0 20%,#c56b16 22% 37%,#1c100c 39% 55%,transparent 57%),radial-gradient(ellipse at 78% 72%,#1c100c 0 23%,transparent 25%),#c56b16"
        :cl.kind==="zebra"?"repeating-linear-gradient(102deg,#171615 0 5px,#e8e4da 6px 11px,#171615 12px 15px,#e8e4da 16px 22px)"
        :cl.kind==="tiger"?"repeating-linear-gradient(96deg,#170e0a 0 3px,#b95a13 4px 9px,#e39128 10px 12px,#b95a13 13px 17px)"
        :cl.base;
      return(<button key={k} onClick={()=>setCloth(k)} title={cl.name} aria-label={`${cl.name} cloth`} aria-pressed={on}
        style={{width:26,height:26,borderRadius:7,padding:0,cursor:"pointer",background:sw,
          border:on?`2px solid ${C.accent}`:`1px solid ${C.line}`,boxShadow:on?"0 0 0 3px rgba(127,166,196,.14)":"none"}}/>);})}
    <span style={{...label,marginLeft:4}}>{CLOTHS[cloth].name}</span></div>);

  // ---- HOME ---------------------------------------------------------------
  if(screen==="home")return(<Shell>
    <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:30,padding:"6vh 0"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:F.display,fontWeight:700,fontSize:"clamp(52px,13vw,88px)",letterSpacing:-2.5,lineHeight:1}}>Chalk</div>
        <div style={{...label,marginTop:12,letterSpacing:4}}>Run the table</div></div>
      <div style={{width:"min(320px,100%)",display:"grid",gap:9}}>
        <button onClick={()=>setScreen("table")} style={{...btnPrimary,padding:"16px",fontSize:15}}>Play</button>
        <button onClick={()=>setScreen("lab")} style={{...btn,padding:"13px",borderColor:C.accentDim}}>Effect Lab</button>
        <button onClick={()=>setScreen("rules")} style={{...btn,padding:"13px"}}>How to play</button>
        <button disabled style={{...btn,padding:"13px",opacity:.35,cursor:"default"}}>Online</button>
      </div></div></Shell>);

  if(screen==="lab")return <EffectLab onBack={()=>setScreen("home")} cloth={cloth}/>;

  if(screen==="king"){
    const q=king.challenge,room=king.room;
    const tier=BOTS.reduce((a,b)=>Math.abs(b.rating-q.rating)<Math.abs(a.rating-q.rating)?b:a,BOTS[0]);
    const s=king.series||{us:0,them:0},deciding=s.us===1&&s.them===1;
    const watcher=watcherFor(room,king.streak,king.cold,!!(king.series&&king.series.protected));
    const crowdMul=kingCrowdMul(room);
    const rackPay=Math.round(kingStakeBase(q,king.streak)*crowdMul);
    const opinion=opinionOf(room.profile,king.streak,king.buzz);
    const prep=preparation(q,room.profile);
    const qStyle=AI_STYLES[q.style]||AI_STYLES.aggressive;
    const here=present(room);
    const phase=king.phase||"pick";
    const inMatchup=!!(king.series||king.decision);
    const Card=({children,accent,pad})=><div style={{...panel,padding:pad||"11px 13px",marginBottom:9,
      borderColor:accent||C.line}}>{children}</div>;
    const Lab=({children,c})=><div style={{...label,fontSize:8.5,color:c||C.muted,marginBottom:6}}>{children}</div>;

    const nick=roomName(room,room.profile,king.best.streak,king.buzz);
    if(king.over){
      const o=king.over;
      return(<Shell wide><Head onBack={()=>setScreen("setup")} title={`Night ${o.night} · last call`}/>
        <div style={{...panel,padding:"22px 24px",borderColor:"rgba(201,138,75,.42)",maxWidth:720,margin:"0 auto"}}>
          <div style={{...label,color:C.warn,fontSize:9}}>THE TABLE IS SOMEBODY ELSE'S</div>
          <h2 style={{fontFamily:F.display,fontSize:"clamp(22px,4vw,32px)",margin:"6px 0 4px"}}>
            {o.nickname?`They were calling you ${o.nickname}.`:"Nobody ever settled on a name for you."}</h2>
          <div style={{fontSize:13,color:C.ink2,lineHeight:1.6,marginTop:8}}>
            {o.beatenBy?`${o.beatenBy} took it off you.`:"You walked away from it."} You held the table for {o.streak} straight
            across {o.racks} racks, and the room decided you were {o.opinion.toLowerCase()}.
          </div>
          {o.legend&&<div style={{fontSize:13,color:"#c9a0d8",lineHeight:1.6,marginTop:8}}>{o.legend}</div>}
          {o.rivals.length>0&&<div style={{fontSize:12.5,color:C.ink2,lineHeight:1.6,marginTop:8}}>
            You made enemies of {o.rivals.slice(0,3).join(", ")}{o.rivals.length>3?` and ${o.rivals.length-3} more`:""}. They will be here tomorrow.</div>}
          {o.regular&&<div style={{fontSize:12.5,color:C.muted,lineHeight:1.6,marginTop:8}}>
            {o.regular} never got up off that stool all night.</div>}
          <div className="king-metrics" style={{marginTop:16}}>
            {[["BEST STREAK",o.streak,"#efc486"],["WALKED WITH",`$${o.bank}`,C.good],
              ["RACKS PLAYED",o.racks,C.accent],["NIGHT",o.night,"#9fb6cf"]].map(([kk,v,c])=>
              <div key={kk} style={{...panel,padding:"8px 11px"}}>
                <div style={{...label,fontSize:8}}>{kk}</div>
                <div style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:c,marginTop:1}}>{v}</div></div>)}
          </div>
          {king.nights.length>0&&<div style={{marginTop:14}}>
            <div style={{...label,fontSize:8.5,marginBottom:6}}>EARLIER NIGHTS IN HERE</div>
            {king.nights.slice().reverse().slice(0,5).map((n,i)=><div key={i}
              style={{fontFamily:F.mono,fontSize:10,color:C.muted,marginBottom:2}}>
              NIGHT {n.night} · {n.streak} STRAIGHT · ${n.bank}{n.nickname?` · “${n.nickname}”`:""}</div>)}
          </div>}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:18}}>
            <button onClick={()=>setKing(k=>nextNight(k))} style={btnPrimary}>Come back tomorrow night</button>
            <button onClick={()=>{setKing(freshKing());}} style={{...btnGhost,padding:"8px 12px"}}>Find another bar</button>
          </div>
        </div>
      </Shell>);
    }
    // The back arrow used to drop you out of the whole campaign. Mid-matchup it
    // now walks you back a step — wrong person picked is a one-tap fix.
    const backStep=()=>{
      if(phase==="counter")return setKing(k=>({...k,phase:"stakes",counter:null}));
      if(phase==="stakes"&&king.rematchPending)return setKing(k=>({...k,
        decision:k.rematchPending,rematchPending:null,phase:"play",stake:null,counter:null}));
      if(inMatchup)return setScreen("setup");
      if(phase==="play")return setKing(k=>({...k,phase:"stakes",counter:null}));
      if(phase==="stakes")return setKing(k=>({...k,phase:"prep"}));
      if(phase==="prep")return setKing(k=>({...k,phase:"pick",intro:null,scouted:false,
        warmed:false,prepTaken:null,stake:null}));
      setScreen("setup");
    };
    return(<Shell wide><Head onBack={backStep} title={`King of the Table · night ${king.night}`}/>
      <div className="king-metrics">
        {[["WIN STREAK",king.streak,"#efc486",
            king.decision&&king.decision.lastWon?"+1 WHEN YOU BANK IT":king.series?`MATCHUP ${s.us}–${s.them}`:null],
          ["BANK",`$${king.bank}`,C.good,null],
          ["BUZZ",Math.round(king.buzz),king.buzz>=85?C.warn:C.accent,null],
          ["PLAYERS IN",here.length,"#9fb6cf",`+${Math.round(5+room.crowd/7)} NOT PLAYING`]].map(([kk,v,c,note])=><div key={kk} style={{...panel,padding:"8px 11px"}}>
          <div style={{...label,fontSize:8}}>{kk}</div>
          <div style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:c,marginTop:1}}>{v}</div>
          {note&&<div style={{fontFamily:F.mono,fontSize:7.5,color:C.warn,marginTop:1}}>{note}</div>}</div>)}
      </div>
      {king.last&&<div role="status" aria-live="polite" style={{padding:"8px 11px",borderRadius:9,
        background:"rgba(106,168,138,.09)",border:`1px solid ${C.line}`,fontSize:12,color:C.ink2,marginBottom:9}}>{king.last}</div>}

      {/* NEXT STEP. There is always exactly one thing the game is waiting for,
          and it now says so at the top with the button attached, instead of
          hiding the only live control somewhere down the card. */}
      {(()=>{
        const step=
          king.decision&&king.decision.forced?{t:`${(q.short||q.name)} took that rack. Your five-win protection earned a rematch — renegotiate before you defend the streak.`,
            b:[{l:"Renegotiate the defence",f:beginRematchNegotiation,p:1}]}
        :king.decision&&deciding?{t:"One each. The next rack decides the matchup.",
            b:[{l:"Play the deciding rack",f:()=>launchKing(true),p:1}]}
        :king.decision&&king.decision.lastWon?{t:`You won that rack ${s.us}–${s.them}. Bank it and your streak goes to ${king.streak+1}, or play them again for the bigger purse.`,
            b:[{l:`Bank it · streak ${king.streak+1}`,f:()=>advanceKing(true),p:1},
               {l:"Negotiate a rematch · race to 2",f:beginRematchNegotiation}]}
        :king.decision?{t:"That loss ends the night. The table belongs to them.",b:[]}
        :phase==="pick"?{t:king.pool.length>1?`${king.pool.length} people have put quarters down. Pick who you are playing.`:"One person stepped up. Take the match.",
            b:[{l:`Play ${(q.short||q.name)}`,f:()=>chooseKing(q),p:1}]}
        :phase==="prep"?{t:`You are on ${q.name}. Take one thing before you play them.`,
            b:[{l:"Skip preparation",f:()=>setKing(k=>({...k,phase:"stakes"}))}]}
        :phase==="stakes"?{t:"Agree what is on the match. Not all of it has to be money.",
            b:[{l:"Play it straight",f:()=>takeStake(stakeOptions(king,q,room)[0]),p:1}]}
        :phase==="counter"&&king.counter?{t:king.counter.line,
            b:[{l:`Shake on it · ${king.counter.name}`,f:acceptCounter,p:1},
               {l:king.counter.compromise.label,f:compromiseCounter},
               {l:"Refuse",f:refuseCounter}]}
        :{t:`Everything is agreed. ${q.name} is waiting on the table.`,
            b:[{l:king.streak>=15?"Play the series · best of 3":`Play ${MODES[king.mode||"eight"].name}`,
                f:()=>launchKing(king.streak>=15||!!king.rematchPending),p:1},
               {l:"Change the bet",f:()=>setKing(k=>({...k,phase:"stakes"}))}]};
        return(<div style={{...panel,padding:"10px 12px",marginBottom:9,borderColor:"rgba(201,138,75,.5)",
          background:"rgba(201,138,75,.07)",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{...label,fontSize:8,color:C.warn}}>NEXT</span>
          <span style={{fontSize:12.5,color:C.ink,flex:"1 1 280px",lineHeight:1.4}}>{step.t}</span>
          {step.b.map((x,i)=><button key={i} onClick={x.f}
            style={x.p?{...btnPrimary,padding:"7px 13px"}:{...btn,padding:"7px 11px",fontSize:11.5}}>{x.l}</button>)}
        </div>);})()}

      {/* ---- THE ROOM: crowd, the one who is watching, and what is going round */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:9,marginBottom:9}}>
        <div style={{...panel,padding:"11px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"baseline"}}>
            <span style={{...label,fontSize:9,color:room.crowd>55?"#efc486":C.muted}}>{opinion.label}</span>
            <span style={{fontFamily:F.mono,fontSize:9,color:C.muted}}>CROWD {Math.round(room.crowd)}%</span></div>
          <div style={{height:5,borderRadius:4,background:C.line,marginTop:7,overflow:"hidden"}}>
            <span style={{display:"block",height:"100%",width:`${Math.round(room.crowd)}%`,background:"#e0a45f"}}/></div>
          <div style={{fontSize:11,color:C.muted,marginTop:6,lineHeight:1.45}}>{opinion.line}</div>
          {nick&&<div style={{fontSize:11.5,color:"#efc486",marginTop:5,lineHeight:1.45}}>
            They have started calling you <b>{nick}</b>.</div>}
          <div style={{fontFamily:F.mono,fontSize:8.5,color:C.good,marginTop:6}}>PURSE ×{crowdMul.toFixed(2)}</div>
        </div>
        <div style={{...panel,padding:"11px 13px",borderColor:watcher.level?"rgba(215,127,153,.45)":C.line}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"baseline"}}>
            <span style={{...label,fontSize:9,color:watcher.level?"#f1a4b8":C.muted}}>{watcher.label}</span>
            <span style={{fontFamily:F.mono,fontSize:9,color:C.muted}}>LEVEL {watcher.level}</span></div>
          <div style={{height:5,borderRadius:4,background:C.line,marginTop:7,overflow:"hidden"}}>
            <span style={{display:"block",height:"100%",width:`${watcher.level*20}%`,background:"#d77f99"}}/></div>
          <div style={{fontSize:11,color:C.muted,marginTop:6,lineHeight:1.45}}>{watcher.text}</div>
        </div>
      </div>

      {(room.rumors.length>0||room.feed.length>0)&&<div style={{display:"grid",
        gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:9,marginBottom:9}}>
        {room.rumors.length>0&&<div style={{...panel,padding:"11px 13px"}}>
          <Lab c="#c9a0d8">WHAT PEOPLE ARE SAYING YOU DID</Lab>
          {room.rumors.slice(0,4).map(r=><div key={r.id} style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginBottom:3}}>
            <span style={{color:r.tier>=2?"#c9a0d8":C.muted,fontFamily:F.mono,fontSize:8}}>{"·".repeat(r.tier+1)} </span>
            You {rumorText(r)}.</div>)}
        </div>}
        {room.feed.length>0&&<div style={{...panel,padding:"11px 13px"}}>
          <Lab>THE ROOM</Lab>
          {room.feed.slice(0,4).map((f,i)=><div key={i} style={{fontSize:11.5,color:i?C.muted:C.ink2,lineHeight:1.5,marginBottom:3}}>{f}</div>)}
        </div>}
      </div>}

      {/* ---- what you are carrying -------------------------------------------- */}
      {king.perks&&(king.perks.drink>0||king.perks.cue>0||king.perks.intel>0||king.perks.quiet>0||king.perks.word>0||king.perks.partnerCall)&&
        <div style={{...panel,padding:"8px 11px",marginBottom:9,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{...label,fontSize:8,color:C.good}}>ON YOU</span>
        {king.perks.drink>0&&<span style={{fontFamily:F.mono,fontSize:9.5,color:C.good,padding:"3px 8px",
          borderRadius:7,border:`1px solid ${C.good}55`}}>{king.perks.drink} DRINK{king.perks.drink>1?"S":""} ON THE HOUSE</span>}
        {king.perks.cue>0&&<span style={{fontFamily:F.mono,fontSize:9.5,color:"#efc486",padding:"3px 8px",
          borderRadius:7,border:"1px solid rgba(201,138,75,.45)"}}>THEIR CUE · {king.perks.cue} MATCHUP{king.perks.cue>1?"S":""}</span>}
        {king.perks.intel>0&&<span style={{fontFamily:F.mono,fontSize:9.5,color:"#c9a0d8",padding:"3px 8px",
          borderRadius:7,border:"1px solid rgba(201,160,216,.45)"}}>FREE READS · {king.perks.intel}</span>}
        {king.perks.quiet>0&&<span style={{fontFamily:F.mono,fontSize:9.5,color:C.accent,padding:"3px 8px",
          borderRadius:7,border:`1px solid ${C.accentDim}`}}>RAIL QUIET · NEXT MATCHUP</span>}
        {king.perks.word>0&&<span style={{fontFamily:F.mono,fontSize:9.5,color:C.good,padding:"3px 8px",
          borderRadius:7,border:`1px solid ${C.good}55`}}>A WORD PUT IN · NEXT OFFER</span>}
        {king.perks.partnerCall&&<span style={{fontFamily:F.mono,fontSize:9.5,color:C.warn,padding:"3px 8px",
          borderRadius:7,border:`1px solid ${C.warn}55`}}>{king.perks.partnerCall.name.toUpperCase()} · READY FOR DOUBLES</span>}
      </div>}

      {king.owedFavours&&king.owedFavours.length>0&&<div style={{...panel,padding:"8px 11px",marginBottom:9,
        display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",borderColor:"rgba(106,168,138,.38)"}}>
        <span style={{...label,fontSize:8,color:C.good}}>OWED TO YOU</span>
        {king.owedFavours.map(f=><span key={f.id} title={f.reason}
          style={{fontFamily:F.mono,fontSize:9.5,color:C.ink2,padding:"3px 8px",borderRadius:7,
            border:`1px solid ${C.good}44`}}>{f.name.toUpperCase()} · OWES A FAVOUR</span>)}
      </div>}

      {/* ---- a moment between racks ------------------------------------------- */}
      {king.beat&&phase==="pick"&&<div style={{...panel,padding:"11px 13px",marginBottom:9,
        borderColor:"rgba(159,182,207,.4)",background:"rgba(159,182,207,.06)"}}>
        <div style={{fontSize:12.5,color:C.ink,lineHeight:1.5}}>{king.beat.text}</div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:8}}>
          {king.beat.opt.map((o,i)=><button key={i} onClick={()=>setKing(k=>({...o.apply(k),beat:null}))}
            style={{...btn,padding:"6px 10px",textAlign:"left"}}>
            <b style={{fontSize:11.5}}>{o.label}</b>
            {o.sub&&<span style={{display:"block",fontFamily:F.mono,fontSize:8,color:C.muted}}>{o.sub}</span>}</button>)}
        </div>
      </div>}

      {/* ---- 1. PICK ---------------------------------------------------------- */}
      {phase==="pick"&&!inMatchup&&<Card accent="rgba(201,138,75,.38)" pad="13px 15px">
        <Lab c={C.warn}>QUARTERS ON THE RAIL · {king.pool.length} STEPPED UP</Lab>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:8}}>
          {king.pool.map(p=>{const st=AI_STYLES[p.style]||AI_STYLES.aggressive,pr=preparation(p,room.profile);
            const hist=p.record.w+p.record.l;
            return(<button key={p.id} onClick={()=>chooseKing(p)}
              style={{...btn,textAlign:"left",padding:"10px 11px",
                borderColor:p.rival?"#c96e78":pr?"#c9a0d8":C.line,background:C.panel2}}>
              <div style={{display:"flex",alignItems:"center",gap:7}}>
                <span style={{width:9,height:9,borderRadius:9,background:charOf(p.char).color,flexShrink:0}}/>
                <b style={{fontSize:12,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</b>
                {p.rival&&<span style={{fontFamily:F.mono,fontSize:7.5,color:"#e08b95"}}>RIVAL</span>}</div>
              <div style={{fontFamily:F.mono,fontSize:8.5,color:C.muted,marginTop:4}}>
                {p.rating} · {st.name.toUpperCase()} · {p.ability}</div>
              <div style={{fontFamily:F.mono,fontSize:8,color:C.muted,marginTop:3}}>
                {hist?`${p.record.w}–${p.record.l} vs you · `:""}{p.watched?`WATCHED ${p.watched}`:"NEW HERE"}{p.team?" · DOUBLES":""}
                {(p.form||0)>=2?" · HOT":(p.form||0)<=-2?" · COLD":""}</div>
              <div style={{fontFamily:F.mono,fontSize:8,color:"#9fb6cf",marginTop:3}}>{whyStepped(p,room)}</div>
              {pr&&<div style={{fontFamily:F.mono,fontSize:8,color:"#c9a0d8",marginTop:4}}>{pr.tag}</div>}
            </button>);})}
        </div>
      </Card>}

      {/* ---- the person you are actually playing ------------------------------ */}
      <div style={{...panel,padding:15,borderColor:"rgba(201,138,75,.38)"}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:13,flexWrap:"wrap"}}>
          <span style={{width:44,height:44,borderRadius:13,background:charOf(q.char).color,display:"grid",
            placeItems:"center",fontFamily:F.display,fontWeight:800,fontSize:19,color:"#111"}}>{charOf(q.char).initial||charOf(q.char).name[0]}</span>
          <div style={{flex:"1 1 300px"}}>
            <div style={{...label,color:C.warn,fontSize:8.5}}>
              {king.decision?"Rack complete · choose":phase==="prep"?"Before you play them":phase==="stakes"?"What is on it":"Next challenger"}</div>
            <h2 style={{fontFamily:F.display,margin:"3px 0 3px",fontSize:"clamp(19px,3.4vw,27px)"}}>{q.name}</h2>
            <div style={{fontFamily:F.mono,fontSize:9.5,color:C.muted}}>
              {q.rating} · {qStyle.name.toUpperCase()} · {tier.label.toUpperCase()} · {TABLES[king.table].name.toUpperCase()}
              {king.modeTheirs?` · THEIR GAME: ${MODES[king.mode].name.toUpperCase()}`:` · ${MODES[king.mode||"eight"].name.toUpperCase()}`}
            {king.streak>=15?" · BEST OF THREE":""}</div>
          </div>
          {q.rival&&<span style={{fontFamily:F.mono,fontSize:9.5,padding:"5px 8px",borderRadius:7,
            border:"1px solid #c96e78",color:"#e08b95"}}>RIVAL · GRUDGE {q.grudge}</span>}
          {q.team&&<span style={{fontFamily:F.mono,fontSize:9.5,padding:"5px 8px",borderRadius:7,border:`1px solid ${C.warn}`,color:C.warn}}>2 × 2 OFFER</span>}
          {king.series&&<span style={{fontFamily:F.display,fontWeight:700,fontSize:20,padding:"6px 10px",borderRadius:9,background:C.panel2,border:`1px solid ${C.line}`}}>{s.us}–{s.them}</span>}
        </div>

        {king.intro&&<div style={{fontSize:12.5,color:C.ink2,lineHeight:1.55,marginTop:10,
          paddingLeft:10,borderLeft:`2px solid ${charOf(q.char).color}`}}>{king.intro}</div>}
        {king.modeTheirs&&<div style={{fontSize:12,color:C.warn,lineHeight:1.5,marginTop:8}}>
          You dropped a rack, so they name the game. It is {MODES[king.mode].name} until you win one back off them.</div>}

        <div style={{margin:"13px 0",height:1,background:C.line}}/>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:16,alignItems:"start"}}>
          <TableArt tid={king.table} cloth={cloth}/>
          <div>
            <div style={{fontFamily:F.mono,fontSize:9.5,color:C.accent}}>STYLE · {qStyle.name}: {qStyle.tag}</div>
            <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:4}}>{qStyle.line}</div>
            <div style={{fontFamily:F.mono,fontSize:9.5,color:C.accent,marginTop:9}}>TRAIT · {q.ability}</div>
            <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:3}}>{charOf(q.char).move.text}</div>
            {prep&&<><div style={{fontFamily:F.mono,fontSize:9.5,color:"#c9a0d8",marginTop:9}}>{prep.tag}</div>
              <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:3}}>{prep.line}</div></>}
            {king.scouted
              ? <><div style={{fontFamily:F.mono,fontSize:9.5,color:C.good,marginTop:9}}>THE TELL</div>
                <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:3}}>{AI_TELLS[q.style]}</div>
                <div style={{fontFamily:F.mono,fontSize:8.5,color:C.muted,marginTop:7}}>{kingSheet(q.char)} · SEEN {q.watched} OF YOUR RACKS · REGULAR SINCE RACK {q.firstSeen||0}</div></>
              : <div style={{fontFamily:F.mono,fontSize:8.5,color:C.muted,marginTop:9}}>SHEET UNREAD · SCOUT THEM TO SEE IT</div>}

            {q.team&&phase!=="pick"&&<div style={{marginTop:10,display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{...label,fontSize:8.5}}>DOUBLES OFFER</span>
              <button onClick={()=>setKing(k=>({...k,doubles:true,partner:k.partner||q.partners[0]}))} aria-pressed={king.doubles} style={{...btn,padding:"6px 9px",borderColor:king.doubles?C.good:C.line}}>Accept 2 × 2</button>
              <button onClick={()=>setKing(k=>({...k,doubles:false}))} aria-pressed={!king.doubles} style={{...btn,padding:"6px 9px",borderColor:!king.doubles?C.warn:C.line}}>Play them solo</button></div>}
            {q.team&&king.doubles&&q.partners&&<div style={{marginTop:8,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}><span style={{...label,fontSize:8.5}}>YOUR PARTNER</span>
              <Select id="kingpartner" value={(king.partner||q.partners[0]).id} width={190} onPick={id=>setKing(k=>({...k,partner:q.partners.find(p=>p.id===id)}))}
                options={q.partners.map(p=>({v:p.id,label:p.name,sub:`${p.rating} · ${p.ability} · ${kingSheet(p.char)}`,dot:charOf(p.char).color}))}/></div>}

            {/* ---- 2. PREP ---------------------------------------------------- */}
            {phase==="prep"&&!inMatchup&&<div style={{marginTop:13}}>
              <div style={{...label,fontSize:8.5,marginBottom:7,color:C.warn}}>ONE OF THESE, THEN YOU PLAY</div>
              <div style={{display:"grid",gap:6}}>
                {prepCards(king,q,room).map(c=><button key={c.id} disabled={!c.ok} onClick={()=>takePrep(c)}
                  style={{...btn,textAlign:"left",padding:"8px 10px",opacity:c.ok?1:.4,cursor:c.ok?"pointer":"default"}}>
                  <div style={{display:"flex",gap:8,alignItems:"baseline"}}>
                    <b style={{fontSize:12}}>{c.name}</b>
                    <span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:8.5,color:C.good,whiteSpace:"nowrap"}}>{c.sub}</span></div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2,lineHeight:1.4}}>{c.text}</div></button>)}
              </div>
              <button onClick={()=>setKing(k=>({...k,phase:"stakes"}))} style={{...btnGhost,padding:"6px 10px",marginTop:7,fontSize:11}}>Skip it · go straight to the table</button>
            </div>}

            {/* ---- 3. STAKES --------------------------------------------------- */}
            {phase==="stakes"&&<div style={{marginTop:13}}>
              <div style={{...label,fontSize:8.5,marginBottom:7,color:C.warn}}>WHAT IS ON IT</div>
              <div style={{display:"grid",gap:6}}>
                {stakeOptions(king,q,room).map(o=><button key={o.id} onClick={()=>takeStake(o)}
                  style={{...btn,textAlign:"left",padding:"8px 10px",borderColor:o.mult>2?C.warn:C.line}}>
                  <div style={{display:"flex",gap:8,alignItems:"baseline"}}>
                    <b style={{fontSize:12}}>{o.name}</b>
                    <span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:8.5,color:o.risk?C.warn:C.good,whiteSpace:"nowrap"}}>{o.sub}</span></div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2,lineHeight:1.4}}>{o.text}</div></button>)}
              </div>
              <button onClick={()=>setKing(k=>k.rematchPending
                ?({...k,decision:k.rematchPending,rematchPending:null,phase:"play",stake:null,counter:null})
                :({...k,phase:"prep"}))} style={{...btnGhost,padding:"6px 10px",marginTop:7,fontSize:11}}>Back</button>
            </div>}

            {/* ---- 3b. THEY CAME BACK WITH SOMETHING ELSE --------------------- */}
            {phase==="counter"&&king.counter&&<div style={{marginTop:13}}>
              <div style={{...label,fontSize:8.5,marginBottom:7,color:C.warn}}>THEY COUNTERED</div>
              <div style={{fontSize:12.5,color:C.ink,lineHeight:1.5,marginBottom:8,
                paddingLeft:9,borderLeft:`2px solid ${C.warn}`}}>{king.counter.line}</div>
              <div style={{display:"grid",gap:6}}>
                <button onClick={acceptCounter} style={{...btn,textAlign:"left",padding:"8px 10px",borderColor:C.good}}>
                  <div style={{display:"flex",gap:8,alignItems:"baseline"}}>
                    <b style={{fontSize:12}}>Shake on it · {king.counter.name}</b>
                    <span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:8.5,color:C.good,whiteSpace:"nowrap"}}>{king.counter.sub}</span></div></button>
                <button onClick={compromiseCounter} style={{...btn,textAlign:"left",padding:"8px 10px",borderColor:C.accentDim}}>
                  <div style={{display:"flex",gap:8,alignItems:"baseline"}}>
                    <b style={{fontSize:12}}>{king.counter.compromise.label}</b>
                    <span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:8.5,color:C.accent,whiteSpace:"nowrap"}}>{king.counter.compromise.sub}</span></div></button>
                <button onClick={refuseCounter} style={{...btn,textAlign:"left",padding:"8px 10px"}}>
                  <div style={{display:"flex",gap:8,alignItems:"baseline"}}>
                    <b style={{fontSize:12}}>Not a chance · keep {king.stake.name.toLowerCase()}</b>
