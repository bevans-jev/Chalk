                    <span style={{marginLeft:"auto",fontFamily:F.mono,fontSize:8.5,color:C.muted,whiteSpace:"nowrap"}}>{king.stake.sub}</span></div></button>
              </div>
            </div>}

            {/* ---- 4. PLAY ----------------------------------------------------- */}
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:13}}>
              {phase==="play"&&!king.decision&&<button onClick={()=>launchKing(king.streak>=15||!!king.rematchPending)} style={btnPrimary}>
                {king.streak>=15?"Play the series · best of 3":`Play ${MODES[king.mode||"eight"].name}`} · win ${Math.round(rackPay*(king.stake?king.stake.mult:1))}</button>}
              {phase==="play"&&!king.decision&&<button onClick={()=>setKing(k=>({...k,phase:"stakes"}))} style={{...btnGhost,padding:"8px 12px"}}>Change the bet</button>}
              {king.decision&&king.decision.racks===1&&king.decision.forced&&<button onClick={beginRematchNegotiation} style={{...btnPrimary,background:C.warn}}>Renegotiate the defence</button>}
              {king.decision&&king.decision.racks===1&&!king.decision.forced&&king.decision.lastWon&&<>
                <button onClick={()=>advanceKing(true)} style={btnPrimary}>Bank the win · next challenger</button>
                <button onClick={beginRematchNegotiation} style={{...btn,borderColor:C.warn,color:"#efc486"}}>Negotiate rematch · race to 2</button>
              </>}
              {king.decision&&deciding&&<button onClick={()=>launchKing(true)} style={{...btnPrimary,background:C.warn}}>Play deciding rack · tied 1–1</button>}
            </div>
          </div>
        </div>
      </div>

      {/* ---- who else is in here ---------------------------------------------- */}
      {here.length>0&&<div style={{...panel,padding:"11px 13px",marginTop:9}}>
        <Lab>PLAYERS IN THE ROOM · everyone else is just drinking</Lab>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {here.filter(p=>p.id!==q.id).slice(0,10).map(p=><span key={p.id} title={`${p.rating} · ${(AI_STYLES[p.style]||{}).name} · watched ${p.watched} of your racks`}
            style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 8px",borderRadius:7,
              border:`1px solid ${p.rival?"#c96e78":p.id===room.watcher?"#d77f99":C.line}`,background:C.panel2}}>
            <span style={{width:7,height:7,borderRadius:7,background:charOf(p.char).color}}/>
            <span style={{fontSize:10.5,color:C.ink}}>{(p.short||p.name)}</span>
            <span style={{fontFamily:F.mono,fontSize:7.5,color:C.muted}}>
              {p.id===room.watcher?"WATCHING":p.rival?"GRUDGE":p.studied?"STUDYING":p.watched?`SEEN ${p.watched}`:"NEW"}</span>
            {room.gameNo-(p.firstSeen||0)>=12&&<span title={`In here since rack ${p.firstSeen||0}`} style={{fontFamily:F.mono,fontSize:7.5,color:"#8fa9c4"}}>REGULAR</span>}
          </span>)}
        </div>
      </div>}

      <div className="king-controls" style={{...panel,padding:"11px 13px",marginTop:9}}>
        <span style={{...label,fontSize:9}}>Your player</span>
        <Select id="kingchar" value={seats[0].char} width={150} onPick={v=>upd(0,{char:v})}
          options={CHAR_IDS.map(c=>({v:c,label:CHARS[c].name,sub:CHARS[c].move.name,dot:CHARS[c].color}))}/>
        <span style={{...label,fontSize:9,marginLeft:8}}>Your table</span>
        <Select id="kingtable" value={king.table} width={190} onPick={v=>setKing(k=>({...k,table:v}))}
          options={TABLE_IDS.map(t=>({v:t,label:TABLES[t].name,sub:TABLES[t].tag}))}/>
        {!king.modeTheirs&&<><span style={{...label,fontSize:9,marginLeft:8}}>Your game</span>
        <Select id="kingmode" value={king.mode||"eight"} width={150} onPick={v=>setKing(k=>({...k,mode:v}))}
          options={["eight","cutthroat"].map(m=>({v:m,label:MODES[m].name,sub:"the king picks"}))}/></>}
        <span style={{...label,fontSize:9,marginLeft:8}}>Cloth</span><ClothPicker/>
      </div>
    </Shell>);}

  if(screen==="kingGame"){
    const q=king.challenge,room=king.room;
    const doubles=q.team&&king.doubles,ally=king.partner||(q.partners&&q.partners[0]),foe=q.oppAlly;
    // PREPARATION IS REAL. Whatever they learned from watching you actually
    // changes the person you sit down against — their style and a stat bump.
    const prep=preparation(q,room.profile);
    const qMind={skill:q.skill,style:(prep&&prep.style)||q.style};
    const ks=doubles?
      [{kind:"human",char:seats[0].char,team:1},
       {kind:"cpu",char:q.char,rating:q.rating,team:2,mind:qMind},
       {kind:"cpu",char:ally.char,rating:ally.rating,team:1,mind:personMind(ally)},
       {kind:"cpu",char:foe.char,rating:foe.rating,team:2,mind:personMind(foe)}]:
      [{kind:"human",char:seats[0].char,team:1},
       {kind:"cpu",char:q.char,rating:q.rating,team:2,mind:qMind}];
    const watcher=watcherFor(room,king.streak,king.cold,!!(king.series&&king.series.protected));
    // THE HECKLERS. Anybody in the room can shout, and what they shout is built
    // out of what they have actually seen tonight.
    const hecklers=present(room).filter(p=>p.id!==q.id);
    const heckleChoice=(kind,fromId)=>setKing(k=>{
      const p=k.room.people.find(x=>x.id===fromId);
      if(!p)return k;
      if(kind==="quarters"){
        p.calledOut=true;
        roomSay(k.room,`${p.name} stopped laughing and found a quarter. They intend to use it.`);
      }else if(kind==="chalk"){
        p.chalkHeld=true;
        roomSay(k.room,`${p.name} is holding your chalk until you finally sit down.`);
      }else if(kind==="laugh")roomSay(k.room,`${p.short||p.name} got the joke. The rest of the rail moved on.`);
      return{...k,room:k.room};
    });
    const heckleFn=ctx=>{
      const from=hecklers.length&&Math.random()<0.75?pick(hecklers)
        :(room.watcher?room.people.find(p=>p.id===room.watcher):null);
      if(!from)return null;
      const tag=`${(from.short||from.name).toUpperCase()} · ${from.id===room.watcher?"THE ONE WATCHING":"FROM THE RAIL"}`;
      if(ctx.kind==="call")return{kind:"call",from:"THE ROOM",line:pick(CALL_LINES)};
      if(ctx.kind==="bet"){
        const n=1+Math.floor(Math.random()*3);
        return{kind:"bet",from:tag,amount:n,line:pick(BET_LINES)(n)};
      }
      const r=from.heard.length?room.rumors.find(x=>x.id===from.heard[from.heard.length-1]):null;
      const lines=heckleLines({name:(q.short||q.name),streak:king.streak,buzz:ctx.buzz,
        misses:ctx.misses,lastSafety:ctx.lastSafety,lastBank:ctx.lastBank,
        rumor:r?rumorText(r):null,record:q.record,studied:q.studied,style:q.style,
        rackNo:ctx.rackNo,potted:ctx.potted,crowd:room.crowd,watcher:!!room.watcher});
      return{kind:"taunt",line:pick(lines),from:tag,fromId:from.id};
    };
    return <Game key={kingKey} tid={king.table} cloth={cloth} count={doubles?4:2}
      mode={king.modeTheirs?king.mode:(king.mode||"eight")} seats={ks}
      opts={{balls:false,specials:true,bar:true}} initialBuzz={king.buzz} initialCash={START_CASH}
      campaign={{challenger:q.name,rating:q.rating,us:king.series.us,them:king.series.them,
        target:king.series.target,rematch:king.series.rematch,bank:king.bank,watcher,
        crowd:room.crowd,stake:king.stake,warmed:king.warmed,
        heckle:(king.perks&&king.perks.quiet)>0?null:heckleFn,
        onHeckleChoice:heckleChoice,
        cue:(king.perks&&king.perks.cue)>0,
        freeDrink:(king.perks&&king.perks.drink)>0?()=>setKing(k=>({...k,
          perks:{...k.perks,drink:Math.max(0,(k.perks.drink||0)-1)}})):null}}
      onResult={onKingResult} onSetup={()=>setScreen("king")} onQuit={()=>setScreen("king")}/>;
  }

  // ---- RULES --------------------------------------------------------------
  if(screen==="rules"){
    const H=({children})=><div style={{fontFamily:F.display,fontSize:15,fontWeight:600,margin:"22px 0 9px"}}>{children}</div>;
    const S=({children})=><div style={{...label,color:C.warn,fontSize:8.5,margin:"15px 0 6px"}}>{children}</div>;
    const R=({k,v,c})=><div className="rules-row" style={{fontSize:13}}>
      <b style={{color:c||C.ink,fontWeight:600}}>{k}</b><span style={{color:C.ink2,lineHeight:1.55}}>{v}</span></div>;
    return(<Shell wide><Head onBack={()=>setScreen("home")} title="How to play"/>
      <div className="rules-copy">
      <p style={{color:C.ink2,fontSize:13.5,lineHeight:1.65,margin:0,maxWidth:640}}>
        Drag anywhere on the cloth to aim — the further from the cue ball you drag, the finer the control.
        Use Fine Aim for slowed relative movement when a cut needs tiny adjustments. Set the speed meter beneath
        the table, then press Shoot. The white line shows first contact and the blue line shows the beginning of
        the object ball's route. The line never confirms that a ball will drop — that judgement is yours.</p>
      <H>Game types</H>
      {MODE_IDS.map(m=><R key={m} k={MODES[m].name} v={m==="king"?`Solo campaign — ${MODES[m].blurb}`:`${MODES[m].seats.join(" or ")} players — ${MODES[m].blurb}`}/>)}
      <H>King of the Table</H>
      <p style={{color:C.ink2,fontSize:13,lineHeight:1.65,margin:"0 0 8px",maxWidth:680}}>
        This is an ongoing pool-room run, not a tournament bracket. You enter with a $60 house bankroll and no
        streak. The room remembers who watched, who lost, who helped you, what was said, and how you played.</p>
      <S>THE BASIC LOOP</S>
      <R k="1 · Pick" v="Choose from one to five challengers currently in the room. New faces rotate in as matches finish; people you ignore can stay, leave, or return later."/>
      <R k="2 · Read and prepare" v="Study the challenger card, then choose one preparation aimed at that matchup. Scouting exposes habits; drinks and other choices trade immediate help for buzz, money, or consequences."/>
      <R k="3 · Set terms" v="Offer a normal wager, push for higher risk, or propose something non-cash. A counter can change the money, game, race length, handicap, or personal stake. You may accept it, meet in the middle, or hold your ground. Sometimes a fair offer is simply accepted."/>
      <R k="4 · Play" v="You pick the physical table and cloth. You normally name 8-Ball or Cutthroat too, unless the negotiation or current control of the table says otherwise."/>
      <R k="5 · Decide" v="After a rack, bank the result and choose someone new, or ask for a rematch. Every rematch opens a fresh negotiation and can change the wager and conditions; the old deal never carries over automatically."/>
      <S>WINNING, LOSING AND THE STREAK</S>
      <R k="Banking a win" v="Money settles when the rack or series ends. Banking commits the result, raises your streak, refreshes the room, and lets you select a new challenger."/>
      <R k="An early loss" v="Before five straight wins, losing a rack ends the night immediately. There is no rematch option and no reset into another challenger; you have not earned protection yet."/>
      <R k="Protected at five" v="At five straight wins, the first lost rack does not immediately erase the run. It guarantees a rematch against that opponent. You renegotiate fresh terms, then defend the streak as a best of three. Win the series and the streak lives; lose it and the night is over."/>
      <R k="Deep run at fifteen" v="From fifteen straight onward, every matchup is a best of three from the start. A full series loss ends the night."/>
      <R k="Ending the night" v="You can walk at Last Call and keep what you banked. Starting another night keeps the room's relationships and stories, but begins a new run under that night's conditions."/>
      <S>WHO CONTROLS WHAT</S>
      <R k="Table and cloth" v="The reigning king chooses the physical table and cloth. Different tables change pocket size, rail speed, friction, and geometry, so this is a real strategic choice."/>
      <R k="Game rules" v="While ahead, you name the game. If you drop a rack, the challenger may name the next game until you win control back. A negotiated condition can override the usual choice."/>
      <R k="Buzz and bankroll" v="Wagers come from the house bankroll. Buzz affects your stroke and judgement; between matchups only forty-five percent carries over, with at least a little relief before the next one."/>
      <S>THE LIVING ROOM</S>
      <R k="Persistent population" v="This is not a fresh menu after every match. People arrive, watch, leave, return, and may still be leaning on the same wall many racks later."/>
      <R k="Style vs skill" v="Every challenger keeps a style for life — aggressive, lockdown, bank-heavy, spin-heavy, showman, and more — plus a separate skill level. Better opponents do not receive fake aim; they choose smarter routes, safeties, and risks."/>
      <R k="Being studied" v="People who watch enough learn your habits: side spin, safeties, wild shots, drinking, and pace. When they finally step up, they may alter their plan specifically for you, and their card will say so."/>
      <R k="Crowd and watcher" v="The crowd meter is the room's live attention and can multiply a purse. A watcher is one particular person invested in the run; their interest can steady you, rise with drama, and fall when the run goes wrong."/>
      <S>HECKLING AND ANSWERING</S>
      <R k="When it happens" v="The rail can heckle at most twice in a rack. It is rare after a good shot and more likely after a mistake, repeated failure, or a late-game miss. A deliberate safety is not treated as a mistake."/>
      <R k="Your response" v="Each moment draws three genuinely different responses from a wider set. You might laugh with them and cool the room, call that exact heckler into a future matchup, hand them your chalk until the rack ends, answer with a deliberate safety, turn the rail onto your opponent, or put a tiny bet on the next ball. You can always let it go."/>
      <R k="When effects apply" v="Social replies happen immediately, but they never alter a shot already in motion. Safety, redirected pressure, and money are settled only after the next shot has been completely judged — including a rack-ending shot."/>
      <S>DOUBLES AND NAMED FAVORS</S>
      <R k="How often 2v2 appears" v="Most matches stay one-on-one. A doubles offer cannot appear before your first win; each available challenger then has roughly a 16% chance at streaks 1–2, 24% at 3–5, and 30% at 6 or more."/>
      <R k="Choosing a partner" v="When doubles is offered, the room provides possible partners. Teams alternate turns, and your partner's personality and skill matter; accepting doubles does not immediately generate another doubles offer afterward."/>
      <R k="Earning a favor" v="If you clutch an important doubles game, your teammate may owe you a favor. It is not guaranteed, and a four-ball finish gives the strongest chance. Covering somebody's table fee can create a named debt too."/>
      <R k="A real person owes it" v="The favor belongs to that exact character, not to a generic token. They wait at least another matchup before repaying it, can leave and return, and the debt survives into later nights."/>
      <R k="Repayment" v="When that person is present, you can ask them to quiet the rail, put in a word so a challenger accepts, scout an opponent, pull a new face into the room, lower your buzz, or return as a doubles partner."/>
      <S>ROOM MEMORY</S>
      <R k="Rumours" v="Genuinely strange things you do can become stories carried by witnesses. Most fade quickly; surviving stories change rail talk and who comes through the door."/>
      <R k="Rivals" v="Humiliating someone, taking serious money, or reverse-sweeping them can create a grudge. Rivals leave and return stronger, sometimes built to counter exactly what beat them."/>
      <R k="Reputation" v="Nicknames, room opinion, favors, rivals, and remembered habits give later matchups context. The run is about more than the number beside your streak."/>
      <H>8-Ball</H>
      <R k="Groups" v="The table is open until someone legally pockets a solid or a stripe. That group is theirs, and their side's."/>
      <R k="Fouls" v="Scratch, hitting nothing, hitting the wrong group first, or failing to reach a cushion after contact. Every one of them is ball in hand anywhere."/>
      <R k="The eight" v="Once your group is cleared you're on the eight, and you have to call the pocket first. Make it there and the rack is yours. Sink it early, sink it anywhere else, or foul while making it, and you lose on the spot."/>
      <R k="The break" v="Eight on the break is not a loss — it goes straight back up on the foot spot."/>
      <H>Cutthroat</H>
      <R k="Groups" v="Two players protect solids and stripes with the eight left neutral; three protect five balls each; four protect three each with 13, 14 and 15 neutral. A ring marks who protects that ball — it is not a target marker."/>
      <R k="Shooting" v="Attack other people's balls and protect your own. Merely hitting a ball never keeps the turn: you must pocket an opponent's ball. If you pocket one wearing your own colour, it stays down and your turn ends."/>
      <R k="Neutral balls" v="Pocketing one is a foul. It goes back on the foot spot and your turn ends."/>
      <R k="Scratch" v="Every opponent gets one of their pocketed balls spotted back, and the next player shoots with ball in hand. Someone with no balls left is skipped, not eliminated — a scratch can put them right back in it."/>
      <H>Tables</H>
      {TABLE_IDS.map(t=><R key={t} k={TABLES[t].name} v={`${TABLES[t].tag} — ${TABLES[t].blurb}`}/>)}
      <H>Stats</H>
      <p style={{color:C.ink2,fontSize:13,lineHeight:1.6,margin:"0 0 10px",maxWidth:640}}>
        Six stats, and each one gates something different, so being good at one never covers being bad at another.
        Nobody has all six.</p>
      <p style={{color:C.ink2,fontSize:13,lineHeight:1.6,margin:"0 0 10px",maxWidth:640}}>
        <b style={{color:C.good}}>Every sober character aims perfectly.</b> No stat makes the ball wander off the
        line you were shown — if you line it up and the white line says it drops, it drops, whoever you are picked.
        Aim error comes from the bar and nowhere else: buzz past eighty-five, a double shot bought for you, a lying
        aim line. Sober up and your aim comes all the way back. What the stats change is what you are ABLE to
        attempt — how hard you can hit it, how much spin lands, how far off centre you may strike, how high the cue
        may be raised and how much of the shot you are shown. Every low stat now buys you something back:
        a puncher gets speed for keeping the cue flat, and a feel player is close to immune to having the
        lights killed or their aim line lied to.</p>
      <R k="Power" v="Your top cue speed. Low power can still pot anything on the table, it just can't break properly or send the cue ball three rails for position."/>
      <R k="Stroke" v="How much of the spin you dialled in actually reaches the ball. A high-stroke player gets the full draw, follow and side they set on the tip; a low-stroke player gets a fraction of it and has to plan routes that do not need much. It never makes you miss a ball you lined up correctly."/>
      <R k="Touch" v="How closely the delivered speed matches the speed you set, and how softly you can play at all. High touch rolls the ball an inch; low touch has a floor under the power bar and physically cannot play a delicate safety."/>
      <R k="English" v="How far off centre you're allowed to strike. The dashed ring on the tip control is your ceiling — draw, follow and side all live inside it."/>
      <R k="Curve" v="How high you may raise the butt of the cue. Everybody can bend the ball a little; a high-curve player bends it round a post. Anyone printed under 45 is a puncher instead — they keep the cue dead level and get eight percent more speed out of every shot for it."/>
      <R k="Eye" v="How far down the line you can see. Everyone gets the object line — nobody plays blind — but Eye decides how many INCHES of it you are shown before it stops, and how many cushions fit inside that. A feel player gets a stub and has to know the rest; a sighted player gets a genuinely useful stretch. Nobody is ever shown the whole route, so the last part of every shot is your judgement. Anyone printed under 55 is a feel player, and because they never leaned on the picture, killing the lights or lying to their aim line barely touches them. Acid, Espresso and Red Bull buy real distance here."/>
      <R k="What the line will not tell you" v="It never turns green to say a ball is going in. It shows you where the object ball sets off and how far you can see it travel; whether that is a pot is your call, and the harder you hit it the further past the end of the line the ball goes."/>
      <H>Characters</H>
      <p style={{color:C.ink2,fontSize:13,lineHeight:1.6,margin:"0 0 10px",maxWidth:640}}>
        Every special stacks two or three effects, so using one changes what is possible rather than just nudging
        the odds. Fargo is the strongest all round and still cannot bend a ball, so custom bank geometry can
        expose that weakness instead of functioning as decoration.</p>
      {CHAR_IDS.map(c=><R key={c} c={CHARS[c].color} k={CHARS[c].name}
        v={`${CHARS[c].move.name} (${CHARS[c].move.tag}) — ${CHARS[c].move.text}`}/>)}
      <H>Power Ball sets</H>
      {POWER_SET_IDS.map(k=><R key={k} k={POWER_SETS[k].name} v={`${POWER_SETS[k].blurb} ${POWER_SETS[k].trigger}.`}/>) }
      </div>
    </Shell>);}

  // ---- TABLE PICKER -------------------------------------------------------
  if(screen==="table")return(<Shell>
    <Head onBack={()=>setScreen("home")} title="Pick a table"/>
    <div className="table-grid">
      {TABLE_IDS.map(t=>{const on=tid===t;
        return(<button className="table-choice" key={t} onClick={()=>setTid(t)} aria-pressed={on} style={{...panel,padding:9,cursor:"pointer",textAlign:"center",
          border:on?`1px solid ${C.accentDim}`:`1px solid ${C.line}`,background:on?C.panel2:C.panel,
          boxShadow:on?"0 0 0 1px rgba(127,166,196,.18)":"none"}}>
          <TableArt tid={t} cloth={PREVIEW_CLOTH}/>
          <div style={{fontFamily:F.display,fontWeight:600,fontSize:14,marginTop:8,color:C.ink}}>{TABLES[t].name}</div>
          <div style={{fontFamily:F.mono,fontSize:10.5,color:C.muted,marginTop:2}}>{TABLES[t].tag}</div>
        </button>);})}
    </div>
    <div className="screen-actions">
      <button onClick={()=>setScreen("rules")} style={{...btnGhost,fontSize:12}}>How to play</button>
      <button onClick={()=>setScreen("setup")} style={{...btnPrimary,padding:"11px 20px"}}>Continue →</button></div>
  </Shell>);

  // ---- SETUP --------------------------------------------------------------
  if(screen==="setup"){
    const legal=modesFor(count);
    const pure=!opts.balls&&!opts.specials&&!opts.bar;
    const everything=opts.balls&&opts.specials&&opts.bar;
    return(<Shell><Head onBack={()=>setScreen("table")} title={`Setup · ${TABLES[tid].name}`}/>
      {mode!=="king"&&<div style={{display:"flex",gap:7,marginBottom:10}}>{[2,3,4].map(n=>
        <button key={n} onClick={()=>setCount(n)} aria-pressed={count===n} style={count===n?segOn:seg}>{n} players</button>)}</div>
      }
      <div className="setup-grid">
        <div style={{...panel,padding:"12px 14px"}}>
          <div style={{...label,marginBottom:7}}>Cloth</div>
          <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{width:190,maxWidth:"100%",flexShrink:0}}><TableArt tid={tid} cloth={cloth}/></div>
            <div style={{flex:"1 1 260px",minWidth:0}}>
              <ClothPicker/>
              <div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:9}}>Select a swatch to preview the full cloth on {TABLES[tid].name}.</div>
            </div>
          </div>
          <div style={{height:1,background:C.line,margin:"11px 0"}}/>

          <div style={label}>Game mode</div>
          <div style={{display:"flex",gap:7,marginTop:8,flexWrap:"wrap"}}>{legal.map(m=>
            <button key={m} onClick={()=>setMode(m)} aria-pressed={mode===m} style={mode===m?segOn:seg}>{MODES[m].name}</button>)}
            <button disabled style={{...seg,opacity:.35,cursor:"default"}}>Tournament · soon</button></div>
          <div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:8}}>{MODES[mode].blurb}</div>
          {mode==="cutthroat"&&(()=>{const N=(TABLES[tid].build().racks||1)*15;
            const per=count===2?Math.floor(N/2)-(N/15):Math.floor(N/count), spare=N-per*count;
            return <div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:5}}>
              {per} balls each{spare?`, ${spare} neutral — pocket one of those and it goes straight back up`:", nothing spare"}.</div>;})()}
          {mode==="eight"&&count>2&&(()=>{const a=seats.slice(0,count).filter(x=>(x.team||1)===1).length;
            return <div style={{fontSize:11.5,color:a===0||a===count?C.warn:C.muted,lineHeight:1.45,marginTop:5}}>
              {a===0||a===count?"Put at least one player on each side.":`${a} v ${count-a}. Sides alternate every shot, so a lone player still shoots every other turn.`}</div>;})()}

          <div style={{height:1,background:C.line,margin:"11px 0"}}/>
          {mode==="king"?<div style={{padding:"11px 12px",borderRadius:10,background:"rgba(201,138,75,.08)",border:`1px solid rgba(201,138,75,.35)`}}>
            <div style={{fontFamily:F.mono,fontSize:9.5,color:C.warn}}>SOLO CAMPAIGN · POWER BALLS OFF</div>
            <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:5}}>Your selected cloth and {TABLES[tid].name} carry into the run. You control the table and can change it between matchups; challengers bring rising stakes and occasional 2v2 partners. Power Balls stay in experimental matches for now.</div>
          </div>:<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div style={label}>Game options</div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setOpts({balls:false,specials:false,bar:false})} aria-pressed={pure}
                style={{...btnGhost,padding:"6px 11px",fontSize:11,background:pure?C.panel2:"transparent",borderColor:pure?C.accentDim:C.line}}>Pure</button>
              <button onClick={()=>setOpts({balls:true,specials:true,bar:true})} aria-pressed={everything}
                style={{...btnGhost,padding:"6px 11px",fontSize:11,background:everything?C.panel2:"transparent",borderColor:everything?C.accentDim:C.line}}>Everything</button>
            </div></div>
          <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
            {[["balls","Power balls"],["specials","Specials"],["bar","The bar"]].map(([k,l])=>
              <button key={k} onClick={()=>setOpts(o=>({...o,[k]:!o[k]}))} aria-pressed={opts[k]} style={opts[k]?segOn:seg}>{opts[k]?"✓ ":""}{l}</button>)}</div>
          {opts.balls&&<div style={{marginTop:11,padding:"11px 12px",borderRadius:10,background:"rgba(127,166,196,.07)",border:`1px solid ${C.line}`}}>
            <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{...label,fontSize:9}}>Match-wide set</span>
              <Select id="powerset" value={powerSet} width={168} onPick={setPowerSet}
                options={POWER_SET_IDS.map(k=>({v:k,label:POWER_SETS[k].name,sub:POWER_SETS[k].tag,dot:POWER_SETS[k].color}))}/>
              <span style={{fontFamily:F.mono,fontSize:9.5,color:POWER_SETS[powerSet].color}}>{POWER_SETS[powerSet].trigger.toUpperCase()}</span>
            </div>
            <div style={{fontSize:11.5,color:C.ink2,lineHeight:1.5,marginTop:7}}>{POWER_SETS[powerSet].blurb}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>{Object.entries(POWER_SETS[powerSet].map).map(([n,p])=>{
              // "?" is a House Roulette slot: it is dealt out of the whole deck
              // when the rack is built, so there is nothing to name yet.
              const d=BALLS[p], col=d?d.color:POWER_SETS[powerSet].color;
              return <span key={n} title={d?d.effect:"Dealt at random from the whole deck when the rack is built."}
                style={{fontFamily:F.mono,fontSize:8.5,color:col,padding:"4px 6px",borderRadius:6,border:`1px solid ${col}55`,background:`${col}0d`}}>
                {n} · {d?`${d.sigil} ${d.name.toUpperCase()} · ${d.cadence}`:"? DEALT AT RACK TIME"}</span>;})}</div>
          </div>}
          {opts.bar&&<div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:8}}>
            Everyone starts on a ${START_CASH} tab. Drinks buy you stats or bend the rules; you can also spend it on
            the player opposite. When the tab is gone it is gone.</div>}
          </>}
        </div>

        {Array.from({length:mode==="king"?1:count}).map((_,i)=>{const s=seats[i],ch=charOf(s.char);
          return(<div key={i} style={{...panel,padding:"10px 12px"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{width:22,height:22,borderRadius:6,background:ch.color,flexShrink:0}}/>
              <b style={{fontFamily:F.mono,fontSize:11,minWidth:48}}>SEAT {i+1}</b>
              {mode!=="king"&&<Select id={i+"k"} value={s.kind} width={104} onPick={v=>upd(i,{kind:v})}
                options={[{v:"human",label:"You"},{v:"cpu",label:"Computer"}]}/>
              }
              <Select id={i+"c"} value={s.char} width={132} onPick={v=>upd(i,{char:v})}
                options={CHAR_IDS.map(c=>({v:c,label:CHARS[c].name,sub:CHARS[c].move.name,dot:CHARS[c].color}))}/>
              {mode!=="king"&&s.kind==="cpu"&&<Select id={i+"r"} value={s.rating} width={150} onPick={v=>upd(i,{rating:v})}
                options={BOTS.map(b=>({v:b.rating,label:b.label,sub:b.rating+" rating"}))}/>}
              {mode==="eight"&&count>2&&<Select id={i+"t"} value={s.team||1} width={100} onPick={v=>upd(i,{team:v})}
                options={[{v:1,label:"Side 1"},{v:2,label:"Side 2"}]}/>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(105px,1fr))",gap:"6px 10px",marginTop:9}}>
              {STATS.map(([k,l])=><span key={k} style={{display:"inline-flex",gap:6,alignItems:"center"}}>
                <span style={{...label,fontSize:8,letterSpacing:.9}}>{l}</span><Bars v={ch[k]} color={ch.color}/></span>)}</div>
            {(mode==="king"||opts.specials)&&<div style={{fontSize:11.5,color:C.muted,lineHeight:1.45,marginTop:8}}>
              <b style={{color:ch.color,fontWeight:600}}>{ch.move.name}</b>
              <span style={{fontFamily:F.mono,fontSize:10,color:ch.move.kind==="passive"?C.good:C.warn}}> · {ch.move.tag}</span> — {ch.move.text}</div>}
          </div>);})}
      </div>
      <div className="screen-actions"><button onClick={()=>{if(mode==="king"){setKing(k=>({...k,table:tid}));setScreen("king");}else setScreen("game");}}
        style={btnPrimary}>{mode==="king"?"Enter King of the Table →":"Break →"}</button></div>
    </Shell>);}

  return <Game tid={tid} cloth={cloth} count={count} mode={mode} seats={seats} opts={opts} powerSet={powerSet}
    onSetup={()=>setScreen("setup")} onQuit={()=>setScreen("home")}/>;
}

// ===== 9. GAME ===============================================================
// Two rulesets share one shot loop. What differs is only: who owns which balls,
// what counts as a foul, what a foul costs, and how the turn passes.
function Game({tid,cloth,count,mode,seats,opts,powerSet,onSetup,onQuit,onResult,onAiShot,initialBuzz=0,initialCash=START_CASH,campaign}){
  // Geometry is immutable for the lifetime of this Game instance.
  const g=useMemo(()=>TABLES[tid].build(),[tid]);
  const racks=g.racks||1, TOTAL=racks*15;
  const pk=useMemo(()=>makePockets(g),[g]);

  // Physics mutates ball objects at 120 Hz. Keeping that array in a ref avoids
  // creating React state objects for every ball on every simulation step;
  // redraw() is the explicit bridge back to the interface.
  const ballsRef=useRef(buildRack(g,racks,opts.balls?powerSet:null));
  const [,force]=useState(0);
  const redraw=useCallback(()=>force(v=>v+1),[]);
  const bs=ballsRef.current;
  const cue=bs.find(b=>b.n===0);

  const teams=useMemo(()=>{
    if(mode!=="eight")return null;
    const a=[],b=[];
    for(let i=0;i<count;i++)((seats[i].team===2)?b:a).push(i);
    // Invalid custom team selections fall back to alternating seats, ensuring
    // both sides always contain somebody and turn rotation cannot deadlock.
    if(!a.length||!b.length){a.length=0;b.length=0;
      for(let i=0;i<count;i++)(i%2?b:a).push(i);}
    return [a,b];
  },[mode,count,seats]);
  const own=useMemo(()=>mode==="cutthroat"?assignOwners(TOTAL,count):null,[mode,TOTAL,count]);

  // ---- turn state ----------------------------------------------------------
  const [ply,setPly]=useState(0);        // 8-ball: alternates sides, so 1 v 2 is fair
  const [seatTurn,setSeatTurn]=useState(0);
  const [angle,setAngle]=useState(Math.PI);
  const [fineAim,setFineAim]=useState(false); // slowed relative drag for precise cuts
  const [power,setPower]=useState(0.42);   // committed shot power, 0..1 — persists
  const grab=useRef(0);                    // power at the moment you took hold
  const [tip,setTip]=useState({a:0,b:0});  // where the tip strikes the cue ball
  const [elev,setElev]=useState(0);        // how far the butt is raised, radians
  const [moving,setMoving]=useState(false);
  const [side,setSide]=useState(null);   // 8-ball assignment by team index
  const [called,setCalled]=useState(null);
  const [calledFor,setCalledFor]=useState(null); // a pocket call belongs to one shooter only
  const [msg,setMsg]=useState("Break.");
  const [over,setOver]=useState(null);   // winning seat
  const [endOpen,setEndOpen]=useState(false);  // the GAME OVER card
  const [inHand,setInHand]=useState(false);
  const [shotNo,setShotNo]=useState(0);
  const [spent,setSpent]=useState({});     // special uses burned, per seat
  const [run,setRun]=useState({});         // balls potted this rack, per seat — drives House Money
  const [armed,setArmed]=useState(false);  // active special primed for this shot

  // ---- the bar -------------------------------------------------------------
  const [buzz,setBuzz]=useState(()=>initialBuzz?{0:initialBuzz}:{});       // per seat, 0-120
  const [fx,setFx]=useState({});           // per seat, [{id, shots}]
  const [cash,setCash]=useState(()=>({0:initialCash}));       // your tab
  const [roomHeat,setRoomHeat]=useState(()=>campaign?(campaign.crowd||0):0);
  const [sending,setSending]=useState(false);
  const [barOpen,setBarOpen]=useState(false);   // the bar is a popup, not a scroll
  const [sheetOpen,setSheetOpen]=useState(false);  // your live stat sheet
  const [bought,setBought]=useState(-1);   // which ply the current purchase was made on
  const [spiked,setSpiked]=useState({});   // hostile buys used, per seat — HARD CAP OF 2 A RACK
  const SPIKE_CAP=2;
  const spikesLeft=i=>SPIKE_CAP-(spiked[i]||0);
  const [pending,setPending]=useState({});  // per seat: skipTurn / echo rewind
  const [tilt,setTilt]=useState(0);
  const [missStreak,setMissStreak]=useState(0);
  const [magnetSurge,setMagnetSurge]=useState(false);
  const [powerPulse,setPowerPulse]=useState("");
  // WHAT THE ROOM SEES. Every shot the human plays is scored on four axes and
  // handed back to the campaign when the rack ends, because the people standing
  // around this table are supposed to be learning how you play.
  const prof=useRef({shots:0,spin:0,aggro:0,safe:0,flash:0,buzzPeak:0,
    notable:{},run:0,runBest:0,lead:0,worst:0,misses:0,lastSafe:false,lastBank:false});
  const shotTag=useRef(null);
  const [heckle,setHeckle]=useState(null);      // {line,from} — a rare interruption
  const backtalk=useRef(false);
  const railBet=useRef(0);
  const drinkUsed=useRef(false);
  const heckleCount=useRef(0);
  const [powerBurst,setPowerBurst]=useState(null);
  const powerSeq=useRef(0);
  const reported=useRef(false);
  // Transient engine refs deliberately do not trigger renders:
  // raf = active animation frame; drag = pointer gesture; snap = Peyote rewind;
  // legalRef = legal targets frozen before the shot changes the table.
  const raf=useRef(0), drag=useRef(null), snap=useRef(null), legalRef=useRef(null);
  const aimGrab=useRef({x:0,y:0,angle:Math.PI});
  const nerveRef=useRef(false);   // was this shot played in front of somebody?

  function sideOf(seat){return teams&&teams[0].includes(seat)?0:1;}

  // Compose one player's printed sheet, campaign modifier, active items, and
  // current buzz band. Every preview, AI decision, and strike reads this path.
  const effOf=useCallback(seat=>{
    const ch=charOf(seats[seat].char), b=buzz[seat]||0, list=fx[seat]||[];
    const st={}; STAT_KEYS.forEach(k=>st[k]=ch[k]);
    const flags={};
    if(ch.kingAbility){
      for(const k in (ch.kingAbility.stats||{}))st[k]+=ch.kingAbility.stats[k];
      Object.assign(flags,ch.kingAbility.flags||{});
    }
    // She's Watching belongs to the night, not the bar. It is a small campaign
    // modifier on the human sheet and can never be purchased mid-rack.
    if(campaign&&seat===0&&campaign.watcher){
      for(const k in (campaign.watcher.stats||{}))st[k]+=campaign.watcher.stats[k];
    }
    // Ten minutes alone on the table before the match: props up whatever you
    // are worst at, which is exactly what a warm-up does.
    // THEIR CUE. Won off somebody and it is better than yours, for three
    // matchups, and then you give it back.
    if(campaign&&seat===0&&campaign.cue){st.english+=7;st.stroke+=5;st.touch+=3;}
    if(campaign&&seat===0&&campaign.warmed){
      const order=STAT_KEYS.slice().sort((a,b)=>st[a]-st[b]);
      st[order[0]]+=3; st[order[1]]+=3;
    }
    // Fargo's House Money is a stat modifier like any other, so it flows through
    // kit() and shows up in every readout without a single special case.
    const mo=passiveOf(ch).momentum;
    if(mo){const gain=momentumGain(mo,run[seat]||0);
      if(gain)STAT_KEYS.forEach(k=>st[k]+=gain);}
    for(const e of list){const d=e.data||DRINKS[e.key]||SPIKES[e.key]; if(!d)continue;
      for(const k in (d.stats||{}))st[k]+=d.stats[k];
      Object.assign(flags,d.flags||{});}
    const band=bandOf(b), bf=BAND_FX[band];
    if(bf){ for(const k in (bf.stats||{}))st[k]+=bf.stats[k]; Object.assign(flags,bf.flags||{}); }
    return{ch,st,flags,band,buzz:b};   // ch is the PRINTED sheet, st the effective one
  },[seats,buzz,fx,run,campaign]);
  const upCount=seat=>mode==="cutthroat"
    ? bs.filter(b=>!b.in&&b.n!==0&&own[b.n]===seat).length
    : (()=>{const gp=side&&side[sideOf(seat)]; if(!gp)return 7*racks;
        return bs.filter(b=>!b.in&&b.n!==0&&groupOf(b.n)===gp).length;})();
  // balls of your group already in the pockets — the number the end card ranks on
  const potted=seat=>{
    if(mode==="cutthroat")return bs.filter(b=>b.in&&b.n!==0&&own[b.n]!=null&&own[b.n]!==seat&&own[b.n]!==-1).length;
    const gp=side&&side[sideOf(seat)];
    return gp?bs.filter(b=>b.in&&b.n!==0&&groupOf(b.n)===gp).length:0;};

  // `ply` advances sides; shooterAt rotates through the seats on that side.
  // This makes 1v2 and 2v2 alternate teams without starving any teammate.
  const shooterAt=useCallback(p=>{
    if(mode!=="eight")return seatTurn;
    const sd=p%2, list=teams[sd];
    return list[Math.floor(p/2)%list.length];
  },[mode,teams,seatTurn]);
  const turn=mode==="eight"?shooterAt(ply):seatTurn;
  const alive=i=>mode!=="cutthroat"||upCount(i)>0;

  const onEight=(()=>{ if(mode!=="eight"||!side)return false;
    const gp=side[sideOf(turn)];
    return bs.filter(b=>!b.in&&b.n!==0&&groupOf(b.n)===gp).length===0;})();

  // Return a predicate rather than an array because Power Balls can change
  // ownership semantics without changing their printed number or group.
  const legalFor=useCallback(t=>{
    if(mode==="cutthroat")return n=>own[n]!==t&&own[n]!==-1; // not yours, not neutral
    const gp=side&&side[sideOf(t)];
    if(!gp)return n=>groupOf(n)!=="eight";                 // table still open
    const left=bs.filter(b=>!b.in&&b.n!==0&&groupOf(b.n)===gp).length;
    return left?(n=>groupOf(n)===gp):(n=>groupOf(n)==="eight");
  },[mode,side,own,bs,teams]);

  const nextSeat=t=>{let n=t;
    for(let i=0;i<count*2;i++){n=(n+1)%count;
      if(!alive(n))continue;
      if((pending[n]||{}).skip){setPending(x=>({...x,[n]:{...(x[n]||{}),skip:0}}));continue;}
      return n;}
    return t;};
  const passTurn=()=>{ if(mode==="eight")setPly(p=>p+1); else setSeatTurn(t=>nextSeat(t)); };
  const powderReady=opts.balls&&powerSet==="powder"&&(shotNo+1)%POWER_SETS.powder.period===0;

  // ---- the shot -------------------------------------------------------------
  // shoot() snapshots the active modifiers, primes RULE, strikes the cue ball,
  // and owns the animation loop. Rules are judged later by resolveRef.
  const resolveRef=useRef(null);
  const shoot=useCallback((a,speed,tp,el)=>{
    if(moving||over!=null||!cue||cue.in)return;
    const e0=effOf(turn), ch=e0.ch, mv=ch.move, FL=e0.flags;
    const P=passiveOf(ch);
    // Pearl's shaft raises the tip ceiling, so the kit she actually shoots
    // with is not the kit his raw English stat would give him.
    const k0=kit(e0.st,e0.flags,ch);
    const k={...k0,maxTip:k0.maxTip*P.tipBonus,maxElev:P.elevFree?60:k0.maxElev};
    RULE.masse=(k0.masseMul||1)*(P.masseBoost||1);   // CURVE, then Cricket on top
    RULE.spinMul=k0.spinMul;      // Stroke: how much of the tip offset lands
    const breaking=bs.filter(b=>!b.in&&b.n!==0).length===TOTAL;
    // FREEZE THE LEGAL-BALL TEST BEFORE ANYTHING MOVES.
    // legalFor() reads the live table, so clearing your last group ball used to
    // flip you onto the eight *during* the shot, and the legal contact you had
    // just made was then judged as hitting the wrong ball — a foul, ball in hand,
    // turn over, for a shot that was perfect. This is that bug.
    legalRef.current=legalFor(turn);
    // the nerve shot resolves on THIS shot, so remember it before fx tick down
    nerveRef.current=(fx[turn]||[]).some(e=>e.key==="nerve");
    RULE.noSquirt=P.noSquirt; RULE.spinHold=P.spinHold;
    RULE.heavyCue=P.heavyCue; RULE.cushBite=P.cushBite;
    RULE.fastCloth=!!FL.fastCloth;            // vodka: the cloth runs
    RULE.phase=!!FL.phase||(opts.balls&&powerSet==="haunted"&&missStreak>=3); RULE.phaseBall=null;
    RULE.cueSafe=P.cueSafe||(armed&&mv.name==="Sharking");
    RULE.pocketBoost=FL.khole?1.9:1;          // ketamine: the pockets open up
    RULE.magnetBoost=magnetSurge?2.6:1.7;
    const powderCharge=powderReady;
    RULE.bombBoost=powderCharge?1.75:1; RULE.brickBoost=powderCharge?1.65:1;
    RULE.softJaws=!!FL.khole;
    RULE.tilt=tilt;                           // jager: the slate leans
    RULE.deadRail=P.deadRail||(armed&&mv.name==="Sharking");
    RULE.cueBlast=armed&&mv.name==="Backdraft";     // Backwood: the white goes off
    RULE.claimArm=armed&&mv.name==="Claim";         // Pearl: first touch becomes hers
    RULE.homeArm =armed&&mv.name==="Called Shot";   // Daphne: first touch is guided home
    RULE.homeBall=null;
    bs.filter(b=>!b.in).forEach(b=>{b.ghostSpent=false;b.blown=false;b.pulled=0;b.lit=false;b.homeTo=null;});
    const pv=predictPath(cue,a,speed,tp,el,bs,g,1);
    if(seats[turn].kind==="human"){
      const P=prof.current;
      const mag=Math.hypot(tp?tp.a:0,tp?tp.b:0)/Math.max(0.02,k.maxTip);
      const powerFrac=Math.sqrt(Math.max(0,Math.min(1,speed/(MAXV*k.speedMul))));
      const reach=pv.ball?Math.hypot(pv.ball.x-cue.x,pv.ball.y-cue.y):0;
      // a bank is an object ball that travels much further than the straight
      // line from where it was hit to where it finished
      let bank=false;
      if(pv.objIn&&pv.objPath&&pv.objPath.length>2){
        const q0=pv.objPath[0], q1=pv.objPath[pv.objPath.length-1];
        let run=0; for(let i=1;i<pv.objPath.length;i++)
          run+=Math.hypot(pv.objPath[i][0]-pv.objPath[i-1][0],pv.objPath[i][1]-pv.objPath[i-1][1]);
        bank=run>Math.hypot(q1[0]-q0[0],q1[1]-q0[1])*1.5+8;
      }
      const safe=!pv.objIn&&powerFrac<0.46&&!!pv.ball;
      const flash=(el||0)>0.15||bank||(pv.objIn&&reach>58);
      P.shots++; P.spin+=Math.min(1,mag);
      if(powerFrac>0.55)P.aggro++;
      if(safe)P.safe++;
      if(flash)P.flash++;
      P.buzzPeak=Math.max(P.buzzPeak,E.buzz||0);
      P.lastSafe=safe; P.lastBank=bank;
      shotTag.current={bank,masse:(el||0)>0.2,long:reach>62,safe,expected:!!pv.objIn};
    }
    // Oscar owns a 25° window either side of straight.
    const straight=P.perfectStraight&&pv.ball&&pv.cut>0.90;
    RULE.noThrow=straight;
    const clean=straight||!!FL.steady;
    let aErr=clean?0:(Math.random()*2-1)*k.aimErr;
    let tpUse=FL.noTip?{a:0,b:0}:(tp||{a:0,b:0});
    if(FL.miscue&&Math.hypot(tpUse.a,tpUse.b)>k.maxTip*0.78){
      aErr+=(Math.random()*2-1)*0.05; speed*=0.55;}    // struck it too far out
    // La Recta delivers the WEIGHT as well as the line.
    const sErr=straight?1:1+(Math.random()*2-1)*k.speedErr;
    if(FL.cutOff){aErr+=(Math.random()*2-1)*0.22; speed*=0.55+Math.random()*0.35; tpUse={a:0,b:0};}
    // Backwood ignores the ceiling on the break AND on anything she really leans on.
    const heavy=P.freeBreak&&(breaking||speed>MAXV*k.speedMul*0.62);
    let sp=heavy?Math.min(MAXV*1.28,speed*1.3):speed*sErr;
    if(straight)sp=Math.min(MAXV*1.32,sp*1.15);   // the smoke shot breaks his own ceiling

    strike(cue,a+aErr,Math.max(12,sp),tpUse,el||0);
    if(armed&&mv.name==="Sharking"){

          return(<span key={e.key} title={d.note} style={{display:"inline-flex",alignItems:"center",gap:5,
            padding:"3px 7px 3px 5px",borderRadius:7,border:`1px solid rgba(${look.rgb},.38)`,
            borderLeft:`3px solid ${col}`,background:`rgba(${look.rgb},.09)`,
            boxShadow:`inset 0 1px rgba(255,255,255,.025)`,animation:"fx-enter .22s ease-out both"}}>

            <b style={{fontSize:10.5,color:C.ink,fontWeight:600}}>{d.name}</b>
            <span style={{fontFamily:F.mono,fontSize:7.5,color:C.muted}}>
              {e.shots>900?"RACK":`${e.shots} SHOT${e.shots>1?"S":""}`}{e.hostile?" · HOSTILE":""}</span></span>);})}
      </div>);})()}

    <div className="shot-dock" style={{display:"flex",gap:6,alignItems:"center",marginTop:4,flexWrap:"wrap",flexShrink:0}}>
      <div style={{flex:"0 0 auto"}}>
        <div ref={spinRef} onPointerDown={e=>onSpin("down",e)} onPointerMove={e=>onSpin("move",e)}
          onPointerUp={e=>onSpin("up",e)}
          style={{width:38,height:38,borderRadius:38,background:"#f4f2ec",position:"relative",
            border:`1px solid ${C.line}`,cursor:canShoot?"crosshair":"default",opacity:canShoot?1:.45,
            touchAction:"none",boxShadow:"inset -4px -5px 10px rgba(0,0,0,.28)"}}>
          <div style={{position:"absolute",left:"50%",top:"50%",width:"100%",height:1,
            background:"rgba(0,0,0,.12)",transform:"translate(-50%,-50%)"}}/>
          <div style={{position:"absolute",left:"50%",top:"50%",width:1,height:"100%",
            background:"rgba(0,0,0,.12)",transform:"translate(-50%,-50%)"}}/>
          <div style={{position:"absolute",left:"50%",top:"50%",width:`${K.maxTip*2*38}px`,
            height:`${K.maxTip*2*38}px`,borderRadius:"50%",border:"1px dashed rgba(0,0,0,.28)",
            transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
          <div style={{position:"absolute",width:10,height:10,borderRadius:10,background:"#3f6d8c",
            border:"2px solid #fff",boxShadow:"0 1px 3px rgba(0,0,0,.4)",
            left:`calc(50% + ${tip.a*38}px)`,top:`calc(50% - ${tip.b*38}px)`,
            transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
        </div>
        <div style={{fontFamily:F.mono,fontSize:7.5,color:C.muted,marginTop:1,textAlign:"center",width:38}}>
          {tip.b>0.14?"FOLLOW":tip.b<-0.14?"DRAW":"CENTER"}{Math.abs(tip.a)>0.14?(tip.a>0?"·R":"·L"):""}</div>
      </div>

      <div style={{flex:"0 0 auto",width:76}}>
        <input type="range" aria-label="Cue elevation" min="0" max={Math.round(K.maxElev)} step="1" value={Math.round(elev*180/Math.PI)}
          disabled={!canShoot} onChange={e=>setElev(+e.target.value*Math.PI/180)}
          style={{width:76,accentColor:C.accent,opacity:canShoot?1:.45}}/>
        <div style={{fontFamily:F.mono,fontSize:8.5,color:elev>0.02?C.accent:C.muted,marginTop:4}}>
          {Math.round(elev*180/Math.PI)}°/{Math.round(K.maxElev)}°{elev>0.02&&Math.abs(tip.a)>0.12?" CURVE":""}</div>
      </div>

      <div style={{flex:"0 0 auto"}}>
        <div ref={strokeRef} onPointerDown={e=>onStroke("down",e)} onPointerMove={e=>onStroke("move",e)}
          onPointerUp={e=>onStroke("up",e)}
          style={{width:26,height:38,borderRadius:7,border:`1px solid ${C.line}`,background:C.panel,
            position:"relative",overflow:"hidden",touchAction:"none",
            cursor:canShoot?"grab":"default",opacity:canShoot?1:.45}}>
          <div style={{position:"absolute",left:0,right:0,bottom:0,height:`${power*100}%`,
            background:`linear-gradient(180deg,${C.accent},${C.accentDim})`}}/>
          <div style={{position:"absolute",left:0,right:0,bottom:`calc(${power*100}% - 1px)`,height:2,
            background:"#fff",opacity:.5,pointerEvents:"none"}}/>
        </div>
        <div style={{fontFamily:F.mono,fontSize:7.5,color:C.muted,marginTop:1,textAlign:"center",width:26}}>UP</div>
      </div>

      {mv.kind==="active"&&<button onClick={()=>setArmed(a=>!a)} aria-pressed={armed} disabled={!canArm}
        style={{...btn,padding:"5px 9px",borderColor:armed?me.color:C.line,
          background:armed?me.color:C.panel2,color:armed?"#12140f":C.ink,
          opacity:canArm||armed?1:.35,cursor:canArm?"pointer":"default",textAlign:"left"}}>
        <span style={{display:"block",fontSize:12.5,fontWeight:600}}>{mv.name}</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:8.5,
          color:armed?"#12140f":C.muted}}>{me.name.toUpperCase()} · {armed?"ARMED":`${left} LEFT`}</span></button>}

      <button onClick={()=>setSheetOpen(true)}
        style={{...btn,padding:"5px 9px",textAlign:"left",
          borderColor:(fx[turn]||[]).length?me.color:C.line}}>
        <span style={{display:"block",fontSize:12.5,fontWeight:600}}>My sheet</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:8.5,color:C.muted}}>
          {(fx[turn]||[]).length?`${(fx[turn]||[]).length} ACTIVE`:"NOTHING ON YOU"}</span></button>

      {opts.bar&&<button onClick={()=>setBarOpen(true)}
        style={{...btn,padding:"5px 9px",textAlign:"left",
          borderColor:(fx[turn]||[]).length?C.accent:C.line}}>
        <span style={{display:"block",fontSize:12.5,fontWeight:600}}>The bar</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:8.5,color:C.muted}}>
          ${money(turn)} · {Math.round(E.buzz)} BUZZ</span></button>}

      {inHand&&<button onClick={()=>{setInHand(false);redraw();}}
        style={{...btnPrimary,padding:"7px 12px",background:C.warn}}>Place ball</button>}

      <button onClick={()=>shoot(angle,MAXV*K.speedMul*power*power,tip,elev)} disabled={!canShoot}
        style={{...btnPrimary,padding:"6px 14px",opacity:canShoot?1:.35,
          cursor:canShoot?"pointer":"default",textAlign:"center"}}>
        <span style={{display:"block",fontSize:12.5}}>Shoot</span>
        <span style={{display:"block",fontFamily:F.mono,fontSize:9.5,opacity:.75}}>
          {(MAXV*K.speedMul*power*power/17.6).toFixed(1)} MPH</span></button>

      {ownerInfo&&<div title={ownerInfo.cut?"Protect balls wearing your color; sink everyone else's":"Your assigned group"} style={{height:30,display:"inline-flex",alignItems:"center",gap:6,
        padding:"0 8px",borderRadius:8,border:`1px solid ${ownerInfo.color}66`,background:`${ownerInfo.color}10`,flexShrink:0}}>

          <span style={{width:17,height:17,borderRadius:"50%",background:ownerInfo.cut?ownerInfo.color:"transparent",

            fontFamily:F.mono,fontSize:9,color:C.muted}}/>}
        <span style={{fontFamily:F.mono,fontSize:8.5,fontWeight:600,color:ownerInfo.color,whiteSpace:"nowrap"}}>{ownerInfo.label}</span>
      </div>}

      <div style={{display:"flex",gap:5}}>
        <button onClick={()=>setAngle(a=>a-0.0006)} disabled={!canShoot} title="Fine aim left"
          style={{...btnGhost,padding:"5px 8px",opacity:canShoot?1:.4}}>‹</button>
        <button onClick={()=>setAngle(a=>a+0.0006)} disabled={!canShoot} title="Fine aim right"
          style={{...btnGhost,padding:"5px 8px",opacity:canShoot?1:.4}}>›</button>
        <button onClick={()=>setFineAim(v=>!v)} disabled={!canShoot} aria-pressed={fineAim}
          title="Slow the aiming drag for precise adjustments"
          style={{...btnGhost,padding:"5px 9px",opacity:canShoot?1:.4,
            borderColor:fineAim?C.accent:C.line,color:fineAim?C.accent:C.muted}}>
          {fineAim?"Fine aim ON":"Fine aim"}</button>
      </div>

      <div role="status" aria-live="polite" style={{flex:"1 1 150px",minWidth:140,fontSize:11.5,color:C.ink2,lineHeight:1.4}}>
        {over!=null ? <b style={{color:C.good,fontSize:14}}>
            {mode==="eight"&&count>2?`Side ${sideOf(over)+1} takes it.`:`${charOf(seats[over].char).name} takes the rack.`}
            {msg?<span style={{display:"block",color:C.ink2,fontWeight:400,fontSize:12}}>{msg}</span>:null}</b>
        : needCall ? <b style={{color:C.warn}}>You're on the eight — tap a pocket to call it.</b>
        : inHand ? <b style={{color:C.warn}}>Ball in hand — drag it anywhere, then Place ball.</b>
        : moving ? <span style={{color:C.muted}}>Balls rolling…</span>
        : <><b style={{color:C.ink}}>{me.name}</b> to shoot. {msg}</>}
      </div>
      {over!=null&&!endOpen&&<button onClick={()=>setEndOpen(true)} style={btnGhost}>Results</button>}
      {over!=null&&(campaign?<span style={{fontFamily:F.mono,fontSize:10,color:C.muted}}>Settling the rack…</span>:<button onClick={restart} style={btnPrimary}>Rerack</button>)}
      {called!=null&&calledFor===turn&&over==null&&!moving&&<button onClick={()=>{setCalled(null);setCalledFor(null);}} style={btnGhost}>Recall pocket</button>}

    {opts.bar&&barOpen&&human&&over==null&&!moving&&(()=>{
      const preBreak=shotNo===0, band=E.band;
      const bandCol=band==="Over"||band==="Cut off"?C.warn:band==="Sober"?C.muted:C.good;
      const Card=({id,d,spike})=>{
        const on=!spike&&(fx[turn]||[]).some(e=>e.key===id);
        const house=!spike&&!!(campaign&&campaign.freeDrink&&!drinkUsed.current);
        const afford=(house||money(turn)>=d.cost)&&!spentThisTurn&&!on&&!preBreak&&(!spike||spikesLeft(turn)>0);
        const loud=d.fx===d.fx.toUpperCase();
        const look=fxLook(id);
        return(<button key={id} disabled={!afford}
          onClick={()=>{if(spike){setSending(id);}else{buy(id);}setBarOpen(false);}}
          style={{display:"flex",flexDirection:"column",gap:5,padding:"10px 11px",borderRadius:11,
            textAlign:"left",cursor:afford?"pointer":"default",
            border:`1px solid ${on?C.good:sending===id?C.warn:look?`rgba(${look.rgb},.28)`:C.line}`,
            borderTop:look?`2px solid rgba(${look.rgb},.72)`:undefined,
            background:on?"rgba(106,168,138,.10)":C.panel2,
            opacity:afford||on?1:.4}}>
          <span style={{display:"flex",alignItems:"baseline",gap:8}}>
            <b style={{fontSize:13,fontWeight:600,color:C.ink,flex:1}}>{d.name}</b>
            {look&&<span style={{fontFamily:F.mono,fontSize:7.5,letterSpacing:.65,color:look.ink,
              padding:"2px 4px",borderRadius:4,background:`rgba(${look.rgb},.10)`}}>{look.mark}</span>}
            <span style={{fontFamily:F.mono,fontSize:11,color:house?"#efc486":afford?C.good:C.muted}}>
              {house?"ON THE HOUSE":`$${d.cost}`}</span></span>
          <span style={{fontFamily:F.mono,fontSize:8.5,letterSpacing:.5,
            color:look?look.ink:loud?(spike?C.warn:C.accent):C.muted}}>{d.fx.toUpperCase()}</span>
          <span style={{fontSize:10.5,lineHeight:1.4,color:C.muted,display:"-webkit-box",
            WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{d.note}</span>
          <span style={{display:"flex",gap:8,marginTop:"auto",paddingTop:3,
            fontFamily:F.mono,fontSize:8.5,color:C.muted}}>
            {d.buzz!==0&&<span style={{color:d.buzz>0?C.warn:C.good}}>
              {d.buzz>0?"+":""}{d.buzz} BUZZ</span>}
            <span>{d.rack?"ALL RACK":`${d.shots} SHOT${d.shots>1?"S":""}`}</span>
            {on&&<span style={{color:C.good,marginLeft:"auto"}}>ACTIVE</span>}</span>
        </button>);};
      const Shelf=({title,sub,ids,spike})=>(<div style={{marginTop:16}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:8}}>
          <span style={{fontFamily:F.display,fontSize:13,fontWeight:600,letterSpacing:.3,color:C.ink}}>{title}</span>
          <span style={{fontSize:11,color:C.muted}}>{sub}</span></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(184px,1fr))",gap:9}}>
          {ids.filter(id=>!(campaign&&id==="nerve")).map(id=><Card key={id} id={id} d={spike?SPIKES[id]:DRINKS[id]} spike={spike}/>)}</div></div>);
      return(<div onClick={()=>setBarOpen(false)}
        style={{position:"fixed",inset:0,zIndex:90,background:"rgba(4,5,7,.80)",
          display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div onClick={e=>e.stopPropagation()} className="thin modal-card"
          style={{...panel,padding:0,width:"min(860px,100%)",maxHeight:"88vh",overflowY:"auto",
            boxShadow:"0 30px 90px rgba(0,0,0,.75)"}}>

          <div className="modal-head" style={{position:"sticky",top:0,zIndex:2,background:C.panel,
            borderBottom:`1px solid ${C.line}`,padding:"14px 18px",
            display:"flex",alignItems:"center",gap:18,flexWrap:"wrap"}}>
            <div>
              <div style={{fontFamily:F.display,fontSize:19,fontWeight:600,letterSpacing:-.2}}>The bar</div>
              <div style={{fontSize:11,color:preBreak?C.warn:C.muted,marginTop:2}}>
                {preBreak?"Closed until the break is over":
                 spentThisTurn?"You have already bought this turn":"One purchase a turn"}</div></div>

            <div style={{marginLeft:"auto",display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}}>
              <div>
                <div style={{...label,fontSize:9}}>Tab</div>
                <div style={{fontFamily:F.mono,fontSize:20,color:C.good,lineHeight:1.1}}>${money(turn)}</div></div>
              <div style={{minWidth:150}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{...label,fontSize:9}}>{me.name} · tol {me.tol}</span>
                  <span style={{fontFamily:F.mono,fontSize:9.5,color:bandCol}}>
                    {band.toUpperCase()} {Math.round(E.buzz)}</span></div>
                <div style={{height:6,borderRadius:4,background:C.line,marginTop:5,position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",inset:0,width:`${Math.min(100,E.buzz/1.2)}%`,
                    background:`linear-gradient(90deg,${C.good},${bandCol})`}}/>
                  {[20,45,75,95].map(t=><div key={t} style={{position:"absolute",top:0,bottom:0,
                    left:`${t/1.2}%`,width:1,background:"rgba(255,255,255,.22)"}}/>)}</div></div>
              <button onClick={()=>setBarOpen(false)} style={{...btnGhost,padding:"9px 13px"}}>Close</button>
            </div>
          </div>

          <div className="modal-body" style={{padding:"2px 18px 14px"}}>
            <Shelf title="Boost" sub="pure stat trades — no surprises" ids={byRole("boost")}/>
            <Shelf title="Back off" sub="lower buzz and shorten every effect currently on you" ids={byRole("back")}/>
            <Shelf title="Effects" sub="these change a rule, not a number" ids={byRole("effect")}/>
            <Shelf title="On them" sub={spikesLeft(turn)>0
              ?`${spikesLeft(turn)} of ${SPIKE_CAP} left this rack — pick the player after`
              :"you have used both of these this rack"} ids={SPIKE_IDS} spike/>
            {sending&&<div style={{marginTop:14,padding:"11px 13px",borderRadius:10,
              border:`1px solid ${C.warn}`,background:"rgba(201,138,75,.10)",fontSize:12,color:C.ink2,lineHeight:1.5}}>
              <b style={{color:C.warn}}>{SPIKES[sending].name}</b> is on your tab. Close this and press
              <b> On me</b> on whoever is getting it.
              <button onClick={()=>setSending(false)} style={{...btnGhost,padding:"4px 10px",fontSize:11,marginLeft:10}}>Cancel</button></div>}
          </div>
        </div></div>);})()}

    </div>

    {/* ---- YOUR SHEET, RIGHT NOW ------------------------------------------
        Printed sheet on the left, every modifier that is touching it in the
        middle, what the engine is actually using on the right, and how many
        shots each thing has left to live. */}
    {sheetOpen&&(()=>{
      const live=(fx[turn]||[]).map(e=>({e,d:e.data||DRINKS[e.key]||SPIKES[e.key]})).filter(x=>x.d);
      const bf=BAND_FX[E.band]||{};
      const mo=MP.momentum, gain=momentumGain(mo,run[turn]||0);
      const itemD={}; STAT_KEYS.forEach(k=>itemD[k]=0);
      for(const {d} of live) for(const k in (d.stats||{})) itemD[k]+=d.stats[k];
      const bandCol=E.band==="Over"||E.band==="Cut off"?C.warn:E.band==="Sober"?C.muted:C.good;
      const num=(v,suffix)=>`${v}${suffix||""}`;
      const engine=[
        ["Top speed",`${(MAXV*K.speedMul/17.6).toFixed(1)} mph`],
        ["Aim scatter",K.aimErr?`±${(K.aimErr*180/Math.PI).toFixed(2)}°`:"perfect"],
        ["Pace error",`±${(K.speedErr*100).toFixed(2)}%`],
        ["Spin transfer",`${(K.spinMul*100).toFixed(0)}%`],
        ["Tip ceiling",`${(K.maxTip*100).toFixed(0)}% radius`],
        ["Cue elevation",`${Math.round(K.maxElev)}°`],
        ["Preview",`${E.flags.seeAll?5:K.rails} cushions`],
        ["Softest shot",`${(K.minPower*100).toFixed(0)}% power`],
      ];
      return(<div onClick={()=>setSheetOpen(false)}
        style={{position:"fixed",inset:0,zIndex:100,background:"rgba(4,5,7,.80)",
          display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div onClick={e=>e.stopPropagation()} className="thin modal-card"
          style={{...panel,padding:0,width:"min(720px,100%)",maxHeight:"88vh",overflowY:"auto",
            boxShadow:"0 30px 90px rgba(0,0,0,.75)"}}>

          <div className="modal-head" style={{position:"sticky",top:0,zIndex:2,background:C.panel,borderBottom:`1px solid ${C.line}`,
            padding:"14px 18px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
            <span style={{width:30,height:30,borderRadius:30,background:me.color,display:"grid",placeItems:"center",
              fontFamily:F.display,fontWeight:700,fontSize:14,color:"#12140f"}}>{me.name[0]}</span>
            <div>
              <div style={{fontFamily:F.display,fontSize:18,fontWeight:600}}>{me.name}</div>
              <div style={{fontFamily:F.mono,fontSize:9,color:C.muted}}>{me.from.toUpperCase()}</div>
            </div>
            <div style={{marginLeft:"auto",display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
              {opts.bar&&<><div><div style={{...label,fontSize:8.5}}>Buzz</div>
                <div style={{fontFamily:F.mono,fontSize:14,color:bandCol}}>{E.band.toUpperCase()} {Math.round(E.buzz)}</div></div>
              <div><div style={{...label,fontSize:8.5}}>Tab</div>
                <div style={{fontFamily:F.mono,fontSize:14,color:C.good}}>${money(turn)}</div></div>
              <div><div style={{...label,fontSize:8.5}}>On them left</div>
                <div style={{fontFamily:F.mono,fontSize:14,color:spikesLeft(turn)?C.ink2:C.warn}}>{spikesLeft(turn)} / {SPIKE_CAP}</div></div></>}
              {mv.kind==="active"&&<div><div style={{...label,fontSize:8.5}}>{mv.name}</div>
                <div style={{fontFamily:F.mono,fontSize:14,color:left?C.ink2:C.muted}}>{left} left</div></div>}
              <button onClick={()=>setSheetOpen(false)} style={{...btnGhost,padding:"9px 13px"}}>Close</button>
            </div>
          </div>

          <div className="modal-body" style={{padding:"14px 18px 18px"}}>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:520,fontSize:12}}>
              <thead><tr>{["Stat","Printed","Drinks & spikes","Buzz band",MP.momentum?"Run":null,"Now","Change"]
                .filter(Boolean).map(h=><th key={h} style={{...label,fontSize:8.5,textAlign:h==="Stat"?"left":"right",
                  padding:"7px 8px",borderBottom:`1px solid ${C.line}`}}>{h}</th>)}</tr></thead>
              <tbody>{STATS.filter(([k])=>k!=="tol").map(([k,n])=>{
                const base=me[k], it=itemD[k]||0, bd=(bf.stats||{})[k]||0, now=E.st[k], dl=now-base;
                const cell=(v,mode)=><td key={mode} style={{padding:"7px 8px",borderBottom:`1px solid ${C.line}`,
                  textAlign:"right",fontFamily:F.mono,
                  color:mode==="now"?C.ink:mode==="delta"?(v>0?C.good:v<0?C.warn:C.muted)
                    :v>0?C.good:v<0?C.warn:C.muted}}>
                  {mode==="plain"||mode==="now"?Math.round(v):plus(Math.round(v))}</td>;
                return(<tr key={k}>
                  <td style={{padding:"7px 8px",borderBottom:`1px solid ${C.line}`,fontWeight:600,color:C.ink}}>{n}</td>
                  {cell(base,"plain")}{cell(it,"item")}{cell(bd,"band")}
                  {MP.momentum?cell(gain,"run"):null}{cell(now,"now")}{cell(dl,"delta")}</tr>);})}
                <tr><td style={{padding:"7px 8px",fontWeight:600,color:C.ink2}}>TOLERANCE</td>
                  <td colSpan={MP.momentum?5:4} style={{padding:"7px 8px",textAlign:"right",fontFamily:F.mono,color:C.muted}}>
                    {me.tol} — resists every change above, in both directions</td>
                  <td/></tr>
              </tbody></table></div>

            <div style={{...label,fontSize:9,margin:"18px 0 8px"}}>What is on you, and for how long</div>
            {live.length||gain>0||armed?<div style={{display:"grid",gap:7}}>
              {armed&&<div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:9,
                background:`${me.color}18`,border:`1px solid ${me.color}`}}>
                <span style={{fontFamily:F.mono,fontSize:7.5,color:me.color,width:52}}>SPECIAL</span>
                <b style={{fontSize:12.5,flex:1}}>{mv.name}</b>
                <span style={{fontFamily:F.mono,fontSize:9,color:C.ink2}}>ARMED · FIRES THIS SHOT</span></div>}
              {gain>0&&<div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:9,
                background:`${me.color}12`,border:`1px solid ${me.color}55`}}>
                <span style={{fontFamily:F.mono,fontSize:7.5,color:me.color,width:52}}>RUN</span>
                <span style={{flex:1}}><b style={{fontSize:12.5}}>House Money</b>
                  <span style={{display:"block",fontFamily:F.mono,fontSize:9,color:C.muted}}>
                    +{gain} to every stat · {run[turn]} balls potted this rack</span></span>
                <span style={{fontFamily:F.mono,fontSize:9,color:gain>=mo.cap?C.good:C.ink2}}>
                  {gain>=mo.cap?"AT THE CAP":"REST OF RACK"}</span></div>}
              {live.map(({e,d})=>{const look=fxLook(e.key), col=e.hostile?C.warn:look.ink;
                const st2=Object.entries(d.stats||{}).map(([k,v])=>`${k.toUpperCase()} ${plus(v)}`).join(" · ");
                return(<div key={e.key} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",
                  borderRadius:9,background:`rgba(${look.rgb},.09)`,border:`1px solid rgba(${look.rgb},.35)`,
                  borderLeft:`3px solid ${col}`}}>
                  <span style={{fontFamily:F.mono,fontSize:7.5,color:col,width:52}}>{look.mark}</span>
                  <span style={{flex:1,minWidth:0}}>
                    <b style={{fontSize:12.5,color:C.ink}}>{d.name}</b>
                    {e.hostile?<span style={{fontFamily:F.mono,fontSize:8,color:C.warn}}> · ON YOU</span>:null}
                    <span style={{display:"block",fontFamily:F.mono,fontSize:9,color:C.muted,marginTop:2}}>
                      {st2||"changes a rule, not a number"}</span></span>
                  <span style={{fontFamily:F.mono,fontSize:11,color:e.shots<=1?C.warn:C.ink2,whiteSpace:"nowrap"}}>
                    {e.shots>900?"ALL RACK":`${e.shots} SHOT${e.shots>1?"S":""} LEFT`}</span></div>);})}
            </div>:<div style={{fontSize:12,color:C.muted}}>Nothing. You are playing your printed sheet.</div>}

            <div style={{...label,fontSize:9,margin:"18px 0 8px"}}>What the engine is using right now</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:7}}>
              {engine.map(([n,v])=><div key={n} style={{padding:"8px 10px",borderRadius:9,background:C.panel2,
                border:`1px solid ${C.line}`}}>
                <div style={{...label,fontSize:8}}>{n}</div>
                <b style={{fontFamily:F.mono,fontSize:13,color:C.ink}}>{num(v)}</b></div>)}
            </div>
          </div>
        </div></div>);})()}

    {/* ---- THE END CARD ------------------------------------------------------
        Close it with the pill and the table is still there behind you, with
        Rerack in the strip below and Quit up in the header. Nothing is lost by
        dismissing it — the Results button brings it straight back. */}
    {over!=null&&endOpen&&(()=>{
      const TEAL="#43d5a8";
      const teamGame=mode==="eight"&&count>2;
      const winName=teamGame?`Side ${sideOf(over)+1}`:charOf(seats[over].char).name;
      const scoreOf=i=>mode==="cutthroat"?upCount(i):potted(i);
      const rows=seats.slice(0,count).map((s,i)=>({i,ch:charOf(s.char),score:scoreOf(i),
        cpu:s.kind==="cpu",won:teamGame?sideOf(i)===sideOf(over):i===over}))
        .sort((a,b)=>(b.won-a.won)||(b.score-a.score));
      return(<div onClick={()=>setEndOpen(false)}
        style={{position:"fixed",inset:0,zIndex:130,background:"rgba(4,6,8,.74)",
          display:"flex",alignItems:"center",justifyContent:"center",padding:18,
          animation:"ck-endveil .2s ease-out both"}}>
        <div onClick={e=>e.stopPropagation()}
          style={{position:"relative",width:"min(470px,100%)",padding:"32px 32px 28px",
            background:"#101619",border:"1px solid #24333a",borderRadius:20,textAlign:"center",
            boxShadow:"0 34px 100px rgba(0,0,0,.82)",animation:"ck-endcard .26s cubic-bezier(.16,.85,.3,1) both"}}>
          <button onClick={()=>setEndOpen(false)} title="Look at the table"
            style={{...btnGhost,position:"absolute",top:14,right:14,padding:"5px 12px",fontSize:11,
              borderRadius:16,background:"#1a2226",color:C.ink2}}>Close</button>

          <div style={{fontFamily:F.display,fontWeight:700,letterSpacing:1.5,color:TEAL,
            fontSize:"clamp(30px,7.6vw,44px)",lineHeight:1.02}}>GAME OVER</div>
          <div style={{fontFamily:F.display,fontWeight:600,color:TEAL,marginTop:7,
            fontSize:"clamp(16px,4.2vw,22px)"}}>{winName} takes the dish</div>
          <div style={{fontSize:12.5,color:C.ink2,marginTop:9,lineHeight:1.5,maxWidth:330,margin:"9px auto 0"}}>
            {msg||"The rack is settled."}</div>

          <div style={{margin:"24px auto 26px",display:"grid",gap:11,maxWidth:330}}>
            {rows.map((r,k)=>(
              <div key={r.i} style={{display:"flex",alignItems:"center",gap:12,opacity:r.won?1:.46}}>
                <span style={{fontFamily:F.mono,fontSize:12.5,color:C.muted,width:12,textAlign:"right"}}>{k+1}</span>
                <span style={{width:13,height:13,borderRadius:3,background:r.ch.color,flexShrink:0}}/>
                <span style={{flex:1,textAlign:"left",fontSize:15,fontWeight:500,
                  color:r.won?C.ink:C.ink2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {r.ch.name}{r.cpu?"":" (you)"}</span>
                <b style={{fontFamily:F.display,fontSize:17,color:r.won?C.ink:C.muted}}>{r.score}</b>
              </div>))}
          </div>
          <div style={{fontFamily:F.mono,fontSize:8.5,color:C.muted,letterSpacing:1,marginTop:-14,marginBottom:20}}>
            {mode==="cutthroat"?"BALLS STILL UP":"BALLS POTTED"} · {shotNo} SHOTS
          </div>

          <div style={{display:"flex",gap:11,justifyContent:"center",flexWrap:"wrap"}}>
            {campaign
              ? <span style={{fontFamily:F.mono,fontSize:10.5,color:C.muted}}>The rack is banked either way — take your time.</span>
              : <button onClick={()=>{setEndOpen(false);restart();}}
                  style={{...btnPrimary,background:"#dde3e7",color:"#101619",padding:"13px 24px"}}>Play again</button>}
            <button onClick={onQuit}
              style={{...btn,padding:"13px 22px",background:"#151d21",borderColor:"#28353b"}}>{campaign?"King hub":"Main menu"}</button>
          </div>
        </div>
      </div>);})()}
  </Shell>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
