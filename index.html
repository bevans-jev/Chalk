const {useState,useRef,useEffect,useMemo,useCallback}=React;

/* ============================================================================
   CHALK — pool, with a roster, a physics engine, and a bar.

   ONE FILE, NO BUILD STEP. React + Babel from a CDN, everything else is here.

   HOW THE PIECES FIT
     A character has six stats (0-100) plus Tolerance. Drinks and the buzz band
     rewrite those stats into EFFECTIVE stats. kit() turns effective stats into
     the numbers the engine runs on — cue speed, aim scatter, tip ceiling, cue
     elevation, how far ahead you can see. Anything that changes a RULE rather
     than a number sets a flag in RULE, which both the shot loop and the aim
     preview read, so what you are shown is always what you get.

   SECTIONS
     1   CONTENT ....... roster, stats, specials, tables, game types, bots
     1b  THE BAR ....... buzz bands, drinks you buy yourself, spikes you buy
                         for somebody else, tolerance maths
     2   CLOTHS ........ table skins, flat colour only
     3   TOKENS ........ one palette, one type scale, shared style objects
     4   TABLE ART ..... cushion geometry, jaws, pockets, balls, cue stick
     5   PHYSICS ....... sliding/rolling, spin, cushions, throw, prediction
     6   RULES ......... racking, cutthroat ownership, spotting
     7   AI ............ ghost-ball shot picker, pocket calling
     8   SCREENS ....... home, how to play, table, setup
     9   GAME .......... the match itself: turns, fouls, the bar, the controls

   UNITS
     Table space is inches. A regulation playfield is 100 x 50 and a ball is
     2.25 across, so every constant in here is a real measurement you can check
     against a real table. Speeds are inches/second; 440 is a 25 mph break.
   ========================================================================== */

// ===== 1. CONTENT ============================================================
// Six stats, and each one gates a DIFFERENT capability, so a high number in one
// can never paper over a low number in another. Power gets you there, Stroke
// hits the line, Touch delivers the speed you asked for, English caps how far
// off centre you may strike, Curve caps how high you may raise the butt, and Eye
// decides how much of the shot you get shown before you play it.
//   POWER   top cue speed
//   STROKE  how closely the ball leaves on the line you aimed
//   TOUCH   how closely the speed matches the speed you set
//   ENGLISH how far off centre the tip may go before it miscues
//   CURVE   how far the cue may be raised — this is the masse stat
//   EYE     cushions previewed, and whether you see the object and cue-out lines
// Nobody is good at everything. Fargo is the strongest overall and still can't
// bend a ball, which is exactly why Pillars and Gates exist.
// Stats are 0-100 now. Ten buckets was too coarse once drinks started shoving
// numbers around; a drink worth 18 points has to land somewhere real. Effective
// stats can also run past 100 or below 0 — a whiskey-fed Breck at 118 power is a
// legitimate state, and anything under about 20 is where the game starts
// refusing to do things for you.
// TOLERANCE is resistance to CHANGE, in both directions. High tolerance climbs
// slowly and sobers up slowly: stable, committed, hard to sabotage. Low
// tolerance spikes off one drink and a single cigarette drags it most of the way
// back: volatile, tunable shot to shot, and very easy for a rival to ruin.
const CHARS={
  fargo:{name:"Fargo",from:"The house legend",color:"#c9a227",
    pow:70,stroke:94,touch:86,english:78,curve:78,eye:86,tol:68,
    move:{name:"Every Route",kind:"active",uses:1,tag:"once a rack",
      text:"Forty years on this table and he remembers every route on it. The next shot leaves with no stroke error whatsoever and you see five cushions ahead. Point it at the pocket and it goes."}},
  mordecai:{name:"Mordecai",from:"The dirtbag",color:"#6f8fbf",
    pow:52,stroke:76,touch:58,english:96,curve:88,eye:40,tol:80,
    move:{name:"Dead Rail",kind:"active",uses:1,tag:"once a rack",
      text:"He knows which rails on this table are shot. For one shot every cushion goes dead and returns almost nothing, so everything dies where it lands."}},

    pow:38,stroke:58,touch:96,english:66,curve:96,eye:40,tol:96,
    move:{name:"Featherweight",kind:"passive",uses:0,tag:"always on",
      text:"She hits so softly the spin never wears off. Sidespin decays at a quarter of the normal rate, so english that would be gone by the first rail is still working at the third."}},
  reyes:{name:"Reyes",from:"Calls every shot in Spanish",color:"#4fa98d",
    pow:70,stroke:94,touch:66,english:38,curve:28,eye:56,tol:24,
    move:{name:"La Recta",kind:"passive",uses:0,tag:"always on",
      text:"Nobody follows a word he says and it does not matter, because he tells you exactly where it is going every time. Any shot within ten degrees of straight leaves with zero stroke error."}},
  breck:{name:"Breck",from:"The rush chairman",color:"#d07b43",
    pow:98,stroke:66,touch:46,english:46,curve:28,eye:66,tol:90,
    move:{name:"Wrecking Ball",kind:"passive",uses:0,tag:"always on",
      text:"One idea, and it is a good one. His break ignores the power ceiling completely and leaves the tip at thirty miles an hour."}},
  lathe:{name:"Lathe",from:"Builds the cues",color:"#4ca7b8",
    pow:58,stroke:86,touch:58,english:86,curve:66,eye:40,tol:50,
    move:{name:"True Stroke",kind:"passive",uses:0,tag:"always on",
      text:"He turned that shaft himself and it does not deflect. Side english never pushes his cue ball off the aiming line."}},
  wren:{name:"Wren",from:"Nobody caught the name",color:"#c87898",
    pow:58,stroke:76,touch:76,english:46,curve:38,eye:96,tol:36,
    move:{name:"Perch",kind:"active",uses:2,tag:"twice a rack",
      text:"Twice a rack the cue ball stops dead where it makes contact, whatever spin was on it. Perfect position from anywhere, if you know where you want to be."}},
};
const CHAR_IDS=Object.keys(CHARS);
const charOf=id=>CHARS[id]||CHARS[CHAR_IDS[0]];   // never blow up on a stale id
const STATS=[["pow","POWER"],["stroke","STROKE"],["touch","TOUCH"],
             ["english","ENGLISH"],["curve","CURVE"],["eye","EYE"],["tol","TOLERANCE"]];
const STAT_KEYS=["pow","stroke","touch","english","curve","eye"];
// Every stat turned into the number the engine actually uses.
// A character's PASSIVE is keyed off their move name. This lives apart from
// kit() because kit works on effective stats (which drinks and buzz rewrite)
// while a passive belongs to the person and never changes.
function passiveOf(ch){
  const m=ch.move.kind==="passive"?ch.move.name:"";
  return{
    perfectStraight: m==="La Recta",       // Reyes: near-straight shots leave clean
    freeBreak:       m==="Wrecking Ball",  // Breck: the break ignores the ceiling
    noSquirt:        m==="True Stroke",    // Lathe: side english never deflects
    spinHold:        m==="Featherweight",  // Cricket: sidespin barely decays
  };
}

// Effective stats -> the numbers the engine actually runs on.
function kit(st,flags){
  const f=flags||{};
  const cl=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
  const eng=cl(st.english,0,130)*(f.miscue?0.6:1);
  return{
    speedMul: cl(0.50+0.0062*st.pow,0.40,1.35),   // pow 38 -> 18mph, 70 -> 23mph, 98 -> 28mph
    aimErr:   Math.max(0,0.0000495*(105-st.stroke))*(f.strokeWreck?2.4:1),
    speedErr: Math.max(0,0.0011*(102-st.touch)),
    maxTip:   cl(0.10+0.0040*eng,0.08,0.52),
    maxElev:  cl(2+0.50*st.curve,0,60),
    rails:    st.eye>=78?3:st.eye>=48?2:1,
    objLine:  st.eye>=38, cueLine: st.eye>=68, stopMark: st.eye>=48,
    minPower: f.noSoft?0.60:0.02,
  };
}

// ===== 1b. THE BAR ===========================================================
// A drink is a TRADE, never a buff. Some trade stats. The good ones trade an
// ability — they add or delete something you can do, which is a bigger deal than
// any number. Every one of them adds Buzz, and Buzz is the shared cost.
//   0-25   SOBER    your sheet as printed
//   25-55  LOOSE    a small bonus everywhere — drinking a little is correct
//   55-85  LIT      the drink's ability at full strength, and its costs land
//   85-100 OVER     double vision, shaking hands, miscues
//   100+   CUT OFF  you don't aim any more; the game plays a wild shot for you
const BANDS=[[20,"Sober"],[45,"Loose"],[75,"Lit"],[95,"Over"],[999,"Cut off"]];

};

// ===== 4. TABLE ART ==========================================================
// Real table geometry, drawn flat.
//   RW  rail width from cushion nose to the outside edge of the frame
//   CD  cushion depth — how far the rubber stands proud of the rail
//   M_C / M_S  how far back a cushion is cut from a corner / side pocket
//   JAW how much wider the throat gets between the nose and the back
// Cushions are separate segments per rail. Each end that meets a pocket is
// mitred outward into the throat; each end that meets another cushion (a sealed
// corner, as on Offset) is mitred at 45° so the two meet flush.
const RW=6.6, CD=2.2, M_C=2.24, M_S=2.5, JAW=1.5, BR=1.125;
const FRAME="#1b1e22", FRAME_EDGE="#000000", POCKET="#030405";

function makePockets(g){
  const on=(v,e)=>Math.abs(v-e)<1e-6;
  return g.pockets.map(p=>{
    if(p.cx!=null)return{...p,corner:true,r:p.r||2.85,capt:p.capt||(p.r||2.85)*1.1};
    const ax=on(p.x,0)||on(p.x,g.w), ay=on(p.y,0)||on(p.y,g.h), corner=ax&&ay;
    let nx=0,ny=0;
    if(corner){nx=(p.x<g.w/2?-1:1)*0.7071; ny=(p.y<g.h/2?-1:1)*0.7071;}
    else if(ay) ny=p.y<g.h/2?-1:1; else nx=p.x<g.w/2?-1:1;
    const off=corner?0.85:0.7, r=corner?2.9:2.6;
    return{x:p.x,y:p.y,corner,cx:p.x+nx*off,cy:p.y+ny*off,r,capt:r*(corner?1.12:1.06)};});
}

// One polygon per cushion segment, in table coordinates.
function cushions(g){
  if(g.boundary)return[];
  const near=(a,b)=>Math.abs(a-b)<1e-6;
  const rails=[
    {L:g.w,on:p=>near(p.y,0),   at:p=>p.x, map:(t,d)=>[t,-d]},
    {L:g.w,on:p=>near(p.y,g.h), at:p=>p.x, map:(t,d)=>[t,g.h+d]},
    {L:g.h,on:p=>near(p.x,0),   at:p=>p.y, map:(t,d)=>[-d,t]},
    {L:g.h,on:p=>near(p.x,g.w), at:p=>p.y, map:(t,d)=>[g.w+d,t]},
  ];
  const out=[];
  for(const r of rails){
    const ts=g.pockets.filter(r.on).map(r.at).sort((a,b)=>a-b);
    const head=ts.some(t=>near(t,0)), tail=ts.some(t=>near(t,r.L));
    const mid=ts.filter(t=>!near(t,0)&&!near(t,r.L));
    const segs=[]; let cur=head?M_C:0, ja=head;
    for(const t of mid){segs.push({a:cur,b:t-M_S,ja,jb:true}); cur=t+M_S; ja=true;}
    segs.push({a:cur,b:tail?r.L-M_C:r.L,ja,jb:tail});
    for(const s of segs){
      if(s.b-s.a<0.4)continue;
      const ab=s.ja?s.a-JAW:s.a-CD, bb=s.jb?s.b+JAW:s.b+CD;
      out.push([r.map(s.a,0),r.map(s.b,0),r.map(bb,CD),r.map(ab,CD)]);}
  }
  return out;
}

// ---- pattern builders -------------------------------------------------------
// A real cheetah spot is a solid blob with a slightly ragged edge, not an
// ellipse. Two overlapping ellipses at different angles break the outline, which
// is the whole difference between "printed fur" and "polka dots".
function spot(x,y,r,rot,ink,i){
  return(<g key={"s"+i} transform={`rotate(${rot} ${x} ${y})`} fill={ink}>
    <ellipse cx={x} cy={y} rx={r} ry={r*0.83}/>
    <ellipse cx={x+r*0.30} cy={y-r*0.22} rx={r*0.72} ry={r*0.62} transform={`rotate(${rot*-1.7} ${x} ${y})`}/>
  </g>);}

// A leopard rosette is a ring of separate petals around a warmer centre — never
// a dashed circle. Petals vary in length and thickness and the ring is broken.
function rosette(cx,cy,r,rot,c,i){
  const petals=[];
  const gaps=[0.18,0.62];                        // where the ring breaks
  for(let k=0;k<7;k++){
    const t=k/7;
    if(gaps.some(gp=>Math.abs(t-gp)<0.075))continue;
    const a=t*Math.PI*2+rot;
    const px=cx+Math.cos(a)*r*0.88, py=cy+Math.sin(a)*r*0.74;
    const pr=r*(0.27+0.10*Math.sin(k*2.3+i));
    petals.push(<ellipse key={k} cx={px} cy={py} rx={pr} ry={pr*0.66}
      transform={`rotate(${a*57.3+90} ${px} ${py})`} fill={c.ink}/>);
  }
  return(<g key={"r"+i}>
    <ellipse cx={cx} cy={cy} rx={r*0.66} ry={r*0.54} fill="#8a5c28" opacity=".55"/>
    {petals}</g>);}

// Spiral tie-dye is made by folding: colour sweeps round in WEDGES, so the dye
// changes with angle, not with radius. Drawing it as short arc segments coloured
// by sector is what gives the pinwheel its wedges and its white resist lines.
function dyeWedges(cols){
  const segs=[],TURNS=5.4,STEPS=460,cx=50,cy=29;
  for(let i=0;i<STEPS;i++){
    const t0=i/STEPS, t1=(i+1)/STEPS;
    const a0=t0*Math.PI*2*TURNS, a1=t1*Math.PI*2*TURNS;
    const r0=2+t0*46, r1=2+t1*46;
    const wedge=Math.floor((((a0/(Math.PI*2))%1)+1)%1*cols.length*1.5);
    const resist=Math.abs((((a0/(Math.PI*2))%1)*cols.length*1.5)%1-0.5)>0.44;
    segs.push({
      d:`M${(cx+Math.cos(a0)*r0).toFixed(2)} ${(cy+Math.sin(a0)*r0*0.62).toFixed(2)}`+
        `L${(cx+Math.cos(a1)*r1).toFixed(2)} ${(cy+Math.sin(a1)*r1*0.62).toFixed(2)}`,
      c:resist?"#fdf7e6":cols[wedge%cols.length],
      w:9.6+2.2*Math.sin(i*0.21)});
  }
  return segs;}

function ClothDefs({id,cl}){const c=CLOTHS[cl]||CLOTHS.onyx;
  return(<>
    {(c.kind==="cheetah"||c.kind==="leopard")&&

        <feTurbulence type="fractalNoise" baseFrequency=".34 .24" numOctaves="2" seed="13" result="f"/>
        <feDisplacementMap in="SourceGraphic" in2="f" scale=".78" xChannelSelector="R" yChannelSelector="B"/>
      </filter>}

    {c.kind==="cheetah"&&<pattern id={"pat"+id} width="11" height="11" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill={c.base}/>
      {[[2.0,1.7,.62,.48,18],[6.1,3.4,.44,.62,-24],[9.2,1.4,.36,.30,40],
        [4.0,6.9,.56,.42,-12],[8.3,8.1,.48,.60,30],[1.4,9.0,.40,.34,-38],
        [10.4,5.6,.30,.40,10],[5.8,10.5,.50,.36,-5]].map(([x,y,rx,ry,r],k)=>
        <ellipse key={k} cx={x} cy={y} rx={rx} ry={ry} fill={c.ink}
          transform={`rotate(${r} ${x} ${y})`} opacity={.62+(k%3)*.08}/>)}
    </pattern>}
    {c.kind==="leopard"&&<pattern id={"pat"+id} width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill={c.base}/>
      {/* a rosette is a pale centre inside a BROKEN ring — arcs, not petals */}
      {[[3.2,3.0,1.9,14],[9.4,6.4,2.2,-22],[5.8,11.0,1.7,36],[12.4,12.1,1.5,-8],
        [12.0,2.0,1.4,25]].map(([x,y,r,rot],k)=>(
        <g key={k} transform={`rotate(${rot} ${x} ${y})`} opacity=".72">
          <ellipse cx={x} cy={y} rx={r*.58} ry={r*.48} fill={c.mid}/>
          {[[0,150],[170,120],[300,45]].map(([a0,sweep],q)=>{
            const rr=r*.86, s0=a0*Math.PI/180, s1=(a0+sweep)*Math.PI/180;
            const x0=x+Math.cos(s0)*rr, y0=y+Math.sin(s0)*rr*.85;

            return <path key={q} d={`M${x0} ${y0} A ${rr} ${rr*.85} 0 ${sweep>180?1:0} 1 ${x1} ${y1}`}

        </g>))}
    </pattern>}
    {c.kind==="zebra"&&<pattern id={"pat"+id} width="34" height="26" patternUnits="userSpaceOnUse">
      <rect width="34" height="26" fill={c.base}/>
      {[[6,1.5,.75,1.9],[19,2.0,1.15,1.1],[29,1.3,1.7,.8]].map(([cx,w1,w2,w3],k)=>
        <path key={k} fill={c.ink} opacity=".8" d={`M${cx-w1} 0 C${cx+3-w2} 9, ${cx-3.4-w2} 17, ${cx+1.4-w3} 26
          L${cx+1.4+w3} 26 C${cx-3.4+w2} 17, ${cx+3+w2} 9, ${cx+w1} 0 Z`}/>)}
      {[[12.5,.36,.2],[24.5,.28,.44]].map(([cx,w1,w3],k)=>
        <path key={"f"+k} fill={c.ink} opacity=".55"
          d={`M${cx-w1} 0 C${cx+2.2} 9, ${cx-2.7} 17, ${cx+1-w3} 26
             L${cx+1+w3} 26 C${cx-2.2} 17, ${cx+2.9} 9, ${cx+w1} 0 Z`}/>)}
    </pattern>}
    {c.kind==="dye"&&<radialGradient id={"pat"+id} cx="38%" cy="34%" r="86%">
      {c.cols.map((col,k)=><stop key={k} offset={`${(k/(c.cols.length-1)*100).toFixed(0)}%`} stopColor={col}/>)}
    </radialGradient>}
    {/* the weave. every cloth gets it, at a contrast you feel rather than see */}
    <pattern id={"weave"+id} width="1.1" height="1.1" patternUnits="userSpaceOnUse">

      <path d="M0 0 H1.1" stroke="#fff" strokeWidth=".28" opacity=".045"/>
      <path d="M0 .55 H1.1" stroke="#000" strokeWidth=".28" opacity=".07"/>
      <path d="M.55 0 V1.1" stroke="#000" strokeWidth=".22" opacity=".045"/>
    </pattern>

// The heat field. White sources only — the filter does every bit of the colour.
function HeatCloth({id,g,balls}){
  const trails=useRef([]), last=useRef(new Map());
  const [,fade]=useState(0);
  const now=typeof performance!=="undefined"?performance.now():0;
  const live=(balls||[]).filter(b=>!b.in);
  if(balls&&live.length){
    for(const b of live){
      const q=last.current.get(b.n), sp=Math.hypot(b.vx||0,b.vy||0);
      if(q){const d=Math.hypot(b.x-q.x,b.y-q.y);
        if(d>0.16)trails.current.push({x1:q.x,y1:q.y,x2:b.x,y2:b.y,t:now,p:Math.min(1,0.22+sp/210)});}
      last.current.set(b.n,{x:b.x,y:b.y});}
    const up=new Set(live.map(b=>b.n));
    for(const n of last.current.keys())if(!up.has(n))last.current.delete(n);
    trails.current=trails.current.filter(t=>now-t.t<1600).slice(-150);}
  useEffect(()=>{ if(!balls)return; let raf=0;
    const tick=()=>{const t=performance.now();
      trails.current=trails.current.filter(q=>t-q.t<1600);
      fade(v=>v+1); raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick); return()=>cancelAnimationFrame(raf);},[balls]);
  const spots=live.length?live:[{n:"a",x:g.w*.27,y:g.h*.36},{n:"b",x:g.w*.51,y:g.h*.56},
    {n:"c",x:g.w*.57,y:g.h*.5},{n:"d",x:g.w*.76,y:g.h*.3}];
  // crowding drives the reading: a ball with neighbours burns hotter and wider
  const heat=b=>spots.reduce((s2,q)=>q===b?s2:s2+Math.max(0,1-Math.hypot(q.x-b.x,q.y-b.y)/8.5),0);
  const links=[];for(let i=0;i<spots.length;i++)for(let j=i+1;j<spots.length;j++){
    const d=Math.hypot(spots[i].x-spots[j].x,spots[i].y-spots[j].y);if(d<12.5)links.push({a:spots[i],b:spots[j],d});}
  return(<g clipPath={`url(#bed${id})`} pointerEvents="none" shapeRendering="geometricPrecision" style={{mixBlendMode:"screen"}}>
    {/* cold field first, so the empty cloth is not simply black */}
    {spots.map(b=><ellipse key={"cold"+b.n} cx={b.x} cy={b.y} rx="11" ry="9"
      fill={`url(#heatCold${id})`} filter={`url(#heatSoft${id})`}/>)}
    {/* Close balls share one continuous thermal body instead of showing a row
        of separate circular pixels. The bridge fades before the spots separate. */}
    {links.map((q,i)=><line key={"bridge"+i} x1={q.a.x} y1={q.a.y} x2={q.b.x} y2={q.b.y}
      stroke="#e84b37" strokeWidth={Math.max(1.2,7.2-q.d*.42)} strokeLinecap="round"
      opacity={Math.max(.08,.5-q.d*.032)} filter={`url(#heatBridge${id})`}/>)}
    {/* where balls have been */}
    {trails.current.map((t,i)=>{const age=Math.min(1,(now-t.t)/1600);
      return <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2}
        stroke={age>0.55?"#7d1f86":age>0.3?"#c8264f":"#ff7a1e"}
        strokeWidth={(0.8+2.0*t.p)*(1-age*0.55)} strokeLinecap="round"
        opacity={(1-age)*(0.3+0.4*t.p)} filter={`url(#heatBlur${id})`}/>;})}
    {/* and the balls themselves, hotter where they are packed together */}
    {spots.map(b=>{const c2=heat(b), r=4.25+Math.min(3.6,c2*1.55);
      return(<g key={b.n}>
        <ellipse cx={b.x} cy={b.y} rx={r*1.62} ry={r*1.48} fill={`url(#heatSpot${id})`}
          opacity={0.34+Math.min(0.28,c2*0.09)} filter={`url(#heatSoft${id})`}/>
        <ellipse cx={b.x} cy={b.y} rx={r} ry={r*.96} fill={`url(#heatSpot${id})`}
          opacity={Math.min(1,0.84+c2*0.07)} filter={`url(#heatFeather${id})`}/>
        <ellipse cx={b.x} cy={b.y} rx={r*.52} ry={r*.49} fill={`url(#heatSpot${id})`}
          opacity={Math.min(1,.72+c2*.08)}/></g>);})}
  </g>);}

function Ball({b,id,ring}){const {num,col,group}=ballInfo(b.n);
  const cue=b.n===0, r=BR;
  // The pole, projected. Its tilt decides where the numbered cap sits and how
  // wide the stripe reads — pole facing up gives you a white cap ringed with
  // colour, pole lying flat gives you the classic band across the middle.
  const px=b.px||0, py=b.py||0, pz=b.pz==null?1:b.pz;
  const pl=Math.hypot(px,py);
  const ang=Math.atan2(py,px)*180/Math.PI;
  const capOn=Math.abs(pz)>0.42;
  const capX=px*r*0.58, capY=py*r*0.58, capR=r*0.40;
  const numOn=Math.abs(pz)>0.62;
  const nAng=Math.atan2(b.qy||0,b.qx||1)*180/Math.PI;
  const band=Math.min(r,r*0.60/Math.max(0.30,pl));
  return(<g transform={`translate(${b.x} ${b.y})`}>
    <ellipse cx=".18" cy=".26" rx={r*.95} ry={r*.9} fill="#000" opacity=".3" filter={`url(#soft${id})`}/>
    <circle r={r} fill={cue||group==="stripe"?"#f4f2ec":col}/>
    {group==="stripe"&&!cue&&<rect x={-band} y={-r} width={band*2} height={r*2} fill={col}
      transform={`rotate(${ang})`} clipPath={`url(#bclip${id})`}/>}
    {capOn&&!cue&&<g transform={`rotate(${ang} ${capX} ${capY})`}>
      <ellipse cx={capX} cy={capY} rx={capR*Math.max(0.5,Math.abs(pz))} ry={capR} fill="#faf8f3"
        clipPath={`url(#bclip${id})`}/></g>}
    {capOn&&cue&&<ellipse cx={capX} cy={capY} rx={capR*0.34*Math.abs(pz)} ry={capR*0.34}
      fill="#c0402f" opacity=".8" transform={`rotate(${ang} ${capX} ${capY})`}/>}
    {numOn&&!cue&&<text x={capX} y={capY+r*.145} textAnchor="middle" fontFamily={F.body}
      fontWeight="700" fontSize={r*.5} fill="#17191c" opacity={Math.min(1,(Math.abs(pz)-0.62)*4)}
      transform={`rotate(${nAng} ${capX} ${capY})`}>{num}</text>}
    {b.power&&<PowerSkin type={b.power} r={r} id={id}/>} 
    <circle r={r} fill={`url(#sph${id})`}/>
    <circle cx={-r*.33} cy={-r*.35} r={r*.2} fill="#fff" opacity=".42"/>
    {ring&&<circle r={r+.24} fill="none" stroke={ring} strokeWidth=".34"/>}
    {b.power&&<g pointerEvents="none">
      <circle r={r+0.43} fill="none" stroke={BALLS[b.power].color} strokeWidth=".24" strokeOpacity=".96"/>
      {b.power==="ghost"&&<circle r={r+.67} fill="none" stroke={BALLS[b.power].color} strokeWidth=".12" strokeOpacity=".32"/>}
      <circle cx={r*.7} cy={-r*.7} r=".43" fill="#0b0d10" stroke={BALLS[b.power].color} strokeWidth=".13"/>
      <text x={r*.7} y={-r*.7+.18} textAnchor="middle" fontFamily={F.body} fontSize=".45" fontWeight="700" fill={BALLS[b.power].color}>{BALLS[b.power].sigil}</text>
      <circle cx={-r*.68} cy={r*.68} r=".35" fill="#f5f2e9" stroke="#15181b" strokeWidth=".1"/>
      <text x={-r*.68} y={r*.68+.14} textAnchor="middle" fontFamily={F.mono} fontSize=".38" fontWeight="700" fill="#17191c">{num}</text>
    </g>}
  </g>);}

function GroupToken({group,color,size=22}){const stripe=group==="stripe";

// Butt cap, linen wrap, forearm, silver joint collar, maple shaft, ivory
// ferrule, blue tip — built as a chain of tapered quads down one axis.
function CueStick({x,y,angle,pull,id,tip,live}){
  const back=BR+1.4+pull*26, L=58;
  const dx=Math.cos(angle),dy=Math.sin(angle),nx=-dy,ny=dx;
  const off=(tip?tip.a:0)*BR*0.62;
  const px=x-dx*back+nx*off, py=y-dy*back+ny*off;
  const pt=(d,o)=>[px-dx*d+nx*o,py-dy*d+ny*o];
  // half-width grows from the tip back to the butt
  const hw=d=>0.30+0.26*(d/L);
  const quad=(d0,d1)=>[pt(d0,hw(d0)),pt(d1,hw(d1)),pt(d1,-hw(d1)),pt(d0,-hw(d0))]
    .map(q=>q.join(",")).join(" ");
  const part=(d0,d1,fill,extra)=><polygon points={quad(d0,d1)} fill={fill} {...(extra||{})}/>;
  return(<g opacity={live?1:.94}>
    {live&&<polygon points={quad(-1.2,L)} fill={C.accent} opacity=".14"
      transform={`translate(${nx*0} ${ny*0})`}/>}
    {part(0,0.9,"#4f86a8")}          {/* tip */}
    {part(0.9,2.4,"#efe9dc")}        {/* ferrule */}
    {part(2.4,24,`url(#shaft${id})`)}{/* maple shaft */}
    {part(24,25.4,"#cfd3d8")}        {/* joint collar */}
    {part(25.4,38,`url(#fore${id})`)}{/* forearm */}
    {part(38,50,"#15161a")}          {/* linen wrap */}
    {part(50,L,`url(#fore${id})`)}   {/* butt sleeve */}
    {part(L-1.1,L,"#cfd3d8")}        {/* butt cap */}
    <polygon points={[pt(2.4,hw(2.4)*0.55),pt(L,hw(L)*0.55),pt(L,hw(L)*0.05),pt(2.4,hw(2.4)*0.05)]
      .map(q=>q.join(",")).join(" ")} fill="#fff" opacity=".16"/>
    <polygon points={[pt(2.4,-hw(2.4)*0.35),pt(L,-hw(L)*0.35),pt(L,-hw(L)),pt(2.4,-hw(2.4))]
      .map(q=>q.join(",")).join(" ")} fill="#000" opacity=".26"/>
  </g>);}

let UID=0;

    const t=e.touches&&e.touches[0]?e.touches[0]:e;
    return{x:vb[0]+(t.clientX-r.left)/r.width*vb[2], y:vb[1]+(t.clientY-r.top)/r.height*vb[3]};};
  // Sight diamonds sit on the rail top, skipped wherever a pocket is close.
  const sights=[];
  const addS=(L,map)=>{for(let i=1;i<=7;i++){const t=L*i/8;
    if(g.pockets.some(p=>Math.abs((map===0||map===1?p.x:p.y)-t)<5&&
      (map===0?p.y===0:map===1?p.y===g.h:map===2?p.x===0:p.x===g.w)))continue;

    sights.push({x:q[0],y:q[1],a:45});}};
  if(!g.boundary){addS(g.w,0);addS(g.w,1);addS(g.h,2);addS(g.h,3);}
  else g.boundary.forEach((a,i)=>{const b=g.boundary[(i+1)%g.boundary.length],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),n=Math.max(1,Math.floor(L/28));
    for(let k=1;k<=n;k++){const t=k/(n+1),x=a[0]+dx*t,y=a[1]+dy*t;if(g.pockets.some(p=>Math.hypot(p.x-x,p.y-y)<6))continue;
      sights.push({x:x+dy/L*(CD+RW)/2,y:y-dx/L*(CD+RW)/2,a:Math.atan2(dy,dx)*180/Math.PI+45});}});

        <stop offset="30%" stopColor="#8f7bff" stopOpacity=".75"/>
        <stop offset="62%" stopColor="#4fd6e0" stopOpacity=".75"/>
        <stop offset="100%" stopColor="#ffd36e" stopOpacity="0"/>
      </linearGradient>
      <radialGradient id={"focusRing"+id}>
        <stop offset="0%" stopColor="#f2dcff" stopOpacity="0"/>
        <stop offset="70%" stopColor="#d6a7f5" stopOpacity=".08"/>
        <stop offset="92%" stopColor="#e9c7ff" stopOpacity=".34"/>
        <stop offset="100%" stopColor="#e9c7ff" stopOpacity="0"/>
      </radialGradient>
      <radialGradient id={"echoRing"+id}>
        <stop offset="0%" stopColor="#eadfb8" stopOpacity=".10"/>
        <stop offset="72%" stopColor="#d3be79" stopOpacity=".03"/>
        <stop offset="100%" stopColor="#d3be79" stopOpacity="0"/>
      </radialGradient>
      <filter id={"ripple"+id} x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="turbulence" baseFrequency="0.05 0.012" numOctaves="2" seed="3" result="n">
          <animate attributeName="baseFrequency" values="0.05 0.012;0.02 0.05;0.05 0.012"
            dur="7s" repeatCount="indefinite"/></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <linearGradient id={"rain"+id} x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0%" stopColor="#ff5f6d"/><stop offset="20%" stopColor="#ffc371"/>
        <stop offset="40%" stopColor="#7ee8a2"/><stop offset="60%" stopColor="#5ac8fa"/>
        <stop offset="80%" stopColor="#b06ff5"/><stop offset="100%" stopColor="#ff5f6d"/>
        <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
      </linearGradient>
      <linearGradient id={"tiltD"+id} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor="#000" stopOpacity=".26"/><stop offset="100%" stopColor={C.warn} stopOpacity=".18"/></linearGradient>
      <linearGradient id={"tiltU"+id} x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stopColor="#000" stopOpacity=".26"/><stop offset="100%" stopColor={C.warn} stopOpacity=".18"/></linearGradient>
    </defs>

    {/* frame */}
    {boundary?<>
      <polygon points={boundary} fill={`url(#rail${id})`} stroke="#020304" strokeWidth={RW*2+1.4} strokeLinejoin="round"/>
      <polygon points={boundary} fill={`url(#rail${id})`} stroke={`url(#rail${id})`} strokeWidth={RW*2} strokeLinejoin="round"/>
      <polygon points={boundary} fill="none" stroke="#fff" strokeOpacity=".055" strokeWidth={RW*2-.8} strokeLinejoin="round"/>
      <polygon points={boundary} fill="none" stroke={FRAME_EDGE} strokeOpacity=".72" strokeWidth=".58" strokeLinejoin="round"/>
    </>:<>
      <rect x={vb[0]} y={vb[1]} width={vb[2]} height={vb[3]} rx="2.5" fill={`url(#rail${id})`}/>
      <rect x={vb[0]+.45} y={vb[1]+.45} width={vb[2]-.9} height={vb[3]-.9} rx="2.1" fill="none" stroke="#fff" strokeOpacity=".055" strokeWidth=".5"/>
      <rect x={vb[0]+.2} y={vb[1]+.2} width={vb[2]-.4} height={vb[3]-.4} rx="2.3" fill="none" stroke={FRAME_EDGE} strokeOpacity=".85" strokeWidth=".55"/>
      <rect x={-CD-.55} y={-CD-.55} width={g.w+(CD+.55)*2} height={g.h+(CD+.55)*2} rx="1.4" fill="none" stroke="#000" strokeOpacity=".5" strokeWidth=".5"/>
    </>}
    {sights.map((s,i)=><rect key={i} x={s.x-.6} y={s.y-.6} width="1.2" height="1.2"
      transform={`rotate(${s.a} ${s.x} ${s.y})`} fill="#cfc6b2" opacity=".3"/>)}

    {/* bed */}
    {/* Acid distorts the cloth itself. Ketamine leaves the bed alone and marks
        only the pockets, keeping the shot readable. */}
    <g filter={T.melt?`url(#melt${id})`:undefined} clipPath={`url(#bed${id})`}>
      {boundary?<polygon points={boundary} fill={fill}/>:<rect x="0" y="0" width={g.w} height={g.h} fill={fill}/>} 
      {cl.kind==="heat"&&<HeatCloth id={id} g={g} balls={balls}/>}
    </g>
    <g clipPath={`url(#bed${id})`}>
    {T.melt&&<g style={{pointerEvents:"none"}}>
      {/* Acid is chromatic refraction, not a rainbow blanket. The cloth shifts
          just enough to feel unreliable while the balls remain readable. */}
      <rect x="0" y="0" width={g.w} height={g.h} filter={`url(#oil${id})`}
        opacity=".16" style={{mixBlendMode:"soft-light",animation:"ck-hue 23s linear infinite"}}/>
      <rect className="ck" x="-3" y="-2" width={g.w+6} height={g.h+4} fill={`url(#rain${id})`}
        filter={`url(#soften${id})`} opacity=".24"
        style={{mixBlendMode:"screen",animation:"ck-acid-tide 9s ease-in-out infinite"}}/>
      {[[0.30,26,0],[0.55,-20,-7],[0.76,17,-13]].map(([y,amp,delay],i)=>(
        <path key={i} className="ck" filter={`url(#soften${id})`}
          d={`M-8 ${g.h*y} C ${g.w*0.28} ${g.h*y-amp}, ${g.w*0.66} ${g.h*y+amp}, ${g.w+8} ${g.h*y-amp*0.35}`}
          fill="none" stroke={`url(#aur${id})`} strokeWidth={1.2+i*.34} strokeLinecap="round"
          style={{animation:`ck-ribbon ${21+i*5}s ease-in-out infinite`,animationDelay:`${delay}s`,
                  mixBlendMode:"screen",opacity:.54}}/>))}
    </g>}
    {T.fastCloth&&<rect x="0" y="0" width={g.w} height={g.h} fill={`url(#vodkaWash${id})`}
      opacity=".72" style={{pointerEvents:"none",mixBlendMode:"screen"}}/>}
    {T.steady&&<rect className="ck" x="0" y="0" width={g.w} height={g.h} fill={`url(#mollyWash${id})`}
      style={{pointerEvents:"none",mixBlendMode:"screen",animation:"ck-molly-wash 2.15s ease-in-out infinite"}}/>}
    {T.echo&&<rect className="ck" x="0" y="0" width={g.w} height={g.h} fill={`url(#peyoteWash${id})`}
      style={{pointerEvents:"none",mixBlendMode:"screen",animation:"ck-peyote-wash 7s ease-in-out infinite"}}/>}
    {T.ends&&<g style={{pointerEvents:"none",mixBlendMode:"screen"}} opacity=".7">
      <circle cx={g.w/2} cy={g.h/2} r={Math.min(g.w,g.h)*.38} fill={`url(#dmtCore${id})`}/>
      <g className="ck" style={{animation:"ck-dmt-turn 24s linear infinite"}}>
        {[.18,.28,.37].map((r,i)=>{const R=Math.min(g.w,g.h)*r,pts=Array.from({length:8},(_,k)=>{
          const a=Math.PI*2*k/8+(i%2?Math.PI/8:0);return `${g.w/2+Math.cos(a)*R},${g.h/2+Math.sin(a)*R}`;}).join(" ");
          return <polygon key={i} points={pts} fill="none" stroke={i===1?"#c68bff":"#83e7f3"}
            strokeWidth={i===1?.17:.12} strokeOpacity={.28+i*.09}/>;})}
        {Array.from({length:8},(_,k)=>{const a=Math.PI*2*k/8,R=Math.min(g.w,g.h)*.37;
          return <line key={k} x1={g.w/2} y1={g.h/2} x2={g.w/2+Math.cos(a)*R} y2={g.h/2+Math.sin(a)*R}
            stroke={k%2?"#b482ef":"#8be9f4"} strokeWidth=".1" strokeOpacity=".24"/>;})}
      </g>
    </g>}

    {/* An effect that changes the RULES has to change the TABLE, or the player
        has no way of knowing it is running. Each one gets its own mark. */}
    {T.tilt&&<g style={{pointerEvents:"none"}}>
      <rect className="ck" x="0" y="0" width={g.w} height={g.h}
        fill={T.tilt>0?`url(#tiltD${id})`:`url(#tiltU${id})`}
        style={{animation:"ck-swim 6s ease-in-out infinite"}}/>
      {[.13,.29,.47,.68,.86].map((f,i)=>{const from=T.tilt>0?4:g.h-4,to=T.tilt>0?g.h-4:4;
        return <circle key={"gravity"+i} cx={g.w*f} cy={from} r=".38" fill="#f0b96d" fillOpacity=".68"
          stroke="#ffe1a8" strokeOpacity=".44" strokeWidth=".11" filter={`url(#glow${id})`}>
          <animate attributeName="cy" values={`${from};${to};${from}`} dur={`${4.3+i*.61}s`} begin={`${i*-.83}s`} repeatCount="indefinite"/>
          <animate attributeName="r" values=".28;.52;.28" dur={`${2.2+i*.17}s`} repeatCount="indefinite"/>
        </circle>;})}
      {/* A carpenter's level makes the shared table rule legible without
          pretending that glowing rain is part of a pool hall. */}
      <g transform={`translate(${g.w-16} 2.2)`} opacity=".9">
        <rect x="0" y="0" width="13.5" height="2.5" rx="1.25" fill="#0b0d10" fillOpacity=".72"
          stroke="#e4b46e" strokeOpacity=".72" strokeWidth=".22"/>
        <line x1="6.75" y1=".35" x2="6.75" y2="2.15" stroke="#e4b46e" strokeOpacity=".42" strokeWidth=".16"/>
        <circle className="ck" cx={T.tilt>0?9.7:3.8} cy="1.25" r=".78" fill="#e7ba76"
          style={{animation:"ck-level 2.8s ease-in-out infinite"}}/>
      </g>
    </g>}
    {T.fastCloth&&aim&&(()=>{const dx=Math.cos(aim.angle),dy=Math.sin(aim.angle),nx=-dy,ny=dx,L=38;
      return <g style={{pointerEvents:"none"}} clipPath={`url(#bed${id})`}>
        {[-2.2,0,2.2].map((o,i)=>{const sx=aim.x+nx*o,sy=aim.y+ny*o;
          const d=`M${sx-dx*3} ${sy-dy*3}Q${sx+dx*L*.45+nx*o*.16} ${sy+dy*L*.45+ny*o*.16} ${sx+dx*L} ${sy+dy*L}`;
          return <g key={i}><path d={d} fill="none" stroke="#b8e9fb" strokeWidth={i===1?.28:.17}
              strokeLinecap="round" strokeOpacity={i===1?.32:.18}/>
            <circle r={i===1?.31:.23} fill="#d8f5ff" opacity={i===1?.68:.44} filter={`url(#glow${id})`}>
              <animateMotion path={d} dur={`${2.7+i*.45}s`} begin={`${i*-.65}s`} repeatCount="indefinite"/>
            </circle></g>;})}
        {[1,2,3].map(k=><circle key={"wake"+k} cx={aim.x-dx*k*.72} cy={aim.y-dy*k*.72} r={BR*(1.05+k*.1)}
          fill="none" stroke="#bcecff" strokeWidth=".15" strokeOpacity={.25/k}/>) }
        <circle cx={aim.x} cy={aim.y} r={BR*1.72} fill="none" stroke="#c9effc" strokeOpacity=".28" strokeWidth=".18"/>
      </g>;})()}
    {T.steady&&balls&&(()=>{const c=balls.find(b=>b.n===0&&!b.in);if(!c)return null;
      const near=balls.filter(b=>!b.in&&b.n!==0).sort((a,b)=>Math.hypot(a.x-c.x,a.y-c.y)-Math.hypot(b.x-c.x,b.y-c.y)).slice(0,4);
      return(<g style={{pointerEvents:"none"}}>
        {near.map((b,i)=><g key={"link"+b.n} className="ck" style={{animation:`ck-neural ${2.8+i*.37}s ease-in-out infinite`,animationDelay:`${i*-.42}s`}}>
          <line x1={c.x} y1={c.y} x2={b.x} y2={b.y} stroke="#e7b6ff" strokeWidth=".14" strokeOpacity=".24"/>
          <circle cx={(c.x+b.x)/2} cy={(c.y+b.y)/2} r=".25" fill="#f4d9ff" opacity=".62" filter={`url(#glow${id})`}/>
        </g>)}
        <circle className="ck" cx={c.x} cy={c.y} r={BR*3.9} fill={`url(#focusRing${id})`}
          style={{animation:"ck-focus 3.2s ease-in-out infinite"}}/>
        {[-1,1].flatMap(sx=>[-1,1].map(sy=><path key={sx+","+sy}
          d={`M${c.x+sx*BR*2.55} ${c.y+sy*BR*1.45}L${c.x+sx*BR*2.55} ${c.y+sy*BR*2.55}L${c.x+sx*BR*1.45} ${c.y+sy*BR*2.55}`}
          fill="none" stroke="#efd2ff" strokeOpacity=".72" strokeWidth=".22" strokeLinecap="round"/>))}
        <circle cx={c.x} cy={c.y} r={BR*1.34} fill="none" stroke="#e7c3fb" strokeOpacity=".28" strokeWidth=".13"/>
      </g>);})()}
    {T.echo&&balls&&<g style={{pointerEvents:"none"}}>
      {balls.filter(b=>!b.in).map(b=>[
        [1,"#eadcae",.42,-.32],[2,"#9ed7c2",.76,-.57],[3,"#d0a8dc",1.05,-.78]
      ].map(([k,col,ox,oy])=><circle key={"echo"+b.n+"-"+k} cx={b.x+ox} cy={b.y+oy} r={BR*(1.04+k*.035)}
        fill={col} fillOpacity={(b.n===0?.14:.065)/k} stroke={col}
        strokeOpacity={(b.n===0?.5:.24)/k} strokeWidth=".13"/>))}
      {(()=>{const c=balls.find(b=>b.n===0&&!b.in);if(!c)return null;
        const pts=Array.from({length:110},(_,i)=>{const t=i/109*Math.PI*5.5,r=.28+(i/109)*BR*7.2;
          return[c.x+Math.cos(-t)*r,c.y+Math.sin(-t)*r*.72];});
        const spiral=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(2)+" "+q[1].toFixed(2)).join("");
        return <g opacity=".88">
          <g className="ck" style={{animation:"ck-peyote-turn 18s linear infinite"}}>
            {Array.from({length:10},(_,i)=>{const a=i*36,col=["#e8c979","#79bea3","#b987c8"][i%3];
              return <ellipse key={i} cx={c.x} cy={c.y-BR*4.5} rx={BR*.72} ry={BR*2.25}
                transform={`rotate(${a} ${c.x} ${c.y})`} fill={col} fillOpacity=".12" stroke={col}
                strokeOpacity=".46" strokeWidth=".16"/>;})}
            <circle cx={c.x} cy={c.y} r={BR*2.05} fill="#d9b767" fillOpacity=".10" stroke="#efd48d" strokeOpacity=".45" strokeWidth=".16"/>
          </g>
          <path className="ck" d={spiral} fill="none" stroke={`url(#peyoteSpiral${id})`} strokeWidth=".36"
            strokeLinecap="round" filter={`url(#glow${id})`} style={{animation:"ck-rewind 8.5s linear infinite"}}/>
          {pts.filter((_,i)=>i%18===0).map((q,i)=><circle key={i} cx={q[0]} cy={q[1]} r=".27"
            fill={["#f0d181","#83c9ae","#bd91cd"][i%3]} opacity=".7"/>)}
        </g>;})()}
    </g>}
    {T.noPreview&&<rect x="0" y="0" width={g.w} height={g.h} fill="#000" opacity=".34"/>}
    </g>

    {/* cushions: same cloth, one shade down, with a crisp nose line */}
    {boundary&&<g>
      <polygon points={boundary} fill="none" stroke={fill} strokeWidth={CD*2} strokeLinejoin="round"/>
      <polygon points={boundary} fill="none" stroke={`url(#weave${id})`} strokeWidth={CD*2} strokeLinejoin="round" opacity=".8"/>
      <polygon points={boundary} fill="none" stroke="#000" strokeWidth={CD*2} strokeLinejoin="round" opacity=".28"/>
      <polygon points={boundary} fill="none" stroke="#000" strokeOpacity=".62" strokeWidth=".24" strokeLinejoin="round"/>
    </g>}
    {cush.map((poly,i)=>{const pts=poly.map(q=>q.join(",")).join(" ");
      return(<g key={i}>
        <polygon points={pts} fill={fill}/>
        <polygon points={pts} fill={`url(#weave${id})`}/>
        <polygon points={pts} fill="#000" opacity=".28"/>
        <polygon points={pts} fill="none" stroke="#000" strokeOpacity=".55" strokeWidth=".22"/></g>);})}

    {/* obstacle walls, built like cushions so they read as part of the table */}
    {g.walls.map((w,i)=><g key={"w"+i}>
      <rect x={w.x} y={w.y} width={w.w} height={w.h} rx=".5" fill={FRAME}/>
      <rect x={w.x} y={w.y} width={w.w} height={w.h} rx=".5" fill="none" stroke="#000" strokeOpacity=".7" strokeWidth=".22"/></g>)}

    {/* pockets last so they cut cleanly through cushion and frame alike */}
    {/* Just the opening. No halo, no lip highlight — a pocket is a hole in the
        slate, and any ring around it reads as decoration. The only rings that
        belong here are the ketamine wells. */}
    {pk.map((p,i)=><circle key={i} cx={p.cx} cy={p.cy} r={p.r} fill={`url(#pkt${id})`}/>)}
    {/* the eight is being called: every pocket is a target until one is picked */}
    {T.khole&&pk.map((p,i)=><g key={"kh"+i} style={{pointerEvents:"none"}}>
      <circle className="ck" cx={p.cx} cy={p.cy} r={p.r*1.82} fill={`url(#well${id})`}
        style={{animation:"ck-pocket 2.8s ease-in-out infinite",animationDelay:`${i*.12}s`}}/>
      {/* Two quiet intake arcs replace the old dashed target rings. They point
          into the opening and leave the pocket itself visually clean. */}
      <path d={`M${p.cx-p.r*1.42} ${p.cy}A${p.r*1.42} ${p.r*1.42} 0 0 1 ${p.cx} ${p.cy-p.r*1.42}`}
        fill="none" stroke={`url(#ketFade${id})`} strokeWidth=".34" strokeLinecap="round" filter={`url(#glow${id})`}/>
      <path d={`M${p.cx+p.r*1.42} ${p.cy}A${p.r*1.42} ${p.r*1.42} 0 0 1 ${p.cx} ${p.cy+p.r*1.42}`}
        fill="none" stroke={`url(#ketFade${id})`} strokeWidth=".27" strokeLinecap="round" filter={`url(#glow${id})`} opacity=".76"/>
    </g>)}
    {calls&&calls.map((p,i)=><circle key={"c"+i} cx={p.cx} cy={p.cy} r={p.r+1.1} fill="none"
      stroke={C.warn} strokeOpacity=".85" strokeWidth=".5"/>)}
    {called!=null&&pk[called]&&<circle cx={pk[called].cx} cy={pk[called].cy} r={pk[called].r+1.3}
      fill="none" stroke={C.warn} strokeWidth=".7"/>}

    {aim&&aim.show&&aim.ghostLine&&<polyline points={aim.ghostLine.path.map(q=>q.join(",")).join(" ")}
      fill="none" stroke="#fff" strokeOpacity=".3" strokeWidth=".22" strokeDasharray="1.6 1.4"/>}
    {aim&&aim.show&&aim.p&&<g>
      {/* the shot as it will actually be played, curve and all, ending where
          the cue ball genuinely runs out of legs */}
      <polyline points={aim.p.path.map(q=>q.join(",")).join(" ")} fill="none"
        stroke="#fff" strokeOpacity={aim.live?".62":".38"} strokeWidth=".24" strokeDasharray="1.6 1.4"/>
      {aim.p.short&&!aim.p.potted&&aim.stop&&<circle cx={aim.p.path[aim.p.path.length-1][0]}
        cy={aim.p.path[aim.p.path.length-1][1]} r={BR*0.8} fill="none"
        stroke={C.warn} strokeOpacity=".7" strokeWidth=".22" strokeDasharray=".7 .7"/>}
      {aim.p.ghost&&aim.objLine&&<>
        <circle cx={aim.p.ghost[0]} cy={aim.p.ghost[1]} r={BR} fill="none" stroke="#fff" strokeOpacity=".55" strokeWidth=".2"/>
        <polyline points={aim.p.objPath.map(q=>q.join(",")).join(" ")} fill="none"
          stroke={C.accent} strokeOpacity=".85" strokeWidth=".3"/>
        {aim.cueLine&&<polyline points={aim.p.cuePath.map(q=>q.join(",")).join(" ")} fill="none"
          stroke="#fff" strokeOpacity=".45" strokeWidth=".2" strokeDasharray=".8 .9"/>}
      </>}
    </g>}
    {balls&&balls.filter(b=>!b.in&&b.n!==0).map(b=><Ball key={b.n} b={b} id={id} ring={ringFor?ringFor(b):null} blank={blank}/>)}
    {balls&&balls.filter(b=>!b.in&&b.n===0).map(b=><Ball key="cue" b={b} id={id}/>)}
    {T.fastCloth&&balls&&aim&&(()=>{const dx=Math.cos(aim.angle),dy=Math.sin(aim.angle);
      return <g style={{pointerEvents:"none",mixBlendMode:"screen"}}>{balls.filter(b=>!b.in).map(b=>[1,2,3].map(k=><circle
        key={`v${b.n}-${k}`} cx={b.x-dx*k*.52} cy={b.y-dy*k*.52} r={BR*(1+.04*k)} fill="none"
        stroke={b.n===0?"#dff8ff":"#8ddcf4"} strokeWidth=".14" strokeOpacity={(b.n===0?.42:.22)/k}/>))}</g>;})()}
    {T.steady&&balls&&<g style={{pointerEvents:"none",mixBlendMode:"screen"}}>
      {balls.filter(b=>!b.in).map((b,i)=><circle key={"molly"+b.n} className="ck" cx={b.x} cy={b.y} r={BR*1.65}
        fill="none" stroke={["#ff86dc","#b489ff","#65e3e9","#ffd071"][i%4]} strokeWidth=".19" strokeOpacity=".5"
        style={{animation:`ck-molly-ball ${1.85+(i%4)*.16}s ease-in-out infinite`,animationDelay:`${i*-.12}s`}}/>)}
    </g>}
    {T.phase&&balls&&(()=>{const c=balls.find(b=>b.n===0&&!b.in); if(!c)return null;
      const blob=(R,seed)=>Array.from({length:44},(_,i)=>{const a=i/44*Math.PI*2,
        rr=R*(1+.12*Math.sin(a*3+seed)+.065*Math.cos(a*5-seed*.7));
        return`${c.x+Math.cos(a)*rr},${c.y+Math.sin(a)*rr*.66}`;}).join(" ");
      return(<g style={{pointerEvents:"none",mixBlendMode:"screen"}}>
        <g clipPath={`url(#bed${id})`}>
          {balls.filter(b=>!b.in).map(b=><g key={"split"+b.n}>
            <circle cx={b.x-.34} cy={b.y+.16} r={BR*1.04} fill="none" stroke="#ff62c6" strokeWidth=".23" strokeOpacity=".34"/>
            <circle cx={b.x+.34} cy={b.y-.16} r={BR*1.04} fill="none" stroke="#54dfe7" strokeWidth=".23" strokeOpacity=".34"/>
          </g>)}
          {[6.5,10.5,15.5,21.5].map((r,i)=><polygon key={i} className="ck" points={blob(r,i*1.7)}
            fill="none" stroke={`url(#aur${id})`} strokeWidth={.2+i*.035} strokeOpacity={.34+i*.08}
            filter={`url(#glow${id})`} style={{animation:`ck-acid-contour ${8+i*2.4}s linear infinite`,animationDelay:`${i*-.9}s`}}/>)}
        </g>
        {aim&&aim.p&&<>
          <polyline points={aim.p.path.map(q=>q.join(",")).join(" ")} fill="none" stroke="#ef7fc7"
            strokeWidth=".46" strokeOpacity=".16" transform="translate(-.24 .12)"/>
          <polyline points={aim.p.path.map(q=>q.join(",")).join(" ")} fill="none" stroke="#62dce3"
            strokeWidth=".46" strokeOpacity=".16" transform="translate(.24 -.12)"/>
        </>}
        <path className="ck" d={`M${c.x-BR*2.1} ${c.y}A${BR*2.1} ${BR*2.1} 0 0 1 ${c.x} ${c.y-BR*2.1}
          M${c.x+BR*2.1} ${c.y}A${BR*2.1} ${BR*2.1} 0 0 1 ${c.x} ${c.y+BR*2.1}`}
          fill="none" stroke="#cdb7ff" strokeWidth=".24" strokeLinecap="round" filter={`url(#glow${id})`}
          style={{animation:"ck-phase 5.2s linear infinite"}}/>
        <circle className="ck" cx={c.x-.18} cy={c.y} r={BR*1.18} fill="none" stroke="#ef7fc7"
          strokeWidth=".28" opacity=".44" style={{animation:"ck-phase-pulse 2.4s ease-in-out infinite"}}/>
        <circle className="ck" cx={c.x+.18} cy={c.y} r={BR*1.18} fill="none" stroke="#62dce3"
          strokeWidth=".28" opacity=".44" style={{animation:"ck-phase-pulse 2.4s ease-in-out infinite reverse"}}/>
      </g>);})()}
    {T.ends&&T.ends.map((q,i)=>{if(q.in)return null;const bi=q.n===0?null:ballInfo(q.n),col=q.n===0?"#f4fbff":bi.col;
      const from=balls&&balls.find(b=>b.n===q.n&&!b.in),mx=from?(from.x+q.x)/2:q.x,my=from?(from.y+q.y)/2:q.y;
      return <g key={"e"+i} className="ck" style={{animation:"ck-forecast 3.1s ease-in-out infinite",animationDelay:`${i*.045}s`}}>
        {from&&<path d={`M${from.x} ${from.y}Q${mx+(i%2?.8:-.8)} ${my-1.2} ${q.x} ${q.y}`}
          fill="none" stroke={col} strokeWidth=".16" strokeOpacity=".26" filter={`url(#glow${id})`}/>} 
        <circle cx={q.x} cy={q.y} r={BR*1.08} fill={col} fillOpacity=".16" stroke={col} strokeWidth=".22" strokeOpacity=".72"/>
        <circle cx={q.x} cy={q.y} r={BR*.78} fill="#071219" fillOpacity=".26" stroke="#fff" strokeOpacity=".12" strokeWidth=".1"/>
        {bi&&<text x={q.x} y={q.y+.31} textAnchor="middle" fontFamily={F.mono} fontSize=".72" fontWeight="500" fill="#eefaff" opacity=".76">{bi.num}</text>}
      </g>;})}
    {aim&&aim.stick&&<CueStick x={aim.x} y={aim.y} angle={aim.angle} pull={aim.pull} tip={aim.tip} live={aim.live} id={id}/>}
  </svg>);}

// ===== 5. PHYSICS ============================================================
// A real billiard model rather than a bouncing point.
//
// Every ball carries linear velocity AND angular velocity: wx,wy are the
// horizontal axes that make it roll, wz is the vertical axis — sidespin.
// The contact patch under the ball moves at
//        u = (vx - R·wy , vy + R·wx)
// If u is non-zero the ball is SLIDING and heavy friction acts along -u, which
// both slows the ball and spins it up until u reaches zero. From then on it is
// ROLLING and only light rolling resistance applies. That single distinction is
// what produces draw, follow, stun, and the way a hard shot skids before it
// takes. Nothing here is faked with a multiplier.
// Specials that alter one shot set a flag here; the shot loop and the aim
// preview both read it, so what you are shown is what you get.
const RULE={deadRail:false,stunCue:false,spinHold:false,noSquirt:false,fastCloth:false,tilt:0,
  phase:false,phaseBall:null,pocketBoost:1,softJaws:false,magnetBoost:1.7};
const G=386;                 // gravity, inches/s²
const MU_SLIDE=0.19;         // cloth friction while the ball is skidding
const MU_ROLL=0.055;         // rolling resistance once it takes
const MU_SPIN=0.7;           // how fast sidespin bleeds off, per second
const MU_BALL=0.055;         // ball-on-ball friction — this is what throws a cut
const MU_CUSH=0.30;          // cushion friction — this is what english bites on
const SQUIRT=0.012;          // how far side english pushes the cue off the aim line
const E_BALL=0.95;           // ball-on-ball restitution
const STOP_V=0.55, STOP_W=0.9;
const MAXV=440;              // a full-blooded break, inches/s (about 25 mph)

// Collision geometry: the cushion noses AND the angled jaw faces either side of
// every pocket, plus the four faces of each obstacle wall. Because the jaws are
// real surfaces, a ball can rattle in them and come back out.
function tableSegs(g){
  if(g._segs)return g._segs;
  const segs=[];
  if(g.boundary){for(let i=0;i<g.boundary.length;i++)segs.push([g.boundary[i],g.boundary[(i+1)%g.boundary.length]]);}
  else for(const poly of cushions(g)){
      const [n0,n1,b1,b0]=poly;
      segs.push([n0,n1],[n1,b1],[b0,n0]);}      // nose, then both jaw faces
  for(const w of g.walls){
    const c=[[w.x,w.y],[w.x+w.w,w.y],[w.x+w.w,w.y+w.h],[w.x,w.y+w.h]];
    for(let i=0;i<4;i++)segs.push([c[i],c[(i+1)%4]]);
  }
  g._segs=segs;return segs;
}
// Each ball also carries its orientation: `p` is the pole the number sits on
// (and the axis the stripe rings), `q` is a second axis so the number itself
// turns. Both are world-frame unit vectors rotated by the angular velocity every
// step, which is what makes a rolling ball visibly roll and a spinning one spin.
const newBall=(n,x,y)=>{const s=Math.sin(n*2.4)*0.5+0.5, t=n*1.7;
  return{n,x,y,vx:0,vy:0,wx:0,wy:0,wz:0,in:false,pocket:undefined,
    px:Math.cos(t)*s,py:Math.sin(t)*s,pz:Math.sqrt(Math.max(0,1-s*s)),
    qx:-Math.sin(t),qy:Math.cos(t),qz:0};};
// v += (w x v) dt, then renormalise
function spinVec(b,dt){
  const {wx,wy,wz}=b;
  let x=b.px+(wy*b.pz-wz*b.py)*dt, y=b.py+(wz*b.px-wx*b.pz)*dt, z=b.pz+(wx*b.py-wy*b.px)*dt;
  let l=Math.hypot(x,y,z)||1; b.px=x/l; b.py=y/l; b.pz=z/l;
  x=b.qx+(wy*b.qz-wz*b.qy)*dt; y=b.qy+(wz*b.qx-wx*b.qz)*dt; z=b.qz+(wx*b.qy-wy*b.qx)*dt;
  l=Math.hypot(x,y,z)||1; b.qx=x/l; b.qy=y/l; b.qz=z/l;
}

// Strike the cue ball. `tip` is where the tip lands on the face, in ball radii:
// tip.a is left/right (english), tip.b is high/low (follow/draw). Real cue tips
// can't safely go past half a radius, which is why the widget stops there.
// `el` is how far the butt of the cue is raised. Level, side english just spins
// the ball. Raised, some of that spin tips onto the axis the ball is travelling
// along — and spin about the direction of travel drags the contact patch
// sideways, so friction pushes the ball sideways too. That is a curve, and it
// falls out of the same friction model as everything else. Steeper cue, more
// bend, less speed forward, exactly like the real shot.
function strike(cue,angle,speed,tip,el){
  const a=tip?tip.a:0, b=tip?tip.b:0, e=el||0;
  const ce=Math.cos(e), se=Math.sin(e);
  const th=angle-(RULE.noSquirt?0:a*SQUIRT*ce);
  const dx=Math.cos(th), dy=Math.sin(th);
  const v=speed*ce;
  cue.vx=dx*v; cue.vy=dy*v;
  const k=2.5*speed/BR;
  const wPerp=k*b*ce;        // follow / draw — axis across the line of travel
  const wAlong=-k*a*se;      // masse — axis along the line of travel
  cue.wx=wPerp*(-dy)+wAlong*dx;
  cue.wy=wPerp*dx+wAlong*dy;
  cue.wz=-k*a*ce;            // plain sidespin
}

function stepBall(b,dt){
  const ux=b.vx-BR*b.wy, uy=b.vy+BR*b.wx, us=Math.hypot(ux,uy);
  const a=MU_SLIDE*G;
  // Slip closes at 7/2 of the friction rate. If it would close inside this step,
  // don't integrate through it — jump straight to the rolling state, or the slip
  // direction flips every frame and the friction cancels itself out.
  if(us>3.5*a*dt){                               // still sliding after this step
    const nx=ux/us, ny=uy/us;
    b.vx-=a*dt*nx; b.vy-=a*dt*ny;
    const k=(2.5*a*dt)/BR;
    b.wx-=k*ny; b.wy+=k*nx;
  }else{                                         // rolling
    b.vx-=(2/7)*ux; b.vy-=(2/7)*uy;              // exact end-of-slide velocity
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>0){const ns=Math.max(0,sp-MU_ROLL*(RULE.fastCloth?0.42:1)*G*dt); b.vx*=ns/sp; b.vy*=ns/sp;}
    b.wy=b.vx/BR; b.wx=-b.vy/BR;
  }
  b.wz-=b.wz*Math.min(1,(b.n===0&&RULE.spinHold?MU_SPIN*0.25:MU_SPIN)*dt);
  if(RULE.tilt)b.vy+=RULE.tilt*dt;   // Jäger: the slate is not level
  spinVec(b,dt);
  b.x+=b.vx*dt; b.y+=b.vy*dt;
}

// Cushion contact. The normal component rebounds; the tangential component is
// worked on by friction against whatever the contact patch is doing, which is
// where sidespin earns its keep — running english widens the rebound, reverse
// english shortens it.
function hitSeg(b,seg,ev){
  const [p,q]=seg;
  const ex=q[0]-p[0], ey=q[1]-p[1], L2=ex*ex+ey*ey||1;
  let t=((b.x-p[0])*ex+(b.y-p[1])*ey)/L2; t=t<0?0:t>1?1:t;
  const qx=p[0]+ex*t, qy=p[1]+ey*t;
  let dx=b.x-qx, dy=b.y-qy, d=Math.hypot(dx,dy);
  if(d>=BR)return false;
  if(d<1e-9){dx=-ey;dy=ex;d=Math.hypot(dx,dy)||1;}
  const nx=dx/d, ny=dy/d;
  b.x=qx+nx*BR; b.y=qy+ny*BR;                    // lift clear of the face
  const vn=b.vx*nx+b.vy*ny;
  if(vn>=0)return false;                          // already leaving
  const tx=-ny, ty=nx;
  let vt=b.vx*tx+b.vy*ty;
  let e=Math.max(0.7,Math.min(0.92,0.78+Math.abs(vn)*0.0006));
  if(RULE.deadRail)e*=0.22;
  if(RULE.softJaws&&b.n!==0)e*=0.30;   // ketamine: the jaws stop fighting back
  const surf=vt-BR*b.wz;                          // contact patch speed along the face
  let dvt=-MU_CUSH*(1+e)*Math.abs(vn)*Math.sign(surf||1);
  if(Math.abs(dvt)>Math.abs(surf)*0.55)dvt=-Math.sign(surf||1)*Math.abs(surf)*0.55;
  vt+=dvt;
  b.wz+=-(2.5*dvt)/BR;
  b.wx*=0.62; b.wy*=0.62;                         // the rail kills most of the roll
  const nv=-vn*e;
  b.vx=nx*nv+tx*vt; b.vy=ny*nv+ty*vt;
  if(ev)ev.rail=true;
  return true;
}

// Ball on ball: an almost-elastic normal impulse plus a tangential friction
// impulse. The tangential part is throw — a cut shot with english does not send
// the object ball exactly along the line of centres, and now neither does ours.
function hitBalls(a,b,ev){
  let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
  if(d<=0||d>=BR*2)return false;
  const cueHere=a.n===0||b.n===0, other=a.n===0?b.n:a.n;
  if(a.power==="ghost"&&!a.ghostSpent){a.ghostSpent=true;if(ev)ev.power="Ghost slipped through contact.";return false;}
  if(b.power==="ghost"&&!b.ghostSpent){b.ghostSpent=true;if(ev)ev.power="Ghost slipped through contact.";return false;}
  if(cueHere&&RULE.phaseBall===other)return false;          // already going through this one
  if(cueHere&&RULE.phase){RULE.phase=false;RULE.phaseBall=other;return false;}
  if(d<1e-9){dx=1;dy=0;d=1;}
  const nx=dx/d, ny=dy/d, ov=(BR*2-d)/2;
  a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
  const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rel>=0)return false;
  if(RULE.phase&&(a.n===0||b.n===0)){RULE.phase=false;return false;}  // acid: straight through
  const mass=q=>q.power==="anchor"?7:q.power==="brick"?2.4:1;
  const ma=mass(a),mb=mass(b),jn=-(1+E_BALL)*rel/(1/ma+1/mb);
  a.vx-=jn/ma*nx; a.vy-=jn/ma*ny; b.vx+=jn/mb*nx; b.vy+=jn/mb*ny;
  // surface speeds at the contact point, tangential component only
  const tx=-ny, ty=nx;
  const sa=(a.vx*tx+a.vy*ty)+BR*a.wz, sb=(b.vx*tx+b.vy*ty)-BR*b.wz;
  const slip=sb-sa;
  if(Math.abs(slip)>1e-4){
    let jt=-slip/2*0.4;
    const cap=MU_BALL*Math.abs(jn);
    if(Math.abs(jt)>cap)jt=Math.sign(jt)*cap;
    a.vx-=jt/ma*tx; a.vy-=jt/ma*ty; b.vx+=jt/mb*tx; b.vy+=jt/mb*ty;
    a.wz-=(2.5*jt)/BR; b.wz-=(2.5*jt)/BR;
  }
  if(RULE.stunCue&&(a.n===0||b.n===0)){
    const c=a.n===0?a:b; c.vx=c.vy=c.wx=c.wy=c.wz=0; RULE.stunCue=false;}
  if(ev&&ev.first==null){ if(a.n===0)ev.first=b.n; else if(b.n===0)ev.first=a.n; }
  return true;
}

function stepSim(bs,g,dt,ev){
  if(!g._pk)g._pk=makePockets(g);
  ev=ev||{};
  const segs=tableSegs(g);
  for(const b of bs){
    if(b.in)continue;
    if(Math.hypot(b.vx,b.vy)<STOP_V&&Math.abs(b.wz)<STOP_W&&
       Math.hypot(b.vx-BR*b.wy,b.vy+BR*b.wx)<0.12){b.vx=b.vy=b.wx=b.wy=b.wz=0;continue;}
    stepBall(b,dt);
    let dropped=false;
    for(let i=0;i<g._pk.length;i++){const p=g._pk[i];
      // Ketamine's generous mouth must exist in the live simulation as well as
      // the aim preview. Previously only predictPath() multiplied this radius.
      const magnet=(b.power==="magnet"&&Math.hypot(b.vx,b.vy)<105)?RULE.magnetBoost:1;
      if(Math.hypot(b.x-p.cx,b.y-p.cy)<p.capt*RULE.pocketBoost*magnet){
        b.in=true;b.pocket=i;b.vx=b.vy=b.wx=b.wy=b.wz=0;dropped=true;
        if(b.power==="bomb")for(const o of bs){if(o===b||o.in)continue;const dx=o.x-p.cx,dy=o.y-p.cy,d=Math.hypot(dx,dy)||1;
          if(d<22){const kick=(22-d)*5.2;o.vx+=dx/d*kick;o.vy+=dy/d*kick;if(ev)ev.power="The Bomb blew the pocket open.";}}
        break;}}
    if(dropped)continue;
    for(const s of segs)hitSeg(b,s,ev);
  }
  for(let i=0;i<bs.length;i++){ if(bs[i].in)continue;
    for(let j=i+1;j<bs.length;j++){ if(bs[j].in)continue; hitBalls(bs[i],bs[j],ev); }}
}
const asleep=bs=>bs.every(b=>b.in||(b.vx===0&&b.vy===0&&b.wz===0));
const fastest=bs=>bs.reduce((m,b)=>b.in?m:Math.max(m,Math.hypot(b.vx,b.vy)),0);

// Advance the whole table by dt, subdividing so nothing tunnels through a rail.
function advance(bs,g,dt,ev){
  const v=Math.max(fastest(bs),1);
  const n=Math.max(2,Math.min(48,Math.ceil(dt*v/0.35)));
  for(let i=0;i<n;i++)stepSim(bs,g,dt/n,ev);
}

// ---- aim prediction ---------------------------------------------------------
// Cheap geometric ray. The AI runs this thousands of times a turn, so it stays
// analytic: first ball along the line, ignoring spin.
function rayFirst(cue,angle,bs,g){
  const dx=Math.cos(angle),dy=Math.sin(angle);
  let bt=Infinity,hit=null;
  for(const b of bs){ if(b.in||b.n===0)continue;
    const ex=b.x-cue.x,ey=b.y-cue.y,proj=ex*dx+ey*dy; if(proj<=0)continue;
    const perp=Math.abs(ex*dy-ey*dx); if(perp>BR*2)continue;
    const t=proj-Math.sqrt(Math.max(0,BR*BR*4-perp*perp));
    if(t>1e-4&&t<bt){bt=t;hit=b;}}
  let lim=Infinity;
  if(g.boundary){for(const s of tableSegs(g)){const ax=s[0][0]-cue.x,ay=s[0][1]-cue.y,
      ex=s[1][0]-s[0][0],ey=s[1][1]-s[0][1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-8)continue;
      const t=(ax*ey-ay*ex)/den,u=(ax*dy-ay*dx)/den;if(t>0&&u>=0&&u<=1)lim=Math.min(lim,Math.max(0,t-BR));}}
  else{const clip=(v,d,lo,hi)=>{if(d>0)lim=Math.min(lim,(hi-v)/d);else if(d<0)lim=Math.min(lim,(lo-v)/d);};
    clip(cue.x,dx,BR,g.w-BR); clip(cue.y,dy,BR,g.h-BR);}
  return{ball:hit&&bt<=lim?hit:null};
}

// The line the player sees is not geometry — it is the shot, actually played.
// A copy of the cue ball is struck with the exact angle, speed, tip offset and
// elevation dialled in, then run through the same physics as the real table.
// So it curves when the shot curves, it bends off cushions correctly, and above
// all it STOPS where the ball would really stop. Draw a straight line to a ball
// the cue ball can't reach and you have lied to the player.
function predictPath(cue,angle,speed,tip,el,bs,g,maxRails){
  const keep={...RULE};
  const t={...cue}; strike(t,angle,speed,tip,el);
  const others=bs.filter(b=>!b.in&&b.n!==0);
  const segs=tableSegs(g), pk=g._pk||(g._pk=makePockets(g));
  const path=[[t.x,t.y]];
  let hit=null, potted=false, stopped=false, rails=0, cool=0;
  const dt=1/220;
  for(let i=0;i<1400;i++){
    stepBall(t,dt);
    let touched=false;
    for(const s of segs)if(hitSeg(t,s,null))touched=true;
    if(touched&&cool<=0){rails++;cool=8;} else cool--;
    for(const q of pk)if(Math.hypot(t.x-q.cx,t.y-q.cy)<q.capt*RULE.pocketBoost){potted=true;break;}
    if(potted)break;
    for(const o of others)if(Math.hypot(t.x-o.x,t.y-o.y)<BR*2){hit=o;break;}
    if(hit)break;
    if(i%4===0)path.push([t.x,t.y]);
    if(Math.hypot(t.vx,t.vy)<0.7){stopped=true;break;}
    if(rails>(maxRails==null?3:maxRails))break;   // EYE decides how far ahead you see
  }
  path.push([t.x,t.y]);
  // `short` means the cue ball genuinely ran out of legs here — that gets the
  // marker. Being cut off at three cushions does not, because it hasn't stopped.
  if(!hit){Object.assign(RULE,keep);return{path,ghost:null,ball:null,objPath:null,cuePath:null,potted,short:stopped};}
  // Play the contact out for real, so the two follow-on lines carry the spin.
  const o={...hit};
  hitBalls(t,o,null);
  const objPath=[[o.x,o.y]], cuePath=[[t.x,t.y]];
  for(let i=0;i<150;i++){
    stepBall(o,dt); for(const s of segs)hitSeg(o,s,null);
    stepBall(t,dt); for(const s of segs)hitSeg(t,s,null);
    if(i%6===0){objPath.push([o.x,o.y]);cuePath.push([t.x,t.y]);}
  }
  const cut=(()=>{const g0=path[path.length-1];
    const nx=hit.x-g0[0], ny=hit.y-g0[1], nl=Math.hypot(nx,ny)||1;
    const vl=Math.hypot(t.vx,t.vy)||1;
    return Math.abs((t.vx/vl)*(nx/nl)+(t.vy/vl)*(ny/nl));})();
  Object.assign(RULE,keep);
  return{path,ghost:[path[path.length-1][0],path[path.length-1][1]],ball:hit,objPath,cuePath,potted,short:false,cut};
}

// DMT. Play the entire shot out on a copy of the table and report where every
// last ball comes to rest. Not a prediction line — the actual finished rack.
function restingPlaces(bs,g,angle,speed,tip,el){
  const keep={...RULE};
  const c=bs.filter(b=>!b.in).map(b=>({...b}));
  const cue=c.find(b=>b.n===0); if(!cue){Object.assign(RULE,keep);return null;}
  strike(cue,angle,speed,tip,el);
  let t=0;
  while(!asleep(c)&&t<7){advance(c,g,1/120,{});t+=1/120;}
  Object.assign(RULE,keep);
  return c.map(b=>({n:b.n,x:b.x,y:b.y,in:b.in}));
}

// ===== 6. RULES ==============================================================
function buildRack(g,racks,powerSet){
  const bs=[],S=BR*2.04;
  const order=[1,11,2,3,8,10,9,7,14,4,5,13,15,6,12];
  const spot=racks===2?[g.w*0.56,g.w*0.82]:[g.rackSpot?g.rackSpot[0]:g.w*0.75];
  spot.forEach((sx,ri)=>{let k=0,sy=g.rackSpot?g.rackSpot[1]:g.h/2;
    for(let row=0;row<5;row++)for(let i=0;i<=row;i++){
      bs.push(newBall(order[k]+ri*15,sx+row*S*.872,sy+(i-row/2)*S));k++;}});
  const cue=g.cueSpot||[g.w*0.24,g.h/2];bs.push(newBall(0,cue[0],cue[1]));
  const set=POWER_SETS[powerSet];if(set)for(const b of bs){const base=((b.n-1)%15)+1;if(set.map[base])b.power=set.map[base];}
  return bs;
}
function insideBed(g,x,y){
  if(!g.boundary)return x>=BR&&x<=g.w-BR&&y>=BR&&y<=g.h-BR;
  let c=false,p=g.boundary;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}
  if(!c)return false;
  return tableSegs(g).every(s=>{const [a,b]=s,ex=b[0]-a[0],ey=b[1]-a[1],l=ex*ex+ey*ey||1;
    const t=Math.max(0,Math.min(1,((x-a[0])*ex+(y-a[1])*ey)/l));return Math.hypot(x-(a[0]+ex*t),y-(a[1]+ey*t))>=BR*.98;});
}
const groupOf=n=>ballInfo(n).group;

// Cutthroat ownership. Each player gets floor(total / players) balls and the
// remainder are neutral hazards. With two players that lands on the nicest
// split there is: solids against stripes, with the eight left neutral.
//   15 balls — 2p: 7 each + the 8    3p: 5 each     4p: 3 each + 13,14,15
//   30 balls — 2p: 14 each + both 8s 3p: 10 each    4p: 7 each + 2 spare
// Returns an array indexed by ball number: seat index, or -1 for neutral.
function assignOwners(total,players){
  const own=new Array(total+1).fill(-1);
  if(players===2){
    for(let n=1;n<=total;n++){const gp=groupOf(n);
      if(gp==="solid")own[n]=0; else if(gp==="stripe")own[n]=1;}
    return own;}
  const per=Math.floor(total/players);
  for(let i=0;i<players;i++)for(let k=0;k<per;k++)own[i*per+k+1]=i;
  return own;
}
const footSpot=g=>g.rackSpot?{x:g.rackSpot[0],y:g.rackSpot[1]}:{x:g.w*((g.racks||1)===2?0.56:0.75),y:g.h/2};
// Put a ball back on the foot spot, sliding toward the foot rail if it's taken.
function spotBall(b,bs,g){
  const f=footSpot(g); let x=f.x;
  for(let i=0;i<40;i++){
    const clash=bs.some(o=>o!==b&&!o.in&&Math.hypot(o.x-x,o.y-f.y)<BR*2.05);
    if(!clash&&x>BR&&x<g.w-BR)break;
    x+=BR*2.1;
    if(x>g.w-BR*2)x=f.x-BR*2.1*(i+1);}
  b.in=false; b.pocket=undefined; b.vx=b.vy=b.wx=b.wy=b.wz=0;
  b.x=Math.max(BR,Math.min(g.w-BR,x)); b.y=f.y;
}

// ===== 7. AI =================================================================
// Speed is derived, not guessed: work out how fast the cue ball has to leave the
// tip for the object ball to just reach the pocket, allow for the energy lost in
// a thin cut, then add a small margin. Anything more is how you slop the eight in.
// Cue speed needed for the object ball to just reach the pocket, allowing for
// the energy a cut throws away. Anything harder is how you slop the eight in.
function shotSpeed(cueDist,objDist,cut,breaking){
  if(breaking)return MAXV*0.92;
  const objV=Math.sqrt(2*MU_ROLL*G*Math.max(6,objDist))*1.35+14;
  const need=objV/Math.max(0.28,cut)+Math.sqrt(2*MU_ROLL*G*Math.max(4,cueDist))*0.85;
  return Math.max(22,Math.min(MAXV*0.62,need));
}
function pickShot(bs,g,legal,rating){
  const cue=bs.find(b=>b.n===0); if(!cue)return null;
  const up=bs.filter(b=>!b.in&&b.n!==0);
  const breaking=up.length===bs.length-1;
  const targets=up.filter(b=>legal(b.n));
  let best=null;
  for(const t of targets)for(const p of g.pockets){
    const px=p.x-t.x,py=p.y-t.y,pl=Math.hypot(px,py)||1;
    const gx=t.x-px/pl*BR*2, gy=t.y-py/pl*BR*2;      // ghost-ball contact point
    const ax=gx-cue.x,ay=gy-cue.y,al=Math.hypot(ax,ay)||1;
    const cut=(ax/al)*(px/pl)+(ay/al)*(py/pl);        // 1 = straight in
    if(cut<0.2)continue;
    const angle=Math.atan2(ay,ax);
    const r=rayFirst(cue,angle,bs,g);
    if(!r.ball||r.ball.n!==t.n)continue;              // something in the way
    const score=cut*3-al/90-pl/90;
    if(!best||score>best.score)best={score,angle,cut,al,pl};}
  if(!best){const t=targets[0];
    if(!t)return{angle:Math.random()*Math.PI*2,speed:70};
    const d=Math.hypot(t.x-cue.x,t.y-cue.y);
    return{angle:Math.atan2(t.y-cue.y,t.x-cue.x)+(Math.random()-.5)*.3,
      speed:shotSpeed(d,d,.6,breaking)};}
  const err=(1-Math.min(rating,850)/900)*0.15;
  return{angle:best.angle+(Math.random()-.5)*err,
    speed:shotSpeed(best.al,best.pl,best.cut,breaking)*(1+(Math.random()-.5)*0.14)};
}

// The computer calls the pocket its eight has the cleanest run at.
function pickPocket(bs,g,pk){
  const cue=bs.find(b=>b.n===0);
  const eight=bs.find(b=>!b.in&&groupOf(b.n)==="eight");
  if(!eight)return 0;
  let best=0,bv=-Infinity;
  pk.forEach((p,i)=>{
    const px=p.x-eight.x,py=p.y-eight.y,pl=Math.hypot(px,py)||1;
    const ax=eight.x-cue.x,ay=eight.y-cue.y,al=Math.hypot(ax,ay)||1;
    const cut=(ax/al)*(px/pl)+(ay/al)*(py/pl);
    const v=cut*3-pl/90;
    if(v>bv){bv=v;best=i;}});
  return best;
}
