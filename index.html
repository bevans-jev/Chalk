  </svg>);}

// ===== 5. PHYSICS ============================================================
// A real billiard model rather than a bouncing point.
//
// Every ball carries linear velocity AND angular velocity: wx,wy are the
// horizontal axes that make it roll, wz is the vertical axis — sidespin.
// The contact patch under the ball moves at
//        u = (vx - R·wy , vy + R·wx)
// If u is non-zero the ball is SLIDING and heavy friction acts along -u, which
// both slows the ball and spins it up until u reaches zero. From then on it is
// ROLLING and only light rolling resistance applies. That single distinction is
// what produces draw, follow, stun, and the way a hard shot skids before it
// takes. Nothing here is faked with a multiplier.
// Scratch object for the modifiers affecting one simulated shot. Both the live
// engine and cloned preview read it, and Game refreshes it for each shooter.
const RULE={
  // Cue delivery and cloth
  noSquirt:false,masse:1,spinMul:1,spinHold:false,fastCloth:false,tilt:0,
  // Cushion, collision, and pocket response
  deadRail:false,cushBite:false,noThrow:false,heavyCue:false,softJaws:false,
  pocketBoost:1,magnetBoost:1.7,bombBoost:1,brickBoost:1,
  // One-shot character and Power Ball state
  cueBlast:false,claimArm:false,homeArm:false,homeBall:null,cueSafe:false,
  phase:false,phaseBall:null,shotAge:0,
};
const G=386;                 // gravity, inches/s²
const MU_SLIDE=0.19;         // cloth friction while the ball is skidding
const MU_ROLL=0.055;         // rolling resistance once it takes
const MU_SPIN=0.7;           // how fast sidespin bleeds off, per second
const MU_BALL=0.055;         // ball-on-ball friction — this is what throws a cut
const MU_CUSH=0.30;          // cushion friction — this is what english bites on
const SQUIRT=0.012;          // how far side english pushes the cue off the aim line
const E_BALL=0.94;           // phenolic ball-on-ball restitution
const STOP_V=0.55, STOP_W=0.9;
// One fixed physics step is shared by the live shot and preview. The animation
// loop may render at any frame rate, but identical strikes remain deterministic.
const PHYS_DT=1/120;
const MAXV=440;              // a full-blooded break, inches/s (about 25 mph)

// CUSTOM ROOMS GET THE REGULATION CUSHION, FULL STOP.
// This used to be its own thing: thick butt-ended strokes laid ON the boundary
// line, a couple of decorative jaw hairs, and the pocket disc dropped on top.
// It intruded into the bed, it left a chewed notch at every sealed corner and
// the mouths read as holes punched in a sticker. It now builds the SAME
// trapezoid cushions() builds for the regulation table — nose on the boundary,
// body standing CD proud on the RAIL side, cut back M_C from every pocket and
// flared JAW into the throat, sealed corners over-run by CD so neighbours meet
// flush. Same shape, same renderer, same collision segments.
function bedCushions(g){
  if(!g.boundary)return null;
  if(g._bc)return g._bc;
  const P=g.boundary;
  // Winding decides which side is "out". A centroid test is wrong on a concave
  // shape like the cross, where the middle edges face back toward the middle.
  let area2=0;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];area2+=a[0]*b[1]-b[0]*a[1];}
  const ccw=area2>0;
  const atVertex=(q,p)=>Math.hypot(q.x-p[0],q.y-p[1])<0.9;
  const N=P.length;
  const E=[];
  for(let i=0;i<N;i++){
    const a=P[i], b=P[(i+1)%N];
    const ex=b[0]-a[0], ey=b[1]-a[1], L=Math.hypot(ex,ey);
    const ux=L<1e-9?1:ex/L, uy=L<1e-9?0:ey/L;
    E.push({a,b,L,ux,uy,nx:ccw?uy:-uy,ny:ccw?-ux:ux});   // n points away from the bed
  }
  // Where two back lines cross. A sealed corner mitres here instead of running
  // a flat CD past the vertex, which is what grew arrowheads into the bed.
  const miter=(e,f)=>{
    const den=e.ux*f.uy-e.uy*f.ux;
    if(Math.abs(den)<1e-6)return null;
    const p1=[e.a[0]+e.nx*CD, e.a[1]+e.ny*CD], p2=[f.a[0]+f.nx*CD, f.a[1]+f.ny*CD];
    const t=((p2[0]-p1[0])*f.uy-(p2[1]-p1[1])*f.ux)/den;
    return[p1[0]+e.ux*t, p1[1]+e.uy*t];};
  // ONE CUSHION PER RAIL, NOT ONE PER FACET.
  // A curved rail is a chain of short straight edges. Emitting a separate
  // trapezoid for each of them drew twenty-four little cushions per rail with a
  // visible seam between every pair — which is exactly why the Wave looked
  // home-made next to the two straight tables. Consecutive edges are now
  // collected into a RUN that breaks only at a pocket, and each run is drawn as
  // a single strip: the nose polyline out, the mitred back polyline home. The
  // collision segments are still one per facet, so the curve stays a curve.
  const pocketV=P.map(p=>g.pockets.some(q=>atVertex(q,p)));
  const starts=[];
  for(let i=0;i<N;i++)if(pocketV[i])starts.push(i);
  const runs=[];
  if(!starts.length)runs.push({from:0,to:N-1,openA:false,openB:false});
  else for(let k=0;k<starts.length;k++){
    const from=starts[k], next=starts[(k+1)%starts.length];
    let to=from; while((to+1)%N!==next){to=(to+1)%N; if(to===from)break;}
    runs.push({from,to,openA:true,openB:true});}
  const polys=[], segs=[];
  for(const run of runs){
    const idx=[]; for(let i=run.from;;i=(i+1)%N){idx.push(i); if(i===run.to)break;}
    const e0=E[idx[0]], e1=E[idx[idx.length-1]];
    if(e0.L<M_C*2+0.4&&idx.length===1)continue;
    // nose polyline: cut back M_C from the pocket at each end
    const nose=[];
    nose.push([e0.a[0]+e0.ux*(run.openA?M_C:0), e0.a[1]+e0.uy*(run.openA?M_C:0)]);
    for(let k=1;k<idx.length;k++)nose.push([E[idx[k]].a[0],E[idx[k]].a[1]]);
    nose.push([e1.b[0]-e1.ux*(run.openB?M_C:0), e1.b[1]-e1.uy*(run.openB?M_C:0)]);
    if(nose.length<2)continue;
    // back polyline: CD proud on the rail side, mitred at every interior joint,
    // flared JAW into the throat at each pocket end
    const back=[];
    back.push([nose[0][0]+e0.nx*CD-e0.ux*(run.openA?JAW:CD),
               nose[0][1]+e0.ny*CD-e0.uy*(run.openA?JAW:CD)]);
    for(let k=1;k<idx.length;k++){
      const u=E[idx[k-1]], v=E[idx[k]];
      const m=miter(u,v);
      back.push(m||[v.a[0]+v.nx*CD, v.a[1]+v.ny*CD]);}
    const last=nose[nose.length-1];
    back.push([last[0]+e1.nx*CD+e1.ux*(run.openB?JAW:CD),
               last[1]+e1.ny*CD+e1.uy*(run.openB?JAW:CD)]);
    polys.push([...nose,...back.slice().reverse()]);
    for(let k=0;k+1<nose.length;k++)segs.push([nose[k],nose[k+1]]);
    segs.push([nose[0],back[0]]);                                  // jaw face
    segs.push([last,back[back.length-1]]);                         // jaw face
  }
  g._bc={polys,segs};return g._bc;
}

function tableSegs(g){
  if(g._segs)return g._segs;
  const segs=[];
  if(g.boundary)for(const s of bedCushions(g).segs)segs.push(s);
  else for(const poly of cushions(g)){
    const [n0,n1,b1,b0]=poly;
    segs.push([n0,n1],[n1,b1],[b0,n0]);}        // nose, then both jaw faces
  for(const w of g.walls){
    const c=[[w.x,w.y],[w.x+w.w,w.y],[w.x+w.w,w.y+w.h],[w.x,w.y+w.h]];
    for(let i=0;i<4;i++)segs.push([c[i],c[(i+1)%4]]);
  }
  g._segs=segs;return segs;
}
const newBall=(n,x,y)=>{const s=Math.sin(n*2.4)*0.5+0.5, t=n*1.7;
  return{n,x,y,vx:0,vy:0,wx:0,wy:0,wz:0,in:false,pocket:undefined,
    px:Math.cos(t)*s,py:Math.sin(t)*s,pz:Math.sqrt(Math.max(0,1-s*s)),
    qx:-Math.sin(t),qy:Math.cos(t),qz:0};};

// Rotate the painted ball orientation with Rodrigues' exact axis-angle formula.
// Hard breaks turn too far per step for a first-order rotation approximation.
function spinVec(b,dt){
  const {wx,wy,wz}=b, w=Math.hypot(wx,wy,wz);
  if(w<1e-9)return;
  const th=w*dt, s=Math.sin(th), c=Math.cos(th), k=1-c;
  const kx=wx/w, ky=wy/w, kz=wz/w;
  const rot=(x,y,z)=>{
    const d=kx*x+ky*y+kz*z;
    return[x*c+(ky*z-kz*y)*s+kx*d*k,
           y*c+(kz*x-kx*z)*s+ky*d*k,
           z*c+(kx*y-ky*x)*s+kz*d*k];};
  let p=rot(b.px,b.py,b.pz), l=Math.hypot(p[0],p[1],p[2])||1;
  b.px=p[0]/l; b.py=p[1]/l; b.pz=p[2]/l;
  let q=rot(b.qx,b.qy,b.qz); l=Math.hypot(q[0],q[1],q[2])||1;
  b.qx=q[0]/l; b.qy=q[1]/l; b.qz=q[2]/l;
}

function strike(cue,angle,speed,tip,el){
  // Every strike starts a fresh physics clock. Vodka uses this to be extremely
  // slick at the start of a shot without leaving the rack rolling forever.
  RULE.shotAge=0;
  const a=tip?tip.a:0, b=tip?tip.b:0, e=el||0;
  const ce=Math.cos(e), se=Math.sin(e);
  const th=angle-(RULE.noSquirt?0:a*SQUIRT*ce);
  const dx=Math.cos(th), dy=Math.sin(th);
  const v=speed*ce;
  cue.vx=dx*v; cue.vy=dy*v;
  // STROKE decides how much of the spin you dialled in actually reaches the
  // ball. This is the deterministic half of what Stroke used to do randomly.
  const sm=RULE.spinMul==null?1:RULE.spinMul;
  const k=2.5*speed/BR;
  const wPerp=k*b*ce*sm;     // follow / draw — axis across the line of travel
  const wAlong=-k*a*se*(RULE.masse||1)*sm;   // masse — axis along the line of travel
  cue.wx=wPerp*(-dy)+wAlong*dx;
  cue.wy=wPerp*dx+wAlong*dy;
  cue.wz=-k*a*ce*sm;         // plain sidespin
  // THE SWERVE. A real masse is the spin axis fighting the cloth, and modelling
  // it purely through the spin vector gave a bend you had to be TOLD about.
  // This is an explicit sideways acceleration armed at the strike: raise the
  // butt, strike off centre, and the ball leaves on one line and arrives on
  // another. You can watch it happen, and the preview draws it, because the
  // preview runs this exact code.
  cue.swerve=-a*se*(RULE.masse||1)*Math.min(speed,300)*3.2;
  cue.swerveT=0;
}

function stepBall(b,dt){
  const ux=b.vx-BR*b.wy, uy=b.vy+BR*b.wx, us=Math.hypot(ux,uy);
  const a=MU_SLIDE*G;
  // Slip closes at 7/2 of the friction rate. If it would close inside this step,
  // don't integrate through it — jump straight to the rolling state, or the slip
  // direction flips every frame and the friction cancels itself out.
  if(us>3.5*a*dt){                               // still sliding after this step
    const nx=ux/us, ny=uy/us;
    b.vx-=a*dt*nx; b.vy-=a*dt*ny;
    const k=(2.5*a*dt)/BR;
    b.wx-=k*ny; b.wy+=k*nx;
  }else{                                         // rolling
    b.vx-=(2/7)*ux; b.vy-=(2/7)*uy;              // exact end-of-slide velocity
    const sp=Math.hypot(b.vx,b.vy);
    // the Comet keeps going: a twentieth of the normal rolling resistance
    // Vodka gives the shot a long, fast opening run, then the cloth gradually
    // regains enough drag to let the turn finish. The old permanent 0.42 factor
    // could leave a hard shot rolling for 30+ seconds and looked like a lockup.
    const vodkaDrag=RULE.fastCloth
      ? (RULE.shotAge<8?0.42:Math.min(1.15,0.42+(RULE.shotAge-8)*0.16))
      : 1;
    const roll=MU_ROLL*vodkaDrag*(b.power==="comet"?0.05:1);
    if(sp>0){const ns=Math.max(0,sp-roll*G*dt); b.vx*=ns/sp; b.vy*=ns/sp;}
    b.wy=b.vx/BR; b.wx=-b.vy/BR;
  }
  // Cricket's Boomerang holds sidespin: a twelfth of the normal decay rather
  // than a quarter, which is the difference between english that survives one
  // rail and english that is still steering the ball off the fourth.
  // Boomerang preserves side spin while the white is travelling. Once its
  // linear motion is effectively over, normal spin decay resumes; otherwise a
  // visually stationary cue ball can monopolise the turn for more than a minute.
  const travel=Math.hypot(b.vx,b.vy);
  const hold=b.n===0&&RULE.spinHold&&travel>2.5;
  b.wz-=b.wz*Math.min(1,(hold?MU_SPIN*0.08:MU_SPIN)*dt);
  if(b.swerve){
    const sp2=Math.hypot(b.vx,b.vy);
    // The bend only lives while the ball is genuinely travelling. Left running
    // as the ball died it kept steering a nearly-stationary ball and wound it
    // round in circles, which is not a masse, it is a fairground ride.
    if(sp2>22){
      const nx=-b.vy/sp2, ny=b.vx/sp2;              // left of travel
      const fade=Math.exp(-b.swerveT*2.6);          // the bend dies as roll takes over
      b.vx+=nx*b.swerve*fade*dt; b.vy+=ny*b.swerve*fade*dt;
      b.swerveT+=dt;
      if(fade<0.04)b.swerve=0;
    } else b.swerve=0;
  }
  if(RULE.tilt)b.vy+=RULE.tilt*dt;   // Jäger: the slate is not level
  spinVec(b,dt);
  b.x+=b.vx*dt; b.y+=b.vy*dt;
}

function hitSeg(b,seg,ev){
  const [p,q]=seg;
  const ex=q[0]-p[0], ey=q[1]-p[1], L2=ex*ex+ey*ey||1;
  let t=((b.x-p[0])*ex+(b.y-p[1])*ey)/L2; t=t<0?0:t>1?1:t;
  const qx=p[0]+ex*t, qy=p[1]+ey*t;
  let dx=b.x-qx, dy=b.y-qy, d=Math.hypot(dx,dy);
  if(d>=BR)return false;
  if(d<1e-9){dx=-ey;dy=ex;d=Math.hypot(dx,dy)||1;}
  const nx=dx/d, ny=dy/d;
  b.x=qx+nx*BR; b.y=qy+ny*BR;                    // lift clear of the face
  const vn=b.vx*nx+b.vy*ny;
  if(vn>=0)return false;                          // already leaving
  const tx=-ny, ty=nx;
  let vt=b.vx*tx+b.vy*ty;
  let e=Math.max(0.73,Math.min(0.84,0.84-Math.abs(vn)*0.00022));
  if(RULE.deadRail)e*=0.22;
  if(RULE.softJaws&&b.n!==0)e*=0.30;   // ketamine: the jaws stop fighting back
  const surf=vt-BR*b.wz;                          // contact patch speed along the face
  // Cricket bites nearly twice as hard into the rail, so her sidespin actually
  // steers the ball off the cushion instead of politely suggesting a direction.
  let dvt=-MU_CUSH*(RULE.cushBite&&b.n===0?1.85:1)*(1+e)*Math.abs(vn)*Math.sign(surf||1);
  if(Math.abs(dvt)>Math.abs(surf)*0.55)dvt=-Math.sign(surf||1)*Math.abs(surf)*0.55;
  vt+=dvt;
  b.wz+=-(2.5*dvt)/BR;
  // The rail barely touches the ROLL. It used to keep only 62% of it, which
  // wiped out draw and follow at every cushion and made balls arrive spinning
  // and leave dead. Keeping the spin is also what makes a ball check up off a
  // rail for real: its spin no longer matches its new velocity, so it slides
  // and the friction model re-establishes the roll on its own.
  b.wx*=0.92; b.wy*=0.92;
  const nv=-vn*e;
  b.vx=nx*nv+tx*vt; b.vy=ny*nv+ty*vt;
  // A cushion nose sits above the centre of the ball, so the impact torques it
  // forward: balls come off a rail already picking up roll rather than sliding
  // the whole way out. Blend a quarter of the way to natural roll for the NEW
  // direction; the slide model does the rest, exactly as it does off the tip.
  const rollX=-b.vy/BR, rollY=b.vx/BR, CUSH_ROLL=0.25;
  b.wx+=(rollX-b.wx)*CUSH_ROLL; b.wy+=(rollY-b.wy)*CUSH_ROLL;
  if(ev){ev.rail=true; if(b.n===0)ev.cueRails=(ev.cueRails||0)+1;}
  return true;
}

function powerHit(ev,kind,x,y,message,key){
  if(!ev)return;
  ev.power=message;
  ev.powerSeen=ev.powerSeen||{};
  const k=key||kind;
  if(ev.powerSeen[k])return;
  ev.powerSeen[k]=1;
  if(ev.emit)ev.emit({kind,x,y,message});
}

function hitBalls(a,b,ev){
  let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
  if(d<=0||d>=BR*2)return false;
  const cueHere=a.n===0||b.n===0, other=a.n===0?b.n:a.n;
  if(a.power==="ghost"&&!a.ghostSpent){a.ghostSpent=true;powerHit(ev,"ghost",(a.x+b.x)/2,(a.y+b.y)/2,"GHOST PHASE · first contact passed straight through.",`ghost-${a.n}`);return false;}
  if(b.power==="ghost"&&!b.ghostSpent){b.ghostSpent=true;powerHit(ev,"ghost",(a.x+b.x)/2,(a.y+b.y)/2,"GHOST PHASE · first contact passed straight through.",`ghost-${b.n}`);return false;}
  if(cueHere&&RULE.phaseBall===other)return false;          // already going through this one
  if(cueHere&&RULE.phase){RULE.phase=false;RULE.phaseBall=other;return false;}
  // FIRST CONTACT IS RECORDED THE MOMENT THE BALLS TOUCH.
  // This used to sit on the last line of the function, past the `rel>=0` early
  // return. A thin cut where the two balls were already separating by the time
  // the overlap resolved therefore registered as "you hit nothing", which is a
  // foul — that is the phantom ball-in-hand that kept ending legal turns.
  if(ev&&ev.first==null){ if(a.n===0)ev.first=b.n; else if(b.n===0)ev.first=a.n; }
  a.swerve=0; b.swerve=0;              // the bend is spent on contact
  if(cueHere){
    const hit=a.n===0?b:a;
    // PEARL: she cuts her mark into whatever she touches first, and it is hers
    // for the rest of the rack. It literally becomes a Steal ball — you can see
    // the mark on it from then on.
    if(RULE.claimArm){RULE.claimArm=false; hit.power="steal"; hit.claimed=1;
      powerHit(ev,"steal",hit.x,hit.y,"CLAIMED · that ball answers to her now.",`claim-${hit.n}`);}
    // DAPHNE: she called it, so it goes. From here the ball steers itself.
    if(RULE.homeArm){RULE.homeArm=false; RULE.homeBall=hit.n;
      powerHit(ev,"wild",hit.x,hit.y,"CALLED SHOT · it is going wherever she said it was going.",`called-${hit.n}`);}
  }
  // FUSE: struck is lit. It goes off at the END of the shot, wherever it stops.
  if(a.power==="brick")a.lit=1;
  if(b.power==="brick")b.lit=1;
  if(d<1e-9){dx=1;dy=0;d=1;}
  const nx=dx/d, ny=dy/d, ov=(BR*2-d)/2;
  a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
  const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rel>=0)return false;
  // Backwood's cue ball carries brick weight all match — it goes THROUGH a cluster.
  const mass=q=>(q.n===0&&RULE.heavyCue)?2.2:q.power==="anchor"?7:q.power==="brick"?2.4*RULE.brickBoost:1;
  const ma=mass(a),mb=mass(b),jn=-(1+E_BALL)*rel/(1/ma+1/mb);
  a.vx-=jn/ma*nx; a.vy-=jn/ma*ny; b.vx+=jn/mb*nx; b.vy+=jn/mb*ny;
  // surface speeds at the contact point, tangential component only
  const tx=-ny, ty=nx;
  const sa=(a.vx*tx+a.vy*ty)+BR*a.wz, sb=(b.vx*tx+b.vy*ty)-BR*b.wz;
  const slip=sb-sa;
  // La Recta: on Oscar's smoke shot the object ball leaves dead on the ghost
  // line. No cut-induced throw, no english pushing it off — the one thing he
  // does, he does perfectly.
  if(Math.abs(slip)>1e-4&&!(RULE.noThrow&&cueHere)){
    // Effective tangential mass includes both translation and the rotational
    // inertia of two solid spheres. This produces natural cut-induced throw
    // instead of a fixed sideways nudge.
    let jt=-slip/(3.5*(1/ma+1/mb));
    const cap=MU_BALL*Math.abs(jn);
    if(Math.abs(jt)>cap)jt=Math.sign(jt)*cap;
    a.vx-=jt/ma*tx; a.vy-=jt/ma*ty; b.vx+=jt/mb*tx; b.vy+=jt/mb*ty;
    a.wz-=(2.5*jt)/BR; b.wz-=(2.5*jt)/BR;
  }
  if(Math.abs(rel)>18){
    const brick=a.power==="brick"?a:b.power==="brick"?b:null;
    const anchor=a.power==="anchor"?a:b.power==="anchor"?b:null;
    if(brick)powerHit(ev,"brick",brick.x,brick.y,"BRICK HIT · heavy mass punched through the collision.",`brick-${brick.n}`);
    else if(anchor)powerHit(ev,"anchor",anchor.x,anchor.y,"ANCHOR HOLD · the impact died against the heavy ball.",`anchor-${anchor.n}`);
  }
  return true;
}

function stepSim(bs,g,dt,ev){
  if(!g._pk)g._pk=makePockets(g);
  ev=ev||{};
  const segs=tableSegs(g);
  // KEYSTONE. While one is on the table the pocket beside it is SHUT — for
  // everybody, including whoever put it there. It is not a heavy ball any more,
  // it is a locked door.
  const shut=closedPockets(bs,g);
  // GRAVITY WELLS. A Void pulls and a Repulsor pushes, continuously, on any
  // ball that is actually travelling. Stationary balls are left alone on
  // purpose — otherwise nothing on the table ever comes to rest and the shot
  // never ends. What you get instead is routes that visibly bend as they pass.
  for(const w of bs){
    if(w.in||(w.power!=="void"&&w.power!=="repulsor"))continue;
    const sign=w.power==="void"?1:-1;
    for(const o of bs){
      if(o===w||o.in)continue;
      if(Math.hypot(o.vx,o.vy)<1.2)continue;          // only bends live routes
      const dx=w.x-o.x, dy=w.y-o.y, d=Math.hypot(dx,dy);
      if(d<BR*2||d>30)continue;
      const a=sign*Math.min(110,2400/(d*d));   // capped, or a Void just eats the ball
      o.vx+=dx/d*a*dt; o.vy+=dy/d*a*dt;
      if(!w.pulled&&d<12){w.pulled=1;
        powerHit(ev,w.power,w.x,w.y,sign>0?"VOID PULL · that route is being bent off its line."
          :"REPULSOR · the lane pushed the ball back out.",`${w.power}-${w.n}`);}
    }
  }
  for(const b of bs){
    if(b.in)continue;
    // Now that the cushions have genuine openings, ANY ball can leave through
    // one. If it does it has gone in — find the pocket it left by, so the
    // called-pocket rule still works, rather than losing it off the table.
    if(cueEscaped(g,b)){
      if(b.n===0&&RULE.cueSafe){                 // Mordecai / Fargo: no scratch
        b.vx=b.vy=b.wx=b.wy=b.wz=0;
        const cs=cueSpotFor(g,bs,b); b.x=cs[0]; b.y=cs[1]; continue;}
      let bi=0,bd=Infinity;
      g._pk.forEach((q,qi)=>{const d=Math.hypot(b.x-q.cx,b.y-q.cy);if(d<bd){bd=d;bi=qi;}});
      b.in=true;b.pocket=bi;b.vx=b.vy=b.wx=b.wy=b.wz=0;
      if(b.n===0)ev.cueRecovered=true;continue;}
    // Pure spin is cosmetic once the centre has stopped. Do not hold the game
    // loop open waiting for an exponentially decaying wz to become exactly 0.
    if(Math.hypot(b.vx,b.vy)<STOP_V&&
       Math.hypot(b.vx-BR*b.wy,b.vy+BR*b.wx)<0.12){b.vx=b.vy=b.wx=b.wy=b.wz=0;continue;}
    // DAPHNE'S CALLED SHOT. The ball she named steers itself into the nearest
    // pocket it is facing. This is not physics and it is not pretending to be —
    // it is a called shot, and a called shot goes in.
    if(RULE.homeBall===b.n&&!b.in){
      let sp=Math.hypot(b.vx,b.vy);
      if(sp>3){
        // lock on once, to the pocket it was best facing when it set off, and
        // do not change its mind halfway
        if(!b.homeTo){
          let best=null,bs2=-9;
          for(const q of g._pk){const dx=q.cx-b.x, dy=q.cy-b.y, d=Math.hypot(dx,dy)||1;
            const face=(b.vx/sp)*(dx/d)+(b.vy/sp)*(dy/d);
            const score=face*2-d/90;
            if(face>-0.5&&score>bs2){bs2=score;best=q;}}
          b.homeTo=best||g._pk[0];
        }
        const q=b.homeTo, dx=q.cx-b.x, dy=q.cy-b.y, d=Math.hypot(dx,dy)||1;
        const turn=Math.min(1,16*dt);
        let nvx=b.vx/sp+dx/d*turn, nvy=b.vy/sp+dy/d*turn;
        const nl=Math.hypot(nvx,nvy)||1;
        // and it does not die on the way. She called it; it gets there.
        if(d>2.5&&sp<26)sp=26;
        b.vx=nvx/nl*sp; b.vy=nvy/nl*sp;
      }
    }
    // FUSE. It was lit when it was struck; now it has stopped rolling, so it
    // goes off where it sits and everything near it goes with it.
    if(b.power==="brick"&&b.lit&&!b.blown&&Math.hypot(b.vx,b.vy)<STOP_V*1.6){
      b.blown=1;
      powerHit(ev,"brick",b.x,b.y,"FUSE · it burned all the way down and went off where it stopped.",`fuse-${b.n}`);
      const reach=24*RULE.brickBoost;
      for(const o of bs){ if(o===b||o.in)continue;
        const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy)||1;
        if(d<reach){const kick=(reach-d)*6.2*RULE.brickBoost; o.vx+=dx/d*kick; o.vy+=dy/d*kick;}}
    }
    stepBall(b,dt);
    let dropped=false;
    // Mordecai's Sharking keeps his own cue ball out of the pockets.
    if(!(b.n===0&&RULE.cueSafe))
    for(let i=0;i<g._pk.length;i++){const p=g._pk[i];
      if(shut&&shut.has(i)&&b.power!=="anchor")continue;   // Keystone has it shut
      const speed=Math.hypot(b.vx,b.vy),isMagnet=b.power==="magnet"&&speed<105;
      const magnet=isMagnet?RULE.magnetBoost:1;
      const pace=isMagnet?1:Math.max(.76,Math.min(1.04,1.06-speed/720));
      if(Math.hypot(b.x-p.cx,b.y-p.cy)<p.capt*RULE.pocketBoost*magnet*pace){
        b.in=true;b.pocket=i;b.vx=b.vy=b.wx=b.wy=b.wz=0;dropped=true;
        if(isMagnet)powerHit(ev,"magnet",p.cx,p.cy,"MAGNET SNAP · the pocket pulled the near miss home.",`magnet-${b.n}`);
        if(b.power==="steal")powerHit(ev,"steal",p.cx,p.cy,"STEAL CLAIM · that ball changed sides on the drop.",`steal-${b.n}`);
        if(b.power==="wild")powerHit(ev,"wild",p.cx,p.cy,"WILD CARD · the table counted exactly what you needed.",`wild-${b.n}`);
        if(b.power==="poltergeist"){
          powerHit(ev,"poltergeist",p.cx,p.cy,"POLTERGEIST · the whole table just got up and moved.",`polt-${b.n}`);
          for(const o of bs){ if(o===b||o.in||o.n===0)continue;
            for(let tries=0;tries<14;tries++){
              const a=Math.random()*Math.PI*2, r=5+Math.random()*4;
              const nx=o.x+Math.cos(a)*r, ny=o.y+Math.sin(a)*r;
              if(!insideBed(g,nx,ny))continue;
              if(bs.some(q=>q!==o&&!q.in&&Math.hypot(q.x-nx,q.y-ny)<BR*2.05))continue;
              o.x=nx; o.y=ny; o.vx=o.vy=o.wx=o.wy=o.wz=0; break;}}}
        if(b.power==="joker")powerHit(ev,"joker",p.cx,p.cy,"JOKER · counted, and the table has been redealt.",`joker-${b.n}`);
        if(b.power==="revenant"&&!b.revived)powerHit(ev,"revenant",p.cx,p.cy,"REVENANT · it climbed straight back out.",`rev-${b.n}`);
        if(b.power==="bomb")powerHit(ev,"bomb",p.cx,p.cy,RULE.bombBoost>1?"POWDER CHARGE · the Bomb cleared the whole pocket zone.":"BOMB DROP · the pocket exploded back into the table.",`bomb-${b.n}`);
        if(b.power==="bomb")for(const o of bs){if(o===b||o.in)continue;const dx=o.x-p.cx,dy=o.y-p.cy,d=Math.hypot(dx,dy)||1;
          const reach=22*RULE.bombBoost;if(d<reach){const kick=(reach-d)*5.2*RULE.bombBoost;o.vx+=dx/d*kick;o.vy+=dy/d*kick;
            }}
        break;}}
    if(dropped)continue;
    const sp0=Math.hypot(b.vx,b.vy);
    let railed=false;
    for(const s of segs)if(hitSeg(b,s,ev))railed=true;
    // NITRO. Drive it into a cushion hard and it goes off where it hits, in the
    // middle of the shot, while everything is still moving.
    if(railed&&b.power==="nitro"&&!b.blown&&sp0>100*(RULE.bombBoost>1?0.65:1)){
      b.blown=true;
      powerHit(ev,"nitro",b.x,b.y,"NITRO · it went off against the rail, mid-shot.",`nitro-${b.n}`);
      const reach=20*RULE.bombBoost;
      for(const o of bs){ if(o===b||o.in)continue;
        const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy)||1;
        if(d<reach){const kick=(reach-d)*5.6*RULE.bombBoost; o.vx+=dx/d*kick; o.vy+=dy/d*kick;}}
      b.vx*=0.25; b.vy*=0.25;
    }
    if(cueEscaped(g,b)){
      if(b.n===0&&RULE.cueSafe){
        b.vx=b.vy=b.wx=b.wy=b.wz=0;
        const cs=cueSpotFor(g,bs,b); b.x=cs[0]; b.y=cs[1]; continue;}
      let bi=0,bd=Infinity;
      g._pk.forEach((q,qi)=>{const d=Math.hypot(b.x-q.cx,b.y-q.cy);if(d<bd){bd=d;bi=qi;}});
      b.in=true;b.pocket=bi;b.vx=b.vy=b.wx=b.wy=b.wz=0;
      if(b.n===0)ev.cueRecovered=true;}
  }
  for(let i=0;i<bs.length;i++){ if(bs[i].in)continue;
    for(let j=i+1;j<bs.length;j++){ if(bs[j].in)continue; hitBalls(bs[i],bs[j],ev); }}
  // BACKWOOD'S BACKDRAFT. The cue ball itself goes off the moment it touches
  // anything. Everything within two feet gets thrown.
  if(RULE.cueBlast&&ev.first!=null&&!ev.blasted){
    ev.blasted=1;
    const c=bs.find(q=>q.n===0);
    if(c){
      powerHit(ev,"bomb",c.x,c.y,"BACKDRAFT · the white went off in the middle of the pack.",`backdraft`);
      for(const o of bs){ if(o===c||o.in)continue;
        const dx=o.x-c.x, dy=o.y-c.y, d=Math.hypot(dx,dy)||1;
        if(d<24){const kick=(24-d)*7.4; o.vx+=dx/d*kick; o.vy+=dy/d*kick;}}
      c.vx*=0.3; c.vy*=0.3;
    }
  }
}

// Which pockets a Keystone currently has shut. Returns null when there are none,
// so the common case costs nothing.
function closedPockets(bs,g){
  let out=null;
  for(const q of bs){
    if(q.in||q.power!=="anchor")continue;
    for(let i=0;i<g._pk.length;i++){
      const p=g._pk[i];
      if(Math.hypot(q.x-p.cx,q.y-p.cy)<9.5)(out=out||new Set()).add(i);
    }
  }
  return out;
}
const asleep=bs=>bs.every(b=>b.in||(
  Number.isFinite(b.vx)&&Number.isFinite(b.vy)&&Number.isFinite(b.wz)&&
  Math.hypot(b.vx,b.vy)<STOP_V&&Math.abs(b.wz)<STOP_W));
function settleTable(bs){
  for(const b of bs){if(!b.in)b.vx=b.vy=b.wx=b.wy=b.wz=0;}
}
const fastest=bs=>bs.reduce((m,b)=>b.in?m:Math.max(m,Math.hypot(b.vx,b.vy)),0);
const spinniest=bs=>bs.reduce((m,b)=>b.in?m:Math.max(m,Math.hypot(b.wx,b.wy,b.wz)),1);

// Advance the whole table by dt, subdividing so nothing tunnels through a rail
// AND so no ball turns more than about half a radian in a single step. Without
// the angular term a fast ball aliases its own rotation and appears to spin
// slowly, backwards, or not at all.
function advance(bs,g,dt,ev){
  const v=Math.max(fastest(bs),1), w=spinniest(bs);
  const n=Math.max(2,Math.min(96,Math.ceil(Math.max(dt*v/0.35, dt*w/0.5))));
  for(let i=0;i<n;i++)stepSim(bs,g,dt/n,ev);
  RULE.shotAge+=dt;
}

// ---- aim prediction ---------------------------------------------------------
function rayFirst(cue,angle,bs,g){
  const dx=Math.cos(angle),dy=Math.sin(angle);
  let bt=Infinity,hit=null;
  for(const b of bs){ if(b.in||b.n===0)continue;
    const ex=b.x-cue.x,ey=b.y-cue.y,proj=ex*dx+ey*dy; if(proj<=0)continue;
    const perp=Math.abs(ex*dy-ey*dx); if(perp>BR*2)continue;
    const t=proj-Math.sqrt(Math.max(0,BR*BR*4-perp*perp));
    if(t>1e-4&&t<bt){bt=t;hit=b;}}
  let lim=Infinity;
  if(g.boundary){for(const s of tableSegs(g)){const ax=s[0][0]-cue.x,ay=s[0][1]-cue.y,
      ex=s[1][0]-s[0][0],ey=s[1][1]-s[0][1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-8)continue;
      const t=(ax*ey-ay*ex)/den,u=(ax*dy-ay*dx)/den;if(t>0&&u>=0&&u<=1)lim=Math.min(lim,Math.max(0,t-BR));}}
  else{const clip=(v,d,lo,hi)=>{if(d>0)lim=Math.min(lim,(hi-v)/d);else if(d<0)lim=Math.min(lim,(lo-v)/d);};
    clip(cue.x,dx,BR,g.w-BR); clip(cue.y,dy,BR,g.h-BR);}
  return{ball:hit&&bt<=lim?hit:null};
}

// THE PREVIEW USED TO BOUNCE OFF POCKETS.
// A pocket's mitred jaws are real collision segments and they sit INSIDE the
// capture radius, so testing cushions before pockets made the aim line rattle
// out of a pocket the actual ball drops straight into. Pockets are now checked
// first, with the same speed-dependent capture radius stepSim uses, for the cue
// ball AND for the object ball after contact. What you are shown is what you get.
// THE PREVIEW IS NOW THE ENGINE.
//
// It used to be a separate, simplified integrator: it rolled the cue ball on
// its own, then rolled the object ball on its own, and neither of them could
// see any other ball on the table. So the moment there was traffic — a cluster,
// a ball two feet down the rail, an Anchor parked in the jaws — the line you
// were shown was a line through an empty table that does not exist. It also
// used a fixed timestep where the real shot uses adaptive substepping, so even
// on a clear table the two drifted apart at speed, and it knew nothing about
// gravity wells, magnets or collision mass.
//
// It now clones the live table and runs advance() — the exact function the real
// shot runs — and simply records where things went. Every ball is present,
// every Power Ball rule applies, the integration is identical. What you are
// shown is what the engine is going to do, and the only things that can still
// move the ball off it are the ones that are supposed to: your Touch stat's
// pace error, and whatever the bar has done to your aim.
// HOW FAR YOU ARE ALLOWED TO SEE.
// The preview used to run until the table settled, so a hard shot handed you
// the entire route — every rail, every roll-out — and the game played itself.
// Each drawn line now has a LENGTH BUDGET in inches. Hit it harder and the ball
// simply travels past the end of what you were shown. Eye still decides how
// many cushions you get inside that budget.
const SEE_OBJ=32, SEE_CUE=20;   // fallbacks for previews with no sheet attached
function cutTo(pts,budget){
  if(!pts||pts.length<2)return pts;
  const out=[pts[0]]; let run=0;
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(run+d>budget){
      const t=Math.max(0,(budget-run)/(d||1));
      out.push([pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t]);
      return out;}
    run+=d; out.push(pts[i]);}
  return out;
}
function predictPath(cue,angle,speed,tip,el,bs,g,maxRails,see){
  const keep={...RULE};
  const sim=bs.filter(b=>!b.in).map(b=>({...b}));
  const t=sim.find(b=>b.n===0);
  if(!t){Object.assign(RULE,keep);
    return{path:[[cue.x,cue.y]],ghost:null,ball:null,objPath:null,cuePath:null,potted:false,short:true};}
  strike(t,angle,speed,tip,el);
  const ev={first:null,rail:false,cueRails:0};
  const LIMIT=maxRails==null?3:maxRails;
  const dt=PHYS_DT;
  const path=[[t.x,t.y]];
  let hit=null, ghost=null, cut=0, potted=false, stopped=false;

  // --- phase one: the white line, up to first contact -----------------------
  for(let i=0;i<560;i++){
    const px=t.x, py=t.y, pvx=t.vx, pvy=t.vy;
    advance(sim,g,dt,ev);
    if(ev.first!=null){
      hit=sim.find(b=>b.n===ev.first);
      ghost=[px,py];
      if(hit){const ivl=Math.hypot(pvx,pvy)||1;
        const nx=hit.x-px, ny=hit.y-py, nl=Math.hypot(nx,ny)||1;
        cut=Math.max(0,(pvx/ivl)*(nx/nl)+(pvy/ivl)*(ny/nl));}
      break;
    }
    if(i%2===0)path.push([t.x,t.y]);
    if(t.in){potted=true;break;}
    if(ev.cueRails>LIMIT)break;          // EYE decides how far ahead you see
    if(Math.hypot(t.vx,t.vy)<0.7){stopped=true;break;}
  }
  path.push([t.x,t.y]);
  if(!hit){Object.assign(RULE,keep);
    return{path,ghost:null,ball:null,objPath:null,cuePath:null,potted:potted||t.in,short:stopped};}

  // --- phase two: where the struck ball and the cue ball actually end up ----
  const objPath=[[hit.x,hit.y]], cuePath=[[t.x,t.y]];
  // run the tail out until the table settles rather than cutting the line off
  // mid-roll — a line that just stops is worse than no line
  for(let i=0;i<560;i++){
    advance(sim,g,dt,ev);
    if(i%2===0){objPath.push([hit.x,hit.y]);cuePath.push([t.x,t.y]);}
    // Stop as soon as the two balls we are actually DRAWING have finished.
    // Waiting for the whole table to settle made the break preview simulate
    // fifteen balls rolling around long after both lines had stopped moving,
    // which is pure cost for nothing on screen.
    const done=q=>q.in||(q.vx===0&&q.vy===0);
    if(done(hit)&&done(t))break;
    if(asleep(sim))break;
  }
  objPath.push([hit.x,hit.y]); cuePath.push([t.x,t.y]);
  Object.assign(RULE,keep);
  // harder shots show a little more of the route, but only a little
  const pace=Math.max(0.55,Math.min(1.35,0.55+speed/MAXV*1.00));
  const objCut=cutTo(objPath,((see&&see.obj)||SEE_OBJ)*pace);
  const cueCut=cutTo(cuePath,((see&&see.cue)||SEE_CUE)*pace);
  // if the line was trimmed the drop is beyond what you were shown, so the
  // preview must not claim it
  const objShown=objCut.length===objPath.length;
  return{path,ghost,ball:hit,objPath:objCut,cuePath:cueCut,
    potted:t.in,objIn:hit.in&&objShown,cueIn:t.in,short:false,cut};
}

function restingPlaces(bs,g,angle,speed,tip,el){
  const keep={...RULE};
  const c=bs.filter(b=>!b.in).map(b=>({...b}));
  const cue=c.find(b=>b.n===0); if(!cue){Object.assign(RULE,keep);return null;}
  strike(cue,angle,speed,tip,el);
  let t=0;
  while(!asleep(c)&&t<7){advance(c,g,PHYS_DT,{});t+=PHYS_DT;}
  Object.assign(RULE,keep);
  return c.map(b=>({n:b.n,x:b.x,y:b.y,in:b.in}));
}

// ===== 6. RULES ==============================================================
// Rack construction is deterministic apart from Power Ball assignment. Custom
// cueSpot/rackSpot values override the regulation quarter/foot locations.
function buildRack(g,racks,powerSet){
  const bs=[],S=BR*2.04;
  const order=[1,11,2,3,8,10,9,7,14,4,5,13,15,6,12];
  const spot=racks===2?[g.w*0.56,g.w*0.82]:[g.rackSpot?g.rackSpot[0]:g.w*0.75];
  spot.forEach((sx,ri)=>{let k=0,sy=g.rackSpot?g.rackSpot[1]:g.h/2;
    for(let row=0;row<5;row++)for(let i=0;i<=row;i++){
      bs.push(newBall(order[k]+ri*15,sx+row*S*.872,sy+(i-row/2)*S));k++;}});
  const cue=g.cueSpot||[g.w*0.24,g.h/2];bs.push(newBall(0,cue[0],cue[1]));
  const set=POWER_SETS[powerSet];
  if(set){const deck=BALL_IDS.filter(x=>x!=="none");
    for(const b of bs){const base=((b.n-1)%15)+1, m2=set.map[base];
      // "?" means House Roulette deals that slot out of the whole deck at rack
      // time, so its table is already mixed before the first redeal lands.
      if(m2)b.power=m2==="?"?deck[Math.floor(Math.random()*deck.length)]:m2;}}
  return bs;
}
function insideBed(g,x,y){
  // An obstacle is as solid as a rail: ball in hand must not drop the white
  // inside a post.
  for(const w of (g.walls||[]))
    if(x>w.x-BR&&x<w.x+w.w+BR&&y>w.y-BR&&y<w.y+w.h+BR)return false;
  if(!g.boundary)return x>=BR&&x<=g.w-BR&&y>=BR&&y<=g.h-BR;
  // Ray-cast against the custom polygon, then require one ball radius of
  // clearance from every physical rail/jaw segment.
  let c=false,p=g.boundary;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}
  if(!c)return false;
  return tableSegs(g).every(s=>{const [a,b]=s,ex=b[0]-a[0],ey=b[1]-a[1],l=ex*ex+ey*ey||1;
    const t=Math.max(0,Math.min(1,((x-a[0])*ex+(y-a[1])*ey)/l));return Math.hypot(x-(a[0]+ex*t),y-(a[1]+ey*t))>=BR*.98;});
}
// THE WHITE HAS TO GO SOMEWHERE LEGAL.
// Every respot used to slam the cue ball onto g.cueSpot regardless of what was
// already sitting there, so a scratch could drop the white straight on top of
// an object ball (they then squirt apart on the first step) or, on a custom
// polygon, onto a point that is inside a cushion. Search outward from the spot
// in a widening ring for the first point that is on the bed AND clear of every
// other ball, and use that instead.
function cueSpotFor(g,bs,skip){
  const base=g.cueSpot||[g.w*0.24,g.h/2];
  const clear=(x,y)=>{
    if(!insideBed(g,x,y))return false;
    for(const b of bs){ if(b.in||b===skip||b.n===0)continue;
      if(Math.hypot(b.x-x,b.y-y)<BR*2.25)return false; }
    return true;};
  if(clear(base[0],base[1]))return base;
  for(let r=BR*1.2;r<=Math.max(g.w,g.h);r+=BR*1.1){
    const steps=Math.max(12,Math.round(r*2.2));
    for(let i=0;i<steps;i++){
      const a=i/steps*Math.PI*2, x=base[0]+Math.cos(a)*r, y=base[1]+Math.sin(a)*r;
      if(clear(x,y))return[x,y];}}
  return base;
}
function cueEscaped(g,b){
  // An out-of-frame cue ball is recoverable. For custom polygons, proximity to
  // a rail still counts as part of the table even if the center crossed outside.
  if(!Number.isFinite(b.x)||!Number.isFinite(b.y))return true;
  if(!g.boundary)return b.x<-RW-BR||b.x>g.w+RW+BR||b.y<-RW-BR||b.y>g.h+RW+BR;
  let inside=false,p=g.boundary;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const a=p[i],q=p[j];if(((a[1]>b.y)!==(q[1]>b.y))&&(b.x<(q[0]-a[0])*(b.y-a[1])/(q[1]-a[1])+a[0]))inside=!inside;}
  if(inside)return false;
  let near=Infinity;
  for(const [a,q] of tableSegs(g)){const ex=q[0]-a[0],ey=q[1]-a[1],l=ex*ex+ey*ey||1;
    const t=Math.max(0,Math.min(1,((b.x-a[0])*ex+(b.y-a[1])*ey)/l));near=Math.min(near,Math.hypot(b.x-a[0]-ex*t,b.y-a[1]-ey*t));}
  return near>RW+BR;
}
const groupOf=n=>ballInfo(n).group;
// The three balls that count for whoever pockets them, whatever they are
// printed as. Kept in one place so a new one only has to be added here.
const CLAIMED=b=>b.power==="wild"||b.power==="steal"||b.power==="joker";

// Cutthroat ownership. Each player gets floor(total / players) balls and the
// remainder are neutral hazards. With two players that lands on the nicest
// split there is: solids against stripes, with the eight left neutral.
function assignOwners(total,players){
  const own=new Array(total+1).fill(-1);
  if(players===2){
    for(let n=1;n<=total;n++){const gp=groupOf(n);
      if(gp==="solid")own[n]=0; else if(gp==="stripe")own[n]=1;}
    return own;}
  const per=Math.floor(total/players);
  for(let i=0;i<players;i++)for(let k=0;k<per;k++)own[i*per+k+1]=i;
  return own;
}
const footSpot=g=>g.rackSpot?{x:g.rackSpot[0],y:g.rackSpot[1]}:{x:g.w*((g.racks||1)===2?0.56:0.75),y:g.h/2};
function spotBall(b,bs,g){
  const f=footSpot(g); let x=f.x;
  for(let i=0;i<40;i++){
    const clash=bs.some(o=>o!==b&&!o.in&&Math.hypot(o.x-x,o.y-f.y)<BR*2.05);
    if(!clash&&x>BR&&x<g.w-BR)break;
    x+=BR*2.1;
    if(x>g.w-BR*2)x=f.x-BR*2.1*(i+1);}
  b.in=false; b.pocket=undefined; b.vx=b.vy=b.wx=b.wy=b.wz=0;
  b.x=Math.max(BR,Math.min(g.w-BR,x)); b.y=f.y;
}

// ===== 7. AI =================================================================
// TWO AXES, NOT ONE.
//
// The old bot was a single number: a rating that shrank a random angle error.
// That made every opponent the same player with a different tremor, and it made
// "better" mean "aims straighter" — which is exactly what this engine refuses
// to say about human characters, who all aim perfectly when sober.
//
// So competence and personality are now separate things.
//
//   STYLE      never changes. A bank player is a bank player at 320 and at 850.
//              It decides WHAT they look for: how thin a cut they will take, how
//              far they will shoot, whether they reach for side, whether they
//              raise the butt, whether a safety is even in their vocabulary,
//              whether they would rather open a cluster than pot a ball.
//
//   SKILL      0..1, derived from rating. It decides HOW WELL they do the thing
//              their style wants. A high-skill player looks at more of the
//              table, judges where the cue ball finishes, notices that a pot
//              leaves them hooked, plays a real safety when there is nothing on,
//              and rarely takes the second-best shot by mistake. A low-skill
//              player of the SAME style wants the same shots and simply reads
//              them badly.
//
// Aim error still exists but it is small and it shrinks fast; the difference
// between a 350 and an 800 is overwhelmingly WHICH SHOT THEY CHOSE.
const AI_STYLES={
  aggressive:{name:"Aggressive",tag:"takes on anything",
    line:"Sees a ball, shoots the ball. Thin cuts and long pots are not a problem to be avoided.",
    cutFloor:.14,dist:.004,safety:-1.1,spin:.42,elev:.12,pace:1.18,bank:.15,cluster:.35,pos:.55},
  defensive:{name:"Defensive",tag:"waits you out",
    line:"Will not fire at a low-percentage ball. If the table is ugly they hand it back and make you solve it.",
    cutFloor:.52,dist:.011,safety:1.35,spin:.35,elev:.10,pace:.86,bank:.05,cluster:-.35,pos:1.15},
  lockdown:{name:"Lockdown",tag:"safety monster",
    line:"Treats a rack as a series of traps. Pots when it is free, buries the white when it is not.",
    cutFloor:.60,dist:.013,safety:2.1,spin:.5,elev:.14,pace:.78,bank:.1,cluster:-.5,pos:1.3},
  bankheavy:{name:"Bank-Heavy",tag:"reads cushions first",
    line:"Grew up on a table with bad pockets. Looks at the rails before looking at the holes.",
    cutFloor:.30,dist:.006,safety:.2,spin:.4,elev:.10,pace:1.05,bank:1.5,cluster:0,pos:.7},
  spinheavy:{name:"Spin-Heavy",tag:"english on everything",
    line:"Never hits a ball in the middle. Side on the simplest straight pot, and it usually means something.",
    cutFloor:.28,dist:.007,safety:.15,spin:1.0,elev:.30,pace:1.0,bank:.5,cluster:.1,pos:.95},
  railheavy:{name:"Rail-Heavy",tag:"lives on the cushion",
    line:"Plays the long game up and down the rails and is happy leaving the white frozen on one.",
    cutFloor:.34,dist:.002,safety:.55,spin:.55,elev:.10,pace:1.08,bank:.75,cluster:-.15,pos:.9},
  minimalist:{name:"Minimalist",tag:"centre ball, short shots",
    line:"No side, no elevation, nothing clever. Takes the nearest ball and rolls it in.",
    cutFloor:.46,dist:.016,safety:.35,spin:.05,elev:0,pace:.9,bank:0,cluster:-.2,pos:.8},
  clusterfirst:{name:"Cluster-First",tag:"opens the trouble early",
    line:"Will not leave a problem for later. Breaks the bunch out while there is still an easy ball to come back to.",
    cutFloor:.34,dist:.008,safety:.25,spin:.45,elev:.12,pace:1.12,bank:.2,cluster:1.6,pos:.85},
  runner:{name:"Runner",tag:"position obsessive",
    line:"Not interested in the ball in front of them, only in where the white finishes afterwards.",
    cutFloor:.42,dist:.010,safety:.5,spin:.7,elev:.16,pace:.94,bank:.15,cluster:.35,pos:1.7},
  showman:{name:"Showman",tag:"plays to the room",
    line:"Takes the shot people will talk about over the shot that wins the rack.",
    cutFloor:.10,dist:-.004,safety:-1.4,spin:.75,elev:.5,pace:1.3,bank:.95,cluster:.3,pos:.35},
};
const AI_STYLE_IDS=Object.keys(AI_STYLES);
// What you notice about somebody once you have stood and watched them for ten
// minutes. Scouting buys this line, and every one of them is true of how that
// style actually behaves in the shot picker.
const AI_TELLS={
  aggressive:"They never look at the rest of the table. Whatever is nearest to a pocket, they are firing at it.",
  defensive:"Watch their shoulders. If the shot is not there they have already decided to give it back to you.",
  lockdown:"They would rather leave you hooked than pot a ball. Do not expect a free table all night.",
  bankheavy:"They check the rails before they check the pockets. Half their shots go the long way round.",
  spinheavy:"There is side on everything, including shots that do not need it. It costs them the odd ball.",
  railheavy:"They live up and down the cushion and they are perfectly happy leaving the white frozen on one.",
  minimalist:"Dead centre, every time. No side, no elevation. Leave them anything awkward and they have no answer.",
  clusterfirst:"They break the trouble out early instead of leaving it. Expect the table open fast.",
  runner:"They are not looking at the ball they are shooting. They are looking at where the white stops.",
  showman:"They are playing to the room. Give them an audience and they will take the shot that loses the rack.",
};
// rating 300 = a beginner who can see a ball; 850+ = reads the whole rack
const skillOf=r=>Math.max(0,Math.min(1,((r||500)-290)/540));

function shotSpeed(cueDist,objDist,cut,breaking){
  if(breaking)return MAXV*0.92;
  const objV=Math.sqrt(2*MU_ROLL*G*Math.max(6,objDist))*1.35+14;
  const need=objV/Math.max(0.28,cut)+Math.sqrt(2*MU_ROLL*G*Math.max(4,cueDist))*0.85;
  return Math.max(22,Math.min(MAXV*0.62,need));
}
// Is a straight line from a to b clear of every ball except the two named?
function laneClear(bs,ax,ay,bx,by,skipA,skipB){
  const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  for(const o of bs){
    if(o.in||o===skipA||o===skipB)continue;
    const t=(o.x-ax)*ux+(o.y-ay)*uy;
    if(t<=0.4||t>=L-0.4)continue;
    if(Math.abs((o.x-ax)*uy-(o.y-ay)*ux)<BR*2.02)return false;}
  return true;
}
// Where the cue ball ends up, roughly. Not a simulation — a stun/roll blend
// good enough to tell a leave from a disaster, which is all a shot picker needs.
function cueLeave(cue,ghost,pocket,cut,pace){
  const ax=ghost[0]-cue.x, ay=ghost[1]-cue.y, al=Math.hypot(ax,ay)||1;
  const ox=pocket[0]-ghost[0], oy=pocket[1]-ghost[1], ol=Math.hypot(ox,oy)||1;
  const ux=ax/al, uy=ay/al, vx=ox/ol, vy=oy/ol;
  // tangent component: what is left of the cue's direction once the object
  // ball has taken the line it was sent on
  let tx=ux-vx*cut, ty=uy-vy*cut;
  const tl=Math.hypot(tx,ty);
  if(tl<1e-4){tx=ux;ty=uy;} else {tx/=tl;ty/=tl;}
  const sin=Math.sqrt(Math.max(0,1-cut*cut));
  const travel=Math.min(70,(14+40*sin)*pace);
  // a rolling cue ball keeps a little of its original line
  const mx=tx*0.82+ux*0.18, my=ty*0.82+uy*0.18, ml=Math.hypot(mx,my)||1;
  return[ghost[0]+mx/ml*travel, ghost[1]+my/ml*travel];
}
function insideRough(g,x,y){
  if(g.boundary)return insideBed(g,x,y);
  return x>BR*1.4&&x<g.w-BR*1.4&&y>BR*1.4&&y<g.h-BR*1.4;
}
// How good does the table look from a given cue-ball position? Used both for
// judging a leave and for judging what a safety hands the other player.
function tableValue(bs,g,from,targets,skipT){
  let best=0;
  for(const t of targets){
    if(t.in||t===skipT)continue;
    const dx=t.x-from[0], dy=t.y-from[1], dl=Math.hypot(dx,dy)||1;
    for(const p of g.pockets){
      const px=p.x-t.x, py=p.y-t.y, pl=Math.hypot(px,py)||1;
      const gx=t.x-px/pl*BR*2, gy=t.y-py/pl*BR*2;
      const ax=gx-from[0], ay=gy-from[1], al=Math.hypot(ax,ay)||1;
      const cut=(ax/al)*(px/pl)+(ay/al)*(py/pl);
      if(cut<0.2)continue;
      if(!laneClear(bs,from[0],from[1],gx,gy,null,t))continue;
      if(!laneClear(bs,t.x,t.y,p.x,p.y,t,null))continue;
      const v=cut*3-al/110-pl/110;
      if(v>best)best=v;}
    if(dl<1)best=Math.max(best,0.2);}
  return best;
}
// balls in a bunch: a cluster-first player wants to be near these, a defensive
// player wants nothing to do with them
function clusterScore(bs,t){
  let n=0;
  for(const o of bs){ if(o.in||o===t||o.n===0)continue;
    if(Math.hypot(o.x-t.x,o.y-t.y)<BR*3.1)n++;}
  return n;
}
function pickShot(bs,g,legal,rating,mind){
  const cue=bs.find(b=>b.n===0); if(!cue)return null;
  const st=(mind&&AI_STYLES[mind.style])||AI_STYLES.aggressive;
  const sk=mind&&mind.skill!=null?mind.skill:skillOf(rating);
  const maxTip=0.30+0.16*sk;
  const up=bs.filter(b=>!b.in&&b.n!==0);
  const breaking=up.length===bs.length-1;
  const targets=up.filter(b=>legal(b.n));
  const theirs=up.filter(b=>!legal(b.n));
  if(!targets.length)return null;
  const cand=[];

  // ---- direct pots --------------------------------------------------------
  for(const t of targets)for(const p of g.pockets){
    const px=p.x-t.x,py=p.y-t.y,pl=Math.hypot(px,py)||1;
    const gx=t.x-px/pl*BR*2, gy=t.y-py/pl*BR*2;
    const ax=gx-cue.x,ay=gy-cue.y,al=Math.hypot(ax,ay)||1;
    const cut=(ax/al)*(px/pl)+(ay/al)*(py/pl);
    if(cut<Math.max(0.12,st.cutFloor-0.30*sk))continue;   // skill widens the book
    const angle=Math.atan2(ay,ax);
    const r=rayFirst(cue,angle,bs,g);
    if(!r.ball||r.ball.n!==t.n)continue;
    if(!laneClear(bs,t.x,t.y,p.x,p.y,t,null))continue;
    // base quality of the pot itself
    let score=cut*3.4-al*st.dist-pl*st.dist*1.2;
    // POSITION. Only a player with some skill actually looks at this, and the
    // style decides how much they care once they can.
    const pace=st.pace;
    if(sk>0.25){
      const leave=cueLeave(cue,[gx,gy],[p.x,p.y],cut,pace);
      const onTable=insideRough(g,leave[0],leave[1]);
      const nv=onTable?tableValue(bs,g,leave,targets,t):-0.6;
      score+=nv*st.pos*sk*1.15;
      if(!onTable)score-=1.4*sk;                       // that is a scratch line
      const near=clusterScore(bs,t);
      score+=near*st.cluster*(0.25+0.5*sk);
    }
    cand.push({kind:"pot",score,angle,cut,al,pl,t,pace});
  }

  // ---- one-cushion banks --------------------------------------------------
  // Everyone can see a bank; a bank player looks for them first and a skilled
  // one can actually judge the angle.
  if(!breaking&&(st.bank>0.05||!cand.length)){
    const W=g.w,H=g.h;
    const mirrors=g.boundary?[]:[
      {mx:p=>[p[0],-p[1]]},{mx:p=>[p[0],2*H-p[1]]},
      {mx:p=>[-p[0],p[1]]},{mx:p=>[2*W-p[0],p[1]]}];
    for(const t of targets)for(const p of g.pockets)for(const m of mirrors){
      const im=m.mx([p.x,p.y]);
      const px=im[0]-t.x,py=im[1]-t.y,pl=Math.hypot(px,py)||1;
      const gx=t.x-px/pl*BR*2, gy=t.y-py/pl*BR*2;
      const ax=gx-cue.x,ay=gy-cue.y,al=Math.hypot(ax,ay)||1;
      const cut=(ax/al)*(px/pl)+(ay/al)*(py/pl);
      if(cut<0.55)continue;                            // banks need a full hit
      const angle=Math.atan2(ay,ax);
      const r=rayFirst(cue,angle,bs,g);
      if(!r.ball||r.ball.n!==t.n)continue;
      const score=cut*2.1-pl*0.014-al*0.006+st.bank*1.9-(1-sk)*2.6;
      cand.push({kind:"bank",score,angle,cut,al,pl:pl*0.8,t,pace:st.pace*1.12});
    }
  }

  // ---- the safety ---------------------------------------------------------
  // A real safety, judged by what it hands back: hit a legal ball thinly and
  // soft, and score the position by how little the OTHER player can do from
  // where the white finishes. Low-skill players barely find one; a lockdown
  // player at high skill finds a good one almost every time.
  if(!breaking&&sk>0.18&&st.safety>-0.9){
    for(const t of targets){
      for(let k=0;k<7;k++){
        const spread=(k-3)/3*0.55;
        const base=Math.atan2(t.y-cue.y,t.x-cue.x);
        const angle=base+spread;
        const r=rayFirst(cue,angle,bs,g);
        if(!r.ball||r.ball.n!==t.n)continue;
        const dl=Math.hypot(t.x-cue.x,t.y-cue.y)||1;
        const gx=t.x-Math.cos(angle)*BR*2, gy=t.y-Math.sin(angle)*BR*2;
        const cut=Math.max(0.05,Math.cos(spread));
        const leave=cueLeave(cue,[gx,gy],[t.x+(t.x-gx),t.y+(t.y-gy)],cut,0.42);
        if(!insideRough(g,leave[0],leave[1]))continue;
        const theyGet=tableValue(bs,g,leave,theirs.length?theirs:targets,null);
        // good safety = they have nothing. Skill decides how well it is judged.
        const score=(2.4-theyGet*1.35)*(0.35+0.65*sk)+st.safety*0.9-1.1;
        cand.push({kind:"safe",score,angle,cut,al:dl,pl:dl,t,pace:0.40});
      }
    }
  }

  if(!cand.length){
    const t=targets[0];
    const d=Math.hypot(t.x-cue.x,t.y-cue.y);
    return{angle:Math.atan2(t.y-cue.y,t.x-cue.x)+(Math.random()-.5)*.25,
      speed:shotSpeed(d,d,.6,breaking),tip:{a:0,b:0},elev:0,kind:"pot"};}

  cand.sort((a,b)=>b.score-a.score);
  // THE MISTAKE. This is where a weak player actually loses the rack: not by
  // shaking on the shot, by choosing the wrong one. A 350 takes the second or
  // third thing they saw about a third of the time; an 850 almost never does.
  const slip=(1-sk)*(1-sk)*0.85;
  let idx=0;
  while(idx<cand.length-1&&Math.random()<slip*0.74)idx++;
  const c=cand[Math.min(idx,cand.length-1)];

  // ---- expressing the style in the actual stroke --------------------------
  // This must be the opponent's decision, never a disguised copy of the human
  // tip control. The old version still had a different problem: EVERY normal
  // pot was assigned follow or draw, and every full hit was deterministic draw.
  // Centre ball is now the ordinary shot. Style, skill and cut shape decide
  // whether there is a reason to add vertical or side spin at all.
  const spinRoom=maxTip*st.spin;
  const control=0.30+0.70*sk;
  let a=0,b=0,elev=0;
  if(c.kind!=="safe"){
    const verticalChance=Math.min(0.90,0.08+st.spin*0.52+st.pos*0.05*sk);
    if(Math.random()<verticalChance){
      const amt=spinRoom*(0.16+Math.random()*0.48)*control;
      const full=Math.max(0,Math.min(1,(c.cut-0.52)/0.43));
      const drawChance=0.10+full*0.34+st.spin*0.07;
      const followChance=0.40-full*0.16;
      const roll=Math.random();
      if(roll<drawChance)b=-amt;
      else if(roll<drawChance+followChance)b=amt;
      // The remaining outcome is a centre-height stun rather than forced spin.
    }
    const sideChance=Math.min(0.88,0.05+st.spin*0.54+(st.bank>0.5?0.10:0));
    if(Math.random()<sideChance){
      a=(Math.random()*2-1)*spinRoom*(0.12+Math.random()*0.42)*control;
    }
    // Elevation belongs mainly to side-spin players; it is no longer rolled on
    // a nominally centre-ball shot merely because the style owns the trait.
    if(Math.abs(a)>0.035&&Math.random()<st.elev*(0.35+0.65*sk))
      elev=(0.08+Math.random()*0.22)*(0.5+0.5*sk);
  } else if(Math.random()<Math.min(0.72,0.18+sk*0.34+st.spin*0.16)){
    // Some safeties need the white checked up, but plenty are plain soft rolls.
    b=-spinRoom*(0.12+Math.random()*0.25)*control;
  }
  // Side plus vertical must stay inside this opponent's own tip budget.
  const tipMag=Math.hypot(a,b);
  if(tipMag>spinRoom&&tipMag>0){a*=spinRoom/tipMag;b*=spinRoom/tipMag;}
  const sp=shotSpeed(c.al,c.pl,c.cut,breaking)*c.pace;
  // execution noise: small, and mostly gone by the top of the ladder
  const aErr=Math.pow(1-sk,1.4)*0.055*(c.kind==="bank"?1.5:1);
  const sErr=1+(Math.random()*2-1)*(0.05+(1-sk)*0.20);
  return{angle:c.angle+(Math.random()*2-1)*aErr,
    speed:Math.max(18,sp*sErr),
    tip:{a:+a.toFixed(3),b:+b.toFixed(3)},elev,kind:c.kind};
}

function pickPocket(bs,g,pk){
  const cue=bs.find(b=>b.n===0);
  const eight=bs.find(b=>!b.in&&groupOf(b.n)==="eight");
  if(!eight)return 0;
  let best=0,bv=-Infinity;
  pk.forEach((p,i)=>{
    const px=p.x-eight.x,py=p.y-eight.y,pl=Math.hypot(px,py)||1;
    const ax=eight.x-cue.x,ay=eight.y-cue.y,al=Math.hypot(ax,ay)||1;
    const cut=(ax/al)*(px/pl)+(ay/al)*(py/pl);
    const v=cut*3-pl/90;
    if(v>bv){bv=v;best=i;}});
  return best;
}

// ===== EFFECT LAB ============================================================
const LAB_EFFECTS=[
  {id:"none",name:"Clean table",tag:"BASELINE",summary:"No rule effect. Use this to judge how much visual treatment an effect is adding.",
    mechanic:"Standard friction, pockets, collisions and prediction."},
  {id:"vodka",name:"Vodka",tag:"FLOW",summary:"The cloth freezes over. A cold sheen on the bed, fracture lines cracking outward from under the cue ball, rime around every ball, and a glide track that runs straight off the end of the table.",
    mechanic:"Rolling resistance is reduced to 42%, so balls keep travelling after they start rolling."},
  {id:"molly",name:"Molly",tag:"LOCK",summary:"A breathing focus gate links the cue ball to the nearest balls like a pulsing neural map.",
    mechanic:"Stroke error becomes zero and the preview expands to five cushions."},
  {id:"jager",name:"Jäger",tag:"TILT",summary:"The slate washes downhill while glowing gravity beads repeatedly fall across it and the level confirms the lean.",
    mechanic:"Every moving ball gains 11 in/s² of acceleration toward the low side for the rack."},
  {id:"ket",name:"Ketamine",tag:"OPEN",summary:"Each pocket becomes a breathing depth well surrounded by curved intake lines that dissolve into the cloth.",
    mechanic:"The live capture radius and preview radius are both multiplied by 1.9; jaw rebound is reduced to 30%."},
  {id:"acid",name:"Acid",tag:"PHASE",summary:"Everything comes out of the cue ball: rainbow shockwaves expanding from it, spokes of colour thrown across the cloth, organic contours growing and turning around it, and every ball split chromatically.",
    mechanic:"The cue ball ignores its first ball collision, then immediately becomes solid again."},
  {id:"dmt",name:"DMT",tag:"END",summary:"Astral copies of the balls appear at their future resting places, connected to the present by luminous filaments.",

  {id:"nerve",name:"Send someone over",tag:"NERVE",summary:"The room closes in around the cloth and the cue ball beats like a pulse. One shot, all eyes.",
    mechanic:"One shot at +22 Eye and -16 Stroke / -15 Touch. Pot your ball and you get two shots of perfect stroke, full vision and +10 Power; miss it and half the nerve stats land on your next shot too."},
  {id:"nerveWin",name:"Riding it",tag:"MADE IT",summary:"The whole room goes rose. A pink spotlight over the table, pink rings on every ball and hearts drifting up off the cue ball. Calm and enormous — the opposite of the nerve shot.",
    mechanic:"Two shots at +18 Stroke, +16 Touch, +16 Eye, +10 Power and zero stroke error. This is what a potted nerve shot buys you."},

  {id:"tipsy",name:"Over the line",tag:"OVER",summary:"Real double vision. The bed swims, the light goes warm and sickly, and the whole table gets a second solid copy of itself drifting around and refusing to line up. Work out which one you are shooting at.",
    mechanic:"Buzz 85-95. -10 Stroke, -12 Touch, a second false aim line, and hand shake added to every shot."},
  {id:"blackout",name:"Cut off",tag:"BLACKOUT",summary:"A dark table and the white ball breathing in the middle of it. Nothing else — no rings, no doubles, no warp on top. That one image says all of it.",
    mechanic:"Buzz 95+. -22 Stroke, -24 Touch, stroke error nearly tripled, guaranteed miscue, and a big random shove on your line — but it is still YOUR line and YOUR speed."},
  {id:"echo",name:"Peyote",tag:"UNDO",summary:"An earthy peyote-flower mandala blooms around the cue ball while a backwards desert-time spiral holds the saved table state.",

const plus=n=>n>0?`+${n}`:String(n||0);
const statLine=d=>{const s=Object.entries(d.stats||{}).map(([k,v])=>`${k.toUpperCase()} ${plus(v)}`).join(" · ");
  const c=d.cleanse?(d.cleanse>900?"CLEAR ACTIVE":`CUT ${d.cleanse} SHOT${d.cleanse>1?"S":""}`):"";
  return [s||(!c?"RULE ONLY":""),c].filter(Boolean).join(" · ");};

function EffectLab({onBack,cloth}){
  const [focus,setFocus]=useState("ket");
  const [charId,setCharId]=useState("fargo");
  const [buzz,setBuzz]=useState(0);
  const [active,setActive]=useState([]);
  const [compare,setCompare]=useState(true);
  const g=useMemo(()=>TABLES.regulation.build(),[]);
  const balls=useMemo(()=>[
    newBall(0,20,25),newBall(1,46,25),newBall(9,51,22.7),newBall(4,51,27.3),
    newBall(8,72,12),newBall(13,79,38),newBall(6,34,39)

  const cue=balls[0];
  const aim={show:true,stick:true,x:cue.x,y:cue.y,angle:0,pull:.42,tip:{a:0,b:0},live:false,
    p:{path:[[cue.x,cue.y],[43.75,25]],ghost:[43.75,25],ball:balls[1],short:false,potted:false,
      objPath:[[46,25],[72,25]],cuePath:[[43.75,25],[55,30]]},
    objLine:true,cueLine:true,stop:true,ghostLine:null,ends:null};
  const tfxFor=id=>({
    fastCloth:id==="vodka",steady:id==="molly",tilt:id==="jager"?11:0,
    khole:id==="ket",phase:id==="acid",melt:id==="acid",echo:id==="echo",nerve:id==="nerve",spotlight:id==="nerveWin",shakes:id==="nerveHalf",
    tipsy:id==="tipsy"||id==="blackout",blackout:id==="blackout",
    ends:id==="dmt"?balls.map((b,i)=>({n:b.n,x:Math.min(96,Math.max(4,b.x+(i%2?8:-3))),
      y:Math.min(46,Math.max(4,b.y+(i%3-1)*5)),in:false})):null
  });
  const selected=LAB_EFFECTS.find(x=>x.id===focus)||LAB_EFFECTS[0];
  const ch=charOf(charId), band=bandOf(+buzz), bf=BAND_FX[band]||{};
  const itemDelta={}; STAT_KEYS.forEach(k=>itemDelta[k]=0);
  const ruleFlags={};
  for(const id of active){const d=DRINKS[id]||SPIKES[id];if(!d)continue;
    for(const k in (d.stats||{}))itemDelta[k]=(itemDelta[k]||0)+d.stats[k];
    Object.assign(ruleFlags,d.flags||{});}
  Object.assign(ruleFlags,bf.flags||{});
  const effective={};
  STAT_KEYS.forEach(k=>effective[k]=ch[k]+(itemDelta[k]||0)+((bf.stats||{})[k]||0));
  const P=passiveOf(ch);
  const bk=kit(ch,{},ch), lk=kit(effective,ruleFlags,ch);
  const baseKit={...bk,maxTip:bk.maxTip*P.tipBonus,maxElev:P.elevFree?60:bk.maxElev},
        liveKit={...lk,maxTip:lk.maxTip*P.tipBonus,maxElev:P.elevFree?60:lk.maxElev};
  const toggle=id=>setActive(a=>a.includes(id)?a.filter(x=>x!==id):[...a,id]);
  const addFocused=()=>{const d=DRINKS[focus];if(!d)return;
    setActive(a=>a.includes(focus)?a:[...a,focus]);
    setBuzz(b=>Math.max(0,Math.min(120,Math.round(+b+buzzShift(d.buzz,ch.tol)))));};
  const mph=v=>v*3600/63360;
  const phys=[
    ["Top cue speed",`${mph(MAXV*baseKit.speedMul).toFixed(1)} mph`,`${mph(MAXV*liveKit.speedMul).toFixed(1)} mph`],
    ["Aim scatter (bar only)",`±${(baseKit.aimErr*180/Math.PI).toFixed(3)}°`,`±${(liveKit.aimErr*180/Math.PI).toFixed(3)}°`],
    ["Pace error",`±${(baseKit.speedErr*100).toFixed(2)}%`,`±${(liveKit.speedErr*100).toFixed(2)}%`],
    ["Spin transfer",`${(baseKit.spinMul*100).toFixed(0)}%`,`${(liveKit.spinMul*100).toFixed(0)}%`],
    ["Tip offset ceiling",`${(baseKit.maxTip*100).toFixed(1)}% radius`,`${(liveKit.maxTip*100).toFixed(1)}% radius`],
    ["Cue elevation",`${baseKit.maxElev.toFixed(0)}°`,`${liveKit.maxElev.toFixed(0)}°`],
    ["Softest shot",`${(baseKit.minPower*100).toFixed(0)}% power`,`${(liveKit.minPower*100).toFixed(0)}% power`],
    ["Reads without the line",baseKit.blindProof?"yes — feel player":"no",liveKit.blindProof?"yes — feel player":"no"],
    ["Preview depth",`${baseKit.rails} rail${baseKit.rails===1?"":"s"}`,`${ruleFlags.seeAll?5:liveKit.rails} rail${(ruleFlags.seeAll?5:liveKit.rails)===1?"":"s"}`],
  ];
  const chooser=(ids,title)=><div style={{marginTop:14}}>
    <div style={{...label,fontSize:9,marginBottom:7}}>{title}</div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(145px,1fr))",gap:7}}>
      {ids.map(id=>{const d=DRINKS[id]||SPIKES[id],on=active.includes(id),look=fxLook(id);

          background:on?`rgba(${look.rgb},.12)`:C.panel2,border:on?`1px solid ${look.ink}`:`1px solid ${C.line}`}}>
          <span style={{display:"flex",alignItems:"center",gap:6}}>
            <b style={{fontSize:11.5,color:C.ink,flex:1}}>{d.name}</b>
            <span style={{fontFamily:F.mono,fontSize:8,color:on?look.ink:C.muted}}>{on?"ON":"OFF"}</span></span>
          <span style={{display:"block",fontFamily:F.mono,fontSize:8.2,color:C.muted,marginTop:4,lineHeight:1.35}}>{statLine(d)}</span>

            {d.buzz?`${plus(bz)} ACTUAL BUZZ`:"NO BUZZ"}</span>

    </div></div>;

  return(<Shell wide>
    <Head onBack={onBack} title="Effect Lab" right={<button onClick={()=>{setActive([]);setBuzz(0);setFocus("ket");}} style={btnGhost}>Reset lab</button>}/>
    <div style={{...panel,padding:"12px 14px",marginBottom:14,display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
      <div style={{flex:"1 1 420px"}}>
        <div style={{fontFamily:F.display,fontSize:16,fontWeight:600}}>Every effect, outside the match</div>
        <div style={{fontSize:11.5,color:C.muted,lineHeight:1.5,marginTop:3}}>Select any effect preview to inspect it. The stat viewer below uses the same modifier and physics functions as a live rack.</div>
      </div>
      <button onClick={()=>setCompare(x=>!x)} aria-pressed={compare} style={compare?segOn:seg}>{compare?"✓ ":""}Baseline comparison</button>

const KING_COLORS=["#d1905b","#65a6a0","#9a83c7","#c96e78","#7f9dcc","#b6a257","#6daa7a","#c27ca3","#cf8f6d","#8fb27f"];
let kingPersonSeq=0;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const chance=p=>Math.random()<p;

// STATS PLATEAU, THE ROOM DOES NOT.
// Sheets climb one tier per five wins and stop at pro speed around tier 7. Past
// that the difficulty is entirely people: elite specialists, rivals who came
// back for you, and players who have been studying you for twenty racks.
const kingTier=streak=>Math.floor(streak/5);
const kingDeep=streak=>Math.max(0,kingTier(streak)-7);
function kingRating(streak,jitter){
  const t=Math.min(7,kingTier(streak));
  // The room opens at competent league speed, not beginner speed. Every five
  // wins still moves the population up a clear tier, with the same pro ceiling.
  return Math.min(870,425+t*58+Math.round((jitter==null?Math.random():jitter)*54));
}
function makePerson(streak,opts={}){
  const rating=opts.rating!=null?opts.rating:kingRating(streak);
  const ability=opts.ability||pick(KING_ABILITIES);
  const styleId=opts.style||pick(AI_STYLE_IDS);
  const center=34+(Math.max(300,rating)-300)/570*58;
  const stat=k=>Math.max(18,Math.min(100,Math.round(center+rnd(-12,12)+(opts.bump&&opts.bump[k]||0))));
  const id=`bar_${++kingPersonSeq}`;
  // NO TWO PEOPLE IN THE ROOM SHARE A FIRST NAME. Everything the bar says is
  // said on first-name terms, so two Ikes makes the whole feed unreadable.
  // BUILD A NAME, THEN CHECK WHAT THE ROOM WOULD CALL THEM.
  // Everything the bar says is on first-name terms, so the thing that has to be
  // unique is the short form — which for a nickname-only regular is the
  // nickname, not the first name nobody uses.
  const shapeName=()=>{
    const first=pick(KING_FIRST), last=pick(KING_LAST), nick=pick(KING_NICK), r=Math.random();
    return r<0.30 ? `${first} ${last}`
         : r<0.52 ? first
         : r<0.80 ? `${first} “${nick}” ${last}`
         : r<0.90 ? `“${nick}” ${last}`
         : r<0.96 ? `${first} “${nick}”`
         :          `${first} ${last[0]}. ${pick(KING_LAST)}`;
  };
  // Somebody known only by a nickname is called the WHOLE nickname — "The
  // Incident", not "The" — so quoted names are read out of the quotes first.
  const shortOf=n=>{
    const m=n.match(/^\s*[“"]([^”"]+)[”"]/);
    if(m)return m[1];
    return n.split(" ")[0].replace(/[“”".]/g,"");
  };
  let name=opts.name||shapeName();
  if(!opts.name&&opts.avoid){
    for(let t=0;t<26&&opts.avoid.has(shortOf(name));t++)name=shapeName();
    if(opts.avoid.has(shortOf(name)))name=`${shortOf(name)} ${pick(KING_LAST)[0]}. ${pick(KING_LAST)}`;
  }
  if(opts.avoid)opts.avoid.add(shortOf(name));
  // What the room actually calls them out loud, quotes stripped, and the letter
  // that goes in the little coloured square.
  const short=shortOf(name);
  CHARS[id]={name,short,initial:short[0]||"?",from:opts.from||pick(KING_FROM),color:pick(KING_COLORS),
    pow:stat("pow"),stroke:stat("stroke"),touch:stat("touch"),english:stat("english"),
    curve:stat("curve"),eye:stat("eye"),
    tol:Math.max(25,Math.min(100,stat("tol")+(ability.tol||0))),kingAbility:ability,
    move:{name:ability.name,kind:"passive",uses:0,tag:"generated trait",text:ability.text}};
  // A THIRD OF THIS ROOM ARE FIXTURES. They do not go home when it gets late,
  // which is what makes it possible for somebody to be leaning on the same wall
  // at rack fifty as they were at rack one.
  const regular=opts.regular!=null?opts.regular:chance(0.34);
  return{id,name,short,char:id,rating,ability:ability.name,style:styleId,regular,
    firstSeen:opts.arrived||0,
    // skill is what the shot picker reads. Deep tiers keep sharpening the mind
    // long after the printed sheet has stopped moving.
    skill:Math.min(0.99,skillOf(rating)+kingDeep(streak)*0.018+(opts.skillBonus||0)),
    arrived:opts.arrived||0,status:"present",watched:0,
    notes:{spin:0,aggro:0,safe:0,flash:0,buzz:0,n:0},
    record:{w:0,l:0},grudge:0,rival:false,adapted:null,studied:false,
    heard:[],   // rumor ids they witnessed
    knows:[],
    team:opts.team||false,
  };
}
const personMind=p=>({skill:p.skill,style:p.style});
const styleOf=p=>AI_STYLES[p.style]||AI_STYLES.aggressive;

// ---- what the room has learned about YOU ------------------------------------
// Every present person accumulates the same reads, but they only matter when
// that person steps forward — then their preparation is built out of them.
const CROWD_OPINIONS=[
  {id:"unknown",label:"NOBODY'S SURE YET",line:"Nobody has decided what you are yet."},
  {id:"flashy",label:"THE FLASHY ONE",line:"They came over for the shots you probably shouldn't be taking."},
  {id:"grinder",label:"THE GRINDER",line:"Nobody's cheering. They're just noticing you don't miss much."},
  {id:"trap",label:"THE SAFETY MONSTER",line:"Half the room has decided you're no fun to watch and they're right."},
  {id:"reckless",label:"THE LUNATIC",line:"They're here for the crash, not the run."},
  {id:"drunk",label:"THE DRUNK WHO CAN PLAY",line:"The tab is doing numbers and you're still winning. They love it."},
  {id:"machine",label:"THE MACHINE",line:"It's gone quiet. That's what it sounds like when people stop expecting you to miss."},
];
function opinionOf(profile,streak,buzz){
  const n=Math.max(1,profile.n);
  const flash=profile.flash/n, safe=profile.safe/n, aggro=profile.aggro/n;
  if(profile.n<3)return CROWD_OPINIONS[0];
  if(buzz>=62&&streak>=3)return CROWD_OPINIONS[5];
  if(streak>=12&&safe<0.5)return CROWD_OPINIONS[6];
  if(safe>0.30)return CROWD_OPINIONS[3];
  if(flash>0.34&&aggro>0.5)return CROWD_OPINIONS[4];
  if(flash>0.20)return CROWD_OPINIONS[1];
  return CROWD_OPINIONS[2];
}
// What the room would call YOUR style. A rival who decides to imitate you
// rather than counter you picks this up and plays it back at you.
function playerStyleOf(profile){
  const n=Math.max(1,profile.n);
  if(profile.n<2)return null;
  if(profile.safe/n>0.26)return "lockdown";
  if(profile.flash/n>0.26)return "showman";
  if(profile.spin/n>0.42)return "spinheavy";
  if(profile.aggro/n>0.62)return "aggressive";
  return "runner";
}
// The style that most annoys the way you have been playing. A person who has
// watched you enough shifts toward this when they finally step up.
function counterStyle(profile){
  const n=Math.max(1,profile.n);
  if(profile.safe/n>0.26)return "aggressive";
  if(profile.flash/n>0.28)return "lockdown";
  if(profile.spin/n>0.42)return "minimalist";
  if(profile.aggro/n>0.62)return "defensive";
  return "runner";
}

// ---- rumours ----------------------------------------------------------------
// Something odd happens, the people who SAW it carry it, and every time it gets
// retold it gets a little further from what actually happened. Most die within
// a few racks. The ones that survive are what the room thinks you are.

  collapse:{tiers:["lost one they had won","dumped a rack from in front","fell apart with the table open","choked so badly people still bring it up"]},
  scratch:{tiers:["scratched on the eight","scratched on the eight with the match on it","scratched on the eight twice in a night","scratched on the eight and blamed the table"]},
  bigbet:{tiers:["played for real money","put their whole night on one rack","bet everything they had on a single ball","bet things they did not own"]},
};
let rumorSeq=0;
function makeRumor(kind,witnesses,gameNo){
  return{id:`r${++rumorSeq}`,kind,tier:0,born:gameNo,heat:1,witnesses:witnesses.slice(0,10)};
}
const rumorText=r=>RUMOR_KINDS[r.kind]?RUMOR_KINDS[r.kind].tiers[Math.min(3,r.tier)]:"did something";

// ---- heckles ----------------------------------------------------------------
// Rare, and always about what is actually happening. A generic "you suck" is
// worse than silence; a line that proves the room has been paying attention is
// the whole point of having a room.
// WHAT YOU ACTUALLY SAY BACK.
// Answering used to be a silent button that set a hidden flag, so nobody could
// tell they had done anything. You get a line, the room hears it, and the box
// stays up telling you the next shot is now carrying it.
// ANSWERING BACK IS A DECISION, NOT A BUTTON.
// The room does not hand you the same menu every time. A stable mix of three
// replies is chosen from the line itself. Some choices change the room at once;
// anything that touches play waits until AFTER the next shot has been judged.
const REPLIES=[
  {id:"bet",label:"Put pocket change on it",risk:"A tiny rail bet on the next ball",
   lines:["\u201cYou want to put money behind that or just noise?\u201d",
     "\u201cA couple bucks says the next one drops. Come on.\u201d",
     "\u201cIf you know so much, back it.\u201d"]},
  {id:"laugh",label:"Give them the joke",risk:"Ends the exchange now; no shot is placed under pressure",instant:"laugh",
   lines:["\u201cThat was pretty bad, wasn\u2019t it.\u201d","\u201cAlright. You got that one.\u201d","\u201cI walked into that. Fair enough.\u201d"]},
  {id:"quarters",label:"Tell them to put quarters up",risk:"Calls that exact heckler toward a future matchup",instant:"quarters",
   lines:["\u201cIf you want the table, put your quarters up.\u201d","\u201cGood. You\u2019re after this rack, then.\u201d","\u201cKeep that energy when your name gets called.\u201d"]},
  {id:"safety",label:"Bury the cue ball",risk:"Answer with a deliberate safety, not a pot",test:"safety",
   lines:["\u201cYou want an answer? Watch where the white finishes.\u201d","\u201cFine. They won\u2019t see a ball.\u201d","\u201cThis one is going nowhere on purpose.\u201d"],
   win:{line:"The next player has nothing clean.",reply:"The rail wanted a shot. You gave them a trap.",pulse:"YOU ANSWERED WITH A SAFETY"},
   lose:{line:"The cue ball leaked into daylight.",reply:"You promised a cage and left the door open.",pulse:"THE SAFETY DID NOT HOLD"}},
  {id:"redirect",label:"Put the rail on them",risk:"After your shot, the heckler rides the opponent's next turn",test:"redirect",
   lines:["\u201cSave some of that for them. They\u2019re up next.\u201d","\u201cFunny. Say it again while they shoot.\u201d","\u201cDon\u2019t stop now. Get in their ear too.\u201d"],
   win:{line:"The rail turns toward the other chair.",reply:"Their next turn belongs to the room now.",pulse:"THE RAIL CHANGED TARGETS"},
   lose:{line:"The rail turns toward the other chair.",reply:"Their next turn belongs to the room now.",pulse:"THE RAIL CHANGED TARGETS"}},
  {id:"chalk",label:"Hand them the chalk",risk:"No boast and no buff; they hold it until your visit ends",instant:"chalk",
   lines:["You hold the chalk out without looking at them.","\u201cHold this until I sit down.\u201d","You toss them the chalk and turn back to the cloth."]},

function replyOptionsFor(line){
  let h=0; for(const c of (line||""))h=(h*31+c.charCodeAt(0))|0;
  const n=REPLIES.length,start=Math.abs(h)%n;
  return [REPLIES[start],REPLIES[(start+1)%n],REPLIES[(start+3)%n]];
}
const COMEBACKS=[

const BET_LINES=[
  n=>`"${n} bucks says you don't make the next one."`,
  n=>`"${n} on the miss. Come on, easy money for you."`,
  n=>`"I'll go ${n} that the next one doesn't drop. Prove me wrong."`,
  n=>`"${n} says that was the last good thing you do tonight."`,

// These only ever fire after you MAKE something, so every one of them is the
// room being impressed. Nobody laughs at a player who is running the table.
const CALL_LINES=[
  "Somebody at the bar went “oooh” and immediately pretended they hadn't.",
  "Two people put their drinks down at the same time.",
  "The far table stopped mid-rack to watch that one.",
  "Somebody said your name to somebody who hadn't asked.",
  "A stool got dragged over. That is not nothing.",

// ---- room lifecycle ---------------------------------------------------------
function roomInit(){
  const people=[];
  const names=new Set();
  const n=5+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    // two guaranteed fixtures, so there is always somebody who was here before
    // you were and intends to be here after
    const p=makePerson(0,{arrived:0,regular:i<2,avoid:names});
    p.watched=Math.floor(Math.random()*2);
    people.push(p);
  }
  // a few of them already know each other
  for(const p of people)if(chance(0.5)){
    const o=pick(people); if(o.id!==p.id){p.knows.push(o.id);o.knows.push(p.id);} }
  return{people,gameNo:0,rumors:[],
    profile:{spin:0,aggro:0,safe:0,flash:0,buzz:0,n:0},
    crowd:0,watcher:null,watcherLevel:0,feed:[],
    intro:null};
}
const present=room=>room.people.filter(p=>p.status==="present");
const takenNames=room=>new Set(room.people.filter(p=>p.status!=="gone").map(p=>(p.short||p.name)));
// The same sentence twice in a row reads as a bug, not a bar.
const roomSay=(room,line)=>{
  if(!line||room.feed[0]===line)return;
  if(room.feed.slice(0,4).includes(line))return;
  room.feed=[line,...room.feed].slice(0,16);};

// Everything that happens to the population between one match and the next.
function roomTick(room,streak,ctx){
  const gameNo=room.gameNo+1;
  const deep=kingDeep(streak);
  const here=present(room);
  // --- people get bored and leave -------------------------------------------
  for(const p of here){
    if(p.rival&&p.status==="present"&&chance(0.30)){
      p.status="away"; p.awaySince=gameNo;
      if(chance(0.6))roomSay(room,pick([
        `${p.name} put their cue in the case and left without saying anything.`,
        `${p.name} watched one more rack and then went. They will be back.`,
        `${p.name} settled up, looked at the table for a while, and left.`]));
      continue;}
